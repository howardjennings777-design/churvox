app = "churvox-backend"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  FRONTEND_URL = "https://www.churvox.com"
  BACKEND_PUBLIC_URL = "https://churvox-backend.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 12
    hard_limit = 16

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
