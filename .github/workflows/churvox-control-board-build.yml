name: Churvox Control Board Build

on:
  pull_request:
    paths:
      - "frontend/src/churvox-product/**"
      - "frontend/src/churvox-fresh/FreshApp.jsx"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/churvox-control-board-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Build Control Board
        run: npm run build
        env:
          CI: "true"
