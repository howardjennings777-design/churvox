name: Fix Worker Live Row Stability

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/churvox-go-live-trust-clean
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Memoise worker live rows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx')
          source = path.read_text()
          old = '  const liveRows = Array.isArray(live.rows) ? live.rows : [];'
          new = '  const liveRows = useMemo(() => Array.isArray(live.rows) ? live.rows : [], [live.rows]);'
          if old not in source:
              raise SystemExit('liveRows initialization not found')
          path.write_text(source.replace(old, new, 1))
          PY
          python3 scripts/churvox-owner-intelligence-contract.py
          python3 scripts/churvox-launch-hardening-contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx
          git commit -m "Stabilize worker offline row updates"
          git push origin HEAD:agent/churvox-go-live-trust-clean
