name: Churvox Render migration live proof

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  prove:
    if: startsWith(github.event.issue.title, '[churvox-render-migration-live-proof]')
    runs-on: ubuntu-latest
    steps:
      - name: Install Chrome tooling
        run: |
          mkdir -p /tmp/proof && cd /tmp/proof
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Check deployed Render frontend
        run: |
          cat > /tmp/proof/proof.js <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1000},ignoreHTTPSErrors:true});
            const urls=['https://grassley-frontend.onrender.com/','https://grassley-frontend.onrender.com/login','https://grassley-frontend.onrender.com/dashboard'];
            const out=[];
            for(const url of urls){const p=await context.newPage();let status=null;try{const r=await p.goto(url,{waitUntil:'networkidle',timeout:60000});status=r&&r.status()}catch(e){}await p.waitForTimeout(2500);out.push({url,status,finalUrl:p.url(),title:await p.title(),text:(await p.locator('body').innerText()).slice(0,6000),sitesRedirect:p.url().includes('chatgpt.site')});await p.close()}
            console.log(JSON.stringify(out,null,2));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/proof/proof.js | tee /tmp/report.json
          {
            echo 'REPORT<<EOF'
            cat /tmp/report.json
            echo 'EOF'
          } >> "$GITHUB_ENV"
      - name: Post proof
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'```json\n'+(process.env.REPORT||'missing')+'\n```'});
