name: Churvox Log Out All Sessions Final Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-logout-all-sessions-final]')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install focused backend dependencies
        run: python -m pip install --disable-pip-version-check fastapi==0.110.1 pymongo==4.5.0

      - name: Mount final session revocation route
        run: python scripts/churvox-logout-all-sessions-final-apply.py

      - name: Compile, contract and behavior gate
        shell: bash
        run: |
          set -o pipefail
          {
            python -m py_compile backend/churvox_logout_all_sessions_final_patch.py backend/server/__init__.py
            node scripts/churvox-logout-all-sessions-final-contract.cjs
            python scripts/churvox_logout_all_sessions_final_test.py
            node scripts/churvox-auth-401-storm-contract.cjs
          } 2>&1 | tee /tmp/churvox-logout-all-sessions-final.txt

      - name: Commit verified session revocation route
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add backend/server/__init__.py
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add secure log out all sessions control'
          git reset --hard HEAD
          git clean -fdx
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ job.status }}' === 'success';
            const sha = '${{ steps.publish.outputs.sha }}' || 'not published';
            const output = fs.existsSync('/tmp/churvox-logout-all-sessions-final.txt') ? fs.readFileSync('/tmp/churvox-logout-all-sessions-final.txt', 'utf8').slice(-7000) : 'No gate output.';
            const body = ok
              ? `## Log out all sessions repair passed\n\nAuthenticated users can now invalidate every older Churvox token server-side, clear cookies and sign in fresh without changing a password.\n\nCommit: \`${sha}\`\n\n\`\`\`text\n${output}\n\`\`\``
              : `## Log out all sessions repair failed safely\n\nNo unverified wrapper change was published.\n\n\`\`\`text\n${output}\n\`\`\`\n\nWorkflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
