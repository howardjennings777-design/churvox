name: Churvox premium public structural rebuild

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  rebuild:
    if: startsWith(github.event.issue.title, '[churvox-premium-public-structure]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Rebuild the main public pages as connected scenes
        shell: bash
        run: |
          cat > frontend/src/pages/marketing/ChurvoxPremiumScenes.css <<'EOF'
          .cvPremiumPage { position: relative; overflow: hidden; }
          .cvPremiumPage::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            opacity: .18;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.14'/%3E%3C/svg%3E");
            mix-blend-mode: soft-light;
          }

          .cvSceneHero {
            width: min(1500px, calc(100% - 38px));
            min-height: 820px;
            margin: 0 auto;
            padding: 122px 0 92px;
            display: grid;
            grid-template-columns: minmax(0,.82fr) minmax(560px,1.18fr);
            gap: clamp(48px,7vw,112px);
            align-items: center;
          }
          .cvSceneHeroCopy { max-width: 680px; }
          .cvSceneKicker { display: flex; align-items: center; gap: 12px; color: #ff9d65; font: 800 9px/1 ui-monospace,monospace; letter-spacing: .2em; text-transform: uppercase; }
          .cvSceneKicker::before { content: ""; width: 38px; height: 1px; background: linear-gradient(90deg,#ff7128,transparent); }
          .cvSceneHero h1 { margin: 22px 0 24px; color: #f6f3eb; font-size: clamp(56px,5.4vw,88px); line-height: .93; letter-spacing: -.065em; font-weight: 700; }
          .cvSceneHero h1 em { color: #ff7128; font-style: normal; }
          .cvSceneHeroCopy>p { max-width: 610px; margin: 0; color: #a8afa8; font-size: 16px; line-height: 1.67; font-weight: 500; }
          .cvSceneActions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
          .cvSceneFacts { display: flex; flex-wrap: wrap; gap: 17px; margin-top: 24px; color: rgba(255,255,255,.43); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; }
          .cvSceneFacts span { display: flex; align-items: center; gap: 7px; }
          .cvSceneFacts span::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #bde96e; box-shadow: 0 0 12px rgba(189,233,110,.45); }

          .cvSignalStage {
            width: min(1500px, calc(100% - 38px));
            margin: 0 auto;
            padding: 105px 0 120px;
          }
          .cvSceneIntro { max-width: 760px; }
          .cvSceneIntro small { color: #ff9d65; font: 800 9px/1 ui-monospace,monospace; letter-spacing: .2em; text-transform: uppercase; }
          .cvSceneIntro h2 { margin: 17px 0 0; color: #f4f1e8; font-size: clamp(40px,4.3vw,66px); line-height: .98; letter-spacing: -.055em; font-weight: 680; }
          .cvSceneIntro p { max-width: 660px; margin: 18px 0 0; color: #a8afa8; font-size: 14px; line-height: 1.65; }

          .cvSignalRail {
            position: relative;
            margin-top: 70px;
            display: grid;
            grid-template-columns: repeat(5,minmax(0,1fr));
            gap: 0;
          }
          .cvSignalRail::before {
            content: "";
            position: absolute;
            left: 5%; right: 5%; top: 30px;
            height: 1px;
            background: linear-gradient(90deg,rgba(255,113,40,.08),#ff7128 35%,#bde96e 70%,rgba(189,233,110,.08));
            box-shadow: 0 0 20px rgba(255,113,40,.25);
          }
          .cvSignalNode { position: relative; min-height: 285px; padding: 0 26px 0 0; }
          .cvSignalNode:not(:last-child) { border-right: 1px solid rgba(255,255,255,.055); }
          .cvSignalDot { position: relative; z-index: 2; width: 61px; height: 61px; display: grid; place-items: center; border: 1px solid rgba(255,113,40,.4); border-radius: 50%; color: #ff9d65; background: #0a0e0b; box-shadow: 0 0 0 10px #090c0a,0 0 35px rgba(255,113,40,.18); font: 800 11px/1 ui-monospace,monospace; }
          .cvSignalNode:nth-child(4) .cvSignalDot,.cvSignalNode:nth-child(5) .cvSignalDot { border-color: rgba(189,233,110,.35); color: #bde96e; box-shadow: 0 0 0 10px #090c0a,0 0 35px rgba(189,233,110,.13); }
          .cvSignalNode h3 { max-width: 180px; margin: 40px 0 0; color: #f3f0e8; font-size: 19px; line-height: 1.05; letter-spacing: -.04em; font-weight: 650; }
          .cvSignalNode p { max-width: 190px; margin: 11px 0 0; color: #89918a; font-size: 11px; line-height: 1.55; }

          .cvCommandStage {
            width: min(1500px, calc(100% - 38px));
            margin: 20px auto 0;
            padding: clamp(42px,5vw,72px);
            display: grid;
            grid-template-columns: minmax(0,.78fr) minmax(520px,1.22fr);
            gap: clamp(44px,7vw,110px);
            align-items: center;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 32px;
            background: radial-gradient(circle at 100% 0%,rgba(255,113,40,.18),transparent 29%),linear-gradient(145deg,#0c110e,#121915 62%,#1d0f08);
            box-shadow: 0 48px 140px rgba(0,0,0,.42);
          }
          .cvCommandStage .cvSceneIntro h2 { font-size: clamp(40px,4.1vw,62px); }
          .cvCommandStage .cvSceneIntro strong { display: block; margin-top: 28px; color: #f4f1e8; font-size: 13px; }
          .cvCommandStage .cvSceneIntro ul { display: grid; gap: 10px; margin: 14px 0 0; padding: 0; list-style: none; }
          .cvCommandStage .cvSceneIntro li { display: flex; gap: 10px; color: #9da49e; font-size: 11px; line-height: 1.45; }
          .cvCommandStage .cvSceneIntro li::before { content: ""; flex: 0 0 5px; height: 5px; margin-top: .5em; border-radius: 50%; background: #ff7128; }
          .cvCommandConsole { overflow: hidden; border: 1px solid rgba(255,255,255,.1); border-radius: 26px; background: rgba(4,7,5,.62); box-shadow: 0 30px 80px rgba(0,0,0,.32); }
          .cvCommandConsole header { min-height: 62px; display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 0 22px; border-bottom: 1px solid rgba(255,255,255,.075); }
          .cvCommandConsole header span { color: #ff9d65; font: 800 9px/1 ui-monospace,monospace; letter-spacing: .17em; text-transform: uppercase; }
          .cvCommandConsole header b { color: #bde96e; font-size: 10px; }
          .cvCommandBody { display: grid; grid-template-columns: 180px 1fr; min-height: 430px; }
          .cvCommandQueue { padding: 15px; border-right: 1px solid rgba(255,255,255,.07); }
          .cvCommandQueue button { width: 100%; min-height: 78px; display: grid; gap: 5px; margin-bottom: 8px; padding: 12px; text-align: left; color: #aab1aa; border: 1px solid transparent; border-radius: 14px; background: rgba(255,255,255,.025); }
          .cvCommandQueue button.active { color: #fff; border-color: rgba(255,113,40,.27); background: rgba(255,113,40,.08); }
          .cvCommandQueue small { color: #ff9d65; font-size: 7px; text-transform: uppercase; letter-spacing: .12em; }
          .cvCommandQueue b { font-size: 11px; }
          .cvDecisionPane { padding: clamp(24px,4vw,46px); }
          .cvDecisionPane>small { color: #ff9d65; font: 800 8px/1 ui-monospace,monospace; letter-spacing: .16em; text-transform: uppercase; }
          .cvDecisionPane h3 { margin: 17px 0 0; color: #fff; font-size: clamp(30px,3.2vw,48px); line-height: .98; letter-spacing: -.055em; font-weight: 620; }
          .cvDecisionPane>p { max-width: 540px; color: #929a93; font-size: 12px; line-height: 1.55; }
          .cvDecisionFacts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin-top: 26px; overflow: hidden; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; background: rgba(255,255,255,.08); }
          .cvDecisionFacts div { padding: 17px; background: #0d120f; }
          .cvDecisionFacts span { display: block; color: #707871; font-size: 8px; text-transform: uppercase; letter-spacing: .1em; }
          .cvDecisionFacts b { display: block; margin-top: 7px; color: #fff; font-size: 18px; }
          .cvDecisionActions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
          .cvDecisionActions span { padding: 11px 14px; border: 1px solid rgba(255,255,255,.1); border-radius: 11px; color: #b9c0ba; background: rgba(255,255,255,.04); font-size: 9px; font-weight: 780; }
          .cvDecisionActions span:first-child { color: #fff; border-color: rgba(255,113,40,.28); background: #e85816; box-shadow: 0 10px 28px rgba(232,88,22,.22); }

          .cvFieldStage {
            width: min(1380px, calc(100% - 38px));
            margin: 0 auto;
            padding: 125px 0;
            display: grid;
            grid-template-columns: minmax(330px,.7fr) minmax(0,1.3fr);
            gap: clamp(50px,9vw,150px);
            align-items: center;
          }
          .cvFieldDevice { position: relative; width: min(390px,100%); margin: 0 auto; padding: 14px; border: 1px solid rgba(255,255,255,.12); border-radius: 46px; background: linear-gradient(145deg,#171b18,#050706); box-shadow: 0 48px 120px rgba(0,0,0,.48); }
          .cvFieldDevice::before { content: ""; position: absolute; left: 50%; top: 10px; width: 74px; height: 20px; transform: translateX(-50%); border-radius: 999px; background: #030403; }
          .cvFieldScreen { min-height: 620px; padding: 50px 18px 18px; overflow: hidden; border-radius: 34px; color: #172018; background: #f0ede4; }
          .cvFieldScreen header { display: flex; justify-content: space-between; color: #5a625b; font-size: 9px; font-weight: 800; }
          .cvFieldJob { margin-top: 24px; padding: 23px; border-radius: 22px; color: #fff; background: radial-gradient(circle at 100% 0%,rgba(255,113,40,.26),transparent 31%),linear-gradient(145deg,#101611,#2a1409); }
          .cvFieldJob small { color: #ff9d65; font-size: 8px; text-transform: uppercase; letter-spacing: .12em; }
          .cvFieldJob h3 { margin: 12px 0 0; font-size: 28px; line-height: 1; letter-spacing: -.05em; }
          .cvFieldJob p { color: rgba(255,255,255,.6); font-size: 11px; line-height: 1.5; }
          .cvFieldSteps { display: grid; margin-top: 13px; }
          .cvFieldSteps span { padding: 16px 4px; border-bottom: 1px solid rgba(23,32,24,.1); font-size: 11px; font-weight: 750; }
          .cvFieldCopy .cvSceneIntro { max-width: 720px; }
          .cvFieldCopy .cvSceneIntro h2 { font-size: clamp(42px,4.7vw,70px); }
          .cvHandoffLine { position: relative; margin-top: 45px; padding-left: 35px; border-left: 1px solid rgba(255,113,40,.28); }
          .cvHandoffLine::before { content: ""; position: absolute; left: -4px; top: 0; width: 7px; height: 7px; border-radius: 50%; background: #ff7128; box-shadow: 0 0 18px rgba(255,113,40,.55); }
          .cvHandoffLine h3 { margin: 0; color: #f3f0e8; font-size: 18px; font-weight: 650; }
          .cvHandoffLine p { max-width: 620px; margin: 10px 0 0; color: #8f9790; font-size: 12px; line-height: 1.6; }

          .cvControlStage { width: min(1420px, calc(100% - 38px)); margin: 0 auto; padding: 90px 0 120px; }
          .cvControlLines { margin-top: 56px; border-top: 1px solid rgba(255,255,255,.09); }
          .cvControlLine { display: grid; grid-template-columns: 80px 1fr auto; gap: 28px; align-items: center; min-height: 130px; border-bottom: 1px solid rgba(255,255,255,.09); }
          .cvControlLine>span { color: #ff7128; font: 800 11px/1 ui-monospace,monospace; }
          .cvControlLine h3 { margin: 0; color: #f4f1e9; font-size: clamp(24px,3vw,42px); letter-spacing: -.045em; font-weight: 620; }
          .cvControlLine p { max-width: 390px; margin: 0; color: #8d958e; font-size: 11px; line-height: 1.55; text-align: right; }

          .cvSceneClose { width: min(1500px, calc(100% - 38px)); margin: 0 auto; padding: 72px; display: grid; grid-template-columns: 1fr auto; gap: 40px; align-items: end; border: 1px solid rgba(255,255,255,.1); border-radius: 30px; background: radial-gradient(circle at 100% 0%,rgba(255,113,40,.19),transparent 31%),linear-gradient(145deg,#0d120f,#121914 62%,#1e0f08); }
          .cvSceneClose small { color: #ff9d65; font: 800 9px/1 ui-monospace,monospace; letter-spacing: .18em; text-transform: uppercase; }
          .cvSceneClose h2 { max-width: 820px; margin: 18px 0 0; color: #f5f2e9; font-size: clamp(42px,4.7vw,72px); line-height: .96; letter-spacing: -.06em; font-weight: 650; }
          .cvSceneClose p { max-width: 650px; color: #989f99; font-size: 13px; line-height: 1.6; }
          .cvSceneClose>div:last-child { display: flex; flex-wrap: wrap; gap: 9px; }

          /* Product page */
          .cvProductSpine { width: min(1380px, calc(100% - 38px)); margin: 0 auto; padding: 120px 0; display: grid; grid-template-columns: .72fr 1.28fr; gap: clamp(60px,9vw,145px); }
          .cvProductSticky { position: sticky; top: 120px; align-self: start; }
          .cvProductSticky .cvSceneIntro h2 { font-size: clamp(40px,4.1vw,62px); }
          .cvRoomSpine { position: relative; display: grid; gap: 0; }
          .cvRoomSpine::before { content: ""; position: absolute; left: 24px; top: 28px; bottom: 28px; width: 1px; background: linear-gradient(#ff7128,#bde96e); box-shadow: 0 0 18px rgba(255,113,40,.22); }
          .cvRoomEntry { position: relative; min-height: 210px; padding: 8px 0 55px 80px; }
          .cvRoomEntry::before { content: attr(data-room); position: absolute; left: 0; top: 0; width: 49px; height: 49px; display: grid; place-items: center; border: 1px solid rgba(255,113,40,.35); border-radius: 50%; color: #ff9d65; background: #090c0a; font: 800 9px/1 ui-monospace,monospace; }
          .cvRoomEntry:nth-child(n+4)::before { border-color: rgba(189,233,110,.32); color: #bde96e; }
          .cvRoomEntry small { color: #747c75; font: 760 8px/1 ui-monospace,monospace; text-transform: uppercase; letter-spacing: .13em; }
          .cvRoomEntry h3 { margin: 13px 0 0; color: #f5f2e9; font-size: clamp(28px,3.2vw,45px); line-height: 1; letter-spacing: -.05em; font-weight: 630; }
          .cvRoomEntry p { max-width: 620px; margin: 13px 0 0; color: #909891; font-size: 12px; line-height: 1.65; }

          .cvIndustryFrequency { width: min(1500px, calc(100% - 38px)); margin: 0 auto; padding: 100px 0 130px; overflow: hidden; }
          .cvFrequencyTrack { display: flex; gap: 12px; margin-top: 50px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: thin; }
          .cvFrequencyTrack a { flex: 0 0 250px; min-height: 150px; display: flex; flex-direction: column; justify-content: space-between; padding: 22px; border-top: 1px solid rgba(255,255,255,.11); border-bottom: 1px solid rgba(255,255,255,.11); color: #f3f0e8; background: linear-gradient(90deg,rgba(255,255,255,.025),transparent); }
          .cvFrequencyTrack small { color: #ff9d65; font: 800 8px/1 ui-monospace,monospace; letter-spacing: .13em; text-transform: uppercase; }
          .cvFrequencyTrack b { font-size: 19px; letter-spacing: -.035em; }
          .cvFrequencyTrack span { color: #757d76; font-size: 9px; text-transform: uppercase; }

          /* Pricing page */
          .cvPlanStage { width: min(1500px, calc(100% - 38px)); margin: 0 auto; padding: 115px 0 125px; }
          .cvPlanToolbar { display: flex; justify-content: space-between; gap: 30px; align-items: end; margin-bottom: 48px; }
          .cvPlanRegion { min-width: 270px; color: #929a93; font-size: 10px; font-weight: 750; }
          .cvPlanRegion select { width: 100%; min-height: 48px; margin-top: 9px; padding: 0 14px; color: #fff; border: 1px solid rgba(255,255,255,.1); border-radius: 12px; background: #111713; }
          .cvPlanConsole { display: grid; grid-template-columns: 260px 1fr; min-height: 620px; overflow: hidden; border: 1px solid rgba(255,255,255,.1); border-radius: 30px; background: radial-gradient(circle at 100% 0%,rgba(255,113,40,.18),transparent 28%),linear-gradient(145deg,#0b100d,#111813 64%,#1d0f08); box-shadow: 0 45px 130px rgba(0,0,0,.4); }
          .cvPlanRail { padding: 18px; border-right: 1px solid rgba(255,255,255,.075); background: rgba(0,0,0,.16); }
          .cvPlanRail small { display: block; padding: 10px 12px 18px; color: #747c75; font: 800 8px/1 ui-monospace,monospace; letter-spacing: .16em; text-transform: uppercase; }
          .cvPlanRail button { width: 100%; min-height: 96px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; margin-bottom: 8px; padding: 17px; text-align: left; color: #9ca39d; border: 1px solid transparent; border-radius: 16px; background: rgba(255,255,255,.025); }
          .cvPlanRail button.active { color: #fff; border-color: rgba(255,113,40,.28); background: rgba(255,113,40,.09); }
          .cvPlanRail button b { font-size: 16px; }
          .cvPlanRail button span { color: #ff9d65; font-size: 9px; }
          .cvPlanDetail { position: relative; padding: clamp(38px,6vw,78px); }
          .cvPlanDetail::after { content: attr(data-index); position: absolute; right: 42px; top: 28px; color: rgba(255,255,255,.035); font: 900 150px/1 ui-monospace,monospace; }
          .cvPlanDetail>small { color: #ff9d65; font: 800 9px/1 ui-monospace,monospace; letter-spacing: .16em; text-transform: uppercase; }
          .cvPlanDetail h2 { position: relative; z-index: 1; margin: 18px 0 0; color: #fff; font-size: clamp(48px,5.3vw,82px); line-height: .94; letter-spacing: -.065em; font-weight: 650; }
          .cvPlanPrice { position: relative; z-index: 1; margin-top: 30px; color: #fff; font-size: clamp(38px,4.5vw,66px); line-height: 1; letter-spacing: -.06em; font-weight: 650; }
          .cvPlanTax { min-height: 18px; margin-top: 8px; color: #777f78; font-size: 10px; }
          .cvPlanSummary { max-width: 650px; margin-top: 23px; color: #a0a7a1; font-size: 13px; line-height: 1.65; }
          .cvPlanFeatures { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; max-width: 760px; margin: 32px 0; padding: 0; list-style: none; }
          .cvPlanFeatures li { position: relative; padding: 13px 0 13px 17px; border-bottom: 1px solid rgba(255,255,255,.07); color: #c1c6c2; font-size: 11px; }
          .cvPlanFeatures li::before { content: ""; position: absolute; left: 0; top: 1.55em; width: 5px; height: 5px; border-radius: 50%; background: #ff7128; }
          .cvPlanBottom { display: flex; justify-content: space-between; gap: 20px; align-items: center; margin-top: 20px; }
          .cvPlanBottom p { max-width: 420px; margin: 0; color: #737b74; font-size: 10px; line-height: 1.5; }
          .cvAddonRails { margin-top: 40px; border-top: 1px solid rgba(255,255,255,.09); }
          .cvAddonRail { min-height: 135px; display: grid; grid-template-columns: 80px 1fr auto; gap: 28px; align-items: center; border-bottom: 1px solid rgba(255,255,255,.09); }
          .cvAddonRail>span { color: #ff7128; font: 800 10px/1 ui-monospace,monospace; }
          .cvAddonRail h3 { margin: 0; color: #f4f1e9; font-size: 22px; font-weight: 620; letter-spacing: -.04em; }
          .cvAddonRail p { max-width: 620px; margin: 8px 0 0; color: #858d86; font-size: 11px; line-height: 1.5; }
          .cvAddonRail b { color: #fff; font-size: 23px; }

          @media(max-width:1100px){
            .cvSceneHero,.cvCommandStage,.cvFieldStage,.cvProductSpine{grid-template-columns:1fr}.cvProductSticky{position:static}.cvCommandBody{grid-template-columns:160px 1fr}.cvPlanConsole{grid-template-columns:220px 1fr}
          }
          @media(max-width:760px){
            .cvSceneHero,.cvSignalStage,.cvCommandStage,.cvFieldStage,.cvControlStage,.cvSceneClose,.cvProductSpine,.cvIndustryFrequency,.cvPlanStage{width:calc(100% - 22px)}
            .cvSceneHero{min-height:auto;padding:112px 0 70px;grid-template-columns:1fr}.cvSceneHero h1{font-size:clamp(45px,14vw,62px)}
            .cvSignalRail{grid-template-columns:1fr;margin-top:48px;padding-left:8px}.cvSignalRail::before{left:38px;right:auto;top:5%;bottom:5%;width:1px;height:auto;background:linear-gradient(#ff7128,#bde96e)}.cvSignalNode{min-height:180px;padding:0 0 40px 92px;border-right:0!important}.cvSignalDot{position:absolute;left:0;top:0}.cvSignalNode h3{margin:7px 0 0;max-width:none}.cvSignalNode p{max-width:270px}
            .cvCommandStage{padding:28px;grid-template-columns:1fr}.cvCommandBody{grid-template-columns:1fr}.cvCommandQueue{display:flex;gap:7px;overflow-x:auto;border-right:0;border-bottom:1px solid rgba(255,255,255,.07)}.cvCommandQueue button{flex:0 0 145px}.cvDecisionFacts{grid-template-columns:1fr}.cvDecisionPane{padding:24px}
            .cvFieldStage{padding:90px 0}.cvFieldDevice{width:min(330px,100%)}.cvFieldScreen{min-height:540px}
            .cvControlLine{grid-template-columns:42px 1fr;gap:16px;padding:24px 0}.cvControlLine p{grid-column:2;text-align:left}.cvSceneClose{padding:34px;grid-template-columns:1fr}.cvSceneClose h2{font-size:clamp(38px,11vw,52px)}
            .cvProductSpine{padding:90px 0}.cvRoomEntry{padding-left:72px}.cvIndustryFrequency{padding:80px 0}
            .cvPlanToolbar{align-items:stretch;flex-direction:column}.cvPlanRegion{min-width:0}.cvPlanConsole{grid-template-columns:1fr}.cvPlanRail{display:flex;gap:7px;overflow-x:auto;border-right:0;border-bottom:1px solid rgba(255,255,255,.075)}.cvPlanRail small{display:none}.cvPlanRail button{flex:0 0 145px;min-height:72px}.cvPlanDetail{padding:30px 24px}.cvPlanDetail::after{font-size:90px}.cvPlanFeatures{grid-template-columns:1fr}.cvPlanBottom{align-items:flex-start;flex-direction:column}.cvAddonRail{grid-template-columns:40px 1fr}.cvAddonRail>b{grid-column:2}
          }
          EOF

          cat > frontend/src/pages/marketing/ExecutiveHomePage.jsx <<'EOF'
          import React from "react";
          import { Link } from "react-router-dom";
          import { PublicNav, PublicFooter } from "./ChurvoxPublicShell";
          import "./ChurvoxLivingOfficeHome.css";
          import "./ChurvoxPremiumPublic.css";
          import "./ChurvoxPremiumScenes.css";

          const DESKS=[["Bookings","Requests, timing and recurring work","3 prepared"],["Field","Workers, progress and proof","6 active"],["Clients","Promises and follow-ups","2 watched"],["Money","Quotes, invoices and missed revenue","$4.2k ready"],["Quality","Photos, extras and exceptions","1 check"]];
