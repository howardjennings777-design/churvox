          function OfficeVisual(){return <div className="clhOffice" aria-label="Churvox connected office"><div className="clhOfficeTop"><span><i/>Live office</span><b>Everything connected</b></div><div className="clhFloor"><div className="clhBrain"><span/><small>Churvox</small><b>Office brain</b><p>Checks the whole business</p></div>{DESKS.map(([name,note,state],index)=><article key={name} className={`clhDesk desk-${index+1}`}><i/><small>{name} desk</small><b>{state}</b><p>{note}</p></article>)}<article className="clhOwnerDesk"><small>Owner desk</small><b>3 decisions</b><p>Approve · Edit · Park</p><span>Nothing sends without you</span></article><div className="clhPath path-a"/><div className="clhPath path-b"/><div className="clhPath path-c"/></div><div className="clhOfficeBottom"><span>Churvox prepared the work.</span><b>You make the decision.</b></div></div>}

          export const Nav=PublicNav; export const Footer=PublicFooter;
          export default function ExecutiveHomePage(){return <main className="clhSite cvPremiumPage" data-version="CHURVOX_PREMIUM_SCENES_HOME_20260724"><PublicNav/>
            <section className="cvSceneHero"><div className="cvSceneHeroCopy"><span className="cvSceneKicker">The office working behind the owner</span><h1>Your business moves. <em>Churvox sees the whole move.</em></h1><p>Jobs, workers, client promises, messages and money stop living in separate boxes. Churvox connects the story, checks the ripple and prepares the one decision that needs you.</p><div className="cvSceneActions"><Link className="cp26Button" to="/signup?plan=operator">Start 14-day trial</Link><Link className="cp26Button cp26ButtonGhost" to="/demo">Run a workday</Link></div><div className="cvSceneFacts"><span>No card upfront</span><span>Owner approval</span><span>No silent sends</span></div></div><OfficeVisual/></section>

            <section className="cvSignalStage"><div className="cvSceneIntro"><small>One connected signal</small><h2>One event travels through the office—without becoming five separate alerts.</h2><p>The business story stays connected from the moment something changes to the moment the owner approves the response.</p></div><div className="cvSignalRail">{SIGNALS.map(([n,title,text])=><article className="cvSignalNode" key={n}><div className="cvSignalDot">{n}</div><h3>{title}</h3><p>{text}</p></article>)}</div></section>

            <section className="cvCommandStage"><div className="cvSceneIntro"><small>Command · owner desk</small><h2>Stop managing software. Make the decision.</h2><p>Churvox does the connecting, checking and preparing first. Command shows the owner what changed, why it matters and the safest next move.</p><strong>Every decision keeps four honest options.</strong><ul><li>Approve the prepared move.</li><li>Edit any detail before it changes.</li><li>Park it without losing the trail.</li><li>Ask for the missing fact instead of guessing.</li></ul></div><div className="cvCommandConsole"><header><span>Command / live decision</span><b>Owner control on</b></header><div className="cvCommandBody"><div className="cvCommandQueue"><button className="active" type="button"><small>Money</small><b>Riverside variation</b></button><button type="button"><small>Schedule</small><b>Worker absence</b></button><button type="button"><small>Client</small><b>Friday booking</b></button></div><div className="cvDecisionPane"><small>Best move right now</small><h3>Protect $680 before invoicing.</h3><p>Worker notes and photos show completed extra work. Churvox checked the quote, time, proof and client messages before preparing the variation.</p><div className="cvDecisionFacts"><div><span>Money protected</span><b>$680</b></div><div><span>Records checked</span><b>4</b></div></div><div className="cvDecisionActions"><span>Approve variation</span><span>Edit</span><span>Park</span><span>Ask worker</span></div></div></div></div></section>

            <section className="cvFieldStage"><div className="cvFieldDevice"><div className="cvFieldScreen"><header><span>9:41</span><b>Churvox Field</b><span>●</span></header><div className="cvFieldJob"><small>Today · next job</small><h3>Riverside tidy</h3><p>Scope, access note and latest owner direction are already attached.</p></div><div className="cvFieldSteps"><span>Acknowledge job</span><span>Start work</span><span>Add note or photo</span><span>Complete and return proof</span></div></div></div><div className="cvFieldCopy"><div className="cvSceneIntro"><small>Field to office</small><h2>Small in the worker’s hand. Complete in the owner’s office.</h2><p>The worker sees the job and returns what happened. Churvox connects that update to clients, timing, proof and money without making the worker operate the whole system.</p></div><div className="cvHandoffLine"><h3>A clean handover—not another admin job.</h3><p>Status, notes, photos and time return to the right record. The owner only sees what needs a decision.</p></div></div></section>

            <section className="cvControlStage"><div className="cvSceneIntro"><small>Control is the product</small><h2>Prepared does not mean automatic.</h2><p>The office can be fast without taking control away from the person who owns the promises, money and reputation.</p></div><div className="cvControlLines">{CONTROLS.map(([n,title,text])=><article className="cvControlLine" key={n}><span>{n}</span><h3>{title}</h3><p>{text}</p></article>)}</div></section>

            <section className="cvSceneClose"><div><small>14-day trial · no card upfront</small><h2>Put a connected office behind the business.</h2><p>Use one real job, one worker update and one owner decision to see whether Churvox removes work.</p></div><div><Link className="cp26Button" to="/signup?plan=operator">Start free trial</Link><Link className="cp26Button cp26ButtonGhost" to="/pricing">View pricing</Link></div></section><PublicFooter/></main>}
          EOF

          cat > frontend/src/pages/marketing/ExecutiveFeaturesPage.jsx <<'EOF'
          import React from "react";
          import { Link } from "react-router-dom";
          import { PublicNav,PublicFooter,serviceTypes } from "./ChurvoxPublicShell";
          import "./ChurvoxPremiumScenes.css";

          const ROOMS=[["01","Today","The morning handover","What changed, what is blocked and the one move worth making first."],["02","Jobs","The work record","Schedule, recurrence, scope, notes, proof and price remain one business story."],["03","Clients","The memory room","Preferences, access notes, promises and history stay with the relationship."],["04","Workers","The field link","Simple updates return to the office without making workers run the owner system."],["05","Money","The value room","Quotes, completed work, extras and invoice drafts stay connected."],["06","Command","The owner desk","Approve, edit, park or ask with the evidence and consequences visible."]];
          function ProductBuilding(){return <aside className="cpProductCutaway" aria-label="Churvox connected office cutaway"><div className="cpProductBrain"><small>Churvox</small><b>Office brain</b><span>checks the connected business</span></div><div className="cpProductRoom r1"><small>Bookings room</small><b>Requests prepared</b><p>Timing, recurrence and client intent.</p></div><div className="cpProductRoom r2"><small>Field room</small><b>Workers moving</b><p>Status, proof and problems.</p></div><div className="cpProductRoom r3"><small>Money room</small><b>Value protected</b><p>Quotes, invoices and extras.</p></div><div className="cpProductRoom r4"><small>Owner room</small><b>Real decisions only</b><p>Approve, edit, park or ask.</p></div><i className="cpProductSignal s1"/><i className="cpProductSignal s2"/><i className="cpProductSignal s3"/><i className="cpProductSignal s4"/></aside>}
          export default function ExecutiveFeaturesPage(){return <main className="cp26Site cpWorld cvPremiumPage" data-room="product" data-version="CHURVOX_PREMIUM_SCENES_PRODUCT_20260724"><PublicNav active="/product"/>
            <section className="cvSceneHero"><div className="cvSceneHeroCopy"><span className="cvSceneKicker">Product · connected office</span><h1>Six rooms. <em>One business story.</em></h1><p>Churvox is not a dashboard with the same cards repeated everywhere. Each room has one operating responsibility, while the office brain keeps the records connected as work changes.</p><div className="cvSceneActions"><Link className="cp26Button" to="/demo">Run a workday</Link><Link className="cp26Button cp26ButtonGhost" to="/signup?plan=operator">Start free trial</Link></div><div className="cvSceneFacts"><span>Connected records</span><span>Field handover</span><span>Owner approval</span></div></div><ProductBuilding/></section>

            <section className="cvProductSpine"><div className="cvProductSticky"><div className="cvSceneIntro"><small>The operating spine</small><h2>Different rooms. No broken handovers.</h2><p>The visual language changes around the job each room performs, but the client, job, worker, promise and money records stay connected.</p></div></div><div className="cvRoomSpine">{ROOMS.map(([n,title,sub,text])=><article className="cvRoomEntry" data-room={n} key={n}><small>{sub}</small><h3>{title}</h3><p>{text}</p></article>)}</div></section>

            <section className="cvCommandStage"><div className="cvSceneIntro"><small>Command · the owner desk</small><h2>The system prepares. The owner decides.</h2><p>Every decision slip explains what changed, which records were checked, what is still missing and what happens next.</p><strong>Nothing important disappears into automation.</strong><ul><li>Messages remain editable.</li><li>Money actions stay deliberate.</li><li>Accounting handoff stays owner-controlled.</li><li>Every approval leaves a trail.</li></ul></div><div className="cvCommandConsole"><header><span>Prepared decision / extra work</span><b>4 records checked</b></header><div className="cvCommandBody"><div className="cvCommandQueue"><button className="active" type="button"><small>Quality</small><b>Extra work found</b></button><button type="button"><small>Client</small><b>Promise due</b></button><button type="button"><small>Money</small><b>Invoice check</b></button></div><div className="cvDecisionPane"><small>Prepared owner move</small><h3>Add the variation. Hold the invoice.</h3><p>The completed extra section is visible in worker time, notes and photos but is not yet represented in the quote or invoice.</p><div className="cvDecisionFacts"><div><span>Value at risk</span><b>$680</b></div><div><span>Next safe move</span><b>Variation</b></div></div><div className="cvDecisionActions"><span>Approve</span><span>Edit amount</span><span>Park</span><span>Ask</span></div></div></div></div></section>

            <section className="cvFieldStage"><div className="cvFieldDevice"><div className="cvFieldScreen"><header><span>9:41</span><b>Churvox Field</b><span>●</span></header><div className="cvFieldJob"><small>Assigned · ready</small><h3>Riverside tidy</h3><p>Client access, scope and latest office direction are attached.</p></div><div className="cvFieldSteps"><span>Acknowledge</span><span>Start work</span><span>Add proof</span><span>Complete</span></div></div></div><div className="cvFieldCopy"><div className="cvSceneIntro"><small>The worker experience</small><h2>The field app stays focused because the office does the joining.</h2><p>Workers receive the work, update what happened and return proof. Churvox connects that handover to the rest of the business.</p></div><div className="cvHandoffLine"><h3>One update can affect the whole office.</h3><p>A completion note can prepare an invoice, surface an extra, update a client promise and create an owner decision—without four people retyping it.</p></div></div></section>

            <section className="cvIndustryFrequency"><div className="cvSceneIntro"><small>Business frequency</small><h2>Same operating brain. The business’s own language.</h2><p>Jobs, visits, appointments, cleaners, stylists and technicians can use wording that fits the work.</p></div><div className="cvFrequencyTrack">{serviceTypes.map((type,index)=><Link key={type} to={`/demo?industry=${encodeURIComponent(type.toLowerCase().replace(/[^a-z0-9]+/g,"-"))}`}><small>Route {String(index+1).padStart(2,"0")}</small><b>{type}</b><span>Open workday →</span></Link>)}</div></section>

            <section className="cvSceneClose"><div><small>Next · workday simulator</small><h2>Watch the connected office respond to one job.</h2><p>The demo uses clearly labelled sample information. Nothing is sent or added to an account.</p></div><div><Link className="cp26Button" to="/demo">Run the simulator</Link><Link className="cp26Button cp26ButtonGhost" to="/pricing">Open pricing</Link></div></section><PublicFooter/></main>}
          EOF

          cat > frontend/src/pages/marketing/ExecutivePricingPage.jsx <<'EOF'
          import React from "react";
          import { Link } from "react-router-dom";
          import { CHURVOX_PLANS,COUNTRY_OPTIONS,addonPriceForCountry,detectCountryCode,getCountryMeta,pricePlanForCountry,pricingNotesForCountry,normalizeCountry } from "../../config/churvoxPlans";
          import { PublicNav,PublicFooter } from "./ChurvoxPublicShell";
          import "./ChurvoxPremiumScenes.css";
          function cleanFeature(item){return String(item||"").replace(/AI Operator Actions/gi,"prepared admin actions").replace(/AI Operator/gi,"prepared admin").replace(/Customer Follow-Up Brain/gi,"customer follow-up tools")}
          function featuresFor(plan){const list=plan.features||plan.includes||[];return Array.isArray(list)?list.slice(0,8).map(cleanFeature):[]}
          function signupPath(country,plan){return `/signup?${new URLSearchParams({country,plan:String(plan?.code||plan?.key||plan?.name||"").toLowerCase()})}`}
          export default function ExecutivePricingPage(){const [country,setCountry]=React.useState(()=>{try{const p=new URLSearchParams(window.location.search||"");return normalizeCountry(p.get("country")||detectCountryCode())}catch{return detectCountryCode()}});const [selected,setSelected]=React.useState(2);React.useEffect(()=>{try{window.localStorage.setItem("churvox:billing-country",country)}catch{}},[country]);const meta=getCountryMeta(country);const plans=React.useMemo(()=>CHURVOX_PLANS.map(p=>pricePlanForCountry(p,country)),[country]);const plan=plans[selected]||plans[2]||plans[0];const accounting=addonPriceForCountry("accounting_sync",country);const growth=addonPriceForCountry("growth_pack",country);const notes=pricingNotesForCountry(country);
            return <main className="cp26Site cpWorld cvPremiumPage" data-room="pricing" data-version="CHURVOX_PREMIUM_SCENES_PRICING_20260724"><PublicNav active="/pricing"/>
              <section className="cvSceneHero"><div className="cvSceneHeroCopy"><span className="cvSceneKicker">Pricing · capacity switchboard</span><h1>Choose the office pressure you want <em>taken off you.</em></h1><p>Do not buy a feature pile. Choose the level that removes the current bottleneck, then move up only when the business earns it.</p><div className="cvSceneActions"><Link className="cp26Button" to="/signup?plan=operator">Start 14-day trial</Link><Link className="cp26Button cp26ButtonGhost" to="/demo">Run the workday</Link></div><div className="cvSceneFacts"><span>14 days</span><span>No card upfront</span><span>Published prices stay visible</span></div></div><aside className="cpPriceSwitchboard"><header><span>Admin load monitor</span><b>Owner control on</b></header><div className="cpPressureGauge"><div><small>recommended room</small><b>03</b><span>Operator</span></div></div><div className="cpSwitchRows"><div><span>Prepared admin</span><b>High</b></div><div><span>Worker coordination</span><b>Connected</b></div><div><span>Owner decisions</span><b>Command</b></div><div><span>Silent sends</span><b>0</b></div></div></aside></section>

              <section className="cvPlanStage"><div className="cvPlanToolbar"><div className="cvSceneIntro"><small>Live plan console</small><h2>Four levels. One control model.</h2><p>Showing {meta.currency} pricing for {meta.label}. {notes.join(" ")}</p></div><label className="cvPlanRegion"><b>Pricing region</b><select value={country} onChange={e=>setCountry(normalizeCountry(e.target.value))}>{COUNTRY_OPTIONS.map(item=><option key={item.code} value={item.code}>{item.label} · {item.currency}</option>)}</select></label></div>
                <div className="cvPlanConsole"><div className="cvPlanRail"><small>Select office level</small>{plans.map((item,index)=><button type="button" key={item.name} className={selected===index?"active":""} onClick={()=>setSelected(index)}><b>{item.name}</b><span>0{index+1}</span></button>)}</div><article className="cvPlanDetail" data-index={`0${selected+1}`} data-plan-card data-plan-name={plan.name}><small>{String(plan.name).toLowerCase()==="operator"?"Most popular · balanced office":"Churvox office level"}</small><h2>{plan.name}</h2><div className="cvPlanPrice">{plan.priceLabel}</div><div className="cvPlanTax">{plan.taxInclusiveLabel||" "}</div><p className="cvPlanSummary">{cleanFeature(plan.summary)}</p><ul className="cvPlanFeatures">{featuresFor(plan).map(feature=><li key={feature}>{feature}</li>)}</ul><div className="cvPlanBottom"><Link className="cp26Button" to={signupPath(country,plan)} onClick={()=>{try{window.localStorage.setItem("churvox:billing-plan",String(plan?.code||plan?.key||plan?.name||"operator").toLowerCase())}catch{}}}>Start free trial</Link><p>Final monthly amount is shown in Stripe Checkout. No card is required to begin the 14-day trial.</p></div></article></div>
                <div className="cvAddonRails"><article className="cvAddonRail" data-plan-card data-plan-name="Command Growth Pack"><span>01</span><div><h3>Command Growth Pack</h3><p>Extra active-team capacity and additional Command headroom.</p></div><b>{growth.priceLabel}</b></article><article className="cvAddonRail" data-plan-card data-plan-name="Accounting Sync Add-on"><span>02</span><div><h3>Accounting Sync Add-on</h3><p>Optional owner-controlled draft invoice sync where available.</p></div><b>{accounting.priceLabel}</b></article><article className="cvAddonRail"><span>03</span><div><h3>Human help</h3><p>Email the team size and the admin problem that hurts most. No sales call required.</p></div><b>hello@churvox.com</b></article></div>
              </section>

              <section className="cvSceneClose"><div><small>Let the office earn its place</small><h2>Start with one real workday.</h2><p>Use one job, one worker update and one owner decision to see whether Churvox actually removes work.</p></div><div><Link className="cp26Button" to={signupPath(country,{code:"operator"})}>Start free trial</Link><Link className="cp26Button cp26ButtonGhost" to="/demo">Open demo</Link></div></section><PublicFooter/></main>}
          EOF

          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/pages/marketing/ChurvoxPublicShell.jsx')
          text=p.read_text()
          imp='import "./ChurvoxPremiumScenes.css";'
          if imp not in text:
              text=text.replace('import "./ChurvoxPremiumPublic.css";', 'import "./ChurvoxPremiumPublic.css";\n'+imp)
          p.write_text(text)
          PY

      - name: Build the complete frontend
        working-directory: frontend
        run: |
          npm install --include=dev --legacy-peer-deps
          npm run build

      - name: Guard product rules and new scene structure
        shell: bash
        run: |
          grep -F 'cvSignalRail' frontend/src/pages/marketing/ExecutiveHomePage.jsx
          grep -F 'cvProductSpine' frontend/src/pages/marketing/ExecutiveFeaturesPage.jsx
          grep -F 'cvPlanConsole' frontend/src/pages/marketing/ExecutivePricingPage.jsx
          grep -F 'CHURVOX_PLANS' frontend/src/pages/marketing/ExecutivePricingPage.jsx
          grep -F 'Nothing important sends, charges, syncs or changes without owner approval.' frontend/src/pages/marketing/ChurvoxPublicShell.jsx

      - name: Commit structural rebuild
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/marketing/ChurvoxPremiumScenes.css frontend/src/pages/marketing/ExecutiveHomePage.jsx frontend/src/pages/marketing/ExecutiveFeaturesPage.jsx frontend/src/pages/marketing/ExecutivePricingPage.jsx frontend/src/pages/marketing/ChurvoxPublicShell.jsx
          git commit -m 'Rebuild the public site as premium connected scenes'
          git push
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report completion
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`The structural public rebuild passed the full production build. Home, Product and Pricing no longer use repeated landing-page card sections; they now use connected signal, Command, field and plan-console scenes. Commit: \`${process.env.COMMIT || 'unknown'}\``});
