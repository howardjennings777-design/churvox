name: Churvox Growth Pack Checkout Live Probe

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[churvox-growth-pack-live-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for Growth Pack purchase bundle
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/churvox-growth-pack-live-probe.txt 2>&1
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const site = 'https://www.churvox.com';
          const marker = 'churvox-growth-pack-checkout-20260713a';
          async function check() {
            const manifestResponse = await fetch(`${site}/asset-manifest.json?ts=${Date.now()}`, { cache: 'no-store' });
            if (!manifestResponse.ok) return { ok: false, detail: `manifest=${manifestResponse.status}` };
            const manifest = await manifestResponse.json();
            const mainPath = manifest.files?.['main.js'] || manifest.entrypoints?.find((item) => /main\..*\.js$/.test(item));
            if (!mainPath) return { ok: false, detail: 'main bundle missing' };
            const bundleResponse = await fetch(new URL(mainPath, site), { cache: 'no-store' });
            const bundle = await bundleResponse.text();
            const live = bundle.includes(marker) && bundle.includes('Buy Growth Packs') && bundle.includes('create-addon-checkout-session');
            return { ok: live, detail: `${mainPath} marker=${bundle.includes(marker)} buy-copy=${bundle.includes('Buy Growth Packs')} checkout=${bundle.includes('create-addon-checkout-session')}` };
          }
          (async () => {
            let last = '';
            for (let attempt = 1; attempt <= 90; attempt += 1) {
              try {
                const result = await check();
                last = result.detail;
                console.log(`Attempt ${attempt}: ${last}`);
                if (result.ok) {
                  console.log('GROWTH_PACK_CHECKOUT_LIVE');
                  return;
                }
              } catch (error) {
                last = error.message || String(error);
                console.log(`Attempt ${attempt}: ${last}`);
              }
              if (attempt < 90) await sleep(10_000);
            }
            throw new Error(`Growth Pack checkout did not deploy: ${last}`);
          })().catch((error) => { console.error(error.message || error); process.exit(1); });
          NODE

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.existsSync('/tmp/churvox-growth-pack-live-probe.txt') ? fs.readFileSync('/tmp/churvox-growth-pack-live-probe.txt', 'utf8').slice(-9000) : 'No probe output.';
            const title = '${{ job.status }}' === 'success' ? '## Growth Pack checkout is live' : '## Growth Pack checkout deployment probe failed';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `${title}\n\n\`\`\`text\n${text}\n\`\`\`` });
