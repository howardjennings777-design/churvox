name: Emergency Safe Smart Hub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-safe-smart-hub.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Point dashboard to safe page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/App.js')
          s = p.read_text()
          s = s.replace('import AIAssistantPage from "./pages/AIAssistantPage";', 'import AIAssistantPage from "./pages/SafeAIAssistantPage";')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.js
          git commit -m "Emergency route dashboard to safe AI assistant" || exit 0
          git push origin main
