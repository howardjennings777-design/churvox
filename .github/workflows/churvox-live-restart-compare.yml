name: Churvox Live Restart Compare

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/churvox-live-restart-compare.yml'
      - '.github/churvox-expected-jwt-key-id.txt'
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare persistent key and protected routes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify the new deployment kept the signing key
        env:
          API_BASE: https://grassley-backend.onrender.com
          FRONTEND_BASE: https://www.churvox.com
          EXPECTED_LOGIN_ROUTE: churvox-login-emergency-final-20260712f
          EXPECTED_HEALTH_VERSION: churvox-jwt-health-fingerprint-20260712
          EXPECTED_LAUNCH_VERSION: churvox-production-launch-security-20260712g
        run: |
          mkdir -p /tmp/churvox-live-restart-compare
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          api = os.environ['API_BASE'].rstrip('/')
          frontend = os.environ['FRONTEND_BASE'].rstrip('/')
          expected_login = os.environ['EXPECTED_LOGIN_ROUTE']
          expected_health = os.environ['EXPECTED_HEALTH_VERSION']
          expected_launch = os.environ['EXPECTED_LAUNCH_VERSION']
          expected_key = Path('.github/churvox-expected-jwt-key-id.txt').read_text().strip()
          report = {'expected_jwt_key_id': expected_key, 'checks': {}, 'failures': []}

          def request(name, path, *, method='GET', body=None, headers=None, timeout=30):
              payload = None if body is None else json.dumps(body).encode()
              request_headers = {'Accept': 'application/json', **(headers or {})}
              if body is not None:
                  request_headers.setdefault('Content-Type', 'application/json')
              req = urllib.request.Request(api + path, data=payload, headers=request_headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      raw = response.read().decode('utf-8', 'replace')
                      status = response.status
                      response_headers = dict(response.headers.items())
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode('utf-8', 'replace')
                  status = exc.code
                  response_headers = dict(exc.headers.items())
              except Exception as exc:
                  result = {'status': 0, 'error': f'{exc.__class__.__name__}: {exc}'}
                  report['checks'][name] = result
                  return result
              try:
                  parsed = json.loads(raw) if raw else None
              except Exception:
                  parsed = None
              result = {
                  'status': status,
                  'json': parsed,
                  'headers': {
                      key.lower(): value
                      for key, value in response_headers.items()
                      if key.lower().startswith('x-churvox-') or key.lower().startswith('access-control-')
                  },
                  'body_preview': raw[:300] if parsed is None else None,
              }
              report['checks'][name] = result
              return result

          health = launch = portal = deletion = signed_out = None
          for attempt in range(1, 46):
              health = request('login_health', '/api/auth/login-health')
              launch = request('launch_status', '/api/security/launch-status')
              portal = request('billing_portal_signed_out', '/api/billing/create-portal-session', method='POST', body={})
              deletion = request('account_delete_signed_out', '/api/account/self-delete', method='DELETE', body={'confirmation': 'DELETE MY ACCOUNT'})
              signed_out = request('signed_out_me', '/api/auth/me')
              health_data = health.get('json') or {}
              launch_data = launch.get('json') or {}
              ready = all([
                  health.get('status') == 200,
                  health_data.get('login_route') == expected_login,
                  health_data.get('jwt_health_version') == expected_health,
                  health_data.get('jwt_source') in {'database', 'environment'},
                  health_data.get('jwt_persistent') is True,
                  health_data.get('restart_persistence_ready') is True,
                  health_data.get('jwt_key_id') == expected_key,
                  health_data.get('billing_portal_post_route_count') == 1,
                  health_data.get('account_delete_post_route_count') == 1,
                  health_data.get('account_delete_delete_route_count') == 1,
                  launch.get('status') == 200,
                  launch_data.get('version') == expected_launch,
                  launch_data.get('ready_for_paid_launch') is True,
                  portal.get('status') in {401, 403},
                  deletion.get('status') in {401, 403},
                  signed_out.get('status') == 401,
              ])
              if ready:
                  report['deployment_attempts'] = attempt
                  break
              if attempt < 45:
                  time.sleep(20)
          else:
              report['failures'].append('The restarted deployment did not satisfy the complete persistence and protected-route contract.')

          health_data = (health or {}).get('json') or {}
          launch_data = (launch or {}).get('json') or {}
          report['observed_jwt_key_id'] = health_data.get('jwt_key_id')
          report['observed_jwt_source'] = health_data.get('jwt_source')
          report['route_counts'] = {
              'billing_portal_post': health_data.get('billing_portal_post_route_count'),
              'account_delete_post': health_data.get('account_delete_post_route_count'),
              'account_delete_delete': health_data.get('account_delete_delete_route_count'),
          }

          requirements = {
              'same_key_after_restart': health_data.get('jwt_key_id') == expected_key,
              'persistent_source': health_data.get('jwt_source') in {'database', 'environment'},
              'restart_ready': health_data.get('restart_persistence_ready') is True,
              'billing_post_mounted_once': health_data.get('billing_portal_post_route_count') == 1,
              'delete_post_mounted_once': health_data.get('account_delete_post_route_count') == 1,
              'delete_delete_mounted_once': health_data.get('account_delete_delete_route_count') == 1,
              'billing_signed_out_protected': (portal or {}).get('status') in {401, 403},
              'deletion_signed_out_protected': (deletion or {}).get('status') in {401, 403},
              'me_signed_out_401': (signed_out or {}).get('status') == 401,
              'launch_ready': launch_data.get('ready_for_paid_launch') is True and launch_data.get('version') == expected_launch,
          }
          report['requirements'] = requirements
          report['failures'].extend([name for name, passed in requirements.items() if not passed])

          cors = request(
              'cors_preflight',
              '/api/auth/login',
              method='OPTIONS',
              headers={
                  'Origin': frontend,
                  'Access-Control-Request-Method': 'POST',
                  'Access-Control-Request-Headers': 'content-type',
              },
          )
          cors_headers = cors.get('headers') or {}
          if cors.get('status') not in {200, 204}:
              report['failures'].append('cors_status')
          if cors_headers.get('access-control-allow-origin') != frontend or cors_headers.get('access-control-allow-credentials', '').lower() != 'true':
              report['failures'].append('cors_credentials')

          report['success'] = not report['failures']
          output = Path('/tmp/churvox-live-restart-compare/report.json')
          output.write_text(json.dumps(report, indent=2, default=str) + '\n')
          print(output.read_text())
          if report['failures']:
              raise SystemExit(1)
          PY
      - name: Upload final restart proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churvox-live-restart-compare
          path: /tmp/churvox-live-restart-compare/report.json
          if-no-files-found: error
          retention-days: 30
