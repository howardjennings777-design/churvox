name: Restore Online Worker Proof Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.pull_request.head.sha || '', 'unused') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/churvox-go-live-trust-clean
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore connected completion proof check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx')
          source = path.read_text()
          source = source.replace(
              'import { fetchWorkerProofCoach } from "./OfficeTeamIntelligenceApi";',
              'import { checkWorkerProofCoach, fetchWorkerProofCoach } from "./OfficeTeamIntelligenceApi";'
          )
          anchor = '''    setStepBusy(step);\n    try {\n'''
          replacement = '''    if (step === "Complete" && workerNetworkState().online) {\n      setProofCoachBusy(true);\n      try {\n        const proofCheck = await checkWorkerProofCoach(jobId, { notes: String(note || "").trim(), photo_names: proofNames, confirmations: proofConfirmationIds, industry: proofCoach?.industry || "" });\n        if (proofCheck?.ready === false) {\n          const missing = Array.isArray(proofCheck?.missing) ? proofCheck.missing.map((item) => item.label || item.id).filter(Boolean) : [];\n          addTrail(`Finish blocked: ${missing.length ? missing.join(" · ") : "required proof still needs checking"}.`);\n          return;\n        }\n      } catch (error) {\n        addTrail(`Finish blocked until Churvox can verify the proof. ${error?.message || ""}`.trim());\n        return;\n      } finally { setProofCoachBusy(false); }\n    }\n    setStepBusy(step);\n    try {\n'''
          if anchor not in source:
              raise SystemExit('Worker completion anchor not found')
          source = source.replace(anchor, replacement, 1)
          path.write_text(source)
          PY
          python3 scripts/churvox-owner-intelligence-contract.py
          python3 scripts/churvox-launch-hardening-contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx
          git commit -m "Restore connected worker proof verification"
          git push origin HEAD:agent/churvox-go-live-trust-clean
