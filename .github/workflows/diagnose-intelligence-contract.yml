name: Diagnose Intelligence Contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Intelligence contract only
        run: python3 scripts/churvox-owner-intelligence-contract.py
