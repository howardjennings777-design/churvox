name: Diagnose Intelligence Contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Intelligence contract only
        id: contract
        continue-on-error: true
        run: python3 scripts/churvox-owner-intelligence-contract.py > /tmp/intelligence-contract.txt 2>&1
      - name: Report exact result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/intelligence-contract.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 684,
              body: `### Intelligence contract diagnostic\n\n\`\`\`text\n${output}\n\`\`\``
            });
      - name: Preserve failure
        if: steps.contract.outcome != 'success'
        run: exit 1
