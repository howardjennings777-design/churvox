name: Churvox Real Person Launch Audit

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Live site URL to test"
        required: true
        default: "https://www.churvox.com"

jobs:
  launch-audit:
    name: Real person Playwright audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --include=dev --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real person launch audit
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url }}
          CHURVOX_TEST_EMAIL: ${{ secrets.CHURVOX_TEST_EMAIL }}
          CHURVOX_TEST_PASSWORD: ${{ secrets.CHURVOX_TEST_PASSWORD }}
        run: npx playwright test tests/e2e/churvox-real-person-launch-audit.spec.js --project=chromium --reporter=list,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churvox-real-person-launch-audit-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churvox-real-person-launch-audit-results
          path: frontend/test-results
          if-no-files-found: ignore
