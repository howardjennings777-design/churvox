name: Assemble Go Live Trust Backend

on:
  push:
    branches:
      - agent/churvox-go-live-trust

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip-go-live-assembly]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/churvox-go-live-trust
          fetch-depth: 0
      - name: Assemble and validate backend
        run: |
          cat .churvox-tmp/launch-hardening-00.part \
              .churvox-tmp/launch-hardening-01.part \
              .churvox-tmp/launch-hardening-02.part \
              .churvox-tmp/launch-hardening-03.part \
              .churvox-tmp/launch-hardening-04.part \
              > backend/churvox_launch_hardening_routes.py
          python3 -m py_compile backend/churvox_launch_hardening_routes.py
          rm -rf .churvox-tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/churvox_launch_hardening_routes.py .churvox-tmp
          git commit -m "Build Go Live trust backend [skip-go-live-assembly]"
          git push origin HEAD:agent/churvox-go-live-trust
