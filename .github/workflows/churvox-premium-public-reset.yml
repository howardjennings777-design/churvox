name: Churvox premium public visual reset

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  reset:
    if: startsWith(github.event.issue.title, '[churvox-premium-public-reset]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Replace the old beige-card visual language
        shell: bash
        run: |
          cat > frontend/src/pages/marketing/ChurvoxPremiumPublic.css <<'EOF'
          :root {
            --cv-premium-bg: #090c0a;
            --cv-premium-bg-2: #0d120f;
            --cv-premium-surface: rgba(255,255,255,.045);
            --cv-premium-surface-strong: rgba(255,255,255,.075);
            --cv-premium-line: rgba(255,255,255,.105);
            --cv-premium-line-soft: rgba(255,255,255,.065);
            --cv-premium-text: #f4f2ea;
            --cv-premium-muted: #a8afa8;
            --cv-premium-orange: #ff7128;
            --cv-premium-orange-soft: #ff9b62;
            --cv-premium-lime: #bde96e;
            --cv-premium-shadow: 0 40px 120px rgba(0,0,0,.38);
          }

          html { background: var(--cv-premium-bg); }
          body { background: var(--cv-premium-bg); }

          .cpWorld,
          .clhSite {
            color: var(--cv-premium-text) !important;
            background:
              radial-gradient(circle at 15% -5%, rgba(255,113,40,.15), transparent 31%),
              radial-gradient(circle at 92% 22%, rgba(117,153,123,.075), transparent 29%),
              linear-gradient(180deg, #090c0a 0%, #0c100d 48%, #080a09 100%) !important;
          }

          .cpWorld::before {
            opacity: .45 !important;
            background:
              linear-gradient(90deg, rgba(255,255,255,.024) 1px, transparent 1px),
              linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px) !important;
            background-size: 72px 72px !important;
            mask-image: linear-gradient(to bottom, #000, transparent 76%);
          }

          .cp26Topbar,
          .cpWorldTopbar {
            width: min(1500px, calc(100% - 28px)) !important;
            top: 12px !important;
            margin: 0 auto !important;
            min-height: 68px !important;
            padding: 0 18px !important;
            border: 1px solid rgba(255,255,255,.095) !important;
            border-radius: 18px !important;
            background: rgba(9,12,10,.78) !important;
            box-shadow: 0 18px 55px rgba(0,0,0,.25) !important;
            backdrop-filter: blur(22px) saturate(125%) !important;
          }
          .cpWorldTopbar::after { display: none !important; }
          .cp26BrandWords small,
          .cpWorldBrandCode,
          .cpWorldOnline { display: none !important; }
          .cp26BrandWords b { color: #fff !important; font-size: 15px !important; letter-spacing: -.035em !important; }
          .cp26NavLinks { gap: 4px !important; }
          .cp26NavLinks a { min-height: 38px !important; padding: 0 12px !important; border-radius: 11px !important; color: rgba(255,255,255,.62) !important; font-size: 11px !important; font-weight: 820 !important; }
          .cp26NavLinks a:hover,
          .cp26NavLinks a[aria-current="page"] { color: #fff !important; background: rgba(255,255,255,.065) !important; }
          .cpWorldNavLinks a[aria-current="page"]::after { left: 12px !important; right: 12px !important; bottom: 1px !important; }
          .cp26TextLink { color: rgba(255,255,255,.72) !important; }
          .cp26Button,
          .clhActions a,
          .clhClose a {
            min-height: 46px !important;
            border-radius: 13px !important;
            padding: 0 18px !important;
            font-size: 11px !important;
            letter-spacing: -.01em !important;
          }
          .cp26Button:not(.cp26ButtonGhost),
          .clhActions .primary,
          .clhClose .primary {
            border: 1px solid rgba(255,167,112,.3) !important;
            background: linear-gradient(135deg, #ff762c, #d94c0b) !important;
            box-shadow: 0 12px 34px rgba(255,91,16,.24), inset 0 1px 0 rgba(255,255,255,.25) !important;
          }
          .cp26ButtonGhost,
          .clhActions .secondary,
          .clhClose .secondary {
            color: rgba(255,255,255,.85) !important;
            border-color: rgba(255,255,255,.12) !important;
            background: rgba(255,255,255,.045) !important;
          }

          .cpWorldHero,
          .clhHero {
            width: min(1500px, calc(100% - 38px)) !important;
            max-width: 1500px !important;
            min-height: 760px !important;
            padding: 112px 0 88px !important;
            gap: clamp(42px, 6vw, 100px) !important;
          }
          .cpWorldLead,
          .clhHeroCopy { max-width: 690px !important; }
          .cpWorldRouteCode,
          .clhKicker,
          .clhStatement>span,
          .clhMoments header span,
          .clhMoveCopy>span,
          .clhFlow header span,
          .clhTell>div:first-child>span,
          .clhControl>div:first-child>span,
          .clhClose>div>span {
            color: var(--cv-premium-orange-soft) !important;
            font-size: 9px !important;
            letter-spacing: .2em !important;
          }
          .cpWorldLead h1,
          .clhHero h1 {
            max-width: 760px !important;
            margin-top: 22px !important;
            color: #f8f5ec !important;
            font-size: clamp(52px, 5.3vw, 86px) !important;
            line-height: .94 !important;
            letter-spacing: -.065em !important;
            font-weight: 760 !important;
          }
          .cpWorldLead h1 em,
          .clhHero h1 em { color: var(--cv-premium-orange) !important; }
          .cpWorldLead>p,
          .clhHeroCopy>p {
            max-width: 630px !important;
            color: var(--cv-premium-muted) !important;
            font-size: 16px !important;
            line-height: 1.65 !important;
            font-weight: 520 !important;
          }
          .cpWorldFacts,
          .clhTrust { gap: 7px !important; }
          .cpWorldFacts span,
          .clhTrust span {
            color: rgba(255,255,255,.52) !important;
            border-color: rgba(255,255,255,.075) !important;
            background: rgba(255,255,255,.025) !important;
            font-size: 9px !important;
            font-weight: 720 !important;
          }

          .clhOffice,
          .cpProductCutaway,
          .cpPriceSwitchboard,
          .cpIndustryBoard,
          .cpRadioRoom,
          .cpTrustInstrument,
          .cp26HeroPanel,
          .cvLoginControlPanel,
          .cvPublicAuthPanel {
            border: 1px solid rgba(255,255,255,.11) !important;
            border-radius: 28px !important;
            background:
              radial-gradient(circle at 78% 8%, rgba(255,113,40,.20), transparent 27%),
              linear-gradient(145deg, #0b100d, #111914 61%, #1e0f08) !important;
            box-shadow: 0 46px 130px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,255,255,.055) !important;
          }
          .clhOffice { min-height: 620px !important; }
          .clhFloor { background-color: #080c09 !important; }
          .clhDesk,
          .clhOwnerDesk,
          .cpProductRoom {
            border-color: rgba(255,255,255,.105) !important;
            background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025)) !important;
            box-shadow: 0 18px 50px rgba(0,0,0,.22) !important;
          }

          .cpWorldSection,
          .clhStatement,
          .clhMoments,
          .clhFlow,
          .clhControl,
          .clhTell {
            width: min(1420px, calc(100% - 38px)) !important;
            max-width: 1420px !important;
            padding: 105px 0 !important;
          }
          .cpWorldSectionHead { max-width: 760px !important; margin-bottom: 46px !important; }
          .cpWorldSectionHead span { color: var(--cv-premium-orange-soft) !important; }
          .cpWorldSectionHead h2,
          .clhStatement h2,
          .clhMoments h2,
          .clhFlow h2,
          .clhMove h2,
          .clhTell h2,
          .clhControl h2,
          .clhClose h2 {
            max-width: 820px !important;
            color: #f5f2e9 !important;
            font-size: clamp(38px, 4.2vw, 64px) !important;
            line-height: .98 !important;
            letter-spacing: -.055em !important;
            font-weight: 700 !important;
          }
          .cpWorldSectionHead p,
          .clhStatement p,
          .clhMoments p,
          .clhFlow p,
          .clhControlGrid p {
            color: var(--cv-premium-muted) !important;
            font-size: 13px !important;
            line-height: 1.6 !important;
            font-weight: 520 !important;
          }

          .clhStatement {
            position: relative !important;
            margin-top: 24px !important;
            padding: 110px 60px !important;
            text-align: left !important;
            border: 1px solid var(--cv-premium-line) !important;
            border-radius: 30px !important;
            background:
              linear-gradient(90deg, rgba(255,113,40,.065), transparent 45%),
              rgba(255,255,255,.025) !important;
            overflow: hidden !important;
          }
          .clhStatement::after {
            content: "CHURVOX / CONNECTED OFFICE";
            position: absolute;
            right: 38px;
            bottom: 30px;
            color: rgba(255,255,255,.14);
            font: 800 9px/1 ui-monospace, monospace;
            letter-spacing: .18em;
          }
          .clhStatement>span { justify-content: flex-start !important; }
          .clhStatement h2 { max-width: 980px !important; margin-left: 0 !important; }
          .clhStatement p { margin-left: 0 !important; }

          .clhMoments>div,
          .clhFlow>div,
          .clhControlGrid,
          .cpProductRoomGrid,
          .cpIndustryCore,
          .cpGuardGrid,
          .cpBlueprintGrid,
          .cpSupportBoard,
          .cpLedgerRows {
            gap: 1px !important;
            overflow: hidden !important;
            border: 1px solid var(--cv-premium-line) !important;
            border-radius: 26px !important;
            background: var(--cv-premium-line) !important;
          }
          .clhMoments article,
          .clhFlow article,
          .clhControlGrid article,
          .cpProductTile,
          .cpIndustryCore article,
          .cpGuardGrid article,
          .cpBlueprintGrid article,
          .cpSupportBoard article,
          .cpLedgerRows article {
            min-height: 245px !important;
            border: 0 !important;
            border-radius: 0 !important;
            color: var(--cv-premium-text) !important;
            background: linear-gradient(150deg, rgba(255,255,255,.046), rgba(255,255,255,.018)) !important;
            box-shadow: none !important;
          }
          .clhMoments h3,
          .clhFlow h3,
          .clhControlGrid h3,
          .cpProductTile h3,
          .cpIndustryCore b,
          .cpGuardGrid b,
          .cpBlueprintGrid b,
          .cpSupportBoard b,
          .cpLedgerRows b {
            color: #f4f1e8 !important;
            font-size: 21px !important;
            line-height: 1.05 !important;
            font-weight: 680 !important;
            letter-spacing: -.045em !important;
          }
          .clhMoments article>b,
          .clhFlow article>b,
          .clhControlGrid article>b { color: var(--cv-premium-orange) !important; }
          .clhMoments em { background: rgba(255,113,40,.11) !important; color: var(--cv-premium-orange-soft) !important; }

          .clhMove,
          .clhTellPanel,
          .cpDecisionSlip,
          .cpWorldClosing {
            border: 1px solid var(--cv-premium-line) !important;
            border-radius: 28px !important;
            background:
              radial-gradient(circle at 90% 0%, rgba(255,113,40,.18), transparent 30%),
              linear-gradient(145deg, #0d120f, #121915 66%, #1c0f08) !important;
            box-shadow: var(--cv-premium-shadow) !important;
          }
          .clhMove { width: min(1420px, calc(100% - 38px)) !important; max-width: 1420px !important; padding: 58px !important; }
          .clhMoveCard {
            border-radius: 22px !important;
            background: rgba(255,255,255,.04) !important;
          }
          .clhTell { grid-template-columns: minmax(0, .88fr) minmax(460px, .8fr) !important; }
          .clhTellPanel { background: rgba(255,255,255,.035) !important; }
          .clhTellPanel>p { color: #fff !important; border-color: var(--cv-premium-line) !important; background: rgba(255,255,255,.04) !important; }
          .clhTellPanel>section { background: #080c09 !important; border: 1px solid var(--cv-premium-line-soft) !important; }

          .cpRecordRiver,
          .cpDecisionDesk {
            width: 100% !important;
            max-width: none !important;
            padding-left: max(19px, calc((100vw - 1420px)/2)) !important;
            padding-right: max(19px, calc((100vw - 1420px)/2)) !important;
            color: var(--cv-premium-text) !important;
            background:
              radial-gradient(circle at 12% 0%, rgba(255,113,40,.11), transparent 34%),
              #070a08 !important;
          }
          .cpRecordTrack,
          .cpPressureMap,
          .cpQuickDirectory {
            border-color: var(--cv-premium-line) !important;
            background: var(--cv-premium-line) !important;
          }
          .cpRecordTrack article,
          .cpPressureMap article,
          .cpQuickDirectory a {
            background: rgba(255,255,255,.032) !important;
          }

          .cpPriceLanes { gap: 12px !important; }
          .cpPriceLane,
          .cpAddonDrawer {
            color: var(--cv-premium-text) !important;
            border: 1px solid var(--cv-premium-line) !important;
            border-radius: 22px !important;
            background: linear-gradient(150deg, rgba(255,255,255,.055), rgba(255,255,255,.02)) !important;
            box-shadow: none !important;
          }
          .cpPriceLane.featured {
            transform: translateY(-10px) !important;
            border-color: rgba(255,113,40,.4) !important;
            background:
              radial-gradient(circle at 95% 0%, rgba(255,113,40,.25), transparent 30%),
              linear-gradient(150deg,#121914,#1b1009) !important;
            box-shadow: 0 30px 80px rgba(0,0,0,.35) !important;
          }
          .cpPriceLane h3,
          .cpAddonDrawer h3 { color: #f7f4ec !important; }
          .cpPriceLane .price,
          .cpAddonDrawer b { color: #fff !important; }
          .cpPriceLane>p,
          .cpPriceLane li,
          .cpAddonDrawer p,
          .cpAddonDrawer a { color: var(--cv-premium-muted) !important; }
          .cpPricingControl select {
            color: #fff !important;
            border-color: var(--cv-premium-line) !important;
            background: #121713 !important;
          }

          .cpContactChannel,
          .cpAddonDrawer,
          .cpDecisionKeys article,
          .cpPocketSteps span,
          .cpIndustryDirectory a {
            color: var(--cv-premium-text) !important;
            border-color: var(--cv-premium-line) !important;
            background: rgba(255,255,255,.035) !important;
          }
          .cpContactChannel p,
          .cpDecisionKeys p,
          .cpIndustryDirectory a::after { color: var(--cv-premium-muted) !important; }
          .cpContactChannel a { background: rgba(255,255,255,.075) !important; }
          .cpIndustryDirectory a[aria-current="page"] { border-color: rgba(255,113,40,.35) !important; background: rgba(255,113,40,.08) !important; }

          .cpWorldClosing,
          .clhClose {
            width: min(1420px, calc(100% - 38px)) !important;
            max-width: 1420px !important;
            margin: 70px auto 0 !important;
            padding: 58px !important;
          }

          .cpWorldFooter {
            width: min(1500px, calc(100% - 28px)) !important;
            margin: 90px auto 14px !important;
            padding: 48px !important;
            border: 1px solid var(--cv-premium-line) !important;
            border-radius: 28px !important;
            color: var(--cv-premium-text) !important;
            background: rgba(255,255,255,.027) !important;
          }
          .cpWorldFooterLead p,
          .cpWorldFooterGroup a,
          .cpWorldFooterBase { color: rgba(255,255,255,.48) !important; }

          .cvWorldAccessGate {
            color: var(--cv-premium-text) !important;
            background:
              radial-gradient(circle at 14% 0%, rgba(255,113,40,.18), transparent 31%),
              linear-gradient(145deg, #090c0a, #0d120f) !important;
          }
          .cvWorldAccessGate .cvPublicAuthCard {
            color: var(--cv-premium-text) !important;
            border-color: var(--cv-premium-line) !important;
            background: rgba(255,255,255,.035) !important;
          }
          .cvWorldAccessGate input,
          .cvWorldAccessGate select,
          .cvWorldAccessGate textarea {
            color: #fff !important;
            border-color: var(--cv-premium-line) !important;
            background: rgba(255,255,255,.045) !important;
          }

          .cp26LegalWorld,
          .cvCustomerRoom { color: var(--cv-premium-text) !important; background: var(--cv-premium-bg) !important; }
          .cp26LegalWorld>section { background: transparent !important; }
          .cp26LegalWorld article,
          .cvCustomerRoom article,
          .cvCustomerRoom section {
            color: var(--cv-premium-text) !important;
            border-color: var(--cv-premium-line) !important;
            background: rgba(255,255,255,.035) !important;
            box-shadow: none !important;
          }

          @media (max-width: 1080px) {
            .cpWorldHero,
            .clhHero { grid-template-columns: 1fr !important; }
            .cpWorldLead,
            .clhHeroCopy { max-width: 780px !important; }
            .clhTell { grid-template-columns: 1fr !important; }
            .cpPriceLane.featured { transform: none !important; }
          }

          @media (max-width: 760px) {
            .cp26Topbar,
            .cpWorldTopbar { width: calc(100% - 18px) !important; top: 8px !important; border-radius: 15px !important; }
            .cpWorldHero,
            .clhHero,
            .cpWorldSection,
            .clhStatement,
            .clhMoments,
            .clhFlow,
            .clhControl,
            .clhTell,
            .clhMove,
            .cpWorldClosing,
            .clhClose { width: calc(100% - 22px) !important; padding-left: 0 !important; padding-right: 0 !important; }
            .cpWorldHero,
            .clhHero { min-height: auto !important; padding-top: 110px !important; }
            .cpWorldLead h1,
            .clhHero h1 { font-size: clamp(44px, 14vw, 62px) !important; }
            .cpWorldSectionHead h2,
            .clhStatement h2,
            .clhMoments h2,
            .clhFlow h2,
            .clhMove h2,
            .clhTell h2,
            .clhControl h2,
            .clhClose h2 { font-size: clamp(34px, 10vw, 48px) !important; }
            .clhStatement,
            .clhMove,
            .cpWorldClosing,
            .clhClose { padding: 32px !important; }
            .clhMoments>div,
            .clhFlow>div,
            .clhControlGrid,
            .cpProductRoomGrid,
            .cpIndustryCore,
            .cpGuardGrid,
            .cpBlueprintGrid,
            .cpSupportBoard,
            .cpLedgerRows { grid-template-columns: 1fr !important; }
            .clhMoments article,
            .clhFlow article,
            .clhControlGrid article { min-height: 210px !important; }
            .cpWorldFooter { width: calc(100% - 18px) !important; padding: 30px !important; }
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          shell = Path('frontend/src/pages/marketing/ChurvoxPublicShell.jsx')
          text = shell.read_text()
          imp = 'import "./ChurvoxPremiumPublic.css";'
          if imp not in text:
              anchor = 'import "./ChurvoxPublicReadableHotfix.css";'
              text = text.replace(anchor, anchor + '\n' + imp)
          shell.write_text(text)

          home = Path('frontend/src/pages/marketing/ExecutiveHomePage.jsx')
          text = home.read_text()
          imp = 'import "./ChurvoxPremiumPublic.css";'
          if imp not in text:
              text = text.replace('import "./ChurvoxLivingOfficeHome.css";', 'import "./ChurvoxLivingOfficeHome.css";\n' + imp)
          home.write_text(text)
          PY

      - name: Build the entire frontend
        working-directory: frontend
        run: |
          npm install --include=dev --legacy-peer-deps
          npm run build

      - name: Guard the premium reset and product rules
        shell: bash
        run: |
          grep -F 'ChurvoxPremiumPublic.css' frontend/src/pages/marketing/ChurvoxPublicShell.jsx
          grep -F 'ChurvoxPremiumPublic.css' frontend/src/pages/marketing/ExecutiveHomePage.jsx
          grep -F -- '--cv-premium-bg: #090c0a' frontend/src/pages/marketing/ChurvoxPremiumPublic.css
          grep -F 'Nothing important sends, charges, syncs or changes without owner approval.' frontend/src/pages/marketing/ChurvoxPublicShell.jsx
          grep -F 'CHURVOX_PLANS' frontend/src/pages/marketing/ExecutivePricingPage.jsx

      - name: Commit premium public reset
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/marketing/ChurvoxPremiumPublic.css frontend/src/pages/marketing/ChurvoxPublicShell.jsx frontend/src/pages/marketing/ExecutiveHomePage.jsx
          git commit -m 'Replace the old public look with a premium control-room system'
          git push
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report result
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Premium public reset built successfully. The cream/card language has been replaced by the dark control-room system across public, access, trust, legal and customer-facing pages. Commit: \`${process.env.COMMIT || 'unknown'}\``});
