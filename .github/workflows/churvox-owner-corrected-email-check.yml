name: Churvox Corrected Owner Email Check

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  owner-email-check:
    if: startsWith(github.event.issue.title, '[churvox-owner-email-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check corrected owner login
        id: check
        continue-on-error: true
        env:
          CHURVOX_OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee /tmp/churvox-owner-email-check.txt
          const email = 'howardjennings777@gmail.com';
          const password = process.env.CHURVOX_OWNER_PASSWORD || '';
          const api = 'https://grassley-backend.onrender.com';

          function tokenFrom(data = {}) {
            return data?.token || data?.access_token || data?.auth_token || data?.jwt || data?.accessToken
              || data?.user?.token || data?.user?.access_token || data?.user?.accessToken
              || data?.data?.token || data?.data?.access_token || data?.data?.user?.token || '';
          }
          function accountEmail(data = {}) {
            return String(data?.email || data?.user?.email || data?.data?.email || data?.data?.user?.email || '').trim().toLowerCase();
          }

          (async () => {
            if (!password) throw new Error('CHURVOX_OWNER_PASSWORD secret is missing.');
            const login = await fetch(`${api}/api/auth/login`, {
              method: 'POST',
              headers: { 'content-type': 'application/json', accept: 'application/json' },
              body: JSON.stringify({ email, password }),
            });
            console.log(`login_status=${login.status}`);
            const loginData = await login.json().catch(() => null);
            if (!login.ok || !loginData || loginData.success === false) {
              const stage = loginData?.stage || 'unknown';
              const detail = loginData?.detail || loginData?.message || 'login failed';
              throw new Error(`Owner login failed: HTTP ${login.status}, stage=${stage}, detail=${detail}`);
            }
            const token = tokenFrom(loginData);
            if (!token) throw new Error('Owner login returned no token.');
            const returned = accountEmail(loginData);
            if (returned && returned !== email) throw new Error('Login returned a different email.');
            const me = await fetch(`${api}/api/auth/me`, {
              headers: { authorization: `Bearer ${token}`, accept: 'application/json' },
            });
            console.log(`auth_me_status=${me.status}`);
            const meData = await me.json().catch(() => null);
            if (!me.ok || !meData) throw new Error(`auth/me failed: HTTP ${me.status}`);
            if (accountEmail(meData) !== email) throw new Error('auth/me did not confirm the corrected email.');
            console.log('auth_me_email_match=true');
            console.log('OWNER_CORRECTED_EMAIL_CHECK_PASSED');
          })().catch((error) => {
            console.error(`OWNER_CORRECTED_EMAIL_CHECK_FAILED: ${error.message}`);
            process.exit(1);
          });
          NODE

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/churvox-owner-email-check.txt';
            const report = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(-5000) : 'No output created.';
            const outcome = process.env.CHECK_OUTCOME === 'success' ? 'PASSED' : 'FAILED';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Corrected owner email check ${outcome}\n\n\`\`\`text\n${report}\n\`\`\``
            });

      - name: Fail when check failed
        if: steps.check.outcome != 'success'
        run: exit 1
