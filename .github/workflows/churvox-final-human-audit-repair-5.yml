name: Churvox Final Human Audit Repair 5

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-final-human-audit-repair-5]')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Extract verified repair scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          lines = Path('.github/workflows/churvox-final-human-audit-repair-4.yml').read_text().splitlines()

          def extract_step(step_name, output):
              step = next(i for i, line in enumerate(lines) if line.strip() == f'- name: {step_name}')
              run = next(i for i in range(step + 1, len(lines)) if lines[i].strip() == 'run: |')
              end = next((i for i in range(run + 1, len(lines)) if lines[i].startswith('      - name: ')), len(lines))
              script = textwrap.dedent('\n'.join(lines[run + 1:end])) + '\n'
              Path(output).write_text(script)

          extract_step('Apply corrected evidence repair', '/tmp/apply-final-repair.sh')
          extract_step('Write clean final Command decision module', '/tmp/write-clean-command-module.sh')
          PY
          bash -n /tmp/apply-final-repair.sh
          bash -n /tmp/write-clean-command-module.sh

      - name: Apply verified repair
        run: bash /tmp/apply-final-repair.sh

      - name: Write verified clean Command module
        run: bash /tmp/write-clean-command-module.sh

      - name: Install verification dependencies
        run: |
          python -m pip install --quiet fastapi pymongo httpx
          npm --prefix frontend install --include=dev --legacy-peer-deps

      - name: Verify backend and permanent contracts
        run: |
          python -m py_compile \
            backend/churvox_command_slip_decision_patch.py \
            backend/churvox_worker_command_visibility_patch.py \
            backend/churvox_worker_field_slip_decision_patch.py \
            backend/churvox_outer_cors_error_shield.py
          python -m unittest backend/test_churvox_command_slip_decision_patch.py backend/test_churvox_worker_command_route_request_injection.py
          node --check frontend/tests/e2e/churvox-live-launch-human-audit-v2.spec.js
          node --check frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js
          node --check frontend/tests/e2e/churvox-hardcore-owner-worker-visual.spec.js
          node --check scripts/churvox-hardcore-human-cleanup.cjs
          node scripts/churvox-hardcore-owner-worker-audit.cjs

      - name: Build production frontend
        run: npm --prefix frontend run build

      - name: Run targeted Plans browser truth tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm start > /tmp/churvox-final-repair-5-server.txt 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npx playwright test tests/e2e/churvox-plans-usage-truth.spec.js --project=desktop-chromium --project=mobile-chromium --workers=1 --reporter=line

      - name: Commit verified product and audit repairs
        run: |
          git checkout -- .github/workflows/churvox-live-human-launch-audit-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            frontend/src/runtime/churvoxPlansUsageTruthRuntime.js \
            frontend/src/churvox-office-lab/OfficeTeamSiteSettings.jsx \
            frontend/src/churvox-office-lab/OfficeTeamClientsWorkspace.jsx \
            frontend/src/App.js \
            frontend/tests/e2e/churvox-live-launch-human-audit-v2.spec.js \
            frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js \
            frontend/tests/e2e/churvox-hardcore-owner-worker-visual.spec.js \
            scripts/churvox-hardcore-human-cleanup.cjs \
            scripts/churvox-hardcore-owner-worker-audit.cjs \
            backend/churvox_command_slip_decision_patch.py \
            backend/test_churvox_command_slip_decision_patch.py \
            backend/churvox_outer_cors_error_shield.py
          git commit -m 'Fix final owner worker human audit failures'
          git push origin HEAD:main

      - name: Post success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Permission-safe final repair passed backend regressions, all permanent owner/worker contracts, Plans desktop/mobile browser tests, and the production build. Verified product and audit changes were committed to main.' });

      - name: Post failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Permission-safe final repair stopped before commit because a guarded verification failed. No partial product repair was pushed.' });

  current-full-user-repair:
    if: startsWith(github.event.issue.title, '[churvox-current-full-user-repair-v2]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply current exact-anchor repairs
        run: python scripts/churvox_current_full_user_repair.py

      - name: Verify current backend and audit contracts
        run: |
          set -euo pipefail
          python -m py_compile backend/server/__init__.py backend/churvox_worker_command_visibility_patch.py
          node --check frontend/tests/e2e/churvox-live-launch-human-audit-v2.spec.js
          node --check frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js
          grep -F "_install_launch_patch('churvox_worker_command_visibility_patch')" backend/server/__init__.py
          grep -F 'if (!proofNames.length && !String(note || "").trim())' frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx
          grep -F 'cvWorkerJobsWorkspace' frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx
          grep -F 'aria-label="Create a record"' frontend/src/churvox-studio/ChurvoxStudioApp.jsx
          grep -F 'min-height: 44px' frontend/src/churvox-studio/churvoxStudio.css
          ! grep -F 'Jobs move into this lane automatically as their state changes.' frontend/src/churvox-studio/StudioPages.jsx
          grep -F '/open churvox|sign in|log in/i' frontend/tests/e2e/churvox-live-launch-human-audit-v2.spec.js
          grep -F "getByRole('dialog', { name: /Create client/i })" frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js
          node scripts/churvox-hardcore-owner-worker-audit.cjs

      - name: Install and build current production frontend
        run: |
          npm --prefix frontend install --include=dev --legacy-peer-deps
          npm --prefix frontend run build

      - name: Commit current verified repairs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/server/__init__.py \
            backend/RENDER_RESTART_20260615.txt \
            frontend/public/render-deploy-marker.txt \
            frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx \
            frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.css \
            frontend/src/churvox-studio/ChurvoxStudioApp.jsx \
            frontend/src/churvox-studio/StudioPages.jsx \
            frontend/src/churvox-studio/churvoxStudio.css \
            frontend/tests/e2e/churvox-live-launch-human-audit-v2.spec.js \
            frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js
          git commit -m 'Repair current full owner worker user test'
          git push origin HEAD:main

      - name: Post current repair result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const body = ok
              ? 'Current exact-anchor full-user repairs passed the permanent owner/worker contract and production build, were committed to main, and updated both Render deployment markers.'
              : 'Current exact-anchor full-user repair stopped before commit because a source anchor, permanent contract or production build failed. No partial repair was pushed.';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
