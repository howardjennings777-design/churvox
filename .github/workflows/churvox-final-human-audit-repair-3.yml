name: Churvox Final Human Audit Repair 3

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-final-human-audit-repair-3]')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Extract and run raw-string corrected evidence repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source_path = Path('.github/workflows/churvox-final-human-audit-repair.yml')
          lines = source_path.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start:end])) + '\n'

          section_start = script.find("wrapper_path = Path('backend/churvox_outer_cors_error_shield.py')")
          if section_start < 0:
              raise SystemExit('Original wrapper patch section was not found')
          end_marker = "wrapper_path.write_text(wrapper)\n"
          section_end = script.find(end_marker, section_start)
          if section_end < 0:
              raise SystemExit('Original wrapper patch section end was not found')
          section_end += len(end_marker)

          corrected = r'''wrapper_path = Path('backend/churvox_outer_cors_error_shield.py')
          wrapper = wrapper_path.read_text()
          worker_decision_marker = '("churvox_worker_field_slip_decision_patch", "backend.churvox_worker_field_slip_decision_patch"),'
          marker_index = wrapper.find(worker_decision_marker)
          if marker_index < 0:
              raise SystemExit('worker field-slip decision installer marker not found')
          block_start = wrapper.rfind('    _install_patch(', 0, marker_index)
          block_end = wrapper.find('\n    )', marker_index)
          if block_start < 0 or block_end < 0:
              raise SystemExit('worker field-slip decision installer block boundaries not found')
          block_end += len('\n    )')
          worker_block = wrapper[block_start:block_end]
          command_block = (
              '    _install_patch(\n'
              '        module,\n'
              '        ("churvox_command_slip_decision_patch", "backend.churvox_command_slip_decision_patch"),\n'
              '        "final Command slip decision routes",\n'
              '    )'
          )
          if 'churvox_command_slip_decision_patch' not in wrapper:
              wrapper = wrapper[:block_start] + command_block + '\n' + worker_block + wrapper[block_end:]
          wrapper_path.write_text(wrapper)
          print('patched: final startup wrapper owns Command decisions')
          '''.replace('\n          ', '\n')

          script = script[:section_start] + corrected + script[section_end:]
          Path('/tmp/churvox-final-repair-3.py').write_text(script)
          compile(script, '/tmp/churvox-final-repair-3.py', 'exec')
          exec(compile(script, '/tmp/churvox-final-repair-3.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install verification dependencies
        run: |
          python -m pip install --quiet fastapi pymongo httpx
          npm --prefix frontend install --include=dev --legacy-peer-deps

      - name: Verify backend and permanent contracts
        run: |
          python -m py_compile \
            backend/churvox_command_slip_decision_patch.py \
            backend/churvox_worker_command_visibility_patch.py \
            backend/churvox_worker_field_slip_decision_patch.py \
            backend/churvox_outer_cors_error_shield.py
          python -m unittest backend/test_churvox_command_slip_decision_patch.py backend/test_churvox_worker_command_route_request_injection.py
          node --check frontend/tests/e2e/churvox-live-launch-human-audit-v2.spec.js
          node --check frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js
          node --check frontend/tests/e2e/churvox-hardcore-owner-worker-visual.spec.js
          node --check scripts/churvox-hardcore-human-cleanup.cjs
          node scripts/churvox-hardcore-owner-worker-audit.cjs
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/churvox-live-human-launch-audit-v2.yml'); puts 'V2 workflow YAML valid'"

      - name: Build production frontend
        run: npm --prefix frontend run build

      - name: Run targeted Plans browser truth tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm start > /tmp/churvox-final-repair-3-server.txt 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npx playwright test tests/e2e/churvox-plans-usage-truth.spec.js --project=desktop-chromium --project=mobile-chromium --workers=1 --reporter=line

      - name: Commit verified repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            frontend/src/runtime/churvoxPlansUsageTruthRuntime.js \
            frontend/src/churvox-office-lab/OfficeTeamSiteSettings.jsx \
            frontend/src/churvox-office-lab/OfficeTeamClientsWorkspace.jsx \
            frontend/src/App.js \
            frontend/tests/e2e/churvox-live-launch-human-audit-v2.spec.js \
            frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js \
            frontend/tests/e2e/churvox-hardcore-owner-worker-visual.spec.js \
            scripts/churvox-hardcore-human-cleanup.cjs \
            scripts/churvox-hardcore-owner-worker-audit.cjs \
            backend/churvox_command_slip_decision_patch.py \
            backend/test_churvox_command_slip_decision_patch.py \
            backend/churvox_outer_cors_error_shield.py \
            .github/workflows/churvox-live-human-launch-audit-v2.yml
          git commit -m 'Fix final owner worker human audit failures'
          git push origin HEAD:main

      - name: Post success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Final repair 3 passed backend regressions, permanent owner/worker contracts, Plans desktop/mobile browser tests, workflow validation, and the production build. Verified changes were committed to main.' });

      - name: Post failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Final repair 3 stopped before commit because a guarded verification failed. No partial product repair was pushed.' });
