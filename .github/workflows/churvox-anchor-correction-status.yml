name: Churvox Anchor Correction Status

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[churvox-anchor-correction-status]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read latest anchor correction run
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow churvox-correct-final-repair-anchor.yml --limit 5 --json databaseId,displayTitle --jq '[.[] | select(.displayTitle | startswith("[churvox-correct-final-repair-anchor]"))][0].databaseId')"
          test -n "$run_id"
          {
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,jobs --jq '{run: .databaseId, status, conclusion, jobs: [.jobs[] | {name, conclusion, steps: [.steps[] | {name, conclusion}]}]}'
            echo '--- failed log ---'
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -n 100 || true
          } > /tmp/anchor-status.txt

      - name: Post status
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('/tmp/anchor-status.txt', 'utf8');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## Anchor correction status\n\n\`\`\`text\n${text}\n\`\`\`` });
