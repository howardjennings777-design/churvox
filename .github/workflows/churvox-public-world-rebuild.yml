          signup.write_text(text)

          for name in ['PrivacyPolicyPage.js','TermsOfServicePage.js','AccountDeletionPage.js']:
              path=Path('frontend/src/pages/legal')/name
              if not path.exists(): continue
              text=path.read_text()
              text=text.replace('className="cp26Site"','className="cp26Site cp26LegalWorld"')
              path.write_text(text)

          for name in ['PublicQuotePage.js','PublicInvoicePage.js','PublicClientPortalPage.js','PublicProofPackPage.js','PublicRequestPage.js']:
              path=Path('frontend/src/pages/public')/name
              if not path.exists(): continue
              text=path.read_text()
              if 'cvCustomerRoom' not in text:
                  text=re.sub(r'<main className="([^"]*)"',lambda m:f'<main className="{m.group(1)} cvCustomerRoom"',text)
              path.write_text(text)
          PY

      - name: Install and build the full frontend
        working-directory: frontend
        run: |
          npm install --include=dev --legacy-peer-deps
          npm run build

      - name: Guard the locked product rules
        shell: bash
        run: |
          grep -F 'Start' frontend/src/pages/marketing/ExecutivePricingPage.jsx >/dev/null
          grep -F 'Crew' frontend/src/pages/marketing/ExecutivePricingPage.jsx >/dev/null
          grep -F 'Operator' frontend/src/pages/marketing/ExecutivePricingPage.jsx >/dev/null
          grep -F 'Command' frontend/src/pages/marketing/ExecutivePricingPage.jsx >/dev/null
          grep -F 'Nothing important sends, charges, syncs or changes without owner approval.' frontend/src/pages/marketing/ChurvoxPublicShell.jsx >/dev/null
          grep -F 'CHURVOX_PLANS' frontend/src/pages/marketing/ExecutivePricingPage.jsx >/dev/null

      - name: Commit the public world
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/marketing frontend/src/pages/auth frontend/src/pages/legal frontend/src/pages/public
          git commit -m 'Turn every public route into the Churvox building'
          git push
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report completion
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Whole-site public world build passed and was committed. Product, pricing, demo, industry, trust, support, billing, contact, login, signup, legal and customer-facing pages now share the Churvox building identity while keeping route-specific layouts. Commit: \`${process.env.COMMIT || 'unknown'}\``});
