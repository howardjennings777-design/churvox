          function setMeta(attribute,key,content){let node=document.head.querySelector(`meta[${attribute}="${key}"]`);if(!node){node=document.createElement("meta");node.setAttribute(attribute,key);document.head.appendChild(node)}node.setAttribute("content",content)}
          function setCanonical(href){let node=document.head.querySelector('link[rel="canonical"]');if(!node){node=document.createElement("link");node.setAttribute("rel","canonical");document.head.appendChild(node)}node.setAttribute("href",href)}

