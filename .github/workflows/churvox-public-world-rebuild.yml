            <section className="cpWorldSection"><header className="cpWorldSectionHead"><span>Same operating brain</span><h2>The language changes. The rooms stay connected.</h2><p>Each room keeps one responsibility so the business is not forced into a generic page template.</p></header><div className="cpIndustryCore">{coreAreas.map(([title,text])=><article key={title}><b>{title}</b><p>{text}</p></article>)}</div></section>

            <section className="cpWorldSection cpRecordRiver"><header className="cpWorldSectionHead"><span>What stays controlled</span><h2>From request to money without losing the trail.</h2><p>Jobs, client information, field updates, proof and money remain connected. Important external actions return to Command.</p></header><div className="cpRecordTrack">{["Request captured","Job prepared","Worker updated","Proof checked","Owner approved"].map((item,index)=><article key={item}><b>0{index+1}</b><h3>{item}</h3><p>{index===4?"The owner approves, edits, parks or asks for the missing fact.":"The record moves to the next room without being rebuilt from scratch."}</p></article>)}</div></section>

            <section className="cpWorldSection"><header className="cpWorldSectionHead"><span>Other routes</span><h2>Choose the closest operating fit.</h2><p>These are configuration examples, not customer endorsements or usage claims.</p></header><div className="cpIndustryDirectory">{professions.map(([title,,industrySlug],index)=><Link key={industrySlug} to={`/industries/${industrySlug}`} aria-current={industrySlug===slug?"page":undefined}><span>Route {String(index+1).padStart(2,"0")}</span>{title}{industrySlug===slug?" · Current":""}</Link>)}</div></section>

            <section className="cpWorldClosing"><div><span>{industry.title} route ready</span><h2>Test the route with your own records.</h2><p>Demo information is clearly labelled. Trial information belongs only to the business account that enters it.</p></div><div><Link className="cp26Button" to={`/demo?industry=${encodeURIComponent(slug)}`}>Open demo</Link><Link className="cp26Button cp26ButtonGhost" to={`/signup?industry=${encodeURIComponent(slug)}`}>Start free trial</Link></div></section><PublicFooter/></main>;
          }
