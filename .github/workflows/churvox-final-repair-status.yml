name: Churvox Final Repair Status Probe

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[churvox-final-repair-status]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read latest repair failure
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow churvox-final-human-audit-repair.yml --limit 10 --json databaseId,displayTitle,status,conclusion --jq '[.[] | select(.displayTitle | startswith("[churvox-final-human-audit-repair]"))][0].databaseId')"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          {
            echo "Run $run_id"
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,jobs
            echo
            echo "--- failed log ---"
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true
          } > /tmp/final-repair-status.txt
          tail -c 50000 /tmp/final-repair-status.txt > /tmp/final-repair-status-tail.txt

      - name: Post result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('/tmp/final-repair-status-tail.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Final repair status\n\n\`\`\`text\n${text.replace(/```/g, '``\\`')}\n\`\`\``
            });
