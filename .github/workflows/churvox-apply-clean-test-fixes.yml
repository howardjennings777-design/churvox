name: Apply clean UI audit fixes

on:
  push:
    branches:
      - agent/clean-full-ui-test

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/clean-full-ui-test
          fetch-depth: 1

      - name: Apply current-contract fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          full_ui = "frontend/tests/e2e/churvox-full-ui-logic-buttons.spec.js"
          replace(
              full_ui,
              "const SAFETY = 'Nothing was sent, synced, charged or changed.';\n",
              "const SAFETY = 'Nothing was sent, synced, charged or changed.';\n"
              "const PLATFORM_OWNER = Object.freeze({\n"
              "  id: 'safe-platform-owner',\n"
              "  email: 'hello@churvox.com',\n"
              "  role: 'owner',\n"
              "  user_role: 'owner',\n"
              "  email_verified: true,\n"
              "  has_app_access: true,\n"
              "  subscription_status: 'active',\n"
              "  plan: 'command',\n"
              "  business_id: 'safe-platform-owner-business',\n"
              "});\n"
          )
          replace(
              full_ui,
              "    const method = request.method();\n\n    if (/\\/accounting\\/export\\/pack/i.test(pathname)) {",
              "    const method = request.method();\n\n"
              "    if (pathname === '/api/auth/me') {\n"
              "      const currentPath = new URL(page.url()).pathname;\n"
              "      const labRoute = ['/office-team-lab', '/office-lab', '/new-command-lab'].includes(currentPath);\n"
              "      await route.fulfill(labRoute\n"
              "        ? json({ success: true, user: PLATFORM_OWNER, ...PLATFORM_OWNER })\n"
              "        : json({ success: false, user: null }, 401));\n"
              "      return;\n"
              "    }\n\n"
              "    if (/\\/accounting\\/export\\/pack/i.test(pathname)) {"
          )
          replace(
              full_ui,
              "    await page.route('**/api/**', async (route) => {\n      await route.fulfill(json({ success: false, detail: 'Deliberate UI failure-state test' }, 503));\n    });",
              "    await page.route('**/api/**', async (route) => {\n"
              "      const pathname = new URL(route.request().url()).pathname;\n"
              "      if (pathname === '/api/auth/me') {\n"
              "        await route.fulfill(json({ success: true, user: PLATFORM_OWNER, ...PLATFORM_OWNER }));\n"
              "        return;\n"
              "      }\n"
              "      await route.fulfill(json({ success: false, detail: 'Deliberate UI failure-state test' }, 503));\n"
              "    });"
          )

          hq = "frontend/tests/e2e/churvox-paid-launch-hq-reality.spec.js"
          replace(
              hq,
              "    await expect(page.getByText('Tester@Real.test', { exact: true })).toBeVisible();",
              "    await expect(page.getByText('Tester@Real.test', { exact: true }).first()).toBeVisible();"
          )
          replace(
              hq,
              "    const pendingRow = page.locator('tr').filter({ hasText: 'Tester@Real.test' });",
              "    const pendingRow = page.locator('tr').filter({ hasText: 'Tester@Real.test' }).filter({ has: page.getByRole('button', { name: 'Revoke', exact: true }) }).first();"
          )

          public = "frontend/tests/e2e/churvox-public-honesty-and-function.spec.js"
          replace(
              public,
              "    await openPublic(page, '/request');\n    await page.getByRole('button', { name: /Send request/i }).click();",
              "    await openPublic(page, '/request?owner=owner%40safe.test');\n    await page.getByRole('button', { name: /Send request/i }).click();"
          )
          replace(
              public,
              "      source: 'Public request quote page',",
              "      owner_email: 'owner@safe.test',\n      source: 'public_customer_request',"
          )

          css = "frontend/src/pages/auth/AuthPublicCommand.css"
          replace(
              css,
              ".cvPublicAuthBottom a {\n  color: #111318;",
              ".cvPublicAuthCard > label.cvPublicAuthIntro a {\n"
              "  display: inline-flex;\n"
              "  align-items: center;\n"
              "  min-height: 28px;\n"
              "  padding: 2px 4px;\n"
              "  color: #111318;\n"
              "  font-weight: 1000;\n"
              "  text-decoration: underline;\n"
              "  text-underline-offset: 3px;\n"
              "}\n\n"
              ".cvPublicAuthBottom a {\n  color: #111318;"
          )
          PY

          rm -f .github/workflows/churvox-apply-clean-test-fixes.yml

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/tests/e2e/churvox-full-ui-logic-buttons.spec.js \
                  frontend/tests/e2e/churvox-paid-launch-hq-reality.spec.js \
                  frontend/tests/e2e/churvox-public-honesty-and-function.spec.js \
                  frontend/src/pages/auth/AuthPublicCommand.css \
                  .github/workflows/churvox-apply-clean-test-fixes.yml
          git commit -m "Fix clean full UI audit failures"
          git push origin HEAD:agent/clean-full-ui-test
