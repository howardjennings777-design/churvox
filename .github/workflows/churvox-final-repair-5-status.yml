name: Churvox Final Repair 5 Status

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[churvox-final-repair-5-status]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read permission-safe repair status
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow churvox-final-human-audit-repair-5.yml --limit 10 --json databaseId,displayTitle --jq '[.[] | select(.displayTitle | startswith("[churvox-final-human-audit-repair-5]"))][0].databaseId')"
          test -n "$run_id"
          {
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,jobs --jq '{run: .databaseId, status, conclusion, jobs: [.jobs[] | {name, status, conclusion, active: [.steps[] | select(.status == "in_progress") | .name], failed: [.steps[] | select(.conclusion == "failure") | .name]}]}'
            if gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq '.status' | grep -q completed; then
              echo '--- failed log tail ---'
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -n 120 || true
            fi
          } > /tmp/repair5-status.txt

      - name: Post status
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('/tmp/repair5-status.txt', 'utf8');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## Final repair 5 status\n\n\`\`\`text\n${text}\n\`\`\`` });
