name: Correct Studio audit selectors

on:
  push:
    branches: [ agent/final-studio-launch-fix ]

permissions:
  contents: write

jobs:
  correct:
    if: github.event.head_commit.message == 'Run Studio regex finalizer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-studio-launch-fix
          fetch-depth: 0

      - name: Correct RegExp template escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/tests/e2e/churvox-big-launch-audit.spec.js')
          text = path.read_text()
          old = "new RegExp(`^\\s*${item}\\b`, 'i')"
          new = "new RegExp(`^\\\\s*${item}\\\\b`, 'i')"
          count = text.count(old)
          if count != 4:
              raise SystemExit(f'Expected four Studio selector templates, found {count}')
          path.write_text(text.replace(old, new))
          PY
          node --check frontend/tests/e2e/churvox-big-launch-audit.spec.js
          grep -F 'new RegExp(`^\\s*${item}\\b`' frontend/tests/e2e/churvox-big-launch-audit.spec.js

      - name: Commit selector correction and trigger final gates
        run: |
          rm .github/workflows/churvox-correct-studio-selectors.yml
          git config user.name "Churvox Launch Repair"
          git config user.email "hello@churvox.com"
          git add frontend/tests/e2e/churvox-big-launch-audit.spec.js .github/workflows/churvox-correct-studio-selectors.yml
          git commit -m "Correct Studio audit selectors"
          git push origin HEAD:agent/final-studio-launch-fix
