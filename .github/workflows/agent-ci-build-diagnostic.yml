name: Agent Strict CI Build Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-strict-ci-build-diagnostic
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-plans-route-and-flow
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Capture strict build
        id: strict_build
        continue-on-error: true
        working-directory: frontend
        env:
          CI: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../strict-ci-build.log
      - name: Upload strict build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-ci-build-log-${{ github.run_number }}
          path: strict-ci-build.log
          retention-days: 2
      - name: Preserve build result
        if: steps.strict_build.outcome == 'failure'
        run: exit 1
