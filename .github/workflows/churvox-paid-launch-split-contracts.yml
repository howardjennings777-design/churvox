name: Churvox Paid Launch Split Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/churvox-paid-launch-split-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: churvox-paid-launch-split-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contracts:
    name: Identify each paid-launch browser contract
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install --include=dev --legacy-peer-deps

      - name: Build production frontend
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start built frontend
        run: |
          npm start > /tmp/churvox-split-frontend.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/churvox-split-frontend.log
          exit 1

      - id: auth
        name: Auth paid-launch contract
        continue-on-error: true
        env: { PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:3000' }
        run: npx playwright test tests/e2e/churvox-auth-paid-launch-contract.spec.js --project=desktop-chromium --workers=1 --reporter=line

      - id: recovery
        name: Login and recovery contract
        continue-on-error: true
        env: { PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:3000' }
        run: npx playwright test tests/e2e/churvox-login-recovery-paid-launch.spec.js --project=desktop-chromium --workers=1 --reporter=line

      - id: signup
        name: Signup invite logout contract
        continue-on-error: true
        env: { PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:3000' }
        run: npx playwright test tests/e2e/churvox-signup-invite-logout-paid-launch.spec.js --project=desktop-chromium --workers=1 --reporter=line

      - id: more
        name: More menu contract
        continue-on-error: true
        env: { PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:3000' }
        run: npx playwright test tests/e2e/churvox-more-menu-paid-launch.spec.js --project=desktop-chromium --workers=1 --reporter=line

      - id: plans
        name: Current Plans and usage contract
        continue-on-error: true
        env: { PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:3000' }
        run: npx playwright test tests/e2e/churvox-plans-usage-truth.spec.js --project=desktop-chromium --workers=1 --reporter=line

      - id: billing
        name: Billing lifecycle contract
        continue-on-error: true
        env: { PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:3000' }
        run: npx playwright test tests/e2e/churvox-billing-lifecycle-paid-launch.spec.js --project=desktop-chromium --workers=1 --reporter=line

      - id: hq
        name: HQ reality contract
        continue-on-error: true
        env: { PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:3000' }
        run: npx playwright test tests/e2e/churvox-paid-launch-hq-reality.spec.js --project=desktop-chromium --workers=1 --reporter=line

      - id: documents
        name: Public documents contract
        continue-on-error: true
        env: { PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:3000' }
        run: npx playwright test tests/e2e/churvox-public-documents-paid-launch.spec.js --project=desktop-chromium --workers=1 --reporter=line

      - id: request
        name: Public request contract
        continue-on-error: true
        env: { PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:3000' }
        run: npx playwright test tests/e2e/churvox-public-request-paid-launch.spec.js --project=desktop-chromium --workers=1 --reporter=line

      - id: emailgate
        name: Billing email verification contract
        continue-on-error: true
        env: { PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:3000' }
        run: npx playwright test tests/e2e/churvox-billing-email-verification-gate.spec.js --project=desktop-chromium --workers=1 --reporter=line

      - name: Fail when any split contract failed
        if: always()
        run: |
          printf '%s\n' \
            'auth=${{ steps.auth.outcome }}' \
            'recovery=${{ steps.recovery.outcome }}' \
            'signup=${{ steps.signup.outcome }}' \
            'more=${{ steps.more.outcome }}' \
            'plans=${{ steps.plans.outcome }}' \
            'billing=${{ steps.billing.outcome }}' \
            'hq=${{ steps.hq.outcome }}' \
            'documents=${{ steps.documents.outcome }}' \
            'request=${{ steps.request.outcome }}' \
            'emailgate=${{ steps.emailgate.outcome }}'
          test '${{ steps.auth.outcome }}' = success
          test '${{ steps.recovery.outcome }}' = success
          test '${{ steps.signup.outcome }}' = success
          test '${{ steps.more.outcome }}' = success
          test '${{ steps.plans.outcome }}' = success
          test '${{ steps.billing.outcome }}' = success
          test '${{ steps.hq.outcome }}' = success
          test '${{ steps.documents.outcome }}' = success
          test '${{ steps.request.outcome }}' = success
          test '${{ steps.emailgate.outcome }}' = success

      - name: Upload split diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churvox-paid-launch-split-${{ github.run_id }}
          path: |
            frontend/test-results
            /tmp/churvox-split-frontend.log
          if-no-files-found: ignore
          retention-days: 5
