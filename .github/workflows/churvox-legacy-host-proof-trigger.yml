name: Trigger legacy host proof

on:
  push:
    paths:
      - '.github/workflows/churvox-legacy-host-proof-trigger.yml'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[churvox-legacy-host-redirect-proof] live verification ' + new Date().toISOString(),
              body: 'Verify the direct Render hostname exits to www.churvox.com after the forced migration deployment.'
            });
