name: Churvox Live Visual Capture V2

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  capture:
    if: startsWith(github.event.issue.title, '[churvox-visual-capture-v2]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_URL: https://www.churvox.com
      API_BASE: https://grassley-backend.onrender.com
      OWNER_EMAIL: howardjennings777@gmail.com
      OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}
      WORKER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser tooling
        working-directory: frontend
        run: |
          npm install --include=dev --legacy-peer-deps
          npx playwright install --with-deps chromium

      - name: Capture live screens
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/churvox-visual-v2
          cat > /tmp/churvox-visual-v2.cjs <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require(process.cwd() + '/node_modules/@playwright/test');

          const base = process.env.BASE_URL.replace(/\/+$/, '');
          const apiBase = process.env.API_BASE.replace(/\/+$/, '');
          const ownerEmail = String(process.env.OWNER_EMAIL || '').trim().toLowerCase();
          const password = process.env.OWNER_PASSWORD || '';
          const workerPassword = process.env.WORKER_PASSWORD || password;
          const out = '/tmp/churvox-visual-v2';
          const results = [];
          const runtimeErrors = [];

          const tokenFrom = (body = {}) => body.token || body.access_token || body.auth_token || body.jwt || body.accessToken
            || body.user?.token || body.user?.access_token || body.data?.token || body.data?.access_token || body.data?.user?.token || '';
          const emailFrom = (body = {}) => String(body.email || body.user?.email || body.data?.email || body.data?.user?.email || '').trim().toLowerCase();
          const rowsFrom = (payload) => {
            const body = payload?.data?.data ?? payload?.data ?? payload;
            if (Array.isArray(body)) return body;
            for (const key of ['workers', 'team', 'members', 'items', 'records', 'results', 'data']) if (Array.isArray(body?.[key])) return body[key];
            return [];
          };

          async function json(pathname, options = {}) {
            const response = await fetch(`${apiBase}${pathname}`, {
              headers: { Accept: 'application/json', 'Content-Type': 'application/json', ...(options.headers || {}) },
              ...options,
            });
            const text = await response.text();
            let body = {};
            try { body = JSON.parse(text); } catch { body = { text: text.slice(0, 500) }; }
            return { response, body };
          }

          async function loginApi(email, pass, worker = false) {
            const paths = worker ? ['/api/auth/login', '/api/worker/auth/login'] : ['/api/auth/login'];
            const attempts = [];
            for (const pathname of paths) {
              const result = await json(pathname, { method: 'POST', body: JSON.stringify({ email, password: pass }) });
              const token = tokenFrom(result.body);
              attempts.push(`${pathname}:${result.response.status}`);
              if (result.response.ok && token) return { token, email: emailFrom(result.body) || email };
            }
            throw new Error(`Login failed for ${worker ? 'worker' : 'owner'}: ${attempts.join(', ')}`);
          }

          async function discoverWorker(ownerToken) {
            for (const endpoint of ['/api/team/workers', '/api/team', '/api/workers']) {
              const result = await json(`${endpoint}?ts=${Date.now()}`, { headers: { Authorization: `Bearer ${ownerToken}` } });
              if (!result.response.ok) continue;
              for (const row of rowsFrom(result.body)) {
                const email = String(row.email || row.worker_email || row.user_email || row.login_email || '').trim().toLowerCase();
                const status = String(row.status || row.worker_status || '').toLowerCase();
                if (email && email !== ownerEmail && row.active !== false && row.is_active !== false && !/inactive|deleted|archived|disabled/.test(status)) return email;
              }
            }
            throw new Error('No active linked worker found in owner team endpoints.');
          }

          async function contextFor(browser, viewport, token, email, role) {
            const context = await browser.newContext({ viewport, serviceWorkers: 'block' });
            await context.addInitScript(({ tokenValue, emailValue, roleValue }) => {
              localStorage.setItem('token', tokenValue);
              localStorage.setItem('authToken', tokenValue);
              localStorage.setItem('access_token', tokenValue);
              localStorage.setItem('churvox_auth_session_snapshot_v1', JSON.stringify({
                at: Date.now(),
                token: tokenValue,
                user: { email: emailValue, role: roleValue, has_app_access: true, email_verified: true, token: tokenValue },
              }));
            }, { tokenValue: token, emailValue: email, roleValue: role });
            return context;
          }

          async function inspect(page, label, url, filename) {
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(1500);
            const metrics = await page.evaluate(() => {
              const visible = (el) => {
                if (!(el instanceof HTMLElement)) return false;
                const style = getComputedStyle(el);
                const rect = el.getBoundingClientRect();
                return style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity) !== 0 && rect.width > 1 && rect.height > 1;
              };
              const controls = [...document.querySelectorAll('button,a[href],input:not([type="hidden"]),textarea,select')].filter(visible);
              const tinyControls = controls.map((el) => {
                const rect = el.getBoundingClientRect();
                return { text: String(el.innerText || el.getAttribute('aria-label') || el.getAttribute('placeholder') || '').replace(/\s+/g, ' ').trim().slice(0, 80), width: Math.round(rect.width), height: Math.round(rect.height) };
              }).filter((item) => item.height < 40 || item.width < 32).slice(0, 25);
              return {
                url: location.href,
                bodyTextLength: String(document.body.innerText || '').trim().length,
                horizontalOverflow: Math.max(0, document.documentElement.scrollWidth - document.documentElement.clientWidth),
                documentWidth: document.documentElement.scrollWidth,
                viewportWidth: document.documentElement.clientWidth,
                tinyControls,
                headings: [...document.querySelectorAll('h1,h2,h3')].filter(visible).map((el) => String(el.innerText || '').replace(/\s+/g, ' ').trim()).filter(Boolean).slice(0, 15),
                buttons: [...document.querySelectorAll('button')].filter(visible).map((el) => String(el.innerText || el.getAttribute('aria-label') || '').replace(/\s+/g, ' ').trim()).filter(Boolean).slice(0, 30),
              };
            });
            await page.screenshot({ path: path.join(out, filename), fullPage: true });
            results.push({ label, filename, ...metrics });
          }

          async function capture(browser, role, viewport, pages, token, email) {
            const context = await contextFor(browser, viewport, token, email, role);
            const page = await context.newPage();
            page.on('pageerror', (error) => runtimeErrors.push(`${role}-${viewport.width} pageerror: ${error.message}`));
            page.on('console', (message) => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (!/favicon|manifest|ResizeObserver|ERR_ABORTED/i.test(text)) runtimeErrors.push(`${role}-${viewport.width} console: ${text}`);
            });
            for (const item of pages) await inspect(page, `${role}-${viewport.width}-${item.name}`, `${base}${item.path}`, `${role}-${viewport.width}-${item.name}.png`);
            await context.close();
          }

          function writeSummary(error = null) {
            fs.writeFileSync(path.join(out, 'metrics.json'), JSON.stringify({ results, runtimeErrors, failure: error ? String(error.stack || error) : null }, null, 2));
            const overflow = results.filter((item) => item.horizontalOverflow > 2);
            const tiny = results.filter((item) => item.tinyControls.length);
            const blank = results.filter((item) => item.bodyTextLength < 90);
            const lines = [
              '# Churvox live visual capture V2', '',
              `- Screens captured: ${results.length}`,
              `- Horizontal overflow pages: ${overflow.length}`,
              `- Pages with controls under 40px high: ${tiny.length}`,
              `- Blank/nearly blank pages: ${blank.length}`,
              `- Runtime errors: ${runtimeErrors.length}`,
              error ? `- Capture failure: ${String(error.message || error)}` : '- Capture completed: yes',
              '',
              overflow.length ? `Overflow: ${overflow.map((item) => item.label).join(', ')}` : 'No horizontal overflow detected.',
              tiny.length ? `Small controls: ${tiny.map((item) => item.label).join(', ')}` : 'No undersized controls detected.',
              runtimeErrors.length ? `Runtime errors:\n${runtimeErrors.slice(0, 15).map((item) => `- ${item}`).join('\n')}` : 'No material runtime errors detected.',
            ];
            fs.writeFileSync(path.join(out, 'summary.md'), lines.join('\n') + '\n');
            if (error) fs.writeFileSync(path.join(out, 'failure.txt'), String(error.stack || error));
            console.log(lines.join('\n'));
          }

          (async () => {
            let browser;
            try {
              if (!password) throw new Error('OWNER_PASSWORD secret missing.');
              const owner = await loginApi(ownerEmail, password, false);
              const workerEmail = await discoverWorker(owner.token);
              console.log('::add-mask::' + workerEmail);
              const worker = await loginApi(workerEmail, workerPassword, true);
              browser = await chromium.launch({ headless: true });
              const ownerPages = [
                ['today','/dashboard#today'],['command','/dashboard#command'],['work','/dashboard#work'],['clients','/dashboard#clients'],
                ['worker','/dashboard#worker'],['quotes','/dashboard#quotes'],['invoices','/dashboard#invoices'],['schedule','/dashboard#schedule'],
                ['messages','/dashboard#messages'],['payroll','/dashboard#payroll'],['integrations','/dashboard#integrations'],['team','/dashboard#team'],
                ['settings','/dashboard#settings'],['plans','/dashboard#plans'],['help','/dashboard#help']
              ].map(([name,path]) => ({ name, path }));
              const ownerPhone = ownerPages.filter((item) => ['today','command','work','clients','worker','plans','help'].includes(item.name));
              const workerPages = [['today','/worker/today'],['jobs','/worker/jobs'],['messages','/worker/messages'],['help','/worker/help']].map(([name,path]) => ({ name, path }));
              await capture(browser, 'owner', { width: 1440, height: 1000 }, ownerPages, owner.token, ownerEmail);
              await capture(browser, 'owner', { width: 390, height: 844 }, ownerPhone, owner.token, ownerEmail);
              await capture(browser, 'worker', { width: 1280, height: 900 }, workerPages, worker.token, workerEmail);
              await capture(browser, 'worker', { width: 390, height: 844 }, workerPages, worker.token, workerEmail);
              writeSummary();
            } catch (error) {
              writeSummary(error);
              process.exitCode = 1;
            } finally {
              if (browser) await browser.close().catch(() => {});
            }
          })();
          NODE
          node /tmp/churvox-visual-v2.cjs 2>&1 | tee /tmp/churvox-visual-v2/capture.log

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churvox-live-visual-capture-v2
          path: /tmp/churvox-visual-v2
          if-no-files-found: error
          retention-days: 14

      - name: Post capture result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (file) => fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '';
            const summary = read('/tmp/churvox-visual-v2/summary.md') || 'Visual capture failed before summary creation.';
            const failure = read('/tmp/churvox-visual-v2/failure.txt');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${summary}${failure ? `\nFailure detail:\n\`\`\`text\n${failure.slice(-2500)}\n\`\`\`` : ''}\n\nWorkflow run: \`${context.runId}\`\nArtifact: \`churvox-live-visual-capture-v2\``
            });
