name: Churvox Auth Live Snapshot

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  snapshot:
    if: startsWith(github.event.issue.title, '[churvox-auth-live-snapshot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect all current live frontend chunks
        shell: bash
        run: |
          node <<'NODE' > /tmp/churvox-auth-live-snapshot.txt 2>&1
          const site = 'https://www.churvox.com';
          const authMarker = 'churvox-auth-401-storm-repair-20260713b';
          const commandMarker = 'churvox-command-fast-load-build-20260713c';
          (async () => {
            const manifestResponse = await fetch(`${site}/asset-manifest.json?ts=${Date.now()}`, { cache: 'no-store' });
            console.log(`manifest=${manifestResponse.status}`);
            const manifest = await manifestResponse.json();
            const mainPath = manifest.files?.['main.js'] || manifest.entrypoints?.find((value) => /main\..*\.js$/.test(value));
            console.log(`main=${mainPath || 'missing'}`);

            const paths = new Set();
            for (const value of Object.values(manifest.files || {})) {
              if (typeof value === 'string' && /\.js(?:\?|$)/.test(value) && !/\.map(?:\?|$)/.test(value)) paths.add(value);
            }
            for (const value of manifest.entrypoints || []) {
              if (typeof value === 'string' && /\.js(?:\?|$)/.test(value) && !/\.map(?:\?|$)/.test(value)) paths.add(value);
            }
            console.log(`js_chunks=${paths.size}`);
            if (!paths.size) process.exit(1);

            let authFound = false;
            let commandFound = false;
            let endpointFound = false;
            let legacyFound = false;
            let authFile = '';
            let commandFile = '';
            let endpointFile = '';
            let legacyFile = '';
            let bytes = 0;

            for (const path of paths) {
              const response = await fetch(new URL(path, site), { cache: 'no-store' });
              const bundle = await response.text();
              bytes += bundle.length;
              if (!authFound && bundle.includes(authMarker)) { authFound = true; authFile = path; }
              if (!commandFound && bundle.includes(commandMarker)) { commandFound = true; commandFile = path; }
              if (!endpointFound && bundle.includes('/api/command/slips')) { endpointFound = true; endpointFile = path; }
              if (!legacyFound && bundle.includes('churvox-admin-brain-surface-style')) { legacyFound = true; legacyFile = path; }
            }

            console.log(`auth_marker=${authFound} file=${authFile || 'none'}`);
            console.log(`command_marker=${commandFound} file=${commandFile || 'none'}`);
            console.log(`command_endpoint=${endpointFound} file=${endpointFile || 'none'}`);
            console.log(`legacy_admin_brain_surface=${legacyFound} file=${legacyFile || 'none'}`);
            console.log(`total_js_bytes=${bytes}`);
          })().catch((error) => { console.error(error.stack || error); process.exit(1); });
          NODE

      - name: Post snapshot
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.existsSync('/tmp/churvox-auth-live-snapshot.txt') ? fs.readFileSync('/tmp/churvox-auth-live-snapshot.txt', 'utf8') : 'No snapshot output.';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## Current frontend chunk snapshot\n\n\`\`\`text\n${text}\n\`\`\`` });

  command_boot_repair:
    if: startsWith(github.event.issue.title, '[churvox-command-boot-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mark real boot repair started
        uses: actions/github-script@v7
        with:
          script: await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Real backend boot repair started. Run ${context.runId}.`})

      - name: Apply Procfile entrypoint repair
        run: python scripts/churvox-command-boot-repair.py

      - name: Verify boot contract and route ownership
        run: |
          grep -q 'VERSION = "churvox-command-fast-load-boot-20260713d"' backend/churvox_boot.py
          grep -q 'churvox_paid_launch_live_patch.install(churvox_start.server, force=True)' backend/churvox_boot.py
          grep -q '/api/command-fast-load/boot' backend/churvox_boot.py
          grep -q 'route_owner_mismatch' backend/churvox_boot.py
          python -m py_compile backend/churvox_boot.py backend/churvox_paid_launch_live_patch.py
          python -m pip install -q pytest fastapi pymongo
          python -m pytest -q \
            backend/test_churvox_command_boot_entrypoint.py \
            backend/test_churvox_command_fast_load_patch.py

      - name: Commit verified boot repair
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add backend/churvox_boot.py
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Install fast Command routes from real backend boot"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post real boot repair result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const sha = '${{ steps.publish.outputs.sha }}' || 'not published';
            const body = ok
              ? `## Real backend boot repair passed\n\n- The Procfile boot module force-installs fast Command routes after churvox_start completes.\n- A safe public boot fingerprint reports exact route ownership and patch status.\n- Boot ASGI test, route-precedence test and Python compilation passed.\n- Commit: \`${sha}\``
              : `## Real backend boot repair failed safely\n\nNo unverified backend product change was published. Workflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
