name: Churvox Final Repair Status Short

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[churvox-final-repair-status-short]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read concise failed log
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow churvox-final-human-audit-repair.yml --limit 10 --json databaseId,displayTitle,status,conclusion --jq '[.[] | select(.displayTitle | startswith("[churvox-final-human-audit-repair]"))][0].databaseId')"
          test -n "$run_id"
          {
            echo "Run $run_id"
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,jobs --jq '{status, conclusion, jobs: [.jobs[] | {name, conclusion, failedSteps: [.steps[] | select(.conclusion == "failure") | .name]}]}'
            echo "--- final failed log lines ---"
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -n 140
          } > /tmp/status-short.txt

      - name: Post concise result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('/tmp/status-short.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Concise final repair status\n\n\`\`\`text\n${text.replace(/```/g, '``\\`')}\n\`\`\``
            });
