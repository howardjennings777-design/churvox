name: Churvox Worker Jobs Definitive Route Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-worker-jobs-definitive-route-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply definitive Worker Jobs route repair
        run: python scripts/churvox-worker-jobs-definitive-route-apply.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --legacy-peer-deps

      - name: Verify backend, contracts and production build
        shell: bash
        run: |
          set -o pipefail
          python -m py_compile backend/churvox_worker_jobs_read_patch.py backend/server/__init__.py
          node scripts/churvox-command-queue-speed-backend-contract.cjs
          node scripts/churvox-server-wrapper-final-command-contract.cjs
          node scripts/churvox-hardcore-owner-worker-audit.cjs
          npm --prefix frontend run build
          grep -q 'worker-jobs-definitive-route-v3-20260713' backend/churvox_worker_jobs_read_patch.py
          grep -q '_remove_route(app, "/api/worker/jobs", "GET")' backend/churvox_worker_jobs_read_patch.py
          grep -q 'definitive_route_owner' backend/churvox_worker_jobs_read_patch.py
          ! grep -q 'Open the full slip to inspect the evidence and prepared form' frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx

      - name: Publish verified product repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/churvox_worker_jobs_read_patch.py \
            frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx
          if git diff --cached --quiet; then
            echo 'Definitive Worker Jobs route repair already present.'
            echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m 'Make Worker Jobs reader the definitive live route'
          git push origin HEAD:main
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const sha = process.env.published_sha || '';
            const body = ok
              ? `## Definitive Worker Jobs route repair passed\n\nThe old route is removed before the repaired business-scoped reader is registered. Backend compilation, wrapper contracts, owner/worker audit and production build passed. Published commit: \`${sha}\`.`
              : `## Definitive Worker Jobs route repair failed safely\n\nNo failed repair should be treated as launch-ready. Workflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
