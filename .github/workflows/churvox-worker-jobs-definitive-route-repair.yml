name: Churvox Worker Jobs Definitive Route Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-worker-jobs-definitive-route-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply owner completion message dedupe repair
        run: python scripts/churvox-owner-message-completion-dedupe-repair.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --legacy-peer-deps

      - name: Verify backend, contracts and production build
        shell: bash
        run: |
          set -o pipefail
          python -m py_compile \
            backend/churvox_worker_jobs_read_patch.py \
            backend/churvox_paid_launch_guard_patch.py \
            backend/churvox_paid_launch_live_patch.py \
            backend/churvox_field_truth_fix_patch.py \
            backend/churvox_owner_data_visibility_patch.py \
            backend/server/__init__.py
          node --check scripts/churvox-worker-assignment-diagnostic-v2.cjs
          node scripts/churvox-command-queue-speed-backend-contract.cjs
          node scripts/churvox-server-wrapper-final-command-contract.cjs
          node scripts/churvox-hardcore-owner-worker-audit.cjs
          node scripts/churvox-worker-field-command-bridge-contract.cjs
          node scripts/churvox-owner-message-dedupe-contract.cjs
          npm --prefix frontend run build
          grep -q 'worker-jobs-current-first-v4-20260713' backend/churvox_worker_jobs_read_patch.py
          grep -q 'owner_manual = payload_source in' backend/churvox_paid_launch_live_patch.py
          grep -q '95 if owner_manual' backend/churvox_paid_launch_live_patch.py
          grep -q 'owner_manual_command_priority.*churvox-owner-manual-command-priority-v12-20260713' backend/churvox_paid_launch_live_patch.py
          grep -q '\["manual_form", "quick_intake", "csv_import"\]' frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx
          grep -q 'return 95' frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx
          grep -q 'OWNER_MESSAGE_DEDUPE_BUILD = "churvox-owner-message-completion-dedupe-v13-20260713"' backend/churvox_owner_data_visibility_patch.py
          grep -q 'rows = dedupe_owner_messages(rows)\[:200\]' backend/churvox_owner_data_visibility_patch.py
          grep -q 'job_completion:' backend/churvox_owner_data_visibility_patch.py
          grep -q 'logical_job_event' backend/churvox_owner_data_visibility_patch.py
          grep -q '/api/messages/readiness' backend/churvox_owner_data_visibility_patch.py
          grep -q 'churvox-owner-message-completion-dedupe-v13-20260713' frontend/public/churvox-paid-launch-build.json
          grep -q 'single-owner-completion-per-message-channel' frontend/public/churvox-paid-launch-build.json
          grep -q 'min-height: 48px' frontend/src/churvox-office-lab/OfficeTeamOwnerReady.css

      - name: Publish verified product repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/churvox_owner_data_visibility_patch.py \
            frontend/public/churvox-paid-launch-build.json \
            scripts/churvox-owner-message-dedupe-contract.cjs
          if git diff --cached --quiet; then
            echo 'Owner completion message dedupe repair already present.'
            echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m 'Deduplicate owner-facing completion messages'
          git push origin HEAD:main
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const sha = process.env.published_sha || '';
            const body = ok
              ? `## Owner completion message dedupe repair passed\n\nThe owner Messages feed now collapses duplicate copies of the same logical job completion across Notifications, approved notifications, worker messages and field slips. Notifications remains a single valid record, while Messages exposes one completion per job event. Manual-slip priority, live refresh, bridge, touch-target, safety contracts and the production build passed. Published commit: \`${sha}\`.`
              : `## Owner completion message dedupe repair failed safely\n\nNo failed repair should be treated as launch-ready. Workflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
