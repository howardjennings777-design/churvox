name: Churvox Worker Jobs Definitive Route Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-worker-jobs-definitive-route-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply final owner Messages v17 signature repair
        run: python scripts/churvox-final-owner-messages-v17-repair.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --legacy-peer-deps

      - name: Verify v17 contracts and production build
        shell: bash
        run: |
          set -o pipefail
          {
            echo '=== Python compile ==='
            python -m py_compile \
              backend/churvox_final_owner_messages_route_patch.py \
              backend/churvox_worker_jobs_read_patch.py \
              backend/churvox_owner_data_visibility_patch.py \
              backend/churvox_paid_launch_live_patch.py \
              backend/churvox_field_truth_fix_patch.py \
              backend/server/__init__.py
            echo '=== Live smoke syntax ==='
            node --check scripts/churvox-paid-launch-live-smoke-v2.cjs
            echo '=== Hardcore static audit ==='
            node scripts/churvox-hardcore-owner-worker-audit.cjs
            echo '=== Worker bridge contract ==='
            node scripts/churvox-worker-field-command-bridge-contract.cjs
            echo '=== Historical message dedupe contract ==='
            node scripts/churvox-owner-message-dedupe-contract.cjs
            echo '=== Worker Jobs copy contract ==='
            node scripts/churvox-worker-jobs-copy-trim-contract.cjs
            echo '=== V15 retained-protections contract ==='
            node scripts/churvox-final-pass-v15-contract.cjs
            echo '=== V16 historical final route contract ==='
            node scripts/churvox-final-owner-messages-v16-contract.cjs
            echo '=== V17 route signature contract ==='
            node scripts/churvox-final-owner-messages-v17-contract.cjs
            echo '=== Production build ==='
            npm --prefix frontend run build
            echo '=== Marker assertions ==='
            grep -q 'from fastapi import Request' backend/churvox_final_owner_messages_route_patch.py
            grep -q 'churvox-final-owner-messages-v17-20260714' backend/churvox_final_owner_messages_route_patch.py
            ! grep -q 'Request = getattr(module, "Request", None)' backend/churvox_final_owner_messages_route_patch.py
            grep -q 'messages_patch.install(legacy, force=True)' backend/server/__init__.py
            grep -q 'churvox-final-owner-messages-v17-20260714' scripts/churvox-paid-launch-live-smoke-v2.cjs
            grep -q 'churvox-final-owner-messages-v17-20260714' frontend/public/churvox-paid-launch-build.json
            grep -q 'active-worker-jobs-only' frontend/public/churvox-paid-launch-build.json
          } 2>&1 | tee /tmp/churvox-v17-verify.txt

      - name: Publish verified product repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- .github/workflows/churvox-worker-command-scope-diagnostic.yml
          git add \
            backend/churvox_final_owner_messages_route_patch.py \
            backend/server/__init__.py \
            frontend/public/churvox-paid-launch-build.json \
            scripts/churvox-paid-launch-live-smoke-v2.cjs \
            scripts/churvox-final-owner-messages-v17-contract.cjs
          if git diff --cached --quiet; then
            echo 'Final owner Messages v17 repair already present.'
            echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m 'Fix final owner Messages request signature'
          git push origin HEAD:main
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ job.status }}' === 'success';
            const sha = process.env.published_sha || '';
            const raw = fs.existsSync('/tmp/churvox-v17-verify.txt') ? fs.readFileSync('/tmp/churvox-v17-verify.txt', 'utf8') : '';
            const tail = raw.slice(-9000)
              .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, '[email-hidden]')
              .replace(/Bearer\s+[A-Za-z0-9._-]+/gi, 'Bearer [hidden]');
            const body = ok
              ? `## Final owner Messages route v17 passed\n\nThe final /api/messages route now uses a globally resolvable FastAPI Request annotation, so authenticated reads no longer fail with a missing request query field. Logical completion dedupe, final route ownership, v15 Worker Jobs protections, owner approval, pricing, safety contracts and the production build all passed. Published commit: \`${sha}\`.`
              : `## Final owner Messages route v17 failed safely\n\nNo failed repair was published as launch-ready. Exact verification tail:\n\n\`\`\`text\n${tail || 'No verification output was produced.'}\n\`\`\`\n\nWorkflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
