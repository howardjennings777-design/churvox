name: Churvox Worker Jobs Definitive Route Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-worker-jobs-definitive-route-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply worker Command priority repair
        run: python scripts/churvox-worker-command-priority-repair.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --legacy-peer-deps

      - name: Verify backend, contracts and production build
        shell: bash
        run: |
          set -o pipefail
          python -m py_compile \
            backend/churvox_worker_jobs_read_patch.py \
            backend/churvox_paid_launch_guard_patch.py \
            backend/churvox_paid_launch_live_patch.py \
            backend/churvox_field_truth_fix_patch.py \
            backend/server/__init__.py
          node --check scripts/churvox-worker-assignment-diagnostic-v2.cjs
          node scripts/churvox-command-queue-speed-backend-contract.cjs
          node scripts/churvox-server-wrapper-final-command-contract.cjs
          node scripts/churvox-hardcore-owner-worker-audit.cjs
          node scripts/churvox-worker-field-command-bridge-contract.cjs
          npm --prefix frontend run build
          grep -q 'worker-jobs-current-first-v4-20260713' backend/churvox_worker_jobs_read_patch.py
          grep -q 'churvox-worker-field-command-bridge-v10-20260713' backend/churvox_field_truth_fix_patch.py
          grep -q 'field_truth_fix.fixed_create_field_slip' backend/churvox_paid_launch_guard_patch.py
          grep -q 'paid_launch_guard_bridge' backend/churvox_paid_launch_guard_patch.py
          grep -q 'seen = set()' backend/churvox_field_truth_fix_patch.py
          grep -q 'worker_problem = source == "worker_field_problem"' backend/churvox_paid_launch_live_patch.py
          grep -q 'priority = 100 if worker_problem' backend/churvox_paid_launch_live_patch.py
          grep -q 'worker_command_priority.*churvox-worker-command-priority-v10-20260713' backend/churvox_paid_launch_live_patch.py
          grep -q 'commandQueuePriority' frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx
          grep -q 'worker_field_problem' frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx
          grep -q 'min-height: 48px' frontend/src/churvox-office-lab/OfficeTeamOwnerReady.css
          grep -q 'churvox-worker-command-priority-v10-20260713' frontend/public/churvox-paid-launch-build.json
          grep -q 'worker-problems-ranked-before-routine-command-items' frontend/public/churvox-paid-launch-build.json

      - name: Publish verified product repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/churvox_paid_launch_guard_patch.py \
            backend/churvox_paid_launch_live_patch.py \
            backend/churvox_field_truth_fix_patch.py \
            frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx \
            frontend/public/churvox-paid-launch-build.json \
            scripts/churvox-command-queue-speed-backend-contract.cjs \
            scripts/churvox-worker-field-command-bridge-contract.cjs
          if git diff --cached --quiet; then
            echo 'Worker Command priority repair already present.'
            echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m 'Rank worker problems first in Command'
          git push origin HEAD:main
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const sha = process.env.published_sha || '';
            const body = ok
              ? `## Worker Command priority repair passed\n\nTop-priority worker problems now rank ahead of routine office-scan slips in both the backend queue and the Command browser, so the three-card owner view cannot hide a new field issue. Cache, bridge, touch-target and owner/worker safety contracts plus the production build passed. Published commit: \`${sha}\`.`
              : `## Worker Command priority repair failed safely\n\nNo failed repair should be treated as launch-ready. Workflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
