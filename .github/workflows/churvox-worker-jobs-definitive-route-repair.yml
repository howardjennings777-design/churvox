name: Churvox Worker Jobs Definitive Route Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-worker-jobs-definitive-route-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply final Worker Jobs copy trim
        run: python scripts/churvox-worker-jobs-copy-trim-repair.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --legacy-peer-deps

      - name: Verify contracts and production build
        shell: bash
        run: |
          set -o pipefail
          python -m py_compile \
            backend/churvox_paid_launch_live_patch.py \
            backend/churvox_owner_data_visibility_patch.py \
            backend/server/__init__.py
          node scripts/churvox-command-queue-speed-backend-contract.cjs
          node scripts/churvox-hardcore-owner-worker-audit.cjs
          node scripts/churvox-worker-field-command-bridge-contract.cjs
          node scripts/churvox-owner-message-dedupe-contract.cjs
          node scripts/churvox-worker-jobs-copy-trim-contract.cjs
          npm --prefix frontend run build
          grep -q 'Only your assigned work appears.' frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx
          grep -q 'Worker View never charges cards. Use an approved invoice link.' frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx
          ! grep -q 'Only work assigned to this worker appears here.' frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx
          ! grep -q 'Payment happens through an approved secure invoice link.' frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx
          grep -q 'churvox-worker-jobs-copy-trim-v14-20260713' frontend/public/churvox-paid-launch-build.json
          grep -q 'worker-jobs-under-hardcore-word-limit' frontend/public/churvox-paid-launch-build.json
          grep -q 'single-owner-completion-per-message-channel' frontend/public/churvox-paid-launch-build.json
          grep -q 'fresh-owner-created-slips-ranked-before-routine-command-items' frontend/public/churvox-paid-launch-build.json

      - name: Publish verified product repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx \
            frontend/public/churvox-paid-launch-build.json \
            scripts/churvox-worker-jobs-copy-trim-contract.cjs
          if git diff --cached --quiet; then
            echo 'Worker Jobs copy trim already present.'
            echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m 'Trim redundant Worker Jobs copy'
          git push origin HEAD:main
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const sha = process.env.published_sha || '';
            const body = ok
              ? `## Worker Jobs copy trim passed\n\nEight redundant words were removed from Worker Jobs while retaining every job, status, proof, payment and owner-approval control. Existing manual-slip priority, completion dedupe, bridge and safety contracts plus the production build passed. Published commit: \`${sha}\`.`
              : `## Worker Jobs copy trim failed safely\n\nNo failed repair should be treated as launch-ready. Workflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
