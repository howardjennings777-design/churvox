name: Churvox Worker Jobs Definitive Route Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-worker-jobs-definitive-route-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply final pass v15 repair
        run: python scripts/churvox-final-pass-v15-repair.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --legacy-peer-deps

      - name: Verify v15 contracts and production build
        shell: bash
        run: |
          set -o pipefail
          python -m py_compile \
            backend/churvox_worker_jobs_read_patch.py \
            backend/churvox_owner_data_visibility_patch.py \
            backend/churvox_paid_launch_live_patch.py \
            backend/churvox_field_truth_fix_patch.py \
            backend/server/__init__.py
          node --check scripts/churvox-paid-launch-live-smoke-v2.cjs
          node scripts/churvox-hardcore-owner-worker-audit.cjs
          node scripts/churvox-worker-field-command-bridge-contract.cjs
          node scripts/churvox-owner-message-dedupe-contract.cjs
          node scripts/churvox-worker-jobs-copy-trim-contract.cjs
          node scripts/churvox-final-pass-v15-contract.cjs
          npm --prefix frontend run build
          grep -q 'worker-jobs-active-only-v5-20260713' backend/churvox_worker_jobs_read_patch.py
          grep -q '_assigned(job, current_user) and not _inactive(job)' backend/churvox_worker_jobs_read_patch.py
          grep -q 'sourceRecords.filter(workerRecordActive)' frontend/src/churvox-office-lab/officeTeamApi.js
          grep -q 'rows.slice(0, 8)' frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx
          grep -q 'Show all ${rows.length} jobs' frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx
          grep -q 'Command scan safe timeout on attempt' scripts/churvox-paid-launch-live-smoke-v2.cjs
          grep -q 'churvox-final-pass-v15-20260713' frontend/public/churvox-paid-launch-build.json

      - name: Publish verified product repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- \
            .github/workflows/churvox-paid-launch-final-gate-v2.yml \
            .github/workflows/churvox-worker-command-priority-live-proof.yml
          git add \
            backend/churvox_worker_jobs_read_patch.py \
            frontend/src/churvox-office-lab/officeTeamApi.js \
            frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx \
            frontend/public/churvox-paid-launch-build.json \
            scripts/churvox-paid-launch-live-smoke-v2.cjs \
            scripts/churvox-final-pass-v15-contract.cjs
          if git diff --cached --quiet; then
            echo 'Final pass v15 repair already present.'
            echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m 'Filter inactive worker jobs and harden final gate'
          git push origin HEAD:main
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const sha = process.env.published_sha || '';
            const body = ok
              ? `## Final pass v15 repair passed\n\nArchived, deleted and cancelled jobs are excluded from Worker Jobs at both API and UI layers. The queue shows eight jobs by default with an explicit Show all control, the desktop summary no longer duplicates the queue, and the live smoke retries only the explicit safe Command timeout with a strict four-attempt ceiling. Existing bridge, completion dedupe, payment safety, pricing, owner approval and production build contracts passed. Published commit: \`${sha}\`.`
              : `## Final pass v15 repair failed safely\n\nNo failed repair was published as launch-ready. Workflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
