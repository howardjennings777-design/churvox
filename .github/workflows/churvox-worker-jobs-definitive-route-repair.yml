name: Churvox Worker Jobs Definitive Route Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-worker-jobs-definitive-route-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Command scan performance v18 repair
        run: python scripts/churvox-command-scan-performance-v18-repair.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --legacy-peer-deps

      - name: Verify v18 contracts and production build
        shell: bash
        run: |
          set -o pipefail
          {
            echo '=== Python compile ==='
            python -m py_compile \
              backend/churvox_command_human_mimic_v3_routes.py \
              backend/churvox_paid_launch_live_patch.py \
              backend/churvox_final_owner_messages_route_patch.py \
              backend/churvox_worker_jobs_read_patch.py \
              backend/churvox_owner_data_visibility_patch.py \
              backend/churvox_field_truth_fix_patch.py \
              backend/server/__init__.py
            echo '=== Live smoke syntax ==='
            node --check scripts/churvox-paid-launch-live-smoke-v2.cjs
            echo '=== Hardcore static audit ==='
            node scripts/churvox-hardcore-owner-worker-audit.cjs
            echo '=== Worker bridge contract ==='
            node scripts/churvox-worker-field-command-bridge-contract.cjs
            echo '=== Historical message dedupe contract ==='
            node scripts/churvox-owner-message-dedupe-contract.cjs
            echo '=== Worker Jobs copy contract ==='
            node scripts/churvox-worker-jobs-copy-trim-contract.cjs
            echo '=== V15 retained-protections contract ==='
            node scripts/churvox-final-pass-v15-contract.cjs
            echo '=== V16 final route contract ==='
            node scripts/churvox-final-owner-messages-v16-contract.cjs
            echo '=== V17 route signature contract ==='
            node scripts/churvox-final-owner-messages-v17-contract.cjs
            echo '=== V18 Command scan performance contract ==='
            node scripts/churvox-command-scan-performance-v18-contract.cjs
            echo '=== Production build ==='
            npm --prefix frontend run build
            echo '=== Marker assertions ==='
            grep -q 'churvox-command-scan-performance-v18-20260714' backend/churvox_command_human_mimic_v3_routes.py
            grep -q 'jobs, invoices, clients, messages, timers, settings = await asyncio.gather' backend/churvox_command_human_mimic_v3_routes.py
            grep -q 'store_semaphore = asyncio.Semaphore(8)' backend/churvox_command_human_mimic_v3_routes.py
            grep -q '"stage_timings_ms": stage_timings' backend/churvox_command_human_mimic_v3_routes.py
            grep -q '"command_scan_timeout_seconds": 25' backend/churvox_paid_launch_live_patch.py
            grep -q 'churvox-command-scan-performance-v18-20260714' frontend/public/churvox-paid-launch-build.json
            grep -q 'churvox-final-owner-messages-v17-20260714' frontend/public/churvox-paid-launch-build.json
          } 2>&1 | tee /tmp/churvox-v18-verify.txt

      - name: Publish verified product repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/churvox_command_human_mimic_v3_routes.py \
            backend/churvox_paid_launch_live_patch.py \
            frontend/public/churvox-paid-launch-build.json \
            scripts/churvox-command-scan-performance-v18-contract.cjs
          if git diff --cached --quiet; then
            echo 'Command scan performance v18 repair already present.'
            echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m 'Speed up strict Command brain scan'
          git push origin HEAD:main
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ job.status }}' === 'success';
            const sha = process.env.published_sha || '';
            const raw = fs.existsSync('/tmp/churvox-v18-verify.txt') ? fs.readFileSync('/tmp/churvox-v18-verify.txt', 'utf8') : '';
            const tail = raw.slice(-9000)
              .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, '[email-hidden]')
              .replace(/Bearer\s+[A-Za-z0-9._-]+/gi, 'Bearer [hidden]');
            const body = ok
              ? `## Command scan performance v18 passed\n\nStrict v3 now loads data areas concurrently with bounded reads, retires legacy slips with bounded concurrency, stores prepared decisions with a controlled semaphore, and reports stage timings. The 25-second fail-safe remains unchanged. All owner/worker, Messages, pricing, payment-safety, owner-approval and production-build contracts passed. Published commit: \`${sha}\`.`
              : `## Command scan performance v18 failed safely\n\nNo failed performance repair was published as launch-ready. Exact verification tail:\n\n\`\`\`text\n${tail || 'No verification output was produced.'}\n\`\`\`\n\nWorkflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
