name: Churvox Worker Jobs Definitive Route Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-worker-jobs-definitive-route-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply current worker, Command refresh and field bridge repairs
        run: |
          python scripts/churvox-worker-jobs-current-first-apply.py
          python scripts/churvox-worker-message-job-context-apply.py
          python scripts/churvox-command-created-slip-refresh-apply.py
          python scripts/churvox-worker-field-command-bridge-apply.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --legacy-peer-deps

      - name: Verify backend, contracts and production build
        shell: bash
        run: |
          set -o pipefail
          python -m py_compile \
            backend/churvox_worker_jobs_read_patch.py \
            backend/churvox_paid_launch_live_patch.py \
            backend/churvox_field_truth_fix_patch.py \
            backend/server/__init__.py
          node --check scripts/churvox-worker-assignment-diagnostic-v2.cjs
          node scripts/churvox-command-queue-speed-backend-contract.cjs
          node scripts/churvox-server-wrapper-final-command-contract.cjs
          node scripts/churvox-hardcore-owner-worker-audit.cjs
          node scripts/churvox-worker-field-command-bridge-contract.cjs
          npm --prefix frontend run build
          grep -q 'worker-jobs-current-first-v4-20260713' backend/churvox_worker_jobs_read_patch.py
          grep -q 'sort(\[("created_at", -1), ("updated_at", -1)\])' backend/churvox_worker_jobs_read_patch.py
          grep -q '_remove_route(app, "/api/worker/jobs", "GET")' backend/churvox_worker_jobs_read_patch.py
          grep -q 'definitive_route_owner' backend/churvox_worker_jobs_read_patch.py
          grep -q 'churvox-worker-current-first-20260713c' frontend/src/churvox-office-lab/officeTeamApi.js
          grep -q 'area === "worker" ? 80 : 12' frontend/src/churvox-office-lab/officeTeamApi.js
          grep -q 'recordTime(right) - recordTime(left)' frontend/src/churvox-office-lab/officeTeamApi.js
          grep -q 'churvox-worker-message-context-v5-20260713' frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx
          grep -q 'updateBusy || live.isLoading' frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx
          grep -q 'Loading assigned job' frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx
          grep -q 'churvox-command-force-refresh-v4-20260713' backend/churvox_paid_launch_live_patch.py
          grep -q 'queue_cache.pop(bid, None)' backend/churvox_paid_launch_live_patch.py
          grep -q 'X-Churvox-Command-Refresh' frontend/src/churvox-office-lab/OfficeTeamCommandApi.js
          grep -q 'force: true' frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx
          grep -q 'churvox-worker-field-command-bridge-v7-20260713' backend/churvox_field_truth_fix_patch.py
          grep -q 'db.command_slips.update_one' backend/churvox_field_truth_fix_patch.py
          grep -q '_invalidate_command_cache(business_id)' backend/churvox_field_truth_fix_patch.py
          grep -q '/api/worker/field-command-readiness' backend/churvox_field_truth_fix_patch.py
          grep -q 'churvox-worker-field-command-bridge-v7-20260713' frontend/public/churvox-paid-launch-build.json
          ! grep -q 'Open the full slip to inspect the evidence and prepared form' frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx

      - name: Publish verified product repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/churvox_worker_jobs_read_patch.py \
            backend/churvox_paid_launch_live_patch.py \
            backend/churvox_field_truth_fix_patch.py \
            frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx \
            frontend/src/churvox-office-lab/OfficeTeamCommandApi.js \
            frontend/src/churvox-office-lab/officeTeamApi.js \
            frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx \
            frontend/public/churvox-paid-launch-build.json \
            scripts/churvox-command-queue-speed-backend-contract.cjs \
            scripts/churvox-worker-field-command-bridge-contract.cjs
          if git diff --cached --quiet; then
            echo 'Worker problem Command bridge already present.'
            echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m 'Bridge worker problems into owner Command'
          git push origin HEAD:main
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const sha = process.env.published_sha || '';
            const body = ok
              ? `## Worker problem Command bridge passed\n\nGenuine worker problems are now deduplicated into the owner Command queue and invalidate its short server cache immediately. Proof and routine messages stay outside Command. All backend/frontend contracts and the production build passed. Published commit: \`${sha}\`.`
              : `## Worker problem Command bridge failed safely\n\nNo failed repair should be treated as launch-ready. Workflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
