name: Churvox Worker Jobs Definitive Route Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-worker-jobs-definitive-route-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply final owner messages v16 repair
        run: python scripts/churvox-final-owner-messages-v16-repair.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --legacy-peer-deps

      - name: Verify v16 contracts and production build
        shell: bash
        run: |
          set -o pipefail
          python -m py_compile \
            backend/churvox_final_owner_messages_route_patch.py \
            backend/churvox_worker_jobs_read_patch.py \
            backend/churvox_owner_data_visibility_patch.py \
            backend/churvox_paid_launch_live_patch.py \
            backend/churvox_field_truth_fix_patch.py \
            backend/server/__init__.py
          node --check scripts/churvox-paid-launch-live-smoke-v2.cjs
          node scripts/churvox-hardcore-owner-worker-audit.cjs
          node scripts/churvox-worker-field-command-bridge-contract.cjs
          node scripts/churvox-owner-message-dedupe-contract.cjs
          node scripts/churvox-worker-jobs-copy-trim-contract.cjs
          node scripts/churvox-final-pass-v15-contract.cjs
          node scripts/churvox-final-owner-messages-v16-contract.cjs
          npm --prefix frontend run build
          grep -q 'churvox-final-owner-messages-v16-20260713' backend/churvox_final_owner_messages_route_patch.py
          grep -q 'messages_patch.install(legacy, force=True)' backend/server/__init__.py
          grep -q "'/api/messages/readiness'" backend/server/__init__.py
          grep -q 'final_owner_messages_wrapper' scripts/churvox-paid-launch-live-smoke-v2.cjs
          grep -q 'churvox-final-owner-messages-v16-20260713' frontend/public/churvox-paid-launch-build.json
          grep -q 'active-worker-jobs-only' frontend/public/churvox-paid-launch-build.json

      - name: Publish verified product repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/churvox_final_owner_messages_route_patch.py \
            backend/server/__init__.py \
            frontend/public/churvox-paid-launch-build.json \
            scripts/churvox-paid-launch-live-smoke-v2.cjs \
            scripts/churvox-final-owner-messages-v16-contract.cjs
          if git diff --cached --quiet; then
            echo 'Final owner messages v16 repair already present.'
            echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m 'Own and deduplicate final owner messages route'
          git push origin HEAD:main
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const sha = process.env.published_sha || '';
            const body = ok
              ? `## Final owner Messages route v16 passed\n\nThe live server wrapper now force-installs the final business-scoped /api/messages route after every older patch. It collapses the four physical completion copies into one logical job completion, exposes a readiness/route-owner marker, and is required by the paid-launch live smoke. Existing v15 Worker Jobs, bridge, payment safety, pricing, owner approval and production build contracts passed. Published commit: \`${sha}\`.`
              : `## Final owner Messages route v16 failed safely\n\nNo failed repair was published as launch-ready. Workflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
