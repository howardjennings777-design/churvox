name: Churvox Owner Visual Follow-up

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-owner-visual-followup]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply and validate final visual follow-up
        shell: bash
        run: |
          set -euo pipefail
          python scripts/churvox_owner_visual_followup_apply.py
          node scripts/churvox-owner-visual-followup-contract.cjs | tee /tmp/churvox-owner-visual-followup-contract.txt
          npm --prefix frontend install --legacy-peer-deps
          CI=false npm --prefix frontend run build 2>&1 | tee /tmp/churvox-owner-visual-followup-build.txt

      - name: Commit and publish final follow-up
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git restore frontend/package-lock.json 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.js frontend/src/churvox-office-lab/OfficeTeamOwnerScreenGuard.jsx frontend/src/churvox-office-lab/OfficeTeamVisualRepair.css frontend/src/runtime/churvoxVisibleLogoutRuntime.js scripts/churvox-owner-visual-followup-contract.cjs
          git diff --cached --check
          git commit -m 'Finish mobile owner guard and touch targets'
          git reset --hard HEAD
          git clean -fd frontend/build frontend/public/generated 2>/dev/null || true
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat --oneline --summary HEAD | tee /tmp/churvox-owner-visual-followup-commit.txt

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const contract = fs.existsSync('/tmp/churvox-owner-visual-followup-contract.txt') ? fs.readFileSync('/tmp/churvox-owner-visual-followup-contract.txt', 'utf8').slice(-5000) : 'No contract output.';
            const build = fs.existsSync('/tmp/churvox-owner-visual-followup-build.txt') ? fs.readFileSync('/tmp/churvox-owner-visual-followup-build.txt', 'utf8').slice(-2200) : 'No build output.';
            const commit = fs.existsSync('/tmp/churvox-owner-visual-followup-commit.txt') ? fs.readFileSync('/tmp/churvox-owner-visual-followup-commit.txt', 'utf8').slice(-2500) : 'No commit output.';
            const title = '${{ job.status }}' === 'success' ? '## Owner visual follow-up committed' : '## Owner visual follow-up failed';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `${title}\n\nCommit: \`${{ steps.commit.outputs.sha }}\`\n\n### Contract\n\`\`\`text\n${contract}\n\`\`\`\n\n### Build\n\`\`\`text\n${build}\n\`\`\`\n\n### Commit\n\`\`\`text\n${commit}\n\`\`\`` });
