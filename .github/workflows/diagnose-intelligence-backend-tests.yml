name: Diagnose Intelligence Backend Tests

on:
  push:
    branches:
      - agent/churvox-owner-intelligence

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip-intelligence-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/churvox-owner-intelligence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check fastapi==0.110.1 pymongo==4.5.0
      - name: Run affected backend contracts
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v \
            backend.test_churvox_feature_tier_paid_launch_guard \
            backend.test_churvox_job_done_reality \
            backend.test_churvox_owner_intelligence 2>&1 | tee /tmp/intelligence-backend-tests.txt
      - name: Post exact result
        if: always()
        uses: actions/github-script@v7
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try { output = fs.readFileSync('/tmp/intelligence-backend-tests.txt', 'utf8'); } catch {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 679,
              body: `### Intelligence backend diagnostic\n\nOutcome: **${process.env.TEST_OUTCOME}**\n\n\`\`\`text\n${output.slice(-12000)}\n\`\`\``
            });
      - name: Fail when tests fail
        if: steps.tests.outcome != 'success'
        run: exit 1
