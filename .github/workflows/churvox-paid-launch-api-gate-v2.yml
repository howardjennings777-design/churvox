name: Churvox Paid Launch API Gate V2

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  gate:
    if: startsWith(github.event.issue.title, '[churvox-paid-launch-api-gate-v2]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_BASE: https://grassley-backend.onrender.com
      OWNER_EMAIL: howardjennings777@gmail.com
      OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}
    steps:
      - name: Mark timed gate started
        if: ${{ !contains(github.event.issue.body, 'COMMAND_FAST_LOAD_REPAIR=1') }}
        uses: actions/github-script@v7
        with:
          script: await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Timed API gate started. Run ${context.runId}.`})

      - name: Probe timed endpoints
        if: ${{ !contains(github.event.issue.body, 'COMMAND_FAST_LOAD_REPAIR=1') }}
        shell: bash
        run: |
          node <<'NODE' 2>&1 | tee /tmp/timed-api.txt
          const api=process.env.API_BASE.replace(/\/+$/,'');const email=process.env.OWNER_EMAIL;const password=process.env.OWNER_PASSWORD;const failures=[];
          const tokenFrom=(b={})=>b.token||b.access_token||b.user?.token||b.data?.token||b.data?.user?.token||'';
          async function call(path,opt={},timeout=20000){console.log(`START ${opt.method||'GET'} ${path}`);const c=new AbortController();const timer=setTimeout(()=>c.abort(),timeout);const started=Date.now();try{const r=await fetch(api+path,{headers:{Accept:'application/json','Content-Type':'application/json',...(opt.headers||{})},...opt,signal:c.signal});const text=await r.text();let b={};try{b=JSON.parse(text)}catch{b={text:text.slice(0,300)}}console.log(`END ${opt.method||'GET'} ${path} HTTP ${r.status} ${Date.now()-started}ms`);return{r,b}}catch(e){console.log(`TIMEOUT/ERROR ${opt.method||'GET'} ${path} ${Date.now()-started}ms ${e.name}:${e.message}`);return{r:{ok:false,status:0},b:{error:e.message}}}finally{clearTimeout(timer)}}
          function check(name,ok,detail=''){console.log(`${ok?'PASS':'FAIL'} ${name} ${detail}`);if(!ok)failures.push(`${name} ${detail}`)}
          (async()=>{const login=await call('/api/auth/login',{method:'POST',body:JSON.stringify({email,password})});const token=tokenFrom(login.b);check('owner-login',login.r.ok&&!!token,`HTTP ${login.r.status}`);if(!token)throw Error('no token');const h={Authorization:`Bearer ${token}`};
          for(const path of ['/api/auth/me','/api/payroll','/api/payroll/summary','/api/plan/usage','/api/billing/addons','/api/command/slips','/api/command/audit']){const x=await call(path,{headers:h});check(path,x.r.ok,`HTTP ${x.r.status}`);if(path.startsWith('/api/payroll')&&x.r.ok){check(path+'-safe',x.b.owner_approval_required===true&&x.b.no_payment===true&&x.b.no_tax_filing===true,`scan_complete=${x.b.scan_complete}`);check(path+'-complete',x.b.scan_complete!==false,JSON.stringify(x.b.scan_errors||[]))}}
          const scan=await call('/api/command/scan',{method:'POST',headers:h,body:JSON.stringify({source:'timed_paid_launch_gate',prepared_only:true,owner_review_only:true})},30000);check('command-scan',scan.r.ok&&scan.b?.success!==false,`HTTP ${scan.r.status} source=${scan.b?.source||''} guard=${scan.b?.guard||''}`);
          const adminPost=await call('/api/admin-brain/scan',{method:'POST',headers:h,body:'{}'},20000);let admin=adminPost;if(adminPost.r.status===405)admin=await call('/api/admin-brain/scan',{headers:h},20000);check('admin-brain',admin.r.ok&&admin.b?.success!==false,`HTTP ${admin.r.status}`);check('admin-brain-errors',!Array.isArray(admin.b?.errors)||admin.b.errors.length===0,JSON.stringify(admin.b?.errors||[]));
          if(failures.length){console.error('GATE FAILURES\n'+failures.join('\n'));process.exit(1)}console.log('TIMED_API_GATE_PASS')})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Post timed result
        if: ${{ always() && !contains(github.event.issue.body, 'COMMAND_FAST_LOAD_REPAIR=1') }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');const text=fs.existsSync('/tmp/timed-api.txt')?fs.readFileSync('/tmp/timed-api.txt','utf8').slice(-40000):'No output';const ok=text.includes('TIMED_API_GATE_PASS');await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`# Timed API gate ${ok?'PASSED':'FAILED'}\n\n\`\`\`text\n${text}\n\`\`\``})

      - name: Checkout repair source
        if: ${{ contains(github.event.issue.body, 'COMMAND_FAST_LOAD_REPAIR=1') }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: ${{ contains(github.event.issue.body, 'COMMAND_FAST_LOAD_REPAIR=1') }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        if: ${{ contains(github.event.issue.body, 'COMMAND_FAST_LOAD_REPAIR=1') }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Mark Command repair started
        if: ${{ contains(github.event.issue.body, 'COMMAND_FAST_LOAD_REPAIR=1') }}
        uses: actions/github-script@v7
        with:
          script: await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Command fast-load repair started. Run ${context.runId}.`})

      - name: Apply focused Command repair
        if: ${{ contains(github.event.issue.body, 'COMMAND_FAST_LOAD_REPAIR=1') }}
        run: python scripts/churvox-command-fast-load-apply.py

      - name: Run permanent source contract
        if: ${{ contains(github.event.issue.body, 'COMMAND_FAST_LOAD_REPAIR=1') }}
        run: node scripts/churvox-command-fast-load-contract.cjs

      - name: Compile and test backend route precedence
        if: ${{ contains(github.event.issue.body, 'COMMAND_FAST_LOAD_REPAIR=1') }}
        run: |
          python -m pip install -q pytest fastapi pymongo
          python -m py_compile \
            backend/churvox_paid_launch_live_patch.py \
            backend/churvox_command_human_mimic_routes.py \
            backend/churvox_command_human_mimic_guard_routes.py \
            backend/churvox_start.py
          python -m pytest -q backend/test_churvox_command_fast_load_patch.py

      - name: Install frontend dependencies
        if: ${{ contains(github.event.issue.body, 'COMMAND_FAST_LOAD_REPAIR=1') }}
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Production frontend build
        if: ${{ contains(github.event.issue.body, 'COMMAND_FAST_LOAD_REPAIR=1') }}
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build

      - name: Verify compiled Command bundle
        if: ${{ contains(github.event.issue.body, 'COMMAND_FAST_LOAD_REPAIR=1') }}
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q "churvox-command-fast-load-build-20260713c" build/static/js
          grep -R -q "Opening the current Command queue" build/static/js
          grep -R -q "/api/command/slips" build/static/js
          if grep -R -q "churvox-admin-brain-surface-style" build/static/js; then
            echo "Legacy Admin Brain surface is still compiled into the owner app."
            exit 1
          fi
          echo "COMPILED_COMMAND_FAST_LOAD_PASS"

      - name: Install Chromium
        if: ${{ contains(github.event.issue.body, 'COMMAND_FAST_LOAD_REPAIR=1') }}
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start local frontend
        if: ${{ contains(github.event.issue.body, 'COMMAND_FAST_LOAD_REPAIR=1') }}
        working-directory: frontend
        run: |
          npm start > /tmp/churvox-command-fast-load-local.txt 2>&1 &
          for i in {1..75}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/churvox-command-fast-load-local.txt
          exit 1

      - name: Prove queue displays before scan and audit
        if: ${{ contains(github.event.issue.body, 'COMMAND_FAST_LOAD_REPAIR=1') }}
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          set -o pipefail
          npx playwright test tests/e2e/churvox-command-fast-load.spec.js \
            --project=desktop-chromium \
            --workers=1 \
            --reporter=line 2>&1 | tee /tmp/churvox-command-browser.txt

      - name: Commit verified Command repair
        if: ${{ contains(github.event.issue.body, 'COMMAND_FAST_LOAD_REPAIR=1') }}
        id: command_publish
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- frontend/package.json frontend/package-lock.json 2>/dev/null || true
          git clean -fd frontend/build frontend/test-results frontend/playwright-report 2>/dev/null || true
          git add \
            frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx \
            frontend/src/churvox-office-lab/OfficeTeamCommandApi.js \
            frontend/src/runtime/churvoxDrawerRecordActionsRuntime.js \
            backend/churvox_paid_launch_live_patch.py \
            backend/churvox_command_human_mimic_routes.py \
            backend/churvox_command_human_mimic_guard_routes.py \
            backend/churvox_start.py
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Load Command queue before background brain scan"
          git reset --hard HEAD
          git clean -fd frontend/build frontend/test-results frontend/playwright-report 2>/dev/null || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post Command result
        if: ${{ always() && contains(github.event.issue.body, 'COMMAND_FAST_LOAD_REPAIR=1') }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ job.status }}' === 'success';
            const sha = '${{ steps.command_publish.outputs.sha }}' || 'not published';
            const browser = fs.existsSync('/tmp/churvox-command-browser.txt') ? fs.readFileSync('/tmp/churvox-command-browser.txt', 'utf8').slice(-16000) : 'Browser proof did not run or produced no output.';
            const body = ok
              ? `## Command fast-load repair passed\n\n- Existing Command decisions render before the full business scan and audit.\n- Queue, audit and scan requests have bounded deadlines.\n- The legacy Admin Brain surface is removed from the owner runtime.\n- The compiled production bundle contains the queue-first marker and real Command endpoint.\n- Final production route precedence is forced after legacy server registration.\n- Command reads exclude audit history and no longer wait for index creation or unrelated counts.\n- Human mimic reads, storage and guard cleanup use bounded concurrency.\n- Backend precedence test, production build and browser queue-first test passed.\n- Commit: \`${sha}\``
              : `## Command fast-load repair failed safely\n\nNo unverified product repair was published. Exact browser tail:\n\n\`\`\`text\n${browser}\n\`\`\`\n\nWorkflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
