name: Churvox Final Repair 3 Status

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[churvox-final-repair-3-status]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Extract final repair 3 failure
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow churvox-final-human-audit-repair-3.yml --limit 10 --json databaseId,displayTitle --jq '[.[] | select(.displayTitle | startswith("[churvox-final-human-audit-repair-3]"))][0].databaseId')"
          test -n "$run_id"
          {
            echo "Run $run_id"
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,jobs --jq '{status, conclusion, jobs: [.jobs[] | {name, conclusion, failedSteps: [.steps[] | select(.conclusion == "failure") | .name]}]}'
            echo '--- failed log tail ---'
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | sed -r 's/\x1B\[[0-9;]*[mK]//g' | tail -n 180
          } > /tmp/repair3-status.txt

      - name: Post result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('/tmp/repair3-status.txt', 'utf8');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## Final repair 3 failure\n\n\`\`\`text\n${text.replace(/```/g, '``\\`')}\n\`\`\`` });
