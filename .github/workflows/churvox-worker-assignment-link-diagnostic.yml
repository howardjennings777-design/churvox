name: Churvox Worker Assignment Link Diagnostic

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnostic:
    if: startsWith(github.event.issue.title, '[churvox-worker-assignment-link-diagnostic]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API: https://grassley-backend.onrender.com
      OWNER_EMAIL: howardjennings777@gmail.com
      PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run robust safe assignment diagnostic
        shell: bash
        run: node scripts/churvox-worker-assignment-diagnostic-v2.cjs 2>&1 | tee /tmp/churvox-worker-assignment-diagnostic-v2.txt

      - name: Post safe diagnostic
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('/tmp/churvox-worker-assignment-report-v2.json')
              ? fs.readFileSync('/tmp/churvox-worker-assignment-report-v2.json', 'utf8')
              : '{"report":"not created"}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Safe worker assignment diagnostic V2\n\nThe workflow tested all active linked worker candidates and includes no emails, tokens or raw IDs.\n\n\`\`\`json\n${report}\n\`\`\`\n\nWorkflow run: \`${context.runId}\`.`
            });
