name: Churvox Paid Launch Gate Harness Fix

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: startsWith(github.event.issue.title, '[churvox-paid-launch-gate-harness-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct JSON header ordering in final gate
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/churvox-paid-launch-final-gate.yml')
          text = path.read_text(encoding='utf-8')
          old = '''                const response = await fetch(`${api}${path}`, {
                  headers: { Accept: 'application/json', ...(options.body ? { 'Content-Type': 'application/json' } : {}), ...(options.headers || {}) },
                  ...options,
                });
'''
          new = '''                const { headers: suppliedHeaders = {}, ...requestOptions } = options;
                const response = await fetch(`${api}${path}`, {
                  ...requestOptions,
                  headers: { Accept: 'application/json', ...(options.body ? { 'Content-Type': 'application/json' } : {}), ...suppliedHeaders },
                });
'''
          if new in text:
              print('Gate JSON header ordering already corrected.')
          elif old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Corrected gate JSON header ordering.')
          else:
              raise SystemExit('Final gate fetch anchor not found.')
          PY
      - name: Validate and publish harness fix
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const { headers: suppliedHeaders = {}, ...requestOptions } = options;" .github/workflows/churvox-paid-launch-final-gate.yml
          git config user.name 'churvox-launch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/churvox-paid-launch-final-gate.yml
          if ! git diff --cached --quiet; then git commit -m 'Fix paid launch gate JSON requests'; fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: ok ? 'Paid-launch gate harness JSON headers corrected and published.' : 'Paid-launch gate harness correction failed safely; the product code was not changed.' });
