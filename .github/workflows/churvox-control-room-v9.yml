name: Churvox Control Room V9

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/src/churvox-product/ProductAppV9.jsx"
      - "frontend/src/churvox-product/ProductAppV9Gate.jsx"
      - "frontend/src/churvox-product/productAppV9.css"
      - "frontend/tests/e2e/churvox-control-room-v9.spec.js"
      - "frontend/craco.config.js"
      - "scripts/churvox_layout_v9_materialize.cjs"
      - ".github/workflows/churvox-control-room-v9.yml"
  push:
    branches: [main]
    paths:
      - "frontend/src/churvox-product/ProductAppV9.jsx"
      - "frontend/src/churvox-product/ProductAppV9Gate.jsx"
      - "frontend/src/churvox-product/productAppV9.css"
      - "frontend/tests/e2e/churvox-control-room-v9.spec.js"
      - "frontend/craco.config.js"
      - "scripts/churvox_layout_v9_materialize.cjs"
      - ".github/workflows/churvox-control-room-v9.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-room-v9:
    name: Design contracts and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Materialise hardened engine and V9 entrypoint
        run: |
          node scripts/churvox_hardening_v8_materialize.cjs
          node scripts/churvox_layout_v9_materialize.cjs

      - name: Verify V9 entrypoint
        run: |
          grep -q "ProductAppV9Gate" frontend/src/churvox-fresh/FreshApp.jsx
          grep -q "CHURVOX_CONTROL_ROOM_V9_20260725" frontend/src/churvox-product/ProductAppV9.jsx

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run Control Room design contracts
        working-directory: frontend
        run: npx playwright test tests/e2e/churvox-control-room-v9.spec.js --reporter=line

      - name: Build production frontend
        working-directory: frontend
        env:
          CI: "true"
        run: npm run build
