name: Wire Job Done navigation handoff

on:
  push:
    branches:
      - agent/clean-full-ui-test

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clean-full-ui-test
      - name: Pass owner navigation into Money Radar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx')
          text = path.read_text()
          old = 'if (screen === "money") return <MoneyScreen appMode={appMode} />;'
          new = 'if (screen === "money") return <MoneyScreen appMode={appMode} go={props.go} />;'
          if old not in text:
              raise SystemExit('Money screen route was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/churvox-wire-job-done-navigation.yml
      - name: Commit navigation wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx .github/workflows/churvox-wire-job-done-navigation.yml
          git commit -m "Wire Job Done and Money Radar navigation"
          git push origin HEAD:agent/clean-full-ui-test
