name: Churvox Worker Command Scope Diagnostic

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: startsWith(github.event.issue.title, '[churvox-worker-command-scope-diagnostic]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API: https://grassley-backend.onrender.com
      OWNER_EMAIL: howardjennings777@gmail.com
      PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}

    steps:
      - name: Mark diagnostic started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `Safe completion-channel diagnostic started on run \`${context.runId}\`.` });

      - name: Measure completion rows per owner-facing channel
        shell: bash
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee /tmp/churvox-completion-channel-diagnostic.txt
          const api = process.env.API.replace(/\/+$/, '');
          const ownerEmail = process.env.OWNER_EMAIL;
          const password = process.env.PASSWORD;
          const run = Date.now();
          const title = `HARDCORE completion diagnostic ${run}`;
          const note = `Complete ${run} with proof`;
          const read = async (response) => response.json().catch(async () => ({ text: (await response.text().catch(() => '')).slice(0, 500) }));
          const tokenFrom = (body = {}) => body.token || body.access_token || body.auth_token || body.jwt || body.accessToken || body.user?.token || body.user?.access_token || body.data?.token || body.data?.access_token || '';
          const rowsFrom = (payload) => {
            const body = payload?.data?.data ?? payload?.data ?? payload;
            if (Array.isArray(body)) return body;
            for (const key of ['items','records','results','workers','team','members','jobs','messages','notifications','slips','actions','data']) if (Array.isArray(body?.[key])) return body[key];
            return [];
          };
          const idOf = (row = {}) => String(row.id || row._id || row.event_id || row.notification_id || row.message_id || row.action_id || row.source_id || '');
          const emailOf = (row = {}) => String(row.email || row.worker_email || row.user_email || '').trim().toLowerCase();
          const contains = (value, token) => JSON.stringify(value || {}).toLowerCase().includes(String(token || '').toLowerCase());
          const auth = (token, json = false) => ({ Authorization: `Bearer ${token}`, Accept: 'application/json', ...(json ? { 'Content-Type': 'application/json' } : {}) });
          const typeOf = (row = {}) => String(row.type || row.kind || row.event_type || row.action_type || row.source_type || 'unknown').toLowerCase();
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function login(email) {
            for (const path of ['/api/auth/login','/api/worker/auth/login']) {
              const response = await fetch(`${api}${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
              const body = await read(response);
              const token = tokenFrom(body);
              if (response.ok && token) return token;
            }
            return '';
          }
          async function cleanup(ownerToken, jobId) {
            if (!jobId) return;
            let response = await fetch(`${api}/api/jobs/${encodeURIComponent(jobId)}`, { method: 'DELETE', headers: auth(ownerToken) }).catch(() => null);
            if (!response || (!response.ok && response.status !== 404)) {
              await fetch(`${api}/api/jobs/${encodeURIComponent(jobId)}/archive`, { method: 'POST', headers: auth(ownerToken, true), body: JSON.stringify({ archived: true, archive_reason: 'completion diagnostic cleanup' }) }).catch(() => null);
            }
          }
          (async () => {
            let ownerToken = '';
            let jobId = '';
            try {
              ownerToken = await login(ownerEmail);
              if (!ownerToken) throw new Error('Owner login failed');
              const candidates = [];
              for (const endpoint of ['/api/team/workers','/api/team','/api/workers']) {
                const response = await fetch(`${api}${endpoint}?ts=${Date.now()}`, { headers: auth(ownerToken), cache: 'no-store' });
                if (!response.ok) continue;
                for (const row of rowsFrom(await read(response))) {
                  const email = emailOf(row);
                  const status = String(row.status || '').toLowerCase();
                  if (!email || email === ownerEmail || /inactive|deleted|archived|disabled/.test(status) || candidates.some((item) => item.email === email)) continue;
                  candidates.push({ email, row });
                }
              }
              let workerToken = '';
              let worker = null;
              for (const candidate of candidates.slice(0, 12)) {
                const token = await login(candidate.email);
                if (token) { workerToken = token; worker = candidate.row; break; }
              }
              if (!workerToken || !worker) throw new Error('No linked worker could authenticate');
              const workerId = String(worker.id || worker._id || worker.worker_id || worker.user_id || '');
              const workerEmail = emailOf(worker);
              if (!workerId) throw new Error('Linked worker has no stable id');

              const createResponse = await fetch(`${api}/api/jobs`, {
                method: 'POST', headers: auth(ownerToken, true), body: JSON.stringify({
                  title, job_title: title, job_type: 'other', client_name: `Hardcore Diagnostic Client ${run}`,
                  customer_name: `Hardcore Diagnostic Client ${run}`, address: '1 Diagnostic Street, Wellington',
                  scheduled_date: new Date().toISOString().slice(0, 10), scheduled_time: '09:00', status: 'assigned', price: 0,
                  assigned_worker_id: workerId, worker_id: workerId, worker_email: workerEmail,
                  assigned_worker_name: worker.name || worker.full_name || 'Linked worker', source: 'hardcore-completion-diagnostic',
                }),
              });
              const created = await read(createResponse);
              if (!createResponse.ok) throw new Error(`Job create failed ${createResponse.status}`);
              const job = created.job || created.record || created.data?.job || created.data?.record || created.data || created;
              jobId = String(job.id || job._id || job.job_id || '');
              if (!jobId) throw new Error('Created job has no id');

              const completeResponse = await fetch(`${api}/api/worker/jobs/${encodeURIComponent(jobId)}/complete`, {
                method: 'POST', headers: auth(workerToken, true), body: JSON.stringify({
                  worker_notes: note, note, proof_photo_names: [`diagnostic-${run}.jpg`], proof_photo_count: 1, source: 'hardcore-completion-diagnostic',
                }),
              });
              const completeBody = await read(completeResponse);
              if (!completeResponse.ok || completeBody.success === false) throw new Error(`Complete failed ${completeResponse.status}`);

              const paths = ['/api/notifications?limit=160', '/api/messages?limit=160', '/api/command/slips'];
              for (let attempt = 1; attempt <= 5; attempt += 1) {
                await sleep(attempt === 1 ? 700 : 1600);
                const report = {};
                for (const path of paths) {
                  const response = await fetch(`${api}${path}${path.includes('?') ? '&' : '?'}ts=${Date.now()}`, { headers: { ...auth(ownerToken), 'X-Churvox-Command-Refresh': 'churvox-command-force-refresh-v4-20260713' }, cache: 'no-store' });
                  const body = await read(response);
                  const rows = response.ok ? rowsFrom(body) : [];
                  const matches = rows.filter((row) => contains(row, title) && /job_complete|job_completed|finished the job|complete/i.test(JSON.stringify(row)));
                  const unique = new Set(matches.map((row) => idOf(row) || JSON.stringify(row))).size;
                  const types = {};
                  for (const row of matches) types[typeOf(row)] = (types[typeOf(row)] || 0) + 1;
                  report[path.split('?')[0]] = { status: response.status, rows: rows.length, matches: matches.length, unique, types };
                }
                console.log(`ATTEMPT ${attempt} ${JSON.stringify(report)}`);
              }
            } finally {
              if (ownerToken) await cleanup(ownerToken, jobId);
            }
          })().catch((error) => { console.error(`DIAGNOSTIC_ERROR ${error.message || error}`); process.exit(1); });
          NODE

      - name: Post diagnostic
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.existsSync('/tmp/churvox-completion-channel-diagnostic.txt') ? fs.readFileSync('/tmp/churvox-completion-channel-diagnostic.txt', 'utf8') : 'No diagnostic output.';
            const safe = raw
              .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, '[email-hidden]')
              .replace(/[a-f0-9]{24}/gi, '[id-hidden]')
              .replace(/Bearer\s+[A-Za-z0-9._-]+/gi, 'Bearer [hidden]')
              .slice(-9000);
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## Safe completion-channel diagnostic\n\n\`\`\`text\n${safe}\n\`\`\`\n\nWorkflow run: \`${context.runId}\`.` });
