name: Go Live Patch Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.pull_request.head.sha || '', 'diagnostic-result') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/churvox-go-live-trust
          fetch-depth: 0
      - name: Run checked patch only
        shell: bash
        run: |
          cat .churvox-tmp/apply-00.part \
              .churvox-tmp/apply-01.part \
              .churvox-tmp/apply-02.part \
              .churvox-tmp/apply-03.part \
              .churvox-tmp/apply-04.part \
              .churvox-tmp/apply-05a.part \
              .churvox-tmp/apply-05b.part \
              .churvox-tmp/apply-05c.part \
              .churvox-tmp/apply-06.part \
              .churvox-tmp/apply-07.part > /tmp/apply-go-live-trust.py
          set +e
          python /tmp/apply-go-live-trust.py > /tmp/go-live-patch.txt 2>&1
          status=$?
          set -e
          git reset --hard HEAD
          if [ "$status" -ne 0 ]; then
            cp /tmp/go-live-patch.txt .churvox-tmp/patch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .churvox-tmp/patch-error.txt
            git commit -m "Save Go Live patch diagnostic result"
            git push origin HEAD:agent/churvox-go-live-trust
            exit 1
          fi
          echo "checked patch applied successfully" > .churvox-tmp/patch-success.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .churvox-tmp/patch-success.txt
          git commit -m "Save Go Live patch success result"
          git push origin HEAD:agent/churvox-go-live-trust
