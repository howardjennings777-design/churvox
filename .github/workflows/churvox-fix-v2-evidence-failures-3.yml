name: Churvox Fix V2 Evidence Failures 3

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-fix-v2-evidence-3]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install minimal backend verification dependencies
        run: python -m pip install fastapi==0.110.1 pymongo==4.5.0

      - name: Reuse the exact corrected evidence patch
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/churvox-fix-v2-evidence-failures-2.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(workflow) if "python - <<'PY' 2>&1 | tee /tmp/churvox-fix-v2-evidence-2-patch.txt" in line) + 1
          end = next(index for index in range(start, len(workflow)) if workflow[index].strip() == 'PY')
          script = textwrap.dedent('\n'.join(workflow[start:end])) + '\n'
          Path('/tmp/churvox-fix-v2-evidence-3.py').write_text(script)
          PY
          python /tmp/churvox-fix-v2-evidence-3.py 2>&1 | tee /tmp/churvox-fix-v2-evidence-3-patch.txt

      - name: Verify backend, current audit logic and production build
        shell: bash
        run: |
          set -o pipefail
          {
            python -m py_compile \
              backend/churvox_worker_command_visibility_patch.py \
              backend/churvox_worker_field_slip_decision_patch.py \
              backend/test_churvox_worker_command_route_request_injection.py
            python backend/test_churvox_worker_command_route_request_injection.py
            node --check scripts/churvox-hardcore-owner-worker-audit.cjs
            node --check scripts/churvox-hardcore-human-cleanup.cjs
            node --check frontend/tests/e2e/churvox-plans-usage-truth.spec.js
            node --check frontend/tests/e2e/churvox-live-launch-human-audit-v2.spec.js
            node --check frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js
            node scripts/churvox-hardcore-owner-worker-audit.cjs
            npm --prefix frontend install --include=dev --legacy-peer-deps
            npm --prefix frontend run build
          } 2>&1 | tee /tmp/churvox-fix-v2-evidence-3-verify.txt

      - name: Commit verified repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/churvox_worker_command_visibility_patch.py \
            backend/churvox_worker_field_slip_decision_patch.py \
            backend/test_churvox_worker_command_route_request_injection.py \
            frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.css \
            frontend/tests/e2e/churvox-plans-usage-truth.spec.js \
            frontend/tests/e2e/churvox-live-launch-human-audit-v2.spec.js \
            frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js \
            scripts/churvox-hardcore-owner-worker-audit.cjs \
            scripts/churvox-hardcore-human-cleanup.cjs
          git commit -m "Fix V2 live audit evidence failures"
          git push origin HEAD:main

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logs = ['/tmp/churvox-fix-v2-evidence-3-patch.txt', '/tmp/churvox-fix-v2-evidence-3-verify.txt']
              .map((path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '')
              .join('\n')
              .slice(-24000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## V2 evidence repair 3 ${{ job.status }}\n\n\`\`\`text\n${logs}\n\`\`\``
            });
