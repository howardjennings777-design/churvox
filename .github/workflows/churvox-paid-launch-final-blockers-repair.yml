name: Churvox Paid Launch Final Blockers Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-paid-launch-final-blockers-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply focused paid-launch repairs
        run: |
          python scripts/churvox-paid-launch-final-blockers-apply.py
          python scripts/churvox-paid-launch-final-blockers-contract-fix.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --legacy-peer-deps

      - name: Verify cleanup script syntax
        run: node --check scripts/churvox-hardcore-human-cleanup.cjs

      - name: Verify owner and worker contract
        run: node scripts/churvox-hardcore-owner-worker-audit.cjs

      - name: Verify production frontend build
        run: npm --prefix frontend run build

      - name: Verify focused repair markers
        run: |
          python <<'PY'
          from pathlib import Path
          checks = {
              'owner Command truth': ('frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx', 'No fallback or browser-only decisions are being shown'),
              'concise Command cards': ('frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx', 'briefDecisionText(item.happened, 96)'),
              'form edit preservation': ('frontend/src/churvox-office-lab/OfficeTeamWorkForms.jsx', 'if (!dirty) setValues'),
              'worker live refresh': ('frontend/src/churvox-office-lab/OfficeTeamLiveRows.js', 'area === "worker" ? 3000 : 0'),
              'Command cleanup drain': ('scripts/churvox-hardcore-human-cleanup.cjs', 'for (let round = 0; round < 24; round += 1)'),
              'local server readiness': ('.github/workflows/churvox-paid-launch-final-gate-v2.yml', 'status=$(curl -sS -o /dev/null'),
              'live-row truth contract': ('scripts/churvox-hardcore-owner-worker-audit.cjs', 'source: nextRows.length ? "live"'),
          }
          for name, (path, marker) in checks.items():
              assert marker in Path(path).read_text(encoding='utf-8'), name
              print('PASS', name)
          PY

      - name: Publish verified repair branch
        id: publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx \
            frontend/src/churvox-office-lab/OfficeTeamWorkForms.jsx \
            frontend/src/churvox-office-lab/OfficeTeamLiveRows.js \
            scripts/churvox-hardcore-owner-worker-audit.cjs \
            scripts/churvox-hardcore-human-cleanup.cjs
          if git diff --cached --quiet; then
            echo 'No product changes to publish.'
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Fix final paid-launch blockers'
          VERIFIED_SHA=$(git rev-parse HEAD)
          git push --force origin HEAD:refs/heads/launch/verified-paid-launch-fixes
          echo "commit_sha=$VERIFIED_SHA" >> "$GITHUB_OUTPUT"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const sha = '${{ steps.publish.outputs.commit_sha }}';
            const body = ok
              ? `## Final paid-launch product repair verified\n\nAll focused checks passed and the verified repair was published to \`launch/verified-paid-launch-fixes\`.\n\nVerified commit: \`${sha}\`.\n\nNothing was sent, synced, charged, filed or paid.`
              : `## Final paid-launch blocker repair failed safely\n\nNo unverified product change was published. The failed workflow step identifies the exact remaining contract. Workflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
