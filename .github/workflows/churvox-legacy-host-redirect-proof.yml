name: Churvox legacy host redirect proof

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  prove:
    if: startsWith(github.event.issue.title, '[churvox-legacy-host-redirect-proof]')
    runs-on: ubuntu-latest
    steps:
      - name: Inspect direct Render host and public domain
        shell: bash
        run: |
          set +e
          {
            echo "UTC=$(date -u '+%Y-%m-%d %H:%M:%S')"
            for url in \
              https://grassley-frontend.onrender.com/ \
              https://grassley-frontend.onrender.com/login \
              https://grassley-frontend.onrender.com/dashboard \
              https://www.churvox.com/ \
              https://www.churvox.com/login \
              https://www.churvox.com/dashboard; do
              echo "URL=$url"
              curl -sS --max-time 40 -D /tmp/h -o /tmp/b -H 'Cache-Control: no-cache, no-store, max-age=0' "$url?proof=$(date +%s%N)"
              status=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' /tmp/h)
              location=$(grep -i '^location:' /tmp/h | tail -1 | tr -d '\r')
              title=$(grep -ioE '<title>[^<]*</title>' /tmp/b | head -1 | tr '\n' ' ')
              redirect=$(grep -Foc 'redirectLegacyRenderHost' /tmp/b 2>/dev/null || true)
              render=$(grep -Foc '/static/js/' /tmp/b 2>/dev/null || true)
              sites=$(grep -Foc 'custom-domains.chatgpt.site' /tmp/b 2>/dev/null || true)
              echo "STATUS=$status"
              echo "LOCATION=$location"
              echo "TITLE=$title"
              echo "INLINE_REDIRECT=$redirect RENDER_CRA=$render SITES_MARKER=$sites"
            done
          } > /tmp/report.txt 2>&1
          cat /tmp/report.txt
          {
            echo 'REPORT<<EOF'
            cat /tmp/report.txt
            echo 'EOF'
          } >> "$GITHUB_ENV"
      - name: Post proof
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '```text\n' + (process.env.REPORT || 'missing') + '\n```'
            });
