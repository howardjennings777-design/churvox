name: Churvox Command Scan V18 Live Proof

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  proof:
    if: startsWith(github.event.issue.title, '[churvox-command-scan-v18-live-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAYWRIGHT_API_BASE: https://grassley-backend.onrender.com
      CHURVOX_OWNER_EMAIL: howardjennings777@gmail.com
      CHURVOX_OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}

    steps:
      - name: Mark proof started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Exact v18 Command scan proof started on run \`${context.runId}\`. It will wait for the v18 backend marker and keep the 25-second safety cutoff intact.`
            });

      - name: Check out current main
        uses: actions/checkout@v4

      - name: Run exact v18 Command scan proof
        shell: bash
        run: |
          set -o pipefail
          node scripts/churvox-command-scan-v18-live-proof.cjs 2>&1 | tee /tmp/churvox-command-scan-v18-live-proof.txt

      - name: Post proof result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.existsSync('/tmp/churvox-command-scan-v18-live-proof.txt')
              ? fs.readFileSync('/tmp/churvox-command-scan-v18-live-proof.txt', 'utf8')
              : 'No proof output.';
            const safe = raw
              .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, '[email-hidden]')
              .replace(/[a-f0-9]{24}/gi, '[id-hidden]')
              .replace(/Bearer\s+[A-Za-z0-9._-]+/gi, 'Bearer [hidden]')
              .slice(-14000);
            const passed = raw.includes('EXACT_V18_COMMAND_SCAN_PROOF_PASS');
            const heading = passed
              ? '## Exact v18 Command scan proof passed'
              : '## Exact v18 Command scan proof failed';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${heading}\n\n\`\`\`text\n${safe}\n\`\`\`\n\nWorkflow run: \`${context.runId}\`.`
            });
