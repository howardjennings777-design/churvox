name: Churvox Paid Launch Debug V2

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

jobs:
  debug:
    if: startsWith(github.event.issue.title, '[churvox-paid-launch-debug-v2]')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PLAYWRIGHT_BASE_URL: https://www.churvox.com
      PLAYWRIGHT_API_BASE: https://grassley-backend.onrender.com
      CHURVOX_OWNER_EMAIL: howardjennings777@gmail.com
      CHURVOX_OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}
      CHURVOX_WORKER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}
      CHURVOX_HARDCORE_MUTATE: I_UNDERSTAND_LIVE_DATA_WILL_CHANGE
      CHURVOX_E2E_MUTATE: '1'
    steps:
      - name: Mark started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Paid launch debug started. Run ${context.runId}.`});
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: frontend
        run: npm install --include=dev --legacy-peer-deps
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Discover worker
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'); const api=process.env.PLAYWRIGHT_API_BASE; const password=process.env.CHURVOX_OWNER_PASSWORD; const ownerEmail=process.env.CHURVOX_OWNER_EMAIL;
          const token=(b={})=>b.token||b.access_token||b.user?.token||b.data?.token||b.data?.user?.token||'';
          const rows=(b={})=>{const d=b?.data?.data??b?.data??b;if(Array.isArray(d))return d;for(const k of ['workers','team','members','items','records','results','data'])if(Array.isArray(d?.[k]))return d[k];return[]};
          async function req(path,opt={}){const r=await fetch(api+path,{headers:{Accept:'application/json','Content-Type':'application/json',...(opt.headers||{})},...opt});let b={};try{b=await r.json()}catch{}return{r,b}}
          async function login(path,email){const x=await req(path,{method:'POST',body:JSON.stringify({email,password})});return{...x,t:token(x.b)}}
          (async()=>{const o=await login('/api/auth/login',ownerEmail);if(!o.r.ok||!o.t)throw Error('owner login '+o.r.status);const candidates=[];for(const p of ['/api/team/workers','/api/team','/api/workers']){const x=await req(p,{headers:{Authorization:'Bearer '+o.t}});if(!x.r.ok)continue;for(const r of rows(x.b)){const e=String(r.email||r.worker_email||r.user_email||'').trim().toLowerCase();if(e&&e!==ownerEmail.toLowerCase()&&!candidates.includes(e))candidates.push(e)}}for(const e of candidates){let x=await login('/api/auth/login',e);if(!x.r.ok||!x.t)x=await login('/api/worker/auth/login',e);if(x.r.ok&&x.t){console.log('::add-mask::'+e);fs.appendFileSync(process.env.GITHUB_ENV,'CHURVOX_WORKER_EMAIL='+e+'\n');return}}throw Error('No worker login succeeded')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Human flow
        id: human
        continue-on-error: true
        working-directory: frontend
        run: npx playwright test tests/e2e/churvox-current-human-owner-worker-flow.spec.js --project=desktop-chromium --workers=1 --reporter=line 2>&1 | tee /tmp/human.txt
      - name: Hardcore
        id: hardcore
        continue-on-error: true
        run: node scripts/churvox-hardcore-owner-worker.cjs 2>&1 | tee /tmp/hardcore.txt
      - name: Cleanup
        id: cleanup
        if: always()
        continue-on-error: true
        run: node scripts/churvox-hardcore-human-cleanup.cjs 2>&1 | tee /tmp/cleanup.txt
      - name: Report
        if: always()
        uses: actions/github-script@v7
        env:
          HUMAN: ${{ steps.human.outcome }}
          HARDCORE: ${{ steps.hardcore.outcome }}
          CLEANUP: ${{ steps.cleanup.outcome }}
        with:
          script: |
            const fs=require('fs');const read=p=>fs.existsSync(p)?fs.readFileSync(p,'utf8').slice(-15000):'No output';const body=[`# Launch debug result`,`Run: ${context.runId}`,`Human: ${process.env.HUMAN}`,`Hardcore: ${process.env.HARDCORE}`,`Cleanup: ${process.env.CLEANUP}`,'## Human','```',read('/tmp/human.txt'),'```','## Hardcore','```',read('/tmp/hardcore.txt'),'```','## Cleanup','```',read('/tmp/cleanup.txt'),'```'].join('\n');await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:body.slice(0,64000)});
      - name: Gate
        if: always()
        env:
          HUMAN: ${{ steps.human.outcome }}
          HARDCORE: ${{ steps.hardcore.outcome }}
          CLEANUP: ${{ steps.cleanup.outcome }}
        run: test "$HUMAN" = success -a "$HARDCORE" = success -a "$CLEANUP" = success
