name: Apply Final Semantic Fix

on:
  pull_request:
    branches: [audit/churvox-pr746-base-20260726]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: churvox-final-semantic-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: agent/churvox-office-os-foundation
          fetch-depth: 0
          persist-credentials: true

      - name: Add semantic page heading and align navigation audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          bridge = Path('frontend/src/churvox-studio/StudioReleaseBridge.jsx')
          text = bridge.read_text()
          marker = '''      const context = document.querySelector(".cvsContextBeam nav");\n'''
          addition = '''      const pageHeading = document.querySelector(".cvsContextIdentity b");\n      if (pageHeading) {\n        pageHeading.setAttribute("role", "heading");\n        pageHeading.setAttribute("aria-level", "1");\n      }\n\n'''
          if addition not in text:
              if marker not in text:
                  raise SystemExit('Could not find Studio context insertion point')
              text = text.replace(marker, addition + marker, 1)
          bridge.write_text(text)

          audit = Path('frontend/tests/e2e/churvox-big-launch-audit.spec.js')
          text = audit.read_text()
          old = '''  const studioAreas = ['Today', 'Jobs', 'Clients', 'Money', 'Team', 'Messages', 'Command'];\n  if (isMobile) {\n    const dock = page.locator('.cvsMobileDock');\n    for (const item of ['Today', 'Jobs', 'Command', 'Messages', 'More']) {\n      await expect(dock.getByRole('button').filter({ hasText: new RegExp(`^\\s*${item}\\b`, 'i') }).first(), `missing mobile Studio navigation: ${item}`).toBeVisible();\n    }\n\n    await dock.getByRole('button').filter({ hasText: /^\\s*More\\b/i }).first().click();\n    const morePanel = page.locator('.cvsMobileMore section');\n    await expect(morePanel, 'mobile Studio More panel did not open').toBeVisible();\n    for (const item of studioAreas) {\n      await expect(morePanel.getByRole('button').filter({ hasText: new RegExp(`^\\s*${item}\\b`, 'i') }).first(), `missing mobile Studio area: ${item}`).toBeVisible();\n    }\n    for (const item of ['Settings', 'Plans & billing', 'Help']) {\n      await expect(morePanel.getByRole('button').filter({ hasText: new RegExp(`^\\s*${item}\\b`, 'i') }).first(), `missing mobile account area: ${item}`).toBeVisible();\n    }\n  } else {\n    const nav = page.getByRole('navigation', { name: /Main Churvox navigation/i });\n    await expect(nav, 'desktop Studio navigation did not load').toBeVisible();\n    for (const item of studioAreas) {\n      await expect(nav.getByRole('button').filter({ hasText: new RegExp(`^\\s*${item}\\b`, 'i') }).first(), `missing desktop Studio area: ${item}`).toBeVisible();\n    }\n\n    await page.locator('.cvsProfileWrap > button.profile').click();\n'''
          new = '''  if (isMobile) {\n    const dock = page.locator('.cvsMobileDock');\n    for (const item of ['Today', 'Jobs', 'Command', 'Messages', 'More']) {\n      await expect(dock.getByRole('button').filter({ hasText: new RegExp(`^\\s*${item}\\b`, 'i') }).first(), `missing mobile Studio navigation: ${item}`).toBeVisible();\n    }\n\n    await dock.getByRole('button').filter({ hasText: /^\\s*More\\b/i }).first().click();\n    const morePanel = page.locator('.cvsMobileMore section');\n    await expect(morePanel, 'mobile Studio More panel did not open').toBeVisible();\n    for (const item of ['Clients', 'Money', 'Team']) {\n      await expect(morePanel.getByRole('button').filter({ hasText: new RegExp(`^\\s*${item}\\b`, 'i') }).first(), `missing mobile Studio area: ${item}`).toBeVisible();\n    }\n    for (const item of ['Settings', 'Plans & billing', 'Help']) {\n      await expect(morePanel.getByRole('button').filter({ hasText: new RegExp(`^\\s*${item}\\b`, 'i') }).first(), `missing mobile account area: ${item}`).toBeVisible();\n    }\n  } else {\n    const nav = page.getByRole('navigation', { name: /Main Churvox navigation/i });\n    await expect(nav, 'desktop Studio navigation did not load').toBeVisible();\n    for (const item of ['Jobs', 'Clients', 'Money', 'Team', 'Messages', 'Command']) {\n      await expect(nav.getByRole('button').filter({ hasText: new RegExp(`^\\s*${item}\\b`, 'i') }).first(), `missing desktop Studio area: ${item}`).toBeVisible();\n    }\n    const todayControl = page.locator('.cvsBrand');\n    await expect(todayControl, 'desktop Today/home control did not load').toBeVisible();\n    await todayControl.click();\n    await expect(page.locator('[data-screen="today"]'), 'desktop Today/home control did not open Today').toBeVisible();\n\n    await page.locator('.cvsProfileWrap > button.profile').click();\n'''
          if old not in text:
              raise SystemExit('Could not find owner navigation audit block')
          audit.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git config user.name "Churvox Audit Bot"
          git config user.email "hello@churvox.com"
          git add frontend/src/churvox-studio/StudioReleaseBridge.jsx frontend/tests/e2e/churvox-big-launch-audit.spec.js
          git commit -m "Add semantic Today heading and verify real navigation paths"
          git push origin HEAD:agent/churvox-office-os-foundation
