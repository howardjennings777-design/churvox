name: Churvox public world visual audit

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: startsWith(github.event.issue.title, '[churvox-public-world-visual-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        run: |
          mkdir -p /tmp/churvox-public-audit
          cd /tmp/churvox-public-audit
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Walk every public room
        shell: bash
        run: |
          cat > /tmp/churvox-public-audit/audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');
          const base = 'https://www.churvox.com';
          const out = '/tmp/churvox-public-audit/out';
          fs.mkdirSync(out,{recursive:true});
          const routes = [
            ['home','/'],
            ['product','/product/'],
            ['features','/features/'],
            ['pricing','/pricing/'],
            ['demo','/demo/'],
            ['about','/about/'],
            ['security','/security/'],
            ['support','/support/'],
            ['billing','/refunds-cancellations/'],
            ['contact','/contact/'],
            ['login','/login/'],
            ['signup','/signup/?plan=operator'],
            ['forgot-password','/forgot-password'],
            ['delete-account','/delete-account'],
            ['privacy','/legal/privacy/'],
            ['terms','/legal/terms/'],
            ['request','/request'],
            ['testers','/testers/'],
            ['new-zealand','/industries/new-zealand/'],
            ['australia','/industries/australia/'],
            ['lawn-care','/industries/lawn-care/'],
            ['landscaping','/industries/landscaping/'],
            ['cleaning','/industries/cleaning/'],
            ['property-maintenance','/industries/property-maintenance/'],
            ['handyman','/industries/handyman/'],
            ['painting','/industries/painting/'],
            ['plumbing-electrical-hvac','/industries/plumbing-electrical-hvac/'],
            ['pest-control','/industries/pest-control/'],
            ['barber-hairdresser','/industries/barber-hairdresser/']
          ];
          const viewports = [['desktop',{width:1440,height:1000}],['phone',{width:390,height:844}]];
          const results=[]; const errors=[];
          const hashFile = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [device,viewport] of viewports){
              const context=await browser.newContext({viewport,serviceWorkers:'block',ignoreHTTPSErrors:true});
              for(const [name,route] of routes){
                const page=await context.newPage(); const pageErrors=[];
                page.on('pageerror',e=>pageErrors.push(String(e.message||e)));
                page.on('console',m=>{if(m.type()==='error'&&!/favicon|manifest|ResizeObserver|ERR_ABORTED/i.test(m.text()))pageErrors.push(m.text())});
                let status=null;
                try{const response=await page.goto(base+route,{waitUntil:'networkidle',timeout:60000});status=response&&response.status()}catch(e){pageErrors.push('goto '+String(e))}
                await page.waitForTimeout(1700);
                const metrics=await page.evaluate(()=>{
                  const visible=el=>{if(!(el instanceof HTMLElement))return false;const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>1&&r.height>1};
                  const controls=[...document.querySelectorAll('button,a[href],input:not([type=hidden]),textarea,select')].filter(visible);
                  return {
                    finalUrl:location.href,title:document.title,room:document.querySelector('main')?.getAttribute('data-room')||'',
                    h1:[...document.querySelectorAll('h1')].filter(visible).map(x=>(x.innerText||'').replace(/\s+/g,' ').trim()).find(Boolean)||'',
                    bodyTextLength:(document.body.innerText||'').trim().length,
                    horizontalOverflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth),
                    tinyControls:controls.map(el=>{const r=el.getBoundingClientRect();return {label:(el.innerText||el.getAttribute('aria-label')||el.getAttribute('placeholder')||'').trim().slice(0,60),w:Math.round(r.width),h:Math.round(r.height)}}).filter(x=>x.h<38||x.w<30).slice(0,15),
                    navLinks:[...document.querySelectorAll('header a[href]')].filter(visible).length
                  };
                });
                const file=path.join(out,`${device}-${name}.png`); await page.screenshot({path:file,fullPage:true});
                results.push({device,name,route,status,hash:hashFile(file),errors:pageErrors,...metrics});
                errors.push(...pageErrors.map(e=>`${device}/${name}: ${e}`));
                await page.close();
              }
              await context.close();
            }
            await browser.close();
            const duplicateGroups={}; for(const r of results){duplicateGroups[r.hash]=(duplicateGroups[r.hash]||[]).concat(`${r.device}/${r.name}`)}
            const duplicates=Object.values(duplicateGroups).filter(x=>x.length>1);
            const summary={screens:results.length,publicRoutes:routes.length,statusFailures:results.filter(r=>r.status!==200).map(r=>`${r.device}/${r.name}:${r.status}`),overflow:results.filter(r=>r.horizontalOverflow>2).map(r=>`${r.device}/${r.name}:${r.horizontalOverflow}`),tiny:results.filter(r=>r.tinyControls.length).map(r=>`${r.device}/${r.name}`),blank:results.filter(r=>r.bodyTextLength<100).map(r=>`${r.device}/${r.name}`),runtimeErrors:errors,duplicateScreenshots:duplicates,rooms:[...new Set(results.map(r=>r.room).filter(Boolean))],headings:Object.fromEntries(results.filter(r=>r.device==='desktop').map(r=>[r.name,r.h1])),tokenisedPagesExcluded:['public quote','public invoice','proof pack','client portal because a valid private token is required']};
            fs.writeFileSync(path.join(out,'results.json'),JSON.stringify(results,null,2));
            fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify(summary,null,2));
            console.log(JSON.stringify(summary,null,2));
            if(summary.statusFailures.length||summary.overflow.length||summary.blank.length||summary.runtimeErrors.length||summary.duplicateScreenshots.length)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/churvox-public-audit/audit.cjs | tee /tmp/churvox-public-audit/audit.log

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churvox-public-world-visual-audit
          path: /tmp/churvox-public-audit/out
          retention-days: 14

      - name: Post audit summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const file='/tmp/churvox-public-audit/out/summary.json';
            const summary=fs.existsSync(file)?JSON.parse(fs.readFileSync(file,'utf8')):{failure:'summary missing'};
            const lines=['# Churvox public world visual audit','',`- Unique public routes: ${summary.publicRoutes||0}`,`- Screens: ${summary.screens||0}`,`- HTTP failures: ${(summary.statusFailures||[]).length}`,`- Overflow pages: ${(summary.overflow||[]).length}`,`- Blank pages: ${(summary.blank||[]).length}`,`- Runtime errors: ${(summary.runtimeErrors||[]).length}`,`- Duplicate full-page screenshots: ${(summary.duplicateScreenshots||[]).length}`,`- Route identities found: ${(summary.rooms||[]).join(', ')||'none'}`,'', 'Desktop headings:', ...Object.entries(summary.headings||{}).map(([k,v])=>`- **${k}:** ${v}`),'',`Tokenised pages not captured without a valid private token: ${(summary.tokenisedPagesExcluded||[]).join(', ')||'none'}`,'',`Workflow run: \`${context.runId}\``,`Artifact: \`churvox-public-world-visual-audit\``];
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:lines.join('\n')});
