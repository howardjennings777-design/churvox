name: Apply Go Live Trust Integration

on:
  push:
    branches:
      - agent/churvox-go-live-trust

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip-go-live-integration]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/churvox-go-live-trust
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Assemble and apply checked integration
        run: |
          cat .churvox-tmp/apply-00.part \
              .churvox-tmp/apply-01.part \
              .churvox-tmp/apply-02.part \
              .churvox-tmp/apply-03.part \
              .churvox-tmp/apply-04.part \
              .churvox-tmp/apply-05a.part \
              .churvox-tmp/apply-05b.part \
              .churvox-tmp/apply-05c.part \
              .churvox-tmp/apply-06.part \
              .churvox-tmp/apply-07.part > /tmp/apply-go-live-trust.py
          python -m py_compile /tmp/apply-go-live-trust.py
          python /tmp/apply-go-live-trust.py
      - name: Validate backend and permanent tests
        run: |
          python -m py_compile backend/churvox_launch_hardening_routes.py churvox_launch_hardening_routes.py backend/test_churvox_launch_hardening.py scripts/churvox-launch-hardening-contract.py
          python -m unittest -v backend.test_churvox_launch_hardening backend.test_churvox_owner_intelligence backend.test_churvox_job_done_reality backend.test_churvox_feature_tier_paid_launch_guard
          node --check frontend/src/churvox-office-lab/OfficeTeamLaunchHardeningApi.js
          node --check frontend/src/churvox-office-lab/workerOfflineQueue.js
          node --check frontend/tests/e2e/churvox-launch-hardening.spec.js
      - name: Build production frontend
        working-directory: frontend
        env:
          CI: 'false'
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci --no-audit --no-fund
          npm run build
      - name: Publish verified product wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire Go Live and Trust product hardening [skip-go-live-integration]"
          git push origin HEAD:agent/churvox-go-live-trust
