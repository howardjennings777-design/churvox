name: Churvox One-Time Frontend Hook Repair

on:
  push:
    branches:
      - agent/final-login-route-contract
    paths:
      - '.github/workflows/churvox-fix-frontend-hooks-once.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-login-route-contract

      - name: Apply exact hook dependency repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path_name, old, new, count=1):
              path = Path(path_name)
              source = path.read_text()
              found = source.count(old)
              if found != count:
                  raise SystemExit(f'{path_name}: expected {count} matches, found {found}: {old!r}')
              path.write_text(source.replace(old, new, count))

          nav = 'frontend/src/churvox-office-lab/OfficeTeamOwnerNavigation.jsx'
          replace(nav, 'const visiblePrimary = useMemo(() => filterOwnerItems(primary, user), [user, plan]);', 'const visiblePrimary = useMemo(() => filterOwnerItems(primary, user), [user]);')
          replace(nav, 'const visibleOffice = useMemo(() => filterOwnerItems(office, user), [user, plan]);', 'const visibleOffice = useMemo(() => filterOwnerItems(office, user), [user]);')
          replace(nav, 'const visibleUtility = useMemo(() => filterOwnerItems(utility, user), [user, plan]);', 'const visibleUtility = useMemo(() => filterOwnerItems(utility, user), [user]);')

          replace(
              'frontend/src/pages/AppOwnerMachine.jsx',
              '  const lists = data?.lists || {};',
              '  const lists = React.useMemo(() => data?.lists || {}, [data?.lists]);',
          )
          replace(
              'frontend/src/pages/PaidLaunchHQSystem.jsx',
              '  const billing = launch?.billing || {};',
              '  const billing = React.useMemo(() => launch?.billing || {}, [launch?.billing]);',
          )

          worker = 'frontend/src/pages/worker/WorkerNoFuss.js'
          replace(
              worker,
              'import React, { useEffect, useMemo, useRef, useState } from "react";',
              'import React, { useCallback, useEffect, useMemo, useRef, useState } from "react";',
          )
          replace(worker, '  async function refresh() {', '  const refresh = useCallback(async () => {', count=2)
          replace(
              worker,
              '  }\n  useEffect(() => { refresh(); }, []);',
              '  }, [get]);\n  useEffect(() => { refresh(); }, [refresh]);',
              count=2,
          )

          billing = 'frontend/src/pages/BillingReturnPage.jsx'
          replace(billing, '  function openSetupSoon() {', '  const openSetupSoon = React.useCallback(() => {')
          replace(
              billing,
              '    }, 1800);\n  }\n\n  function refreshAuthUser() {',
              '    }, 1800);\n  }, [navigate]);\n\n  const refreshAuthUser = React.useCallback(() => {',
          )
          replace(
              billing,
              '    checkAuth?.().catch(() => {});\n  }\n\n  async function refreshBilling({ goToSetup = false } = {}) {',
              '    checkAuth?.().catch(() => {});\n  }, [checkAuth]);\n\n  const refreshBilling = React.useCallback(async ({ goToSetup = false } = {}) => {',
          )
          replace(
              billing,
              '    setCheckedAt(new Date().toLocaleString("en-NZ"));\n  }\n\n  React.useEffect(() => () => window.clearTimeout(redirectTimer.current), []);',
              '    setCheckedAt(new Date().toLocaleString("en-NZ"));\n  }, [get, openSetupSoon, refreshAuthUser, updateUser]);\n\n  React.useEffect(() => () => window.clearTimeout(redirectTimer.current), []);',
          )
          replace(
              billing,
              '    return () => { alive = false; };\n  }, []);',
              '    return () => { alive = false; };\n  }, [cancelled, location.search, post, refreshAuthUser, refreshBilling, updateUser]);',
          )
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend install --legacy-peer-deps --registry=https://registry.npmjs.org/

      - name: Build production frontend
        run: npm --prefix frontend run build

      - name: Commit repairs and remove temporary workflow
        run: |
          rm .github/workflows/churvox-fix-frontend-hooks-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/churvox-office-lab/OfficeTeamOwnerNavigation.jsx \
            frontend/src/pages/AppOwnerMachine.jsx \
            frontend/src/pages/BillingReturnPage.jsx \
            frontend/src/pages/PaidLaunchHQSystem.jsx \
            frontend/src/pages/worker/WorkerNoFuss.js \
            .github/workflows/churvox-fix-frontend-hooks-once.yml
          git commit -m 'Fix frontend hook build blockers'
          git push origin HEAD:agent/final-login-route-contract
