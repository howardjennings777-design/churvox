name: Churvox One-Time Owner Login Proof V2

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  owner-login-proof:
    if: startsWith(github.event.issue.title, '[churvox-owner-smoke-v2]')
    name: Read-only owner browser login proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mark owner proof as started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Read-only owner login proof is running. No business records will be changed.'
            })

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --legacy-peer-deps

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Create owner-only read-only browser test
        working-directory: frontend
        run: |
          cat > tests/e2e/churvox-owner-one-time-live.spec.js <<'NODE'
          const { test, expect } = require('@playwright/test');

          const EMAIL = String(process.env.CHURVOX_OWNER_EMAIL || '').trim().toLowerCase();
          const PASSWORD = String(process.env.CHURVOX_OWNER_PASSWORD || '');
          const API = String(process.env.PLAYWRIGHT_API_BASE || '').replace(/\/+$/, '');

          const tokenFrom = (data = {}) => data?.token || data?.access_token || data?.auth_token || data?.jwt || data?.accessToken
            || data?.user?.token || data?.user?.access_token || data?.user?.accessToken
            || data?.data?.token || data?.data?.access_token || data?.data?.user?.token || '';
          const accountEmail = (data = {}) => String(data?.email || data?.user?.email || data?.data?.email || data?.data?.user?.email || '').trim().toLowerCase();

          test('real owner login, identity, dashboard and refresh persistence', async ({ page }) => {
            test.setTimeout(180000);
            expect(EMAIL, 'owner email secret missing').not.toBe('');
            expect(PASSWORD, 'owner password secret missing').not.toBe('');

            const login = await page.request.post(`${API}/api/auth/login`, {
              data: { email: EMAIL, password: PASSWORD },
              timeout: 30000,
            });
            console.log(`login_status=${login.status()}`);
            const loginData = await login.json().catch(() => null);
            expect(login.ok(), `owner login returned HTTP ${login.status()}`).toBeTruthy();
            expect(loginData, 'owner login did not return JSON').not.toBeNull();
            expect(loginData?.success, 'owner login returned success=false').not.toBe(false);

            const token = tokenFrom(loginData);
            expect(token, 'owner login returned no usable token').not.toBe('');
            const returnedEmail = accountEmail(loginData);
            if (returnedEmail) expect(returnedEmail).toBe(EMAIL);

            const me = await page.request.get(`${API}/api/auth/me`, {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
              timeout: 30000,
            });
            console.log(`auth_me_status=${me.status()}`);
            const meData = await me.json().catch(() => null);
            expect(me.ok(), `owner auth/me returned HTTP ${me.status()}`).toBeTruthy();
            expect(accountEmail(meData)).toBe(EMAIL);
            console.log('auth_me_email_match=true');

            await page.goto('/login', { waitUntil: 'domcontentloaded' });
            await page.evaluate((value) => localStorage.setItem('token', value), token);
            await page.goto('/dashboard#today', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(2500);
            const body = (await page.locator('body').innerText()).replace(/\s+/g, ' ').trim();
            expect(body.length, 'owner dashboard rendered blank').toBeGreaterThan(80);
            expect(body).not.toMatch(/something went wrong|application error|cannot read properties|failed to render/i);
            expect(new URL(page.url()).pathname).not.toMatch(/^\/login\/?$/i);
            console.log('dashboard_rendered=true');

            await page.reload({ waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(1500);
            expect(await page.evaluate(() => Boolean(localStorage.getItem('token')))).toBeTruthy();
            console.log('refresh_persistence=true');
            console.log('OWNER_LOGIN_PROOF_PASSED');
          });
          NODE

      - name: Run owner-only read-only browser test
        id: smoke
        continue-on-error: true
        working-directory: frontend
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: https://www.churvox.com
          PLAYWRIGHT_API_BASE: https://grassley-backend.onrender.com
          CHURVOX_OWNER_EMAIL: ${{ secrets.CHURVOX_OWNER_EMAIL || 'howardjennings77@gmail.com' }}
          CHURVOX_OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}
        run: |
          set -o pipefail
          npx playwright test tests/e2e/churvox-owner-one-time-live.spec.js --project=desktop-chromium --workers=1 --reporter=line 2>&1 | tee /tmp/churvox-owner-smoke-v2.txt

      - name: Post owner proof result
        if: always()
        uses: actions/github-script@v7
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/churvox-owner-smoke-v2.txt';
            let report = 'The owner proof output was not created.';
            if (fs.existsSync(path)) report = fs.readFileSync(path, 'utf8').slice(-16000);
            const outcome = process.env.SMOKE_OUTCOME === 'success' ? 'PASSED' : 'FAILED';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Owner login proof ${outcome}\n\n\`\`\`text\n${report}\n\`\`\``
            });

      - name: Fail workflow when owner proof failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
