name: Churvox Owner Network Trace

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  trace:
    if: startsWith(github.event.issue.title, '[churvox-owner-network-trace]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://www.churvox.com
      API_BASE: https://grassley-backend.onrender.com
      OWNER_EMAIL: howardjennings777@gmail.com
      OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Chromium
        working-directory: frontend
        run: |
          npm install --include=dev --legacy-peer-deps
          npx playwright install --with-deps chromium
      - name: Trace live owner requests
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/churvox-owner-network-trace.txt 2>&1
          const { chromium } = require(process.cwd() + '/node_modules/@playwright/test');
          const base = process.env.BASE_URL.replace(/\/+$/, '');
          const api = process.env.API_BASE.replace(/\/+$/, '');
          const email = process.env.OWNER_EMAIL;
          const password = process.env.OWNER_PASSWORD;
          const tokenFrom = (body = {}) => body.token || body.access_token || body.auth_token || body.jwt || body.accessToken || body.user?.token || body.data?.token || body.data?.user?.token || '';
          (async () => {
            const login = await fetch(`${api}/api/auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
            const loginBody = await login.json().catch(() => ({}));
            const token = tokenFrom(loginBody);
            if (!login.ok || !token) throw new Error(`Owner login failed ${login.status}`);
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 }, serviceWorkers: 'block' });
            await context.addInitScript(({ tokenValue, emailValue }) => {
              localStorage.setItem('token', tokenValue);
              localStorage.setItem('authToken', tokenValue);
              localStorage.setItem('access_token', tokenValue);
              localStorage.setItem('churvox_auth_session_snapshot_v1', JSON.stringify({ at: Date.now(), token: tokenValue, user: { email: emailValue, role: 'owner', has_app_access: true, email_verified: true, token: tokenValue } }));
            }, { tokenValue: token, emailValue: email });
            const page = await context.newPage();
            const failures = [];
            page.on('response', async (response) => {
              const status = response.status();
              if (status < 400) return;
              const request = response.request();
              const url = response.url();
              if (/favicon|manifest|hot-update|sockjs/i.test(url)) return;
              let detail = '';
              try { detail = (await response.text()).replace(/\s+/g, ' ').slice(0, 240); } catch {}
              failures.push({ method: request.method(), status, url, detail });
            });
            const pages = ['today','command','work','clients','worker','quotes','invoices','schedule','messages','payroll','integrations','team','settings','plans','help'];
            for (const name of pages) {
              await page.goto(`${base}/dashboard#${name}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForTimeout(1800);
            }
            await browser.close();
            const unique = [...new Map(failures.map((item) => [`${item.method} ${item.status} ${item.url}`, item])).values()];
            console.log(`Failures captured: ${failures.length}; unique: ${unique.length}`);
            for (const item of unique) console.log(`${item.method} ${item.status} ${item.url}\n  ${item.detail}`);
            if (!unique.length) console.log('NO_MATERIAL_FAILED_REQUESTS');
          })().catch((error) => { console.error(error.stack || error); process.exit(1); });
          NODE
      - name: Post trace
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.existsSync('/tmp/churvox-owner-network-trace.txt') ? fs.readFileSync('/tmp/churvox-owner-network-trace.txt', 'utf8').slice(-12000) : 'No trace output.';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## Owner network trace\n\n\`\`\`text\n${text}\n\`\`\`` });
