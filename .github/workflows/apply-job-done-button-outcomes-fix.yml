name: Apply Job Done Button Outcomes Fix

on:
  push:
    branches:
      - feature/job-done-money-radar
    paths:
      - .github/workflows/apply-job-done-button-outcomes-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/job-done-money-radar
          fetch-depth: 0

      - name: Apply button outcome repair
        run: python scripts/churvox-job-done-button-outcomes-fix.py

      - name: Validate repaired source
        run: |
          python -m py_compile scripts/churvox-job-done-button-outcomes-fix.py
          grep -q 'WorkScreen appMode={appMode} go={props.go}' frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx
          grep -q 'MoneyScreen appMode={appMode} go={props.go}' frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx
          grep -q 'Preview Job Done closeout prepared' frontend/src/churvox-office-lab/OfficeTeamJobDone.js

      - name: Commit product repair and remove temporary patch files
        run: |
          git config user.name "Churvox Reality Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-job-done-button-outcomes-fix.yml
          git rm scripts/churvox-job-done-button-outcomes-fix.py
          git add frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx frontend/src/churvox-office-lab/OfficeTeamJobDone.js
          git commit -m "Give Job Done controls visible outcomes"
          git push origin feature/job-done-money-radar
