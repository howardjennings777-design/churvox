name: Churvox One-Off Ad Assets Capture

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/churvox-ad-assets-capture-once.yml

permissions:
  contents: read
  issues: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --include=dev --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture authenticated product screens
        env:
          CHURVOX_OWNER_EMAIL: ${{ secrets.CHURVOX_OWNER_EMAIL }}
          CHURVOX_OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}
          PLAYWRIGHT_BASE_URL: https://www.churvox.com
          PLAYWRIGHT_API_BASE: https://grassley-backend.onrender.com
        run: |
          mkdir -p ad-assets/desktop ad-assets/mobile ad-assets/video
          cat > /tmp/capture-churvox-ad.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const fs = require('fs');
          const path = require('path');

          const baseURL = (process.env.PLAYWRIGHT_BASE_URL || 'https://www.churvox.com').replace(/\/+$/, '');
          const apiBase = (process.env.PLAYWRIGHT_API_BASE || 'https://grassley-backend.onrender.com').replace(/\/+$/, '');
          const email = process.env.CHURVOX_OWNER_EMAIL || '';
          const password = process.env.CHURVOX_OWNER_PASSWORD || '';
          if (!email || !password) throw new Error('Authenticated capture secrets are not configured.');

          const routes = [
            ['01-today', '/today'],
            ['02-command', '/command'],
            ['03-jobs', '/jobs'],
            ['04-clients', '/clients'],
            ['05-workers', '/workers'],
            ['06-quotes', '/quotes'],
            ['07-invoices', '/invoices'],
          ];

          async function login(page) {
            const response = await page.request.post(`${apiBase}/api/auth/login`, {
              data: { email, password },
              headers: { 'content-type': 'application/json' },
              timeout: 30000,
            });
            const body = await response.json().catch(async () => ({ text: await response.text().catch(() => '') }));
            const token = body.token || body.access_token || body.data?.token || body.user?.token || '';
            if (!response.ok() || !token) throw new Error(`Authenticated API login failed with status ${response.status()}`);
            await page.goto(baseURL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.evaluate((value) => {
              localStorage.setItem('token', value);
              localStorage.setItem('authToken', value);
            }, token);
          }

          async function protectAccountDetails(page) {
            await page.evaluate((accountEmail) => {
              const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
              const nodes = [];
              while (walker.nextNode()) nodes.push(walker.currentNode);
              for (const node of nodes) {
                if ((node.nodeValue || '').toLowerCase().includes(accountEmail.toLowerCase())) {
                  const parent = node.parentElement;
                  if (parent) {
                    parent.style.filter = 'blur(8px)';
                    parent.style.userSelect = 'none';
                  }
                }
              }
            }, email).catch(() => null);
          }

          async function settle(page) {
            await page.waitForLoadState('domcontentloaded').catch(() => null);
            await page.waitForTimeout(2200);
            await protectAccountDetails(page);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const desktop = await browser.newContext({
              viewport: { width: 1440, height: 900 },
              deviceScaleFactor: 1,
              recordVideo: { dir: 'ad-assets/video', size: { width: 1440, height: 900 } },
            });
            const page = await desktop.newPage();
            await login(page);

            for (const [name, route] of routes) {
              await page.goto(`${baseURL}${route}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await settle(page);
              await page.screenshot({ path: `ad-assets/desktop/${name}.png`, fullPage: false });
            }
            await desktop.close();

            const mobile = await browser.newContext({
              viewport: { width: 430, height: 932 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true,
            });
            const mobilePage = await mobile.newPage();
            await login(mobilePage);
            for (const [name, route] of routes) {
              await mobilePage.goto(`${baseURL}${route}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await settle(mobilePage);
              await mobilePage.screenshot({ path: `ad-assets/mobile/${name}.png`, fullPage: false });
            }
            await mobile.close();
            await browser.close();

            fs.writeFileSync(path.join('ad-assets', 'manifest.json'), JSON.stringify({
              captured_at: new Date().toISOString(),
              routes: routes.map(([name, route]) => ({ name, route })),
              note: 'Authenticated test-account marketing capture. Account email blurred where visible.',
            }, null, 2));
          })().catch((error) => {
            console.error(error && error.stack ? error.stack : String(error));
            process.exit(1);
          });
          NODE
          node /tmp/capture-churvox-ad.cjs

      - name: Upload capture artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churvox-ad-assets-${{ github.run_id }}
          path: frontend/ad-assets
          if-no-files-found: warn
          retention-days: 7

      - name: Publish capture run reference
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "[churvox-ad-assets-result] Run $GITHUB_RUN_ID" \
            --body "Authenticated Churvox ad capture finished. Run ID: $GITHUB_RUN_ID. Artifact: churvox-ad-assets-$GITHUB_RUN_ID. Conclusion: ${{ job.status }}."
