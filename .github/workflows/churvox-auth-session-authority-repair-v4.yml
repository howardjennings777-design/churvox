name: Churvox Auth Session Authority Repair V4

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-auth-session-authority-repair-v4]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply product-only auth repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee /tmp/churvox-auth-repair-v4.txt
          from pathlib import Path

          def replace_once(path, old, new, label):
              file = Path(path)
              text = file.read_text()
              if new in text:
                  print(f'already patched: {label}')
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1))
              print(f'patched: {label}')

          auth = 'frontend/src/context/AuthContext.js'
          replace_once(auth, 'const WORKER_OFFLINE_GRACE_MS = 1000 * 60 * 60 * 2;\n', 'const WORKER_OFFLINE_GRACE_MS = 1000 * 60 * 60 * 2;\nconst BUSINESS_OFFLINE_GRACE_MS = 1000 * 60 * 15;\n', 'bounded owner session grace')
          replace_once(auth, '  if (PAID_STATUSES.has(status)) return stripeBackedAccess(user);\n  if (typeof user.has_app_access === "boolean") return user.has_app_access && stripeBackedAccess(user);\n', '  // /api/auth/me is the authoritative billing gate and may omit private Stripe identifiers.\n  if (user.has_app_access === true) return true;\n  if (PAID_STATUSES.has(status)) return stripeBackedAccess(user);\n', 'trust authoritative backend access flag')
          replace_once(auth, 'function offlineWorkerSnapshot(user = {}) {\n  return inferredWorker(user) && !explicitBillingLock(user) && !isPlatformOwner(user);\n}\n', 'function offlineWorkerSnapshot(user = {}) {\n  return inferredWorker(user) && !explicitBillingLock(user) && !isPlatformOwner(user);\n}\n\nfunction offlineBusinessSnapshot(user = {}) {\n  return !inferredWorker(user) && !inferredPayroll(user) && businessAccessFromUser(user);\n}\n', 'recent owner fallback helper')
          replace_once(auth, '    const workerSession = readStoredAuthSnapshot(WORKER_OFFLINE_GRACE_MS);\n', '    const workerSession = readStoredAuthSnapshot(WORKER_OFFLINE_GRACE_MS);\n    const businessSession = readStoredAuthSnapshot(BUSINESS_OFFLINE_GRACE_MS);\n    const fallbackSession = workerSession || businessSession;\n', 'read bounded owner fallback session')
          replace_once(auth, '      const me = await fetchMe(token || workerSession?.token || undefined);\n', '      const me = await fetchMe(token || fallbackSession?.token || undefined);\n', 'use available verified session token')
          replace_once(auth, '      const status = error?.response?.status;\n', '      const status = error?.response?.status;\n      const transient = !status || status === 408 || status === 429 || status >= 500;\n', 'classify transient auth failures')
          replace_once(auth, '      if (!status && workerSession && offlineWorkerSnapshot(workerSession)) {\n', '      if (transient && workerSession && offlineWorkerSnapshot(workerSession)) {\n', 'worker fallback handles transient failures')
          replace_once(auth, '        return workerSession;\n      }\n      clearStoredAuth({ clearPlanState: status === 401 || status === 403 });\n', '        return workerSession;\n      }\n      if (transient && businessSession && offlineBusinessSnapshot(businessSession)) {\n        if (runId === authRunRef.current) setUser(businessSession);\n        return businessSession;\n      }\n      if (status === 401 || status === 403) clearStoredAuth({ clearPlanState: true });\n', 'owner transient fallback and definitive logout')
          replace_once('frontend/src/App.js', 'churvox-worker-command-routes-20260713c', 'churvox-auth-session-authority-20260713d', 'new deployment fingerprint')
          PY

          cat > scripts/churvox-auth-session-authority-contract.cjs <<'NODE'
          #!/usr/bin/env node
          const fs = require('fs');
          const auth = fs.readFileSync('frontend/src/context/AuthContext.js', 'utf8');
          const app = fs.readFileSync('frontend/src/App.js', 'utf8');
          const checks = [
            ['authoritative access flag', auth.includes('if (user.has_app_access === true) return true;')],
            ['explicit false remains a lock', auth.includes('user.has_app_access === false')],
            ['owner grace is bounded', auth.includes('const BUSINESS_OFFLINE_GRACE_MS = 1000 * 60 * 15;')],
            ['owner fallback is transient only', auth.includes('if (transient && businessSession && offlineBusinessSnapshot(businessSession))')],
            ['401 and 403 clear session', auth.includes('if (status === 401 || status === 403) clearStoredAuth({ clearPlanState: true });')],
            ['new frontend fingerprint', app.includes('churvox-auth-session-authority-20260713d')],
          ];
          for (const [name, pass] of checks) {
            console.log(`${pass ? 'PASS' : 'FAIL'} — ${name}`);
            if (!pass) process.exitCode = 1;
          }
          NODE

      - name: Run permanent contract and production build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/churvox-auth-session-authority-contract.cjs | tee /tmp/churvox-auth-contract-v4.txt
          npm --prefix frontend install --legacy-peer-deps
          CI=false npm --prefix frontend run build 2>&1 | tee /tmp/churvox-auth-build-v4.txt

      - name: Commit product-only verified repair
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/context/AuthContext.js frontend/src/App.js scripts/churvox-auth-session-authority-contract.cjs
          git commit -m 'Fix authoritative owner access and transient auth recovery'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat --oneline --summary HEAD | tee /tmp/churvox-auth-commit-v4.txt

      - name: Post success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(-6000) : 'No output.';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## Product auth repair committed\n\nCommit: \`${{ steps.commit.outputs.sha }}\`\n\n### Contract\n\`\`\`text\n${read('/tmp/churvox-auth-contract-v4.txt')}\n\`\`\`\n\n### Commit\n\`\`\`text\n${read('/tmp/churvox-auth-commit-v4.txt')}\n\`\`\`` });

      - name: Post failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const paths = ['/tmp/churvox-auth-repair-v4.txt', '/tmp/churvox-auth-contract-v4.txt', '/tmp/churvox-auth-build-v4.txt', '/tmp/churvox-auth-commit-v4.txt'];
            const body = paths.map((path) => `### ${path}\n\`\`\`text\n${fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(-5000) : 'No output.'}\n\`\`\``).join('\n\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## Product auth repair V4 failed\n\n${body}` });
