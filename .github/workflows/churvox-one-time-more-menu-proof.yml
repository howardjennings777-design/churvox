name: Churvox One-Time More Menu Proof

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  prove-more-menu:
    if: startsWith(github.event.issue.title, '[churvox-more-menu-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Mark proof as started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Owner More-menu browser proof is running.'
            })

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --include=dev --legacy-peer-deps

      - name: Build production frontend
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start built frontend
        run: |
          npm start > /tmp/churvox-more-menu.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/churvox-more-menu.log
          exit 1

      - name: Run exact More-menu viewport proof
        id: proof
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          set -o pipefail
          npx playwright test tests/e2e/churvox-more-menu-paid-launch.spec.js \
            --project=desktop-chromium \
            --workers=1 \
            --reporter=line \
            --grep='desktop More menu is inside the viewport and its links open' \
            2>&1 | tee /tmp/churvox-more-menu-proof.txt

      - name: Post proof result
        if: always()
        uses: actions/github-script@v7
        env:
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/churvox-more-menu-proof.txt';
            let report = 'The browser proof output was not created.';
            if (fs.existsSync(path)) report = fs.readFileSync(path, 'utf8').slice(-16000);
            const outcome = process.env.PROOF_OUTCOME === 'success' ? 'PASSED' : 'FAILED';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## More-menu proof ${outcome}\n\n\`\`\`text\n${report}\n\`\`\``
            });

      - name: Fail workflow when proof failed
        if: steps.proof.outcome != 'success'
        run: exit 1
