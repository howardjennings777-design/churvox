name: Churvox New Backend Contract Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/churvox-new-backend-contract-diagnostic.yml'
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  new-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal backend dependencies
        run: python -m pip install --disable-pip-version-check fastapi==0.110.1 pymongo==4.5.0
      - name: Mongo-backed JWT contract
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p /tmp/churvox-new-contracts
          python -m unittest -v backend.test_churvox_runtime_jwt_secret_patch 2>&1 | tee /tmp/churvox-new-contracts/mongo-jwt.txt
      - name: Billing and deletion route mount contract
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest -v backend.test_churvox_paid_launch_route_mounts 2>&1 | tee /tmp/churvox-new-contracts/route-mounts.txt
      - name: Safe JWT fingerprint contract
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest -v backend.test_churvox_jwt_health_fingerprint_patch 2>&1 | tee /tmp/churvox-new-contracts/fingerprint.txt
      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churvox-new-backend-contract-diagnostics
          path: /tmp/churvox-new-contracts
          if-no-files-found: error
          retention-days: 7
      - name: Fail when any contract failed
        run: |
          grep -q '^OK$' /tmp/churvox-new-contracts/mongo-jwt.txt
          grep -q '^OK$' /tmp/churvox-new-contracts/route-mounts.txt
          grep -q '^OK$' /tmp/churvox-new-contracts/fingerprint.txt
