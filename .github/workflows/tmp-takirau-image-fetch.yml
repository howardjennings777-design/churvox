name: Temporary Takirau archive image fetch

on:
  push:
    branches: [tmp-takirau-image-fetch]
    paths:
      - '.github/workflows/tmp-takirau-image-fetch.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-takirau-image-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expose-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          ref: tmp-takirau-image-fetch

      - name: Verify stored photograph
        run: |
          file tmp/takirau/waitotara-1965.jpg
          ls -lh tmp/takirau/waitotara-1965.jpg
          cat tmp/takirau/selected-image.txt

      - name: Upload photograph
        id: aerial
        uses: actions/upload-artifact@v4
        with:
          name: waitotara-1965-aerial
          path: tmp/takirau/
          if-no-files-found: error
          retention-days: 1

      - name: Print artifact identifier
        run: |
          echo "ARTIFACT_ID=${{ steps.aerial.outputs.artifact-id }}"
          echo "ARTIFACT_URL=${{ steps.aerial.outputs.artifact-url }}"
