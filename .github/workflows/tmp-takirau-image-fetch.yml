name: Temporary Takirau archive image extraction

on:
  push:
    branches: [tmp-takirau-image-fetch]
    paths:
      - '.github/workflows/tmp-takirau-image-fetch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          ref: tmp-takirau-image-fetch

      - name: Split image into temporary text chunks
        run: |
          set -euo pipefail
          rm -rf tmp/takirau/base64-chunks
          mkdir -p tmp/takirau/base64-chunks
          base64 -w0 tmp/takirau/waitotara-1965.jpg > /tmp/waitotara.b64
          split -b 10000 -d -a 2 --additional-suffix=.txt /tmp/waitotara.b64 tmp/takirau/base64-chunks/chunk_
          wc -c /tmp/waitotara.b64 tmp/takirau/base64-chunks/*

      - name: Save chunks to isolated branch
        run: |
          set -euo pipefail
          git config user.name 'archive-image-fetcher'
          git config user.email 'archive-image-fetcher@users.noreply.github.com'
          git add tmp/takirau/base64-chunks
          git commit -m 'Temporarily split Waitotara aerial for extraction'
          git push origin HEAD:tmp-takirau-image-fetch
