name: Temporary Takirau archive image fetch

on:
  push:
    branches: [tmp-takirau-image-fetch]
    paths:
      - '.github/workflows/tmp-takirau-image-fetch.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-takirau-image-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expose-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve stored photograph
        run: |
          mkdir -p output
          curl -fsSL 'https://raw.githubusercontent.com/howardjennings777-design/churvox/tmp-takirau-image-fetch/tmp/takirau/waitotara-1965.jpg' -o output/waitotara-1965.jpg
          file output/waitotara-1965.jpg
          ls -lh output/waitotara-1965.jpg

      - name: Upload photograph
        id: aerial
        uses: actions/upload-artifact@v4
        with:
          name: waitotara-1965-aerial
          path: output/waitotara-1965.jpg
          if-no-files-found: error
          retention-days: 1

      - name: Print artifact identifier
        run: |
          echo "ARTIFACT_ID=${{ steps.aerial.outputs.artifact-id }}"
          echo "ARTIFACT_URL=${{ steps.aerial.outputs.artifact-url }}"
