name: Temporary Takirau archive image fetch

on:
  push:
    branches: [tmp-takirau-image-fetch]
    paths:
      - '.github/workflows/tmp-takirau-image-fetch.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-takirau-image-fetch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          ref: tmp-takirau-image-fetch

      - name: Fetch the 1965 Waitotara image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/takirau
          python - <<'PY'
          import html, json, mimetypes, pathlib, urllib.request
          from urllib.parse import urlparse

          ua = {'User-Agent': 'Mozilla/5.0 Churvox archive research', 'Accept': '*/*'}
          api = 'https://api.digitalnz.org/v3/records/22298931.json?fields=verbose'
          with urllib.request.urlopen(urllib.request.Request(api, headers=ua), timeout=60) as response:
              payload = json.load(response)
          record = payload.get('record', payload)
          pathlib.Path('tmp/takirau/digitalnz-record.json').write_text(json.dumps(record, indent=2))

          candidates = []
          for key in ('large_thumbnail_url', 'object_url', 'thumbnail_url', 'fulltext_url'):
              value = record.get(key)
              for candidate in value if isinstance(value, list) else [value]:
                  if candidate:
                      candidates.append((key, str(candidate)))

          failures = []
          for label, url in candidates:
              url = html.unescape(url)
              try:
                  headers = {'User-Agent': ua['User-Agent'], 'Accept': 'image/*,*/*;q=0.8'}
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=120) as response:
                      blob = response.read()
                      content_type = (response.headers.get_content_type() or '').lower()
                      final_url = response.geturl()
                  signature_ok = blob.startswith((b'\xff\xd8\xff', b'\x89PNG', b'II*\x00', b'MM\x00*', b'\x00\x00\x00\x0cjP  '))
                  if len(blob) < 1000 or ('image' not in content_type and not signature_ok):
                      raise RuntimeError(f'not an image: {len(blob)} bytes, {content_type}')
                  ext = mimetypes.guess_extension(content_type) or pathlib.Path(urlparse(final_url).path).suffix or '.jpg'
                  if ext in ('.jpe', '.jfif'):
                      ext = '.jpg'
                  output = pathlib.Path('tmp/takirau/waitotara-1965' + ext)
                  output.write_bytes(blob)
                  pathlib.Path('tmp/takirau/selected-image.txt').write_text(
                      f'{label}\n{url}\n{final_url}\n{content_type}\n{len(blob)}\n'
                  )
                  print('IMAGE_URL=' + url)
                  print('SAVED=' + str(output))
                  print('BYTES=' + str(len(blob)))
                  break
              except Exception as exc:
                  failures.append(f'{label}: {url}: {exc!r}')
          else:
              pathlib.Path('tmp/takirau/image-failures.txt').write_text('\n'.join(failures))
              raise SystemExit('No downloadable image candidate succeeded')
          PY
          file tmp/takirau/waitotara-1965* || true
          ls -lh tmp/takirau

      - name: Save image to isolated branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'archive-image-fetcher'
          git config user.email 'archive-image-fetcher@users.noreply.github.com'
          git add tmp/takirau
          if git diff --cached --quiet; then
            echo 'Image already stored.'
          else
            git commit -m 'Temporarily store 1965 Waitotara aerial image'
            git push origin HEAD:tmp-takirau-image-fetch
          fi

      - name: Upload fetched image
        uses: actions/upload-artifact@v4
        with:
          name: waitotara-1965-aerial
          path: tmp/takirau/
          if-no-files-found: error
          retention-days: 1
