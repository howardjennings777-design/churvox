name: Temporary Takirau archive image fetch

on:
  push:
    branches: [tmp-takirau-image-fetch]
    paths:
      - '.github/workflows/tmp-takirau-image-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch DigitalNZ metadata and image
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import mimetypes
          import pathlib
          import urllib.request
          from urllib.parse import urlparse

          record_url = 'https://api.digitalnz.org/records/22298931'
          req = urllib.request.Request(record_url, headers={'User-Agent': 'Mozilla/5.0 Churvox archive research'})
          with urllib.request.urlopen(req, timeout=60) as r:
              raw = r.read()
          pathlib.Path('digitalnz-record.json').write_bytes(raw)
          data = json.loads(raw)

          print(json.dumps(data, indent=2)[:20000])
          candidates = []
          for key in ('large_thumbnail_url', 'object_url', 'thumbnail_url'):
              value = data.get(key)
              if isinstance(value, list):
                  candidates.extend((key, str(v)) for v in value if v)
              elif value:
                  candidates.append((key, str(value)))

          source = data.get('source_url')
          if source:
              try:
                  req2 = urllib.request.Request(str(source), headers={'User-Agent': 'Mozilla/5.0 Churvox archive research'})
                  with urllib.request.urlopen(req2, timeout=60) as r:
                      source_raw = r.read()
                  pathlib.Path('digitalnz-source.json').write_bytes(source_raw)
                  source_data = json.loads(source_raw)
                  print('SOURCE:', json.dumps(source_data, indent=2)[:20000])
                  for key in ('large_thumbnail_url', 'object_url', 'thumbnail_url', 'fulltext_url'):
                      value = source_data.get(key)
                      if isinstance(value, list):
                          candidates.extend((f'source.{key}', str(v)) for v in value if v)
                      elif value:
                          candidates.append((f'source.{key}', str(value)))
              except Exception as exc:
                  print('Could not fetch source metadata:', repr(exc))

          seen = set()
          failures = []
          for label, url in candidates:
              if not url or url in seen:
                  continue
              seen.add(url)
              print('Trying', label, url)
              try:
                  req3 = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 Churvox archive research', 'Accept': 'image/*,*/*;q=0.8'})
                  with urllib.request.urlopen(req3, timeout=120) as r:
                      blob = r.read()
                      content_type = (r.headers.get_content_type() or '').lower()
                      final_url = r.geturl()
                  if len(blob) < 1000:
                      raise RuntimeError(f'response too small: {len(blob)} bytes')
                  if 'image' not in content_type and not blob.startswith((b'\xff\xd8\xff', b'\x89PNG', b'II*\x00', b'MM\x00*')):
                      raise RuntimeError(f'not an image: {content_type}, {blob[:80]!r}')
                  ext = mimetypes.guess_extension(content_type) or pathlib.Path(urlparse(final_url).path).suffix or '.jpg'
                  if ext == '.jpe':
                      ext = '.jpg'
                  out = pathlib.Path('waitotara-1965' + ext)
                  out.write_bytes(blob)
                  pathlib.Path('selected-image.txt').write_text(f'{label}\n{url}\n{final_url}\n{content_type}\n{len(blob)}\n')
                  print('Saved', out, len(blob), content_type, final_url)
                  break
              except Exception as exc:
                  failures.append(f'{label}: {url}: {exc!r}')
                  print('FAILED', failures[-1])
          else:
              pathlib.Path('image-failures.txt').write_text('\n'.join(failures))
              raise SystemExit('No downloadable image candidate succeeded')
          PY
          file waitotara-1965* || true
          ls -lh

      - name: Upload fetched image
        uses: actions/upload-artifact@v4
        with:
          name: waitotara-1965-aerial
          path: |
            waitotara-1965*
            selected-image.txt
            digitalnz-record.json
            digitalnz-source.json
          if-no-files-found: error
          retention-days: 1
