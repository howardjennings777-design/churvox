name: Churvox Tenant Isolation Security

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/churvox-tenant-isolation-security.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/churvox-tenant-isolation-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: churvox-tenant-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tenant-isolation:
    name: Cross-business, role and sharing isolation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install contract dependencies
        run: python -m pip install --disable-pip-version-check fastapi==0.110.1 pymongo==4.5.0

      - name: Compile security layers
        run: |
          python -m py_compile \
            backend/churvox_tenant_isolation_security_patch.py \
            backend/churvox_tenant_payment_isolation_patch.py \
            backend/churvox_role_and_share_isolation_patch.py \
            backend/churvox_security_final_tightening_patch.py \
            backend/churvox_terminal_reader_patch.py

      - name: Run tenant isolation attack contracts
        run: |
          python -m unittest -v \
            backend.test_churvox_tenant_isolation_security \
            backend.test_churvox_accounting_payment_tenant_isolation \
            backend.test_churvox_security_final_tightening

      - name: Reject known unsafe tenant patterns
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('backend/churvox_tenant_isolation_security_patch.py'),
              Path('backend/churvox_tenant_payment_isolation_patch.py'),
              Path('backend/churvox_role_and_share_isolation_patch.py'),
              Path('backend/churvox_security_final_tightening_patch.py'),
          ]
          text = '\n'.join(path.read_text(encoding='utf-8') for path in files)
          required = [
              'evil.onrender.com',
              'evil.vercel.app',
              'strict_business_scope',
              'secure_public_proof',
              'xero_state_recent',
              'first_existing_connected_account = lambda _stripe: ""',
              '/api/payments/on-site/status',
              'PUBLIC_PHOTO_KEYS',
          ]
          missing = [marker for marker in required if marker not in text and marker not in Path('backend/test_churvox_tenant_isolation_security.py').read_text(encoding='utf-8')]
          if missing:
              raise SystemExit(f'Missing tenant isolation proof markers: {missing}')
          print('Tenant isolation proof markers present.')
          PY
