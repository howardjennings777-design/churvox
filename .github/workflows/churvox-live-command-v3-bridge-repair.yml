name: Churvox Live Command V3 Bridge Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-live-command-v3]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check fastapi==0.110.1 pymongo==4.5.0 pytest

      - name: Apply live v3 bridge repair
        run: python scripts/churvox-live-command-v3-bridge-repair.py

      - name: Compile, contract and mimic gate
        shell: bash
        run: |
          set -o pipefail
          {
            python -m py_compile \
              backend/churvox_paid_launch_live_patch.py \
              backend/server/__init__.py \
              backend/churvox_command_human_mimic_v3_routes.py
            node scripts/churvox-live-command-v3-bridge-contract.cjs
            python scripts/churvox_mimic_full_test.py
            pytest -q backend/test_churvox_command_fast_load_patch.py
          } 2>&1 | tee /tmp/churvox-live-command-v3.txt

      - name: Commit verified v3 bridge
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add backend/churvox_paid_launch_live_patch.py backend/server/__init__.py
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Mount strict human mimic v3 on live Command scan'
          git reset --hard HEAD
          git clean -fdx
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ job.status }}' === 'success';
            const sha = '${{ steps.publish.outputs.sha }}' || 'not published';
            const output = fs.existsSync('/tmp/churvox-live-command-v3.txt') ? fs.readFileSync('/tmp/churvox-live-command-v3.txt', 'utf8').slice(-8000) : 'No output.';
            const body = ok
              ? `## Live strict Command v3 bridge passed\n\nThe live fast scan now uses strict human mimic v3 with all eight roles, evidence preflight, incomplete-scan reporting and unchanged owner safety.\n\nCommit: \`${sha}\`\n\n\`\`\`text\n${output}\n\`\`\``
              : `## Live strict Command v3 bridge failed safely\n\nNo unverified scanner change was published.\n\n\`\`\`text\n${output}\n\`\`\`\n\nWorkflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
