name: Churvox Full Launch Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/tests/e2e/**'
      - 'frontend/playwright.config.js'
      - 'scripts/churvox-discover-linked-worker.cjs'
      - '.github/workflows/churvox-full-launch-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/tests/e2e/**'
      - 'frontend/playwright.config.js'
      - 'scripts/churvox-discover-linked-worker.cjs'
      - '.github/workflows/churvox-full-launch-audit.yml'

permissions:
  contents: read

concurrency:
  group: churvox-full-launch-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_API_BASE: https://grassley-backend.onrender.com
      CHURVOX_OWNER_EMAIL: howardjennings777@gmail.com
      CHURVOX_OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}
      CHURVOX_WORKER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify private owner credential
        run: |
          test -n "$CHURVOX_OWNER_PASSWORD"
          echo "Owner credential is configured and remains masked."

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --legacy-peer-deps

      - name: Compile current Studio tests and production frontend
        working-directory: frontend
        run: |
          node --check tests/e2e/churvox-studio-live-pages.spec.js
          npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Discover linked worker login
        run: node scripts/churvox-discover-linked-worker.cjs

      - name: Start branch application
        working-directory: frontend
        run: |
          setsid npm start </dev/null > /tmp/churvox-full-launch-local.log 2>&1 &
          for i in {1..90}; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)
            if [[ "$status" =~ ^[234] ]]; then
              echo "Branch application ready with HTTP $status"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/churvox-full-launch-local.log
          exit 1

      - name: Run current public, owner, worker and role audit
        working-directory: frontend
        run: |
          npx playwright test tests/e2e/churvox-studio-live-pages.spec.js \
            --project=desktop-chromium \
            --project=mobile-chromium \
            --workers=1 \
            --reporter=line

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churvox-full-launch-audit-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churvox-full-launch-audit-results
          path: |
            /tmp/churvox-full-launch-local.log
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
