name: Churvox Full Launch Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/tests/e2e/**'
      - 'frontend/playwright.config.js'
      - '.github/workflows/churvox-full-launch-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/tests/e2e/**'
      - 'frontend/playwright.config.js'
      - '.github/workflows/churvox-full-launch-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_BASE_URL: https://www.churvox.com
      PLAYWRIGHT_API_BASE: https://grassley-backend.onrender.com
      CHURVOX_OWNER_EMAIL: howardjennings777@gmail.com
      CHURVOX_OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}
      CHURVOX_WORKER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify private owner credential
        id: credential
        continue-on-error: true
        run: |
          if [ -z "$CHURVOX_OWNER_PASSWORD" ]; then
            echo "::error::CHURVOX_OWNER_PASSWORD repository secret is missing."
            exit 1
          fi
          echo "Owner credential is configured and remains masked."

      - name: Discover linked worker login
        id: worker
        if: steps.credential.outcome == 'success'
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs = require('fs');
          const api = process.env.PLAYWRIGHT_API_BASE.replace(/\/+$/, '');
          const ownerEmail = process.env.CHURVOX_OWNER_EMAIL;
          const password = process.env.CHURVOX_OWNER_PASSWORD;

          function tokenFrom(body = {}) {
            return body.token || body.access_token || body.auth_token || body.jwt || body.accessToken
              || body.user?.token || body.user?.access_token || body.data?.token || body.data?.access_token || body.data?.user?.token || '';
          }
          function rowsFrom(payload) {
            const data = payload?.data?.data ?? payload?.data ?? payload;
            if (Array.isArray(data)) return data;
            for (const key of ['workers', 'team', 'members', 'items', 'records', 'results', 'data']) {
              if (Array.isArray(data?.[key])) return data[key];
            }
            return [];
          }
          function emailOf(row = {}) {
            return String(row.email || row.worker_email || row.user_email || row.login_email || '').trim().toLowerCase();
          }
          function active(row = {}) {
            const status = String(row.status || row.worker_status || '').toLowerCase();
            return row.active !== false && row.is_active !== false && !/inactive|deleted|archived|disabled/.test(status);
          }
          async function request(path, options = {}) {
            const response = await fetch(`${api}${path}`, {
              headers: { Accept: 'application/json', 'Content-Type': 'application/json', ...(options.headers || {}) },
              ...options,
            });
            const text = await response.text();
            let body = {};
            try { body = JSON.parse(text); } catch { body = { text: text.slice(0, 300) }; }
            return { response, body };
          }
          async function login(path, email) {
            const { response, body } = await request(path, {
              method: 'POST',
              body: JSON.stringify({ email, password }),
            });
            return { ok: response.ok && body?.success !== false && Boolean(tokenFrom(body)), body, status: response.status };
          }
          async function main() {
            const ownerLogin = await login('/api/auth/login', ownerEmail);
            if (!ownerLogin.ok) throw new Error(`Owner login failed during worker discovery with HTTP ${ownerLogin.status}.`);
            const token = tokenFrom(ownerLogin.body);
            const candidates = [];
            for (const endpoint of ['/api/team/workers', '/api/team', '/api/workers']) {
              const { response, body } = await request(`${endpoint}?ts=${Date.now()}`, {
                headers: { Authorization: `Bearer ${token}` },
              });
              if (!response.ok) continue;
              for (const row of rowsFrom(body)) {
                const email = emailOf(row);
                if (!email || email === ownerEmail.toLowerCase() || !active(row)) continue;
                if (!candidates.includes(email)) candidates.push(email);
              }
            }
            if (!candidates.length) throw new Error('No active linked worker was found in the owner team endpoints.');

            let selected = '';
            const attempts = [];
            for (const email of candidates.slice(0, 8)) {
              let result = await login('/api/auth/login', email);
              if (!result.ok) result = await login('/api/worker/auth/login', email);
              attempts.push(`${email}:${result.status}`);
              if (result.ok) {
                selected = email;
                break;
              }
            }
            if (!selected) throw new Error(`No linked worker accepted the shared password. Attempts: ${attempts.join(', ')}`);
            console.log(`::add-mask::${selected}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `CHURVOX_WORKER_EMAIL=${selected}\n`);
            console.log('A linked active worker was discovered and its email was masked.');
          }
          main().catch((error) => {
            console.error(error.message || error);
            process.exit(1);
          });
          NODE

      - name: Run public and authenticated app launch audit
        id: run_audit
        if: steps.credential.outcome == 'success' && steps.worker.outcome == 'success'
        env:
          CHURVOX_REQUIRE_AUTH_AUDIT: '1'
          CI: true
        run: |
          set +e
          npx playwright test tests/e2e/churvox-big-launch-audit.spec.js --project=desktop-chromium --project=mobile-chromium 2>&1 | tee ../churvox-audit-output.txt
          status=${PIPESTATUS[0]}
          skipped=$(grep -Eo '[0-9]+ skipped' ../churvox-audit-output.txt | tail -n 1 | awk '{print $1}')
          passed=$(grep -Eo '[0-9]+ passed' ../churvox-audit-output.txt | tail -n 1 | awk '{print $1}')
          skipped=${skipped:-0}
          passed=${passed:-0}
          if [ "$skipped" != "0" ]; then
            echo "::error::Authenticated launch audit is incomplete: $skipped tests were skipped."
            status=1
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Clean full launch worker audit jobs
        id: cleanup
        if: always() && steps.credential.outcome == 'success'
        continue-on-error: true
        run: |
          node <<'NODE'
          const api = process.env.PLAYWRIGHT_API_BASE.replace(/\/+$/, '');
          const email = process.env.CHURVOX_OWNER_EMAIL;
          const password = process.env.CHURVOX_OWNER_PASSWORD;
          const marker = 'full launch worker detail ';

          function tokenFrom(body = {}) {
            return body.token || body.access_token || body.auth_token || body.jwt || body.accessToken
              || body.user?.token || body.user?.access_token || body.data?.token || body.data?.access_token || body.data?.user?.token || '';
          }
          function rowsFrom(payload) {
            const data = payload?.data?.data ?? payload?.data ?? payload;
            if (Array.isArray(data)) return data;
            for (const key of ['jobs', 'items', 'records', 'results', 'data']) {
              if (Array.isArray(data?.[key])) return data[key];
            }
            return [];
          }
          function idOf(row = {}) {
            const raw = row.id || row._id || row.job_id || row.$oid || row.oid || '';
            if (raw && typeof raw === 'object') return String(raw.$oid || raw.oid || raw.id || '');
            return String(raw || '');
          }
          async function request(path, options = {}) {
            const response = await fetch(`${api}${path}`, {
              headers: { Accept: 'application/json', 'Content-Type': 'application/json', ...(options.headers || {}) },
              ...options,
            });
            const text = await response.text();
            let body = {};
            try { body = JSON.parse(text); } catch { body = { text: text.slice(0, 300) }; }
            return { response, body };
          }
          async function main() {
            const login = await request('/api/auth/login', {
              method: 'POST',
              body: JSON.stringify({ email, password }),
            });
            const token = tokenFrom(login.body);
            if (!login.response.ok || !token) throw new Error(`Owner login failed during audit cleanup with HTTP ${login.response.status}.`);
            const headers = { Authorization: `Bearer ${token}` };
            const listed = await request(`/api/jobs?limit=500&ts=${Date.now()}`, { headers });
            if (!listed.response.ok) throw new Error(`Could not list jobs for audit cleanup: HTTP ${listed.response.status}.`);
            const matches = rowsFrom(listed.body).filter((row) => JSON.stringify(row || {}).toLowerCase().includes(marker));
            const failures = [];
            for (const row of matches) {
              const id = idOf(row);
              if (!id) {
                failures.push('missing job id');
                continue;
              }
              const archived = await request(`/api/jobs/${encodeURIComponent(id)}/archive`, {
                method: 'POST',
                headers,
                body: JSON.stringify({ archived: true, archive_reason: 'full launch audit cleanup' }),
              });
              const deleted = await request(`/api/jobs/${encodeURIComponent(id)}`, {
                method: 'DELETE',
                headers,
              });
              const cleaned = archived.response.ok || archived.response.status === 404 || deleted.response.ok || deleted.response.status === 404;
              if (!cleaned) failures.push(`${id}:archive=${archived.response.status},delete=${deleted.response.status}`);
            }
            console.log(`Full launch audit cleanup processed ${matches.length} marked jobs.`);
            if (failures.length) throw new Error(`Audit cleanup failures: ${failures.join('; ')}`);
          }
          main().catch((error) => {
            console.error(error.message || error);
            process.exit(1);
          });
          NODE

      - name: Save readable audit result into repo
        if: always()
        run: |
          mkdir -p ../audit-results
          status="${{ steps.run_audit.outputs.status }}"
          passed="${{ steps.run_audit.outputs.passed }}"
          skipped="${{ steps.run_audit.outputs.skipped }}"
          status=${status:-1}
          passed=${passed:-0}
          skipped=${skipped:-0}
          {
            echo "# Churvox Full Launch Audit"
            echo ""
            echo "- Site: https://www.churvox.com"
            echo "- Commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Status code: $status"
            echo "- Passed: $passed"
            echo "- Skipped: $skipped"
            echo "- Owner credential: ${{ steps.credential.outcome }}"
            echo "- Linked worker discovery: ${{ steps.worker.outcome }}"
            echo "- Audit fixture cleanup: ${{ steps.cleanup.outcome }}"
            echo "- Authenticated audit required: yes"
            echo "- Time: $(date -u)"
            echo ""
            echo "## Output"
            echo '```txt'
            tail -n 240 ../churvox-audit-output.txt || true
            echo '```'
          } > ../audit-results/churvox-full-launch-audit-latest.md

      - name: Commit readable audit result
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd ..
          git config user.name "github-actions"
          git config user.email "hello@churvox.com"
          git add audit-results/churvox-full-launch-audit-latest.md
          if git diff --cached --quiet; then
            echo "No audit result changes to commit"
          else
            git commit -m "Save Churvox full launch audit result"
            git push
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churvox-full-launch-audit-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churvox-full-launch-audit-results
          path: frontend/test-results
          if-no-files-found: ignore

      - name: Fail job if audit is incomplete or failed
        if: always()
        run: |
          test "${{ steps.credential.outcome }}" = success || exit 1
          test "${{ steps.worker.outcome }}" = success || exit 1
          test "${{ steps.cleanup.outcome }}" = success || exit 1
          test "${{ steps.run_audit.outputs.status }}" = 0 || exit 1
          test "${{ steps.run_audit.outputs.skipped }}" = 0 || exit 1
