name: Churvox Full Launch Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/tests/e2e/**'
      - 'frontend/playwright.config.js'
      - '.github/workflows/churvox-full-launch-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/tests/e2e/**'
      - 'frontend/playwright.config.js'
      - '.github/workflows/churvox-full-launch-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify authenticated audit credentials
        env:
          CHURVOX_OWNER_EMAIL: ${{ secrets.CHURVOX_OWNER_EMAIL }}
          CHURVOX_OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}
          CHURVOX_WORKER_EMAIL: ${{ secrets.CHURVOX_WORKER_EMAIL }}
          CHURVOX_WORKER_PASSWORD: ${{ secrets.CHURVOX_WORKER_PASSWORD }}
        run: |
          missing=()
          for name in CHURVOX_OWNER_EMAIL CHURVOX_OWNER_PASSWORD CHURVOX_WORKER_EMAIL CHURVOX_WORKER_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name") ; fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Full launch audit cannot be honest because these repository secrets are missing: ${missing[*]}"
            exit 1
          fi
          echo "Owner and worker audit credentials are configured and remain masked."

      - name: Run public and authenticated app launch audit
        id: run_audit
        env:
          PLAYWRIGHT_BASE_URL: https://www.churvox.com
          CHURVOX_OWNER_EMAIL: ${{ secrets.CHURVOX_OWNER_EMAIL }}
          CHURVOX_OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}
          CHURVOX_WORKER_EMAIL: ${{ secrets.CHURVOX_WORKER_EMAIL }}
          CHURVOX_WORKER_PASSWORD: ${{ secrets.CHURVOX_WORKER_PASSWORD }}
          CHURVOX_REQUIRE_AUTH_AUDIT: '1'
          CI: true
        run: |
          set +e
          npx playwright test tests/e2e/churvox-big-launch-audit.spec.js --project=desktop-chromium --project=mobile-chromium 2>&1 | tee ../churvox-audit-output.txt
          status=${PIPESTATUS[0]}
          skipped=$(grep -Eo '[0-9]+ skipped' ../churvox-audit-output.txt | tail -n 1 | awk '{print $1}')
          passed=$(grep -Eo '[0-9]+ passed' ../churvox-audit-output.txt | tail -n 1 | awk '{print $1}')
          skipped=${skipped:-0}
          passed=${passed:-0}
          if [ "$skipped" != "0" ]; then
            echo "::error::Authenticated launch audit is incomplete: $skipped tests were skipped."
            status=1
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save readable audit result into repo
        if: always()
        run: |
          mkdir -p ../audit-results
          {
            echo "# Churvox Full Launch Audit"
            echo ""
            echo "- Site: https://www.churvox.com"
            echo "- Commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Status code: ${{ steps.run_audit.outputs.status }}"
            echo "- Passed: ${{ steps.run_audit.outputs.passed }}"
            echo "- Skipped: ${{ steps.run_audit.outputs.skipped }}"
            echo "- Authenticated audit required: yes"
            echo "- Time: $(date -u)"
            echo ""
            echo "## Output"
            echo '```txt'
            tail -n 240 ../churvox-audit-output.txt || true
            echo '```'
          } > ../audit-results/churvox-full-launch-audit-latest.md

      - name: Commit readable audit result
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd ..
          git config user.name "github-actions"
          git config user.email "hello@churvox.com"
          git add audit-results/churvox-full-launch-audit-latest.md
          if git diff --cached --quiet; then
            echo "No audit result changes to commit"
          else
            git commit -m "Save Churvox full launch audit result"
            git push
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churvox-full-launch-audit-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churvox-full-launch-audit-results
          path: frontend/test-results
          if-no-files-found: ignore

      - name: Fail job if audit is incomplete or failed
        if: always()
        run: |
          if [ "${{ steps.run_audit.outputs.status }}" != "0" ]; then
            exit 1
          fi
          if [ "${{ steps.run_audit.outputs.skipped }}" != "0" ]; then
            exit 1
          fi
