name: Churvox Command Instant Load Live Proof

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  proof:
    if: startsWith(github.event.issue.title, '[churvox-command-instant-load-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLAYWRIGHT_BASE_URL: https://www.churvox.com
      PLAYWRIGHT_API_BASE: https://grassley-backend.onrender.com
      CHURVOX_OWNER_EMAIL: howardjennings777@gmail.com
      CHURVOX_OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wait for exact Command instant-load bundle
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const site = 'https://www.churvox.com';
          const marker = 'churvox-command-instant-load-20260713d';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function inspect() {
            const manifestResponse = await fetch(`${site}/asset-manifest.json?ts=${Date.now()}`, { cache: 'no-store' });
            if (!manifestResponse.ok) throw new Error(`manifest ${manifestResponse.status}`);
            const manifest = await manifestResponse.json();
            const assets = [...new Set(Object.values(manifest.files || {}).filter((value) => typeof value === 'string' && /\.js(?:$|\?)/.test(value)))];
            for (const asset of assets) {
              const response = await fetch(new URL(asset, site), { cache: 'no-store' });
              if (!response.ok) continue;
              const text = await response.text();
              if (text.includes(marker)) return { asset, count: assets.length };
            }
            throw new Error(`marker missing across ${assets.length} JS assets`);
          }
          (async () => {
            let last = '';
            for (let attempt = 1; attempt <= 90; attempt += 1) {
              try {
                const result = await inspect();
                console.log(`Attempt ${attempt}: ${result.asset} contains exact marker; inspected ${result.count} assets.`);
                console.log('COMMAND_INSTANT_LOAD_BUNDLE_LIVE');
                return;
              } catch (error) {
                last = error.message || String(error);
                console.log(`Attempt ${attempt}: ${last}`);
              }
              if (attempt < 90) await sleep(10_000);
            }
            throw new Error(`Exact Command instant-load bundle did not deploy: ${last}`);
          })().catch((error) => { console.error(error.stack || error.message || error); process.exit(1); });
          NODE

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --legacy-peer-deps

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Prove live first and repeat Command load speed
        working-directory: frontend
        run: |
          npx playwright test tests/e2e/churvox-command-instant-load-live.spec.js \
            --project=desktop-chromium \
            --workers=1 \
            --retries=0 \
            --reporter=line

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const body = ok
              ? '## Live Command speed proof passed\n\nThe exact instant-load bundle is deployed. The first Command queue resolved inside the foreground budget, repeat-open used the confirmed queue cache, and no protected/server errors occurred.'
              : `## Live Command speed proof failed\n\nThe exact deployed bundle or real browser speed test failed. Workflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
