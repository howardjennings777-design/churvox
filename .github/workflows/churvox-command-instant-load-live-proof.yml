name: Churvox Command Instant Load Live Proof

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  proof:
    if: startsWith(github.event.issue.title, '[churvox-command-instant-load-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLAYWRIGHT_BASE_URL: https://www.churvox.com
      PLAYWRIGHT_API_BASE: https://grassley-backend.onrender.com
      CHURVOX_OWNER_EMAIL: howardjennings777@gmail.com
      CHURVOX_OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wait for exact Command frontend and backend speed deployment
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const site = 'https://www.churvox.com';
          const api = 'https://grassley-backend.onrender.com';
          const frontendMarker = 'churvox-command-instant-load-20260713d';
          const acceptedBackendVersions = new Set([
            'churvox-command-queue-speed-boot-20260713e',
            'churvox-command-queue-speed-server-wrapper-20260713f',
          ]);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function inspect() {
            const manifestResponse = await fetch(`${site}/asset-manifest.json?ts=${Date.now()}`, { cache: 'no-store' });
            if (!manifestResponse.ok) throw new Error(`manifest ${manifestResponse.status}`);
            const manifest = await manifestResponse.json();
            const assets = [...new Set(Object.values(manifest.files || {}).filter((value) => typeof value === 'string' && /\.js(?:$|\?)/.test(value)))];
            let frontendAsset = '';
            for (const asset of assets) {
              const response = await fetch(new URL(asset, site), { cache: 'no-store' });
              if (!response.ok) continue;
              const text = await response.text();
              if (text.includes(frontendMarker)) { frontendAsset = asset; break; }
            }
            if (!frontendAsset) throw new Error(`frontend marker missing across ${assets.length} JS assets`);

            const bootResponse = await fetch(`${api}/api/command-fast-load/boot?ts=${Date.now()}`, { cache: 'no-store' });
            if (!bootResponse.ok) throw new Error(`backend boot ${bootResponse.status}`);
            const boot = await bootResponse.json();
            const slipOwners = boot.route_owners?.['/api/command/slips'] || [];
            const scanOwners = boot.route_owners?.['/api/command/scan'] || [];
            const ownsQueue = slipOwners.some((value) => String(value).endsWith(':fast_slips'));
            const ownsScan = scanOwners.some((value) => String(value).endsWith(':fast_scan'));
            if (!acceptedBackendVersions.has(boot.version) || boot.patch_installed !== true || boot.patch_stage !== 'ready' || !ownsQueue || !ownsScan) {
              throw new Error(`backend not exact: version=${boot.version} installed=${boot.patch_installed} stage=${boot.patch_stage} slips=${JSON.stringify(slipOwners)} scan=${JSON.stringify(scanOwners)}`);
            }
            return { frontendAsset, assetCount: assets.length, backendVersion: boot.version };
          }
          (async () => {
            let last = '';
            for (let attempt = 1; attempt <= 90; attempt += 1) {
              try {
                const result = await inspect();
                console.log(`Attempt ${attempt}: ${result.frontendAsset} contains the frontend marker; backend=${result.backendVersion}.`);
                console.log('COMMAND_INSTANT_LOAD_FRONTEND_BACKEND_LIVE');
                return;
              } catch (error) {
                last = error.message || String(error);
                console.log(`Attempt ${attempt}: ${last}`);
              }
              if (attempt < 90) await sleep(10_000);
            }
            throw new Error(`Exact Command speed deployment did not become live: ${last}`);
          })().catch((error) => { console.error(error.stack || error.message || error); process.exit(1); });
          NODE

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --legacy-peer-deps

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Prove live first and repeat Command load speed
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/e2e/churvox-command-instant-load-live.spec.js \
            --project=desktop-chromium \
            --workers=1 \
            --retries=0 \
            --reporter=line 2>&1 | tee /tmp/churvox-command-speed-live.txt

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ job.status }}' === 'success';
            const output = fs.existsSync('/tmp/churvox-command-speed-live.txt')
              ? fs.readFileSync('/tmp/churvox-command-speed-live.txt', 'utf8').slice(-7000)
              : 'No browser timing output was produced.';
            const body = ok
              ? `## Live Command speed proof passed\n\nThe exact frontend and backend speed repairs are deployed. The foreground queue and cached SPA repeat-open both met their speed budgets, with no protected/server errors.\n\n\`\`\`text\n${output}\n\`\`\``
              : `## Live Command speed proof failed\n\nThe exact deployment or browser timing/safety assertion failed.\n\n\`\`\`text\n${output}\n\`\`\`\n\nWorkflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
