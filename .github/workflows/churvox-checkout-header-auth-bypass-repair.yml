name: Churvox Checkout Header Auth Bypass Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-checkout-header-auth-bypass]')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply checkout stream repair
        run: python scripts/churvox-checkout-header-auth-bypass-apply.py

      - name: Compile, contract and stream behavior gate
        shell: bash
        run: |
          set -o pipefail
          {
            python -m py_compile backend/churvox_checkout_token_session_guard.py
            node scripts/churvox-checkout-header-auth-bypass-contract.cjs
            python scripts/churvox_checkout_header_auth_bypass_test.py
            node scripts/churvox-paid-launch-billing-final-contract.cjs
            python scripts/churvox_paid_launch_billing_final_test.py
          } 2>&1 | tee /tmp/churvox-checkout-header-auth-bypass.txt

      - name: Commit verified middleware repair
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add backend/churvox_checkout_token_session_guard.py
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep authenticated checkout request bodies intact'
          git reset --hard HEAD
          git clean -fdx
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ job.status }}' === 'success';
            const sha = '${{ steps.publish.outputs.sha }}' || 'not published';
            const output = fs.existsSync('/tmp/churvox-checkout-header-auth-bypass.txt') ? fs.readFileSync('/tmp/churvox-checkout-header-auth-bypass.txt', 'utf8').slice(-8000) : 'No gate output.';
            const body = ok
              ? `## Checkout body replay repair passed\n\nHeader/cookie-authenticated billing requests now reach the final Stripe route without middleware consuming the JSON body. Downstream auth and revocation checks remain active.\n\nCommit: \`${sha}\`\n\n\`\`\`text\n${output}\n\`\`\``
              : `## Checkout body replay repair failed safely\n\nNo unverified middleware change was published.\n\n\`\`\`text\n${output}\n\`\`\`\n\nWorkflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
