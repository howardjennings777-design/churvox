name: Churvox Final Worker Route Repair 2 Status

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[churvox-final-worker-route-repair-2-status]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read latest corrected repair run
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow churvox-final-worker-route-repair-2.yml --limit 10 --json databaseId,displayTitle --jq '[.[] | select(.displayTitle | startswith("[churvox-final-worker-route-repair-2]"))][0].databaseId')"
          test -n "$run_id"
          {
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,jobs --jq '{run: .databaseId, status, conclusion, jobs: [.jobs[] | {name, status, conclusion, active: [.steps[] | select(.status == "in_progress") | .name], failed: [.steps[] | select(.conclusion == "failure") | .name]}]}'
            if gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq '.status' | grep -q completed; then
              echo '--- failed log tail ---'
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -n 140 || true
            fi
          } > /tmp/worker-route-repair-2-status.txt

      - name: Post status
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('/tmp/worker-route-repair-2-status.txt', 'utf8');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## Corrected worker-route repair status\n\n\`\`\`text\n${text}\n\`\`\`` });
