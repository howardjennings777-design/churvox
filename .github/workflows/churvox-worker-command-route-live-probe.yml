name: Churvox Worker Command Route Live Probe

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[churvox-worker-command-route-live-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for exact repaired routes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/worker-command-live-probe.txt 2>&1
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const site = 'https://www.churvox.com';
          const api = 'https://grassley-backend.onrender.com';

          async function frontend() {
            const manifestResponse = await fetch(`${site}/asset-manifest.json?ts=${Date.now()}`, { cache: 'no-store' });
            if (!manifestResponse.ok) return { ok: false, detail: `manifest ${manifestResponse.status}` };
            const manifest = await manifestResponse.json();
            const mainPath = manifest.files?.['main.js'] || manifest.entrypoints?.find((item) => /main\..*\.js$/.test(item));
            if (!mainPath) return { ok: false, detail: 'main bundle missing' };
            const text = await (await fetch(new URL(mainPath, site), { cache: 'no-store' })).text();
            const fingerprint = text.includes('churvox-auth-session-authority-20260713d');
            return { ok: fingerprint, detail: `${mainPath} repaired-fingerprint=${fingerprint ? 'LIVE' : 'MISSING'}` };
          }

          async function route(path, method = 'GET') {
            const response = await fetch(`${api}${path}?ts=${Date.now()}`, {
              method,
              headers: { Accept: 'application/json', ...(method === 'POST' ? { 'Content-Type': 'application/json' } : {}) },
              body: method === 'POST' ? JSON.stringify({ title: 'signed-out route existence probe' }) : undefined,
              cache: 'no-store',
            });
            const body = await response.text();
            return { status: response.status, body: body.slice(0, 120) };
          }

          async function backend() {
            const createHealth = await route('/api/command/create-route-health');
            const commandPost = await route('/api/command/slips', 'POST');
            const workerAction = await route('/api/worker/jobs/probe-id/acknowledge', 'POST');
            const protectedStatus = (value) => value.status === 401 || value.status === 403;
            return {
              ok: protectedStatus(createHealth) && protectedStatus(commandPost) && protectedStatus(workerAction),
              detail: `create-health=${createHealth.status}; command-post=${commandPost.status}; worker-action=${workerAction.status}`,
            };
          }

          async function main() {
            let last = '';
            for (let attempt = 1; attempt <= 75; attempt += 1) {
              try {
                const [front, back] = await Promise.all([frontend(), backend()]);
                last = `${front.detail}; ${back.detail}`;
                console.log(`Attempt ${attempt}: ${last}`);
                if (front.ok && back.ok) {
                  console.log('WORKER_COMMAND_ROUTE_REPAIR_LIVE');
                  return;
                }
              } catch (error) {
                last = error.message || String(error);
                console.log(`Attempt ${attempt}: ${last}`);
              }
              if (attempt < 75) await sleep(10_000);
            }
            throw new Error(`Worker/Command repair did not deploy: ${last}`);
          }

          main().catch((error) => { console.error(error.message || error); process.exit(1); });
          NODE

      - name: Post success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('/tmp/worker-command-live-probe.txt', 'utf8');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## Worker and Command route repair is live\n\n\`\`\`text\n${text}\n\`\`\`` });

      - name: Post failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.existsSync('/tmp/worker-command-live-probe.txt') ? fs.readFileSync('/tmp/worker-command-live-probe.txt', 'utf8') : 'No probe output.';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## Worker and Command route deployment probe failed\n\n\`\`\`text\n${text}\n\`\`\`` });
