name: Churvox Playwright Full Site Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Live site URL to test"
        required: false
        default: "https://www.churvox.com"
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  playwright:
    name: Playwright public site and authenticated launch audit
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: frontend

    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url || vars.PLAYWRIGHT_BASE_URL || 'https://www.churvox.com' }}
      E2E_EMAIL: ${{ secrets.CHURVOX_E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.CHURVOX_E2E_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: CI=false npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait briefly for live deploy to settle
        if: github.event_name == 'push'
        run: sleep 90

      - name: Run public desktop and mobile site contracts
        run: |
          npx playwright test \
            tests/e2e/churvox-public-honesty-and-function.spec.js \
            --project=desktop-chromium \
            --project=mobile-chromium \
            --workers=1 \
            --reporter=line

      - name: Run authenticated desktop and mobile launch contracts
        if: env.E2E_EMAIL != '' && env.E2E_PASSWORD != ''
        run: |
          npx playwright test \
            tests/e2e/deep-launch-audit.spec.js \
            --project=desktop-chromium \
            --project=mobile-chromium \
            --workers=1 \
            --reporter=line

      - name: Report missing authenticated test credentials
        if: env.E2E_EMAIL == '' || env.E2E_PASSWORD == ''
        run: |
          echo "Authenticated full-site coverage was not run because CHURVOX_E2E_EMAIL and CHURVOX_E2E_PASSWORD are not configured."
          echo "Public desktop and mobile contracts still ran and must pass."

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
