# clean-audit-marker: 2026-07-26-whole-site
name: Churvox Playwright Full Site Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Live site URL to test"
        required: false
        default: "https://www.churvox.com"
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # The live Render backend is limited to 512 MB. Queue all heavy live suites
  # globally so browser tests cannot overload the customer service in parallel.
  group: churvox-live-backend-tests
  cancel-in-progress: false

jobs:
  playwright:
    name: Clean full UI, public site and authenticated launch audit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: frontend

    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url || vars.PLAYWRIGHT_BASE_URL || 'https://www.churvox.com' }}
      PLAYWRIGHT_API_BASE: ${{ vars.PLAYWRIGHT_API_BASE || 'https://grassley-backend.onrender.com' }}
      E2E_EMAIL: ${{ secrets.CHURVOX_E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.CHURVOX_E2E_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove generated frontend files
        run: |
          rm -rf node_modules build playwright-report test-results .cache coverage
          npm cache clean --force

      - name: Install frontend dependencies from lockfile
        run: npm ci --legacy-peer-deps

      - name: Audit active Fresh Studio, worker, Plans, HQ and public wiring
        run: |
          set -o pipefail
          node ../scripts/churvox-active-surface-wiring-audit.cjs 2>&1 | tee ../churvox-active-wiring-output.txt

      - name: Build production frontend
        run: npm run build

      - name: Start exact production server and repair route pages
        run: |
          PORT=3000 node scripts/start-production.cjs > ../churvox-full-site-server.log 2>&1 &
          echo $! > ../churvox-full-site-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              echo "Production frontend is ready."
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/product | grep -F "Churvox product | Job admin prepared for owner approval"
          curl --fail --silent http://127.0.0.1:3000/pricing | grep -F "Churvox pricing | Start, Crew, Operator and Command plans"
          curl --fail --silent http://127.0.0.1:3000/demo | grep -F "Churvox demo | See an owner-controlled job workflow"
          curl --fail --silent http://127.0.0.1:3000/login | grep -F 'content="noindex,nofollow,noarchive"'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run current desktop and mobile UI suite
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_SKIP_WEB_SERVER: '1'
        run: |
          npx playwright test \
            tests/e2e/churvox-full-ui-logic-buttons.spec.js \
            tests/e2e/churvox-public-honesty-and-function.spec.js \
            tests/e2e/churvox-public-search-foundation.spec.js \
            tests/e2e/churvox-owner-no-fake-data.spec.js \
            tests/e2e/churvox-paid-launch-hq-reality.spec.js \
            tests/e2e/churvox-studio-visual.spec.js \
            --project=desktop-chromium \
            --project=mobile-chromium \
            --workers=1 \
            --reporter=line

      - name: Wait briefly for live deploy to settle
        if: github.event_name == 'push'
        run: sleep 90

      - name: Verify live Job Done deployment fingerprints
        if: github.event_name != 'pull_request'
        run: node ../scripts/churvox-live-job-done-deploy.cjs

      - name: Run live public desktop and mobile contracts
        if: github.event_name != 'pull_request'
        env:
          PLAYWRIGHT_SKIP_WEB_SERVER: '1'
        run: |
          npx playwright test \
            tests/e2e/churvox-public-honesty-and-function.spec.js \
            tests/e2e/churvox-public-search-foundation.spec.js \
            --project=desktop-chromium \
            --project=mobile-chromium \
            --workers=1 \
            --reporter=line

      - name: Run authenticated desktop and mobile launch contracts
        if: github.event_name != 'pull_request' && env.E2E_EMAIL != '' && env.E2E_PASSWORD != ''
        env:
          PLAYWRIGHT_SKIP_WEB_SERVER: '1'
        run: |
          npx playwright test \
            tests/e2e/deep-launch-audit.spec.js \
            --project=desktop-chromium \
            --project=mobile-chromium \
            --workers=1 \
            --reporter=line

      - name: Report missing authenticated test credentials
        if: github.event_name != 'pull_request' && (env.E2E_EMAIL == '' || env.E2E_PASSWORD == '')
        run: |
          echo "Authenticated full-site coverage was not run because CHURVOX_E2E_EMAIL and CHURVOX_E2E_PASSWORD are not configured."
          echo "The complete local UI suite, live Job Done deploy proof and live public contracts still ran and must pass."

      - name: Upload active wiring diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-wiring-diagnostics-${{ github.run_id }}
          path: churvox-active-wiring-output.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload production server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-site-server-log-${{ github.run_id }}
          path: churvox-full-site-server.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 3
