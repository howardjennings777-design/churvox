name: Churvox Render Sites migration

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  migrate:
    if: startsWith(github.event.issue.title, '[churvox-render-sites-migration]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install inspection tools
        run: |
          mkdir -p /tmp/churvox-migration
          cd /tmp/churvox-migration
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Capture Sites design reference
        run: |
          mkdir -p docs/sites-render-migration-reference
          cat > /tmp/churvox-migration/capture.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1,ignoreHTTPSErrors:true});
            const pages = [
              ['home','https://churvox.howardjennings77.chatgpt.site/'],
              ['login','https://churvox.howardjennings77.chatgpt.site/login'],
              ['dashboard','https://churvox.howardjennings77.chatgpt.site/dashboard']
            ];
            const report=[];
            for (const [name,url] of pages) {
              const page=await context.newPage();
              await page.goto(url,{waitUntil:'networkidle',timeout:60000});
              await page.waitForTimeout(2500);
              await page.screenshot({path:`${process.env.GITHUB_WORKSPACE}/docs/sites-render-migration-reference/${name}.png`,fullPage:true});
              report.push({name,url,finalUrl:page.url(),title:await page.title(),text:(await page.locator('body').innerText()).slice(0,12000)});
              await page.close();
            }
            fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/docs/sites-render-migration-reference/report.json`,JSON.stringify(report,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/churvox-migration/capture.js

      - name: Commit migration reference
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/sites-render-migration-reference
          git commit -m 'Capture Sites design for Render migration' || true
          git push || true
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report reference capture
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const report=fs.readFileSync('docs/sites-render-migration-reference/report.json','utf8');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Sites design reference captured at commit \`${process.env.COMMIT}\`.\n\n\`\`\`json\n${report.slice(0,60000)}\n\`\`\``});
