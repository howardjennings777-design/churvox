name: Churvox Auth 401 Storm Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-auth-401-storm-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply focused auth repair
        run: |
          python scripts/churvox-auth-401-storm-repair-v2.py
          python scripts/churvox-auth-runtime-ready-patch.py

      - name: Run permanent contract
        run: |
          node scripts/churvox-auth-401-storm-contract.cjs
          grep -q "churvox-owner-app-ready" frontend/src/index.js
          grep -q "churvox-worker-app-ready" frontend/src/index.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Production build
        working-directory: frontend
        env:
          CI: "false"
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start local app
        working-directory: frontend
        run: |
          npm start > /tmp/churvox-auth-401-local.txt 2>&1 &
          for i in {1..75}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/churvox-auth-401-local.txt
          exit 1

      - name: Prove stale session cannot flood protected APIs
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          npx playwright test tests/e2e/churvox-auth-401-storm.spec.js \
            --project=desktop-chromium \
            --workers=1 \
            --reporter=line

      - name: Commit verified product repair
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- frontend/package.json frontend/package-lock.json 2>/dev/null || true
          git add \
            frontend/src/context/AuthContext.js \
            frontend/src/App.js \
            frontend/src/index.js
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stop stale sessions flooding protected APIs"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const sha = '${{ steps.publish.outputs.sha }}' || 'not published';
            const body = ok
              ? `## Auth 401 storm repaired\n\n- Cached account data no longer renders protected screens before /api/auth/me succeeds.\n- Owner and worker runtimes wait for authenticated state.\n- Axios and fetch 401s expire the session once and return to login.\n- Production build and stale-session browser test passed.\n- Commit: \`${sha}\``
              : `## Auth 401 storm repair failed safely\n\nNo unverified product commit was published. Check workflow run \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
