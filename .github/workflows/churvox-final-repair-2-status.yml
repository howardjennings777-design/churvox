name: Churvox Final Repair 2 Status

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[churvox-final-repair-2-status]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Extract corrected repair failure
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow churvox-final-human-audit-repair-2.yml --limit 10 --json databaseId,displayTitle --jq '[.[] | select(.displayTitle | startswith("[churvox-final-human-audit-repair-2]"))][0].databaseId')"
          test -n "$run_id"
          {
            echo "Run $run_id"
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,jobs --jq '{status, conclusion, jobs: [.jobs[] | {name, conclusion, failedSteps: [.steps[] | select(.conclusion == "failure") | .name]}]}'
            echo '--- actual runtime lines ---'
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 \
              | sed -r 's/\x1B\[[0-9;]*[mK]//g' \
              | grep -E 'patched:|created:|mismatch|not found|Traceback|SystemExit|Error:|SyntaxError|AssertionError|FAILED|failed|expected|Received|Timeout|Tests:' \
              | tail -n 120 || true
          } > /tmp/final-repair-2-status.txt

      - name: Post result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('/tmp/final-repair-2-status.txt', 'utf8');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## Corrected repair failure\n\n\`\`\`text\n${text}\n\`\`\`` });
