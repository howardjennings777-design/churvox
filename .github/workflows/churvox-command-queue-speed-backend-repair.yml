name: Churvox Command Queue Speed Backend Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-command-queue-speed-backend]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check fastapi==0.110.1 pymongo==4.5.0 pytest

      - name: Apply focused backend queue repair
        run: python scripts/churvox-command-queue-speed-backend-repair.py

      - name: Compile and contract gate
        run: |
          python -m py_compile backend/churvox_paid_launch_live_patch.py backend/churvox_boot.py
          node scripts/churvox-command-queue-speed-backend-contract.cjs
          python scripts/churvox_paid_launch_backend_contract.py
          pytest -q backend/test_churvox_command_fast_load_patch.py backend/test_churvox_command_boot_entrypoint.py

      - name: Commit verified backend repair
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add backend/churvox_paid_launch_live_patch.py backend/churvox_boot.py
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make Command queue respond inside foreground budget'
          git reset --hard HEAD
          git clean -fdx
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const sha = '${{ steps.publish.outputs.sha }}' || 'not published';
            const body = ok
              ? `## Command backend queue speed repair passed\n\n- Open statuses use small indexed equality reads in parallel.\n- Mongo work is bounded inside the frontend budget.\n- A short confirmed server cache makes repeat requests immediate.\n- Stale cache is labelled incomplete rather than all-clear.\n- Owner approval safety is unchanged.\n- Commit: \`${sha}\``
              : `## Command backend queue speed repair failed safely\n\nNo unverified backend change was published. Workflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
