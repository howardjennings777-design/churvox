name: Churvox Hardening V8

on:
  push:
    branches:
      - main
    paths:
      - "scripts/churvox_hardening_v8_parts/**"
      - "scripts/churvox_hardening_v8_materialize.py"
      - "scripts/churvox_hardening_v8_materialize.cjs"
      - "frontend/craco.config.js"
      - "usercustomize.py"
      - "backend/usercustomize.py"
      - ".github/workflows/churvox-hardening-v8.yml"
  pull_request:
    paths:
      - "scripts/churvox_hardening_v8_parts/**"
      - "scripts/churvox_hardening_v8_materialize.py"
      - "scripts/churvox_hardening_v8_materialize.cjs"
      - "frontend/craco.config.js"
      - "usercustomize.py"
      - "backend/usercustomize.py"
      - ".github/workflows/churvox-hardening-v8.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Materialise verified Churvox V8 source
        run: python scripts/churvox_hardening_v8_materialize.py

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Compile and test hardened backend
        run: |
          python -m py_compile backend/churvox_hardening_routes.py backend/test_churvox_hardening_v8.py usercustomize.py backend/usercustomize.py
          python -m pytest backend/test_churvox_hardening_v8.py -q

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Verify all twelve hardening contracts
        working-directory: frontend
        run: npx playwright test tests/e2e/churvox-hardening-v8.spec.js --reporter=line

      - name: Build production Control Board
        working-directory: frontend
        env:
          CI: "true"
        run: npm run build
