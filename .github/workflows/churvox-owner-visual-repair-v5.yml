name: Churvox Owner Visual Repair V5

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-owner-visual-repair-v5]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply and validate owner visual repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/churvox_owner_visual_repair_apply.py 2>&1 | tee /tmp/churvox-owner-visual-apply-v5.txt
          node scripts/churvox-owner-visual-repair-contract.cjs 2>&1 | tee /tmp/churvox-owner-visual-contract-v5.txt
          python -m py_compile backend/churvox_plan_usage_routes.py backend/churvox_plan_usage_guard_patch.py
          npm --prefix frontend install --legacy-peer-deps
          CI=false npm --prefix frontend run build 2>&1 | tee /tmp/churvox-owner-visual-build-v5.txt

      - name: Commit and publish verified repair
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git restore frontend/package-lock.json 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.js frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx frontend/src/churvox-office-lab/OfficeTeamOwnerNavigation.jsx frontend/src/churvox-office-lab/OfficeTeamVisualRepair.css frontend/src/runtime/churvoxVisibleLogoutRuntime.js backend/churvox_plan_usage_routes.py backend/churvox_plan_usage_guard_patch.py scripts/churvox-owner-visual-repair-contract.cjs
          git diff --cached --check
          git commit -m 'Fix owner visual shell and plan usage loading'
          git reset --hard HEAD
          git clean -fd frontend/build frontend/public/generated 2>/dev/null || true
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat --oneline --summary HEAD | tee /tmp/churvox-owner-visual-commit-v5.txt

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const contract = fs.existsSync('/tmp/churvox-owner-visual-contract-v5.txt') ? fs.readFileSync('/tmp/churvox-owner-visual-contract-v5.txt', 'utf8').slice(-6000) : 'No contract output.';
            const build = fs.existsSync('/tmp/churvox-owner-visual-build-v5.txt') ? fs.readFileSync('/tmp/churvox-owner-visual-build-v5.txt', 'utf8').slice(-2500) : 'No build output.';
            const commit = fs.existsSync('/tmp/churvox-owner-visual-commit-v5.txt') ? fs.readFileSync('/tmp/churvox-owner-visual-commit-v5.txt', 'utf8').slice(-3000) : 'No commit output.';
            const ok = '${{ job.status }}' === 'success';
            const title = ok ? '## Owner visual repair committed' : '## Owner visual repair V5 failed';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `${title}\n\nCommit: \`${{ steps.commit.outputs.sha }}\`\n\n### Contract\n\`\`\`text\n${contract}\n\`\`\`\n\n### Build\n\`\`\`text\n${build}\n\`\`\`\n\n### Commit\n\`\`\`text\n${commit}\n\`\`\`` });
