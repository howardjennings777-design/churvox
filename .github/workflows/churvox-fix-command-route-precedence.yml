name: Churvox Fix Command Route Precedence

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-command-route-precedence]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote specific worker Command routes before dynamic routes
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('backend/churvox_worker_command_visibility_patch.py'),
              Path('backend/churvox_worker_field_slip_decision_patch.py'),
          ]
          helper_anchor = '''def remove_route(app, path, method):
          '''
          helper = '''def promote_route(app, path, method):
              try:
                  method = method.upper()
                  preferred = [
                      route for route in app.router.routes
                      if getattr(route, "path", "") == path
                      and method in set(getattr(route, "methods", set()) or set())
                  ]
                  if not preferred:
                      return
                  remaining = [route for route in app.router.routes if route not in preferred]
                  app.router.routes = preferred + remaining
              except Exception:
                  pass


          '''
          for path in paths:
              text = path.read_text()
              if 'def promote_route(app, path, method):' not in text:
                  index = text.index(helper_anchor)
                  text = text[:index] + helper + text[index:]
              path.write_text(text)

          visibility = paths[0]
          text = visibility.read_text()
          old = '    app.add_api_route("/api/command/slips", command_slips_get, methods=["GET"])\n    INSTALLED.add(name)'
          new = '    app.add_api_route("/api/command/slips", command_slips_get, methods=["GET"])\n    promote_route(app, "/api/command/slips", "GET")\n    INSTALLED.add(name)'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'Visibility route anchor mismatch: {text.count(old)}')
              visibility.write_text(text.replace(old, new, 1))

          decision = paths[1]
          text = decision.read_text()
          old = '    app.add_api_route(path, decide, methods=["POST"])\n    INSTALLED.add(name)'
          new = '    app.add_api_route(path, decide, methods=["POST"])\n    promote_route(app, path, "POST")\n    INSTALLED.add(name)'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'Decision route anchor mismatch: {text.count(old)}')
              decision.write_text(text.replace(old, new, 1))
          PY

      - name: Compile route modules
        run: |
          python -m py_compile \
            backend/churvox_worker_command_visibility_patch.py \
            backend/churvox_worker_field_slip_decision_patch.py \
            backend/churvox_outer_cors_error_shield.py
          grep -q 'promote_route(app, "/api/command/slips", "GET")' backend/churvox_worker_command_visibility_patch.py
          grep -q 'promote_route(app, path, "POST")' backend/churvox_worker_field_slip_decision_patch.py

      - name: Commit and push route precedence repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/churvox_worker_command_visibility_patch.py backend/churvox_worker_field_slip_decision_patch.py
          git commit -m "Promote specific worker Command routes before dynamic routes"
          git push origin HEAD:main

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `Command route precedence repair: **${{ job.status }}**.` });
