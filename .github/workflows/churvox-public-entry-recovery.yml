name: Churvox Public Entry Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/components/ErrorBoundary.js'
      - 'frontend/tests/e2e/churvox-public-entry-recovery.spec.js'
      - '.github/workflows/churvox-public-entry-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: churvox-public-entry-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-recovery:
    name: Desktop and mobile stale-chunk recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production frontend
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the production server
        run: |
          npm start > /tmp/churvox-entry-server.log 2>&1 &
          echo $! > /tmp/churvox-entry-server.pid
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/signup >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/churvox-entry-server.log
          exit 1

      - name: Break one lazy chunk and prove recovery
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          set -o pipefail
          npx playwright test \
            tests/e2e/churvox-public-entry-recovery.spec.js \
            --project=desktop-chromium \
            --project=mobile-chromium \
            --workers=1 \
            --reporter=line 2>&1 | tee /tmp/churvox-entry-test.log

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churvox-public-entry-recovery-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
            /tmp/churvox-entry-server.log
            /tmp/churvox-entry-test.log
          if-no-files-found: ignore
          retention-days: 7
