name: Churvox Render Backend Entrypoint Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-render-backend-entrypoint]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Apply Render entrypoint repair
        run: python scripts/churvox-render-backend-entrypoint-repair.py

      - name: Compile and contract gate
        shell: bash
        run: |
          set -o pipefail
          {
            python -m py_compile backend/churvox_boot.py backend/churvox_paid_launch_live_patch.py
            node scripts/churvox-render-backend-entrypoint-contract.cjs
            pytest -q backend/test_churvox_command_boot_entrypoint.py
          } 2>&1 | tee /tmp/churvox-render-entrypoint-gate.txt

      - name: Commit verified entrypoint repair
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add Dockerfile backend/Procfile
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Boot guarded Churvox backend on every Render path'
          git reset --hard HEAD
          git clean -fdx
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ job.status }}' === 'success';
            const sha = '${{ steps.publish.outputs.sha }}' || 'not published';
            const output = fs.existsSync('/tmp/churvox-render-entrypoint-gate.txt') ? fs.readFileSync('/tmp/churvox-render-entrypoint-gate.txt', 'utf8').slice(-6000) : 'No output.';
            const body = ok
              ? `## Render backend entrypoint repair passed\n\nDocker, root Procfile and backend Procfile now boot the guarded Churvox app, with lifespan startup enabled.\n\nCommit: \`${sha}\`\n\n\`\`\`text\n${output}\n\`\`\``
              : `## Render backend entrypoint repair failed safely\n\nNo unverified deployment configuration was published.\n\n\`\`\`text\n${output}\n\`\`\`\n\nWorkflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
