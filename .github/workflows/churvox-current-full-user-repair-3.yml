name: Churvox Current Full User Repair 3

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-current-full-user-repair-v4]')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply final exact repair
        run: python scripts/churvox_current_full_user_repair_3.py

      - name: Verify final repair anchors
        shell: bash
        run: |
          set -euo pipefail
          node --check frontend/tests/e2e/churvox-live-launch-human-audit-v2.spec.js
          node --check frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js
          grep -F 'const PRODUCTION_BACKEND = "https://grassley-backend.onrender.com";' frontend/src/lib/apiBase.js
          grep -F 'if (isChurvoxProductionHost(window.location.hostname)) return configured || PRODUCTION_BACKEND;' frontend/src/lib/apiBase.js
          ! grep -F "['activity', /activity/i]" frontend/tests/e2e/churvox-live-launch-human-audit-v2.spec.js
          grep -F "['worker', /team|people|workers|field/i]" frontend/tests/e2e/churvox-live-launch-human-audit-v2.spec.js
          test "$(grep -Foc '.cvsContextBeam nav button { min-height: 44px;' frontend/src/churvox-studio/studioPolish.css)" -ge 2
          grep -F 'row?.client_id' frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js
          grep -F "'clients', 'workers'" frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js
          grep -F 'body.result?.client' frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js
          grep -F 'churvox-current-full-user-repair-3-20260728' frontend/public/render-deploy-marker.txt

      - name: Install and build production frontend
        run: |
          npm --prefix frontend install --include=dev --legacy-peer-deps
          npm --prefix frontend run build

      - name: Run login and recovery browser contract
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm start > /tmp/churvox-current-repair-3-server.txt 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then break; fi
            sleep 2
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npx playwright test tests/e2e/churvox-login-recovery-paid-launch.spec.js --project=desktop-chromium --workers=1 --reporter=line

      - name: Commit verified final repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/RENDER_RESTART_20260615.txt \
            frontend/public/render-deploy-marker.txt \
            frontend/src/lib/apiBase.js \
            frontend/src/churvox-studio/studioPolish.css \
            frontend/tests/e2e/churvox-live-launch-human-audit-v2.spec.js \
            frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js
          git commit -m 'Fix production login and final full user audit failures'
          git push origin HEAD:main

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const body = ok
              ? 'Final full-user repair passed exact source guards, the production frontend build and the complete login/recovery browser contract. Production API routing, final mobile touch targets, current route coverage and client response handling were committed to main with fresh Render markers.'
              : 'Final full-user repair stopped before commit because an exact anchor, production build or browser contract failed. No partial product repair was pushed.';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
