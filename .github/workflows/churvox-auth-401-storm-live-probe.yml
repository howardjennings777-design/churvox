name: Churvox Auth 401 Storm Live Probe

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[churvox-auth-401-storm-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wait for exact repaired bundle
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const site = 'https://www.churvox.com';
          const marker = 'churvox-auth-401-storm-repair-20260713b';
          (async () => {
            let last = '';
            for (let attempt = 1; attempt <= 100; attempt += 1) {
              try {
                const manifestResponse = await fetch(`${site}/asset-manifest.json?ts=${Date.now()}`, { cache: 'no-store' });
                const manifest = await manifestResponse.json();
                const mainPath = manifest.files?.['main.js'] || manifest.entrypoints?.find((value) => /main\..*\.js$/.test(value));
                const bundle = mainPath ? await (await fetch(new URL(mainPath, site), { cache: 'no-store' })).text() : '';
                const live = bundle.includes(marker) && bundle.includes('churvoxProtectedFetchAuthGuardRuntime');
                last = `${mainPath || 'missing bundle'} marker=${bundle.includes(marker)} guard=${bundle.includes('churvoxProtectedFetchAuthGuardRuntime')}`;
                console.log(`Attempt ${attempt}: ${last}`);
                if (live) return;
              } catch (error) {
                last = error.message || String(error);
                console.log(`Attempt ${attempt}: ${last}`);
              }
              if (attempt < 100) await sleep(10_000);
            }
            throw new Error(`Repaired frontend bundle did not deploy: ${last}`);
          })().catch((error) => { console.error(error.message || error); process.exit(1); });
          NODE

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Prove live expired session does not flood APIs
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: https://www.churvox.com
        run: |
          npx playwright test tests/e2e/churvox-auth-401-storm-live.spec.js \
            --project=desktop-chromium \
            --workers=1 \
            --reporter=line

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const body = ok
              ? '## Live auth repair passed\n\nThe exact repaired bundle is deployed. An expired cached owner session redirects to login without calling billing add-ons, plan usage, attention counts, Command scan/slips/audit, or industry context.'
              : `## Live auth repair probe failed\n\nThe repaired bundle or live stale-session behaviour did not pass. Workflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
