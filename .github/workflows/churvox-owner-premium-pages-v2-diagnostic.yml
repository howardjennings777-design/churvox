name: Churvox owner premium pages v2 diagnostic

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-owner-premium-pages-v2-diagnostic]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Extract and run full premium pages patch
        id: patch
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/churvox-owner-premium-pages-v2.yml').read_text()
          start = source.index("          python - <<'PY'") + len("          python - <<'PY' 2>&1 | tee /tmp/churvox-premium-pages-patch.log\n")
          end = source.index("          PY\n", start)
          lines = source[start:end].splitlines()
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/churvox-premium-pages-v2.py').write_text(code)
          PY
          python /tmp/churvox-premium-pages-v2.py 2>&1 | tee /tmp/churvox-premium-pages-patch.log

      - name: Build frontend
        id: build
        if: steps.patch.outcome == 'success'
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm ci --legacy-peer-deps 2>&1 | tee /tmp/churvox-premium-pages-install.log
          npm run build 2>&1 | tee /tmp/churvox-premium-pages-build.log

      - name: Commit premium pages
        id: commit
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/churvox-product/ProductAppV3.jsx frontend/src/styles/churvoxOwnerPremiumWorkspace.css
          if git diff --cached --quiet; then
            echo 'No changes produced.' | tee /tmp/churvox-premium-pages-commit.log
          else
            git commit -m 'Carry premium Churvox rooms through the owner app' | tee /tmp/churvox-premium-pages-commit.log
            git push | tee -a /tmp/churvox-premium-pages-commit.log
          fi
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '';
            const patch = read('/tmp/churvox-premium-pages-patch.log');
            const build = read('/tmp/churvox-premium-pages-build.log');
            const commit = read('/tmp/churvox-premium-pages-commit.log');
            const body = [
              `Premium pages diagnostic: **${{ job.status }}**`,
              `Patch: \`${{ steps.patch.outcome }}\` · Build: \`${{ steps.build.outcome }}\` · Commit: \`${{ steps.commit.outcome }}\``,
              `Commit: \`${process.env.COMMIT || 'none'}\``,
              patch ? `\nPatch log:\n\`\`\`text\n${patch.slice(-3500)}\n\`\`\`` : '',
              build ? `\nBuild log:\n\`\`\`text\n${build.slice(-3500)}\n\`\`\`` : '',
              commit ? `\nCommit log:\n\`\`\`text\n${commit.slice(-1500)}\n\`\`\`` : '',
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
