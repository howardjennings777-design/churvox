name: Churvox owner premium flow repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-owner-premium-flow-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Repair routes and build premium owner rooms
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/src/churvox-product/ProductAppV3.jsx')
          text = path.read_text()

          text = text.replace(
            '  { id: "jobs", label: "Jobs", hint: "Run sheet" },\n  { id: "clients", label: "Clients", hint: "Memory" },',
            '  { id: "jobs", label: "Jobs", hint: "Run sheet" },\n  { id: "schedule", label: "Schedule", hint: "Timing" },\n  { id: "clients", label: "Clients", hint: "Memory" },',
            1,
          )
          text = text.replace(
            '  jobs: ["A real run sheet with recurrence built in.", "Create, schedule, price, assign and repeat jobs from one practical workspace."],\n  clients:',
            '  jobs: ["A real run sheet with recurrence built in.", "Create, schedule, price, assign and repeat jobs from one practical workspace."],\n  schedule: ["See the week as one connected route.", "Timing, worker load, recurring work and gaps stay visible without turning the calendar into a wall of boxes."],\n  clients:',
            1,
          )
          text = text.replace(
            '  today: "start", jobs: "start", clients: "start", quotes: "start", invoices: "start", settings: "start", plans: "none", support: "none",',
            '  today: "start", jobs: "start", schedule: "start", clients: "start", quotes: "start", invoices: "start", settings: "start", plans: "none", support: "none",',
            1,
          )
          old_alias = '  const aliases = { dashboard: "today", smartHub: "today", smarthub: "today", plans: "plans", guide: "support", setup: "support", setupguide: "support", help: "support", supportboard: "support", accounting: "xero" };\n  const wanted = hash || aliases[path] || path;'
          new_alias = '  const aliases = { dashboard: "today", smarthub: "today", plans: "plans", guide: "support", setup: "support", setupguide: "support", help: "support", supportboard: "support", work: "jobs", job: "jobs", calendar: "schedule", worker: "workers", staff: "team", integrations: "xero", accounting: "xero" };\n  const wanted = aliases[hash] || hash || aliases[path] || path;'
          if old_alias not in text:
            raise SystemExit('page alias target not found')
          text = text.replace(old_alias, new_alias, 1)

          text = text.replace(
            '    jobs: [[data.jobs.length, "jobs"], [data.jobs.filter((job) => job.recurring !== "One-off").length, "recurring"], [data.jobs.filter((job) => job.issue || /needs check/i.test(job.status)).length, "needs check"], ["Form", "editable"]],\n    clients:',
            '    jobs: [[data.jobs.length, "jobs"], [data.jobs.filter((job) => job.recurring !== "One-off").length, "recurring"], [data.jobs.filter((job) => job.issue || /needs check/i.test(job.status)).length, "needs check"], ["Form", "editable"]],\n    schedule: [[data.jobs.length, "scheduled"], [data.jobs.filter((job) => job.recurring !== "One-off").length, "recurring"], [data.workers.length, "field team"], [data.jobs.filter((job) => !job.date).length, "need dates"]],\n    clients:',
            1,
          )

          today = r'''function TodayPage({ data, open, go, access }) {
  const invoiceValue = data.invoices.reduce((sum, item) => sum + item.amount, 0);
  const attention = [...data.command, ...data.jobs.filter((job) => job.issue || /needs check/i.test(job.status)), ...data.invoices.filter((invoice) => /overdue/i.test(invoice.status))];
  const best = attention[0] || null;
  const complete = data.jobs.filter((job) => /complete|done/i.test(job.status)).length;
  return <>
    <section className="cv3Handover span12">
      <div className="cv3HandoverCopy">
        <small>Live office handover</small>
        <h2>{best ? "One move needs the owner." : data.jobs.length ? "The day is connected." : "Start with one real job."}</h2>
        <p>{best ? `${titleOf(best)} is the clearest next decision. Churvox has kept the records together so you can check it once.` : data.jobs.length ? "Jobs, field updates, messages and money are connected below. Only exceptions rise to Command." : "Add a client or job and Churvox will begin building the live office around the work."}</p>
        <div className="cv3HandoverActions">
          <button type="button" className="primary" onClick={() => best ? go("command") : open(blank("job", data))}>{best ? "Open the decision" : "Add the first job"}</button>
          <button type="button" onClick={() => go("schedule")}>Open the week</button>
        </div>
        <footer>Nothing sends, moves, charges or syncs without owner approval.</footer>
      </div>
      <div className="cv3OfficeSignal" aria-label="Live Churvox office flow">
        <div className="brain"><span /><small>Churvox</small><b>{attention.length ? `${attention.length} owner check${attention.length === 1 ? "" : "s"}` : "Office calm"}</b></div>
        <div className="signalLine" />
        <div className="signalNodes">
          <span><i />Bookings<b>{data.jobs.length}</b></span>
          <span><i />Field<b>{data.workers.length}</b></span>
          <span><i />Proof<b>{complete}</b></span>
          <span><i />Money<b>{money(invoiceValue)}</b></span>
          <span className="owner"><i />Owner<b>{attention.length}</b></span>
        </div>
      </div>
    </section>
    <section className="cv3DayLedger span12">
      <header><div><small>Today</small><h3>Work moving through the office</h3></div><button type="button" onClick={() => open(blank("job", data))}>Add job</button></header>
      <div className="cv3DayColumns">
        <div><small>Run sheet</small>{data.jobs.length ? data.jobs.slice(0, 7).map((job) => <Row key={job.id} title={`${job.time || "Any time"} · ${job.title}`} meta={`${job.client} · ${job.worker} · ${job.status}`} tag={money(job.price)} onClick={() => open(job)} />) : <Empty title="No jobs yet" text="The first real job turns this handover into a live business view." />}</div>
        <div><small>Owner desk</small>{attention.length ? attention.slice(0, 6).map((item) => <Row key={`${item.type}-${item.id}`} title={titleOf(item)} meta={item.status || item.client || "Owner check"} tone="red" action="Check" onClick={() => open(item)} />) : <Empty title="Nothing needs you" text="Churvox will bring exceptions and prepared decisions here." />}</div>
      </div>
    </section>
    <section className="cv3PulseLine span12">
      <button type="button" onClick={() => go("workers")}><small>Field</small><b>{data.workers.length ? `${data.workers.length} worker records` : "No workers connected"}</b><span>Open field view</span></button>
      <button type="button" onClick={() => go("messages")}><small>Promises</small><b>{data.messages.length ? `${data.messages.length} messages` : "No follow-ups waiting"}</b><span>Open messages</span></button>
      <button type="button" onClick={() => go("invoices")}><small>Money</small><b>{money(invoiceValue)}</b><span>Open invoice ledger</span></button>
    </section>
  </>;
}
'''
          text, n = re.subn(r'function TodayPage\(\{ data, open, go, access \}\) \{.*?\n\}\n\n(?=function CommandPage)', today + '\n', text, count=1, flags=re.S)
          if n != 1:
            raise SystemExit('TodayPage replacement failed')

          command = r'''function CommandPage({ data, open, access }) {
  const selected = data.command[0] || null;
  return <>
    <section className="cv3CommandRoom span12">
      <header>
        <div><small>Command · owner decision room</small><h2>Churvox prepares it. You decide what moves.</h2><p>Every slip keeps the source, the prepared result and the consequence together. Approve, edit or park happens here—nowhere else.</p></div>
        <div className="cv3CommandState"><span className={data.command.length ? "live" : "calm"} /><b>{data.command.length ? `${data.command.length} waiting` : "Room clear"}</b><small>Owner control on</small></div>
      </header>
      <div className="cv3CommandBody">
        <div className="cv3CommandQueue">
          <small>Decision rail</small>
          {data.command.length ? data.command.slice(0, 10).map((item, index) => <button type="button" className={index === 0 ? "active" : ""} key={item.id} onClick={() => open(item)}><span>{String(index + 1).padStart(2, "0")}</span><div><b>{item.approvalType}</b><small>{item.title}</small></div><em>{item.status}</em></button>) : <div className="cv3CommandEmpty"><span /><h3>No approvals waiting.</h3><p>The decision rail stays quiet until a quote, invoice, reply, job issue or accounting handoff genuinely needs the owner.</p></div>}
        </div>
        <aside className="cv3DecisionRoom">
          <small>{selected ? "Prepared working slip" : "How Command works"}</small>
          <h3>{selected ? titleOf(selected) : "One decision. Full context."}</h3>
          <p>{selected ? selected.filled || selected.check || "Open the slip to see what Churvox prepared and what still needs checking." : "Churvox connects the records, explains the reason and leaves the final action with the owner."}</p>
          <div className="cv3DecisionSteps"><span><i>1</i>What changed</span><span><i>2</i>What was checked</span><span><i>3</i>What Churvox prepared</span><span><i>4</i>What happens next</span></div>
          {selected ? <button type="button" onClick={() => open(selected)}>Open full decision slip</button> : null}
          <footer>Approve · Edit · Park · Ask for the missing fact</footer>
        </aside>
      </div>
    </section>
    <section className="cv3CommandPromise span12"><span>Control is the product.</span><p>Nothing important sends, charges, syncs, pays, files or changes because software guessed.</p></section>
  </>;
}
'''
          text, n = re.subn(r'function CommandPage\(\{ data, open, access \}\) \{.*?\n\}\n\n(?=function JobsPage)', command + '\n', text, count=1, flags=re.S)
          if n != 1:
            raise SystemExit('CommandPage replacement failed')

          schedule = r'''function SchedulePage({ data, open, access }) {
  const rows = [...data.jobs].sort((a, b) => `${a.date || "9999"} ${a.time || "99"}`.localeCompare(`${b.date || "9999"} ${b.time || "99"}`));
  const undated = rows.filter((job) => !job.date);
  return <><Hero page="schedule" data={data} access={access} /><Toolbar><button type="button" onClick={() => open(blank("job", data))}>Add booking</button><button type="button" onClick={() => open({ ...blank("job", data), recurring: "Weekly" })}>Recurring work</button></Toolbar><section className="cv3ScheduleRoom span8"><header><small>Connected week</small><h3>Timing without calendar clutter</h3></header><div className="cv3ScheduleRail">{rows.length ? rows.slice(0, 14).map((job, index) => <button type="button" key={job.id} onClick={() => open(job)}><span>{String(index + 1).padStart(2, "0")}</span><time>{job.date || "Date needed"}<b>{job.time || "Any time"}</b></time><div><b>{job.title}</b><small>{job.client} · {job.worker}</small></div><em>{job.recurring}</em></button>) : <Empty title="The week is open" text="Add a booking and Churvox will connect timing, worker and recurring work here." />}</div></section><section className="cv3ScheduleSide span4"><small>Week check</small><h3>{undated.length ? `${undated.length} job${undated.length === 1 ? " needs" : "s need"} a date` : "No timing gaps visible"}</h3><p>Ripple Preview will compare worker load, client promises and invoice timing before an approved move.</p><button type="button" onClick={() => open(undated[0] || blank("job", data))}>{undated.length ? "Fix first gap" : "Add a booking"}</button></section></>;
}

'''
          marker = 'function ClientsPage({ data, open, api, refresh, notify, access }) {'
          if marker not in text:
            raise SystemExit('ClientsPage insertion marker missing')
          text = text.replace(marker, schedule + marker, 1)

          text = text.replace(
            '  if (page === "jobs") return <JobsPage data={data} open={open} access={access} />;\n  if (page === "clients")',
            '  if (page === "jobs") return <JobsPage data={data} open={open} access={access} />;\n  if (page === "schedule") return <SchedulePage data={data} open={open} access={access} />;\n  if (page === "clients")',
            1,
          )

          path.write_text(text)

          css = Path('frontend/src/styles/churvoxOwnerPremiumWorkspace.css')
          css.write_text(css.read_text() + r'''

/* Distinctive Churvox owner rooms */
.cv3Handover{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(430px,.95fr);min-height:370px;border-radius:22px;overflow:hidden;background:linear-gradient(145deg,#111411,#1b231e);color:#fff;box-shadow:0 28px 90px rgba(17,21,19,.18)}
.cv3HandoverCopy{display:flex;flex-direction:column;padding:42px 46px}.cv3HandoverCopy>small,.cv3OfficeSignal small,.cv3DayLedger>header small,.cv3DayColumns>div>small,.cv3PulseLine small,.cv3CommandRoom header small,.cv3ScheduleRoom header small,.cv3ScheduleSide>small{color:#f39a69;font-size:9px;font-weight:850;letter-spacing:.18em;text-transform:uppercase}.cv3HandoverCopy h2{max-width:620px;margin:14px 0 16px;font-size:clamp(42px,5vw,74px);line-height:.88;letter-spacing:-.075em;font-weight:760}.cv3HandoverCopy p{max-width:610px;margin:0;color:rgba(255,255,255,.66);font-size:15px;line-height:1.6}.cv3HandoverActions{display:flex;gap:9px;margin-top:28px}.cv3HandoverActions button,.cv3ScheduleSide button{min-height:42px;border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:0 15px;background:rgba(255,255,255,.06);color:#fff;font-size:12px;font-weight:760}.cv3HandoverActions button.primary,.cv3ScheduleSide button{border-color:transparent;background:#ef6b2e}.cv3HandoverCopy footer{margin-top:auto;padding-top:28px;color:rgba(255,255,255,.40);font-size:10px}
.cv3OfficeSignal{position:relative;display:grid;align-content:center;padding:40px;background:radial-gradient(circle at 50% 45%,rgba(239,107,46,.17),transparent 34%),linear-gradient(135deg,rgba(255,255,255,.035),transparent);border-left:1px solid rgba(255,255,255,.08)}.cv3OfficeSignal .brain{position:relative;z-index:2;width:180px;height:180px;margin:0 auto 46px;display:grid;place-items:center;align-content:center;gap:7px;border:1px solid rgba(239,107,46,.42);border-radius:50%;background:rgba(10,13,11,.82);box-shadow:0 0 0 18px rgba(239,107,46,.035),0 0 60px rgba(239,107,46,.13)}.cv3OfficeSignal .brain>span{width:12px;height:12px;border-radius:50%;background:#ef6b2e;box-shadow:0 0 0 8px rgba(239,107,46,.12)}.cv3OfficeSignal .brain b{font-size:18px}.cv3OfficeSignal .signalLine{position:absolute;left:13%;right:13%;bottom:89px;height:1px;background:linear-gradient(90deg,transparent,#ef6b2e 12%,#ef6b2e 88%,transparent)}.cv3OfficeSignal .signalNodes{position:relative;z-index:2;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.cv3OfficeSignal .signalNodes span{display:grid;place-items:center;gap:5px;color:rgba(255,255,255,.48);font-size:9px;text-transform:uppercase}.cv3OfficeSignal .signalNodes i{width:9px;height:9px;border:2px solid #ef6b2e;border-radius:50%;background:#151a17}.cv3OfficeSignal .signalNodes b{color:#fff;font-size:12px;text-transform:none}.cv3OfficeSignal .signalNodes .owner i{background:#ef6b2e;box-shadow:0 0 0 6px rgba(239,107,46,.10)}
.cv3DayLedger{grid-column:1/-1;border-top:1px solid var(--cv-line)}.cv3DayLedger>header{display:flex;align-items:flex-end;justify-content:space-between;padding:20px 0 14px;border-bottom:1px solid var(--cv-faint)}.cv3DayLedger>header h3{margin:5px 0 0;font-size:23px;letter-spacing:-.045em}.cv3DayLedger>header button{min-height:40px;border:0;border-radius:9px;padding:0 14px;background:#1a1f1c;color:#fff;font-size:11px;font-weight:760}.cv3DayColumns{display:grid;grid-template-columns:1.15fr .85fr}.cv3DayColumns>div{min-height:220px;padding:20px 24px 0 0}.cv3DayColumns>div+div{padding-left:28px;border-left:1px solid var(--cv-line)}
.cv3PulseLine{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--cv-line);border-bottom:1px solid var(--cv-line)}.cv3PulseLine button{min-height:100px;display:grid;align-content:center;gap:6px;border:0;border-right:1px solid var(--cv-line);padding:18px 22px;background:transparent;text-align:left;color:var(--cv-ink)}.cv3PulseLine button:last-child{border-right:0}.cv3PulseLine b{font-size:18px;letter-spacing:-.035em}.cv3PulseLine span{color:#7b8580;font-size:11px}
.cv3CommandRoom{grid-column:1/-1;overflow:hidden;border-radius:22px;background:#111411;color:#fff;box-shadow:0 28px 90px rgba(17,21,19,.20)}.cv3CommandRoom>header{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end;padding:38px 42px 30px;border-bottom:1px solid rgba(255,255,255,.09)}.cv3CommandRoom>header h2{max-width:800px;margin:10px 0 10px;font-size:clamp(38px,4.8vw,68px);line-height:.9;letter-spacing:-.075em;font-weight:760}.cv3CommandRoom>header p{max-width:720px;margin:0;color:rgba(255,255,255,.58);line-height:1.55}.cv3CommandState{display:grid;justify-items:end;gap:6px}.cv3CommandState>span{width:12px;height:12px;border-radius:50%;background:#63d28a;box-shadow:0 0 0 8px rgba(99,210,138,.10)}.cv3CommandState>span.live{background:#ef6b2e;box-shadow:0 0 0 8px rgba(239,107,46,.12)}.cv3CommandState b{font-size:18px}.cv3CommandState small{color:rgba(255,255,255,.42)}.cv3CommandBody{display:grid;grid-template-columns:minmax(350px,.75fr) minmax(0,1.25fr);min-height:430px}.cv3CommandQueue{padding:28px;border-right:1px solid rgba(255,255,255,.09)}.cv3CommandQueue>small,.cv3DecisionRoom>small{color:#f39a69;font-size:9px;font-weight:850;letter-spacing:.17em;text-transform:uppercase}.cv3CommandQueue>button{width:100%;min-height:72px;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;border:0;border-bottom:1px solid rgba(255,255,255,.08);padding:10px 4px;background:transparent;color:#fff;text-align:left}.cv3CommandQueue>button>span{color:#f39a69;font-size:10px}.cv3CommandQueue>button b{font-size:13px}.cv3CommandQueue>button small{display:block;margin-top:4px;color:rgba(255,255,255,.43);font-size:10px}.cv3CommandQueue>button em{font-style:normal;color:rgba(255,255,255,.42);font-size:10px}.cv3CommandQueue>button.active{background:linear-gradient(90deg,rgba(239,107,46,.10),transparent)}.cv3CommandEmpty{display:grid;align-content:center;min-height:300px;padding:30px 0}.cv3CommandEmpty>span{width:13px;height:13px;border-radius:50%;background:#63d28a;box-shadow:0 0 0 9px rgba(99,210,138,.08)}.cv3CommandEmpty h3{margin:26px 0 8px;font-size:28px}.cv3CommandEmpty p{max-width:390px;color:rgba(255,255,255,.48);line-height:1.55}.cv3DecisionRoom{display:flex;flex-direction:column;padding:42px 46px;background:radial-gradient(circle at 85% 12%,rgba(239,107,46,.14),transparent 28%)}.cv3DecisionRoom h3{max-width:680px;margin:14px 0 12px;font-size:clamp(34px,4vw,56px);line-height:.92;letter-spacing:-.065em}.cv3DecisionRoom>p{max-width:660px;color:rgba(255,255,255,.58);line-height:1.6}.cv3DecisionSteps{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin:30px 0;border-top:1px solid rgba(255,255,255,.09);border-bottom:1px solid rgba(255,255,255,.09)}.cv3DecisionSteps span{min-height:68px;display:flex;align-items:center;gap:10px;border-right:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.64);font-size:11px}.cv3DecisionSteps i{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:rgba(239,107,46,.15);color:#f39a69;font-style:normal}.cv3DecisionRoom>button{align-self:flex-start;min-height:42px;border:0;border-radius:9px;padding:0 15px;background:#ef6b2e;color:#fff;font-weight:760}.cv3DecisionRoom footer{margin-top:auto;color:rgba(255,255,255,.38);font-size:10px}.cv3CommandPromise{grid-column:1/-1;display:flex;align-items:baseline;gap:18px;padding:4px 0 20px;border-bottom:1px solid var(--cv-line)}.cv3CommandPromise span{color:#ef6b2e;font-weight:800}.cv3CommandPromise p{margin:0;color:#6f7974}
.cv3ScheduleRoom{border-top:1px solid var(--cv-line)}.cv3ScheduleRoom>header{padding:18px 0;border-bottom:1px solid var(--cv-faint)}.cv3ScheduleRoom h3,.cv3ScheduleSide h3{margin:5px 0 0;font-size:25px;letter-spacing:-.045em}.cv3ScheduleRail>button{width:100%;min-height:74px;display:grid;grid-template-columns:34px 125px minmax(0,1fr) auto;gap:14px;align-items:center;border:0;border-bottom:1px solid var(--cv-faint);padding:10px 4px;background:transparent;text-align:left;color:var(--cv-ink)}.cv3ScheduleRail>button>span{color:#ef6b2e;font-size:10px}.cv3ScheduleRail time{display:grid;color:#5f6964;font-size:10px}.cv3ScheduleRail time b{margin-top:4px;color:var(--cv-ink);font-size:12px}.cv3ScheduleRail>button div b{display:block;font-size:13px}.cv3ScheduleRail>button div small{display:block;margin-top:4px;color:#7b8580}.cv3ScheduleRail em{font-style:normal;color:#7b8580;font-size:10px}.cv3ScheduleSide{min-height:310px;align-self:start;border-radius:18px;padding:28px;background:#171c19;color:#fff}.cv3ScheduleSide p{color:rgba(255,255,255,.56);line-height:1.55}.cv3ScheduleSide button{margin-top:16px}
@media(min-width:901px){.cv4Experience .cv4Dock{top:12px!important;right:300px!important;bottom:auto!important;width:auto!important;flex-direction:row!important;transform:none!important;border:0!important;background:transparent!important;box-shadow:none!important;backdrop-filter:none!important}.cv4Experience .cv4OfficeButton,.cv4Experience .cv4Move,.cv4Experience .cv4TellButton{background:rgba(255,255,255,.06)!important}.cv4Experience .cv4TellButton{background:#ef6b2e!important}}
@media(max-width:900px){.cv3Handover{display:block;min-height:0;border-radius:16px}.cv3HandoverCopy{padding:28px 22px}.cv3HandoverCopy h2{font-size:43px}.cv3OfficeSignal{min-height:310px;border-left:0;border-top:1px solid rgba(255,255,255,.08);padding:30px 20px}.cv3OfficeSignal .brain{width:140px;height:140px;margin-bottom:40px}.cv3OfficeSignal .signalNodes{gap:3px}.cv3OfficeSignal .signalNodes span{font-size:7px}.cv3DayColumns{display:block}.cv3DayColumns>div{padding:18px 0}.cv3DayColumns>div+div{padding-left:0;border-left:0;border-top:1px solid var(--cv-line)}.cv3PulseLine{display:block}.cv3PulseLine button{width:100%;border-right:0;border-bottom:1px solid var(--cv-line)}.cv3CommandRoom{border-radius:16px}.cv3CommandRoom>header{display:block;padding:28px 22px}.cv3CommandRoom>header h2{font-size:42px}.cv3CommandState{justify-items:start;margin-top:25px}.cv3CommandBody{display:block}.cv3CommandQueue{padding:22px;border-right:0;border-bottom:1px solid rgba(255,255,255,.09)}.cv3DecisionRoom{padding:30px 22px;min-height:420px}.cv3DecisionSteps{grid-template-columns:1fr}.cv3ScheduleRail>button{grid-template-columns:25px 90px 1fr}.cv3ScheduleRail em{display:none}.cv3ScheduleSide{margin-top:24px}.cv4Experience .cv4Dock{right:14px!important;bottom:14px!important;padding:5px!important}.cv4Experience .cv4OfficeButton,.cv4Experience .cv4Move{display:none!important}}
''')
          PY

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/churvox-product/ProductAppV3.jsx frontend/src/styles/churvoxOwnerPremiumWorkspace.css
          git commit -m 'Build premium Today Command and Schedule rooms'
          git push
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Post result
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Premium owner flow repair built and committed. Route aliases, Schedule, Today handover and Command decision room are included. Commit: \`${process.env.COMMIT || 'unknown'}\``
            });
