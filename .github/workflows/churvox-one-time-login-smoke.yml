name: Churvox One-Time Login Smoke

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  login-smoke:
    if: startsWith(github.event.issue.title, '[churvox-login-smoke]')
    name: Read-only owner and worker login smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Mark smoke as started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Read-only owner/worker browser login smoke is running. No business records will be changed.'
            })

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --legacy-peer-deps

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run read-only owner and worker login smoke
        id: smoke
        continue-on-error: true
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: https://www.churvox.com
          PLAYWRIGHT_API_BASE: https://grassley-backend.onrender.com
          CHURVOX_OWNER_EMAIL: ${{ secrets.CHURVOX_OWNER_EMAIL || 'howardjennings77@gmail.com' }}
          CHURVOX_OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}
          CHURVOX_WORKER_EMAIL: ${{ secrets.CHURVOX_WORKER_EMAIL || secrets.CHURVOX_OWNER_EMAIL || 'howardjennings77@gmail.com' }}
          CHURVOX_WORKER_PASSWORD: ${{ secrets.CHURVOX_WORKER_PASSWORD || secrets.CHURVOX_OWNER_PASSWORD }}
        run: |
          set -o pipefail
          node scripts/churvox-live-owner-worker-readonly.cjs --reporter=line 2>&1 | tee /tmp/churvox-login-smoke.txt

      - name: Post smoke result
        if: always()
        uses: actions/github-script@v7
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/churvox-login-smoke.txt';
            let report = 'The smoke output was not created.';
            if (fs.existsSync(path)) report = fs.readFileSync(path, 'utf8').slice(-18000);
            const outcome = process.env.SMOKE_OUTCOME === 'success' ? 'PASSED' : 'FAILED';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Read-only login smoke ${outcome}\n\n\`\`\`text\n${report}\n\`\`\``
            });

      - name: Fail workflow when smoke failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
