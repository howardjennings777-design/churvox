name: Apply Churvox Owner Intelligence

on:
  push:
    branches:
      - agent/churvox-owner-intelligence
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-owner-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip-intelligence-apply]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/churvox-owner-intelligence
          fetch-depth: 0

      - name: Apply checked product wiring
        shell: bash
        run: |
          set +e
          python3 scripts/apply_churvox_owner_intelligence.py 2>&1 | tee /tmp/owner-intelligence-apply.log
          echo ${PIPESTATUS[0]} > /tmp/owner-intelligence-apply.status
          exit 0

      - name: Remove one-time patch machinery and verify
        shell: bash
        run: |
          apply_status=$(cat /tmp/owner-intelligence-apply.status)
          if [ "$apply_status" -ne 0 ]; then
            echo "$apply_status" > /tmp/owner-intelligence-verify.status
            exit 0
          fi
          rm -f scripts/apply_churvox_owner_intelligence.py .github/workflows/apply-owner-intelligence.yml
          set +e
          {
            python3 scripts/churvox-owner-intelligence-contract.py
            python3 -m py_compile backend/churvox_owner_intelligence_routes.py backend/test_churvox_owner_intelligence.py usercustomize.py backend/usercustomize.py
            git diff --check
          } 2>&1 | tee /tmp/owner-intelligence-verify.log
          echo ${PIPESTATUS[0]} > /tmp/owner-intelligence-verify.status
          exit 0

      - name: Upload wiring diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-intelligence-diagnostics-${{ github.run_id }}
          path: |
            /tmp/owner-intelligence-apply.log
            /tmp/owner-intelligence-verify.log
            /tmp/owner-intelligence-apply.status
            /tmp/owner-intelligence-verify.status
          if-no-files-found: warn
          retention-days: 3

      - name: Commit wired product or fail with diagnostics
        shell: bash
        run: |
          apply_status=$(cat /tmp/owner-intelligence-apply.status)
          verify_status=$(cat /tmp/owner-intelligence-verify.status)
          if [ "$apply_status" -ne 0 ] || [ "$verify_status" -ne 0 ]; then
            echo "Apply status: $apply_status"
            echo "Verify status: $verify_status"
            cat /tmp/owner-intelligence-apply.log || true
            cat /tmp/owner-intelligence-verify.log || true
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire all eight Churvox Intelligence features [skip-intelligence-apply]"
          git push origin HEAD:agent/churvox-owner-intelligence
