name: Apply Churvox Owner Intelligence

on:
  push:
    branches:
      - agent/churvox-owner-intelligence
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: apply-owner-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip-intelligence-apply]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/churvox-owner-intelligence
          fetch-depth: 0

      - name: Apply and create exact product commit
        id: commit
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/apply_churvox_owner_intelligence.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/churvox_feature_tier_paid_launch_guard.py \
            backend/usercustomize.py \
            usercustomize.py \
            frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx \
            frontend/src/churvox-office-lab/OfficeTeamOwnerNavigation.jsx \
            frontend/src/churvox-office-lab/OfficeTeamAccess.js \
            frontend/src/churvox-fresh/planRules.js \
            frontend/src/churvox-office-lab/OfficeTeamPlansScreen.jsx \
            frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.jsx \
            frontend/src/churvox-office-lab/OfficeTeamWorkerRoute.css \
            frontend/package.json \
            .github/workflows/churvox-build-check.yml \
            .github/workflows/churvox-paid-launch-gate.yml \
            scripts/churvox-owner-intelligence-contract.py
          git diff --cached --stat | tee /tmp/intelligence-diff.txt
          git commit -m "Wire all eight Churvox Intelligence features [skip-intelligence-apply]"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push product commit
        id: push
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git push --verbose origin HEAD:agent/churvox-owner-intelligence 2>&1 | tee /tmp/intelligence-push.txt

      - name: Report branch push on PR
        if: always()
        uses: actions/github-script@v7
        env:
          CREATED_SHA: ${{ steps.commit.outputs.sha }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        with:
          script: |
            const fs = require('fs');
            const read = (path) => { try { return fs.readFileSync(path, 'utf8'); } catch { return ''; } };
            const body = [
              '### Churvox Intelligence wiring runner',
              '',
              `- Created commit: \`${process.env.CREATED_SHA || 'not created'}\``,
              `- Push outcome: **${process.env.PUSH_OUTCOME || 'unknown'}**`,
              '',
              '```text',
              read('/tmp/intelligence-diff.txt').slice(0, 5000),
              read('/tmp/intelligence-push.txt').slice(0, 5000),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 679, body });

      - name: Fail if push was rejected
        if: steps.push.outcome != 'success'
        run: exit 1
