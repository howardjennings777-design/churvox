name: Apply Churvox Owner Intelligence

on:
  push:
    branches:
      - agent/churvox-owner-intelligence
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-owner-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip-intelligence-apply]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/churvox-owner-intelligence
          fetch-depth: 0

      - name: Apply, verify and publish result
        shell: bash
        run: |
          set +e
          mkdir -p audit-results
          : > /tmp/owner-intelligence-apply.log
          python3 scripts/apply_churvox_owner_intelligence.py >> /tmp/owner-intelligence-apply.log 2>&1
          status=$?

          if [ "$status" -eq 0 ]; then
            rm -f scripts/apply_churvox_owner_intelligence.py .github/workflows/apply-owner-intelligence.yml
            python3 scripts/churvox-owner-intelligence-contract.py >> /tmp/owner-intelligence-apply.log 2>&1 || status=$?
            python3 -m py_compile backend/churvox_owner_intelligence_routes.py backend/test_churvox_owner_intelligence.py usercustomize.py backend/usercustomize.py >> /tmp/owner-intelligence-apply.log 2>&1 || status=$?
            git diff --check >> /tmp/owner-intelligence-apply.log 2>&1 || status=$?
          fi

          {
            echo "Churvox Intelligence wiring status: $status"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo
            cat /tmp/owner-intelligence-apply.log
          } > audit-results/churvox-owner-intelligence-apply-latest.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire all eight Churvox Intelligence features [skip-intelligence-apply]" || true
          git push origin HEAD:agent/churvox-owner-intelligence
          exit "$status"
