name: Agent Fix Plans Route

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-fix-plans-route-and-flow
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CHURVOX_E2E_EMAIL: ${{ secrets.CHURVOX_E2E_EMAIL || secrets.CHURVOX_OWNER_EMAIL || 'hello@churvox.com' }}
      CHURVOX_E2E_PASSWORD: ${{ secrets.CHURVOX_E2E_PASSWORD || secrets.CHURVOX_OWNER_PASSWORD }}
      PLAYWRIGHT_API_BASE: https://grassley-backend.onrender.com
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-plans-route-and-flow
          fetch-depth: 0

      - name: Apply isolated plans route fix
        run: python3 scripts/agent_apply_plans_fix.py

      - name: Verify route source contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('frontend/src/App.js', 'utf8');
          const wrapper = fs.readFileSync('frontend/src/StandalonePlansRoute.jsx', 'utf8');
          const plans = fs.readFileSync('frontend/src/churvox-fresh/FreshPlans.jsx', 'utf8');
          if (!app.includes('<StandalonePlansRoute />')) throw new Error('/plans is not wired to StandalonePlansRoute');
          if (app.includes('path="/plans" element={<FreshBusinessRoute><AppRedirect')) throw new Error('/plans still redirects into dashboard');
          if (!wrapper.includes('plans-route-auth-recover-v1')) throw new Error('plans auth recovery marker missing');
          if (!plans.includes('Pricing country') || !plans.includes('COUNTRY_OPTIONS')) throw new Error('country-aware pricing selector missing');
          console.log('PASS: standalone /plans route, auth recovery marker and country selector are wired.');
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build patched frontend
        working-directory: frontend
        env:
          CI: false
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Serve verified production build
        working-directory: frontend
        run: |
          nohup npx serve -s build -l 3000 > ../plans-route-server.log 2>&1 &
          echo $! > ../plans-route-server.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "Production build is serving."
              exit 0
            fi
            sleep 1
          done
          cat ../plans-route-server.log
          exit 1

      - name: Run local plans route contract
        id: plans_browser
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          npx playwright test tests/e2e/churvox-plans-route-contract.spec.js --project=desktop-chromium --reporter=line 2>&1 | tee ../plans-route-test-failure.txt

      - name: Run authenticated plans regression
        id: auth_plans
        if: env.CHURVOX_E2E_PASSWORD != ''
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          npx playwright test tests/e2e/churvox-plans-regression-and-cleanup.spec.js --project=desktop-chromium -g "Plans page loads billing JSON" --reporter=line 2>&1 | tee ../auth-plans-test-failure.txt

      - name: Run owner and worker route gauntlet
        id: owner_worker
        if: env.CHURVOX_E2E_PASSWORD != ''
        continue-on-error: true
        working-directory: frontend
        env:
          CHURVOX_OWNER_EMAIL: ${{ secrets.CHURVOX_OWNER_EMAIL || secrets.CHURVOX_E2E_EMAIL || 'hello@churvox.com' }}
          CHURVOX_OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD || secrets.CHURVOX_E2E_PASSWORD }}
          CHURVOX_WORKER_EMAIL: ${{ secrets.CHURVOX_WORKER_EMAIL }}
          CHURVOX_WORKER_PASSWORD: ${{ secrets.CHURVOX_WORKER_PASSWORD }}
        run: |
          set -o pipefail
          npx playwright test tests/e2e/churvox-human-business-gauntlet.spec.js --project=desktop-chromium --workers=1 -g "owner dashboard|worker app route" --reporter=line 2>&1 | tee ../owner-worker-test-failure.txt

      - name: Run client job quote invoice journey
        id: business_journey
        if: env.CHURVOX_E2E_PASSWORD != ''
        continue-on-error: true
        working-directory: frontend
        env:
          CHURVOX_E2E_MUTATE: "1"
        run: |
          set -o pipefail
          npx playwright test tests/e2e/churvox-real-business-audit-v2.spec.js --project=desktop-chromium --workers=1 -g "creates client, job, quote and invoice" --reporter=line 2>&1 | tee ../business-journey-test-failure.txt

      - name: Clean journey test records
        id: cleanup
        if: always() && env.CHURVOX_E2E_PASSWORD != ''
        continue-on-error: true
        working-directory: frontend
        env:
          CHURVOX_E2E_CLEANUP: "1"
        run: |
          set -o pipefail
          npx playwright test tests/e2e/churvox-plans-regression-and-cleanup.spec.js --project=desktop-chromium -g "cleanup live Playwright test records" --reporter=line 2>&1 | tee ../cleanup-test-failure.txt

      - name: Save exact failing checks
        if: always() && (steps.plans_browser.outcome == 'failure' || steps.auth_plans.outcome == 'failure' || steps.owner_worker.outcome == 'failure' || steps.business_journey.outcome == 'failure')
        run: |
          kill $(cat plans-route-server.pid) 2>/dev/null || true
          git config user.name "Churvox Agent"
          git config user.email "hello@churvox.com"
          git add plans-route-server.log plans-route-test-failure.txt auth-plans-test-failure.txt owner-worker-test-failure.txt business-journey-test-failure.txt cleanup-test-failure.txt
          git commit -m "Record plans and business flow failures"
          git push origin HEAD:agent/fix-plans-route-and-flow
          exit 1

      - name: Commit verified fix and remove temporary helpers
        run: |
          kill $(cat plans-route-server.pid) 2>/dev/null || true
          rm -f .github/workflows/agent-fix-plans-route.yml scripts/agent_apply_plans_fix.py plans-route-server.pid plans-route-server.log plans-route-test-failure.txt auth-plans-test-failure.txt owner-worker-test-failure.txt business-journey-test-failure.txt cleanup-test-failure.txt
          git config user.name "Churvox Agent"
          git config user.email "hello@churvox.com"
          git add -A frontend/src/App.js frontend/src/StandalonePlansRoute.jsx frontend/tests/e2e/churvox-plans-route-contract.spec.js .github/workflows/agent-fix-plans-route.yml scripts/agent_apply_plans_fix.py plans-route-server.pid plans-route-server.log plans-route-test-failure.txt auth-plans-test-failure.txt owner-worker-test-failure.txt business-journey-test-failure.txt cleanup-test-failure.txt
          git commit -m "Fix standalone plans route"
          git push origin HEAD:agent/fix-plans-route-and-flow
