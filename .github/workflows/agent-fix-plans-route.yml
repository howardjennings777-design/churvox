name: Agent Fix Plans Route

on:
  push:
    branches:
      - agent/fix-plans-route-and-flow
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-fix-plans-route-and-flow
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CHURVOX_E2E_EMAIL: ${{ secrets.CHURVOX_E2E_EMAIL || secrets.CHURVOX_OWNER_EMAIL }}
      CHURVOX_E2E_PASSWORD: ${{ secrets.CHURVOX_E2E_PASSWORD || secrets.CHURVOX_OWNER_PASSWORD }}
      PLAYWRIGHT_API_BASE: https://grassley-backend.onrender.com
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-plans-route-and-flow
          fetch-depth: 0

      - name: Apply isolated plans route fix
        shell: python
        run: |
          from pathlib import Path

          app_path = Path("frontend/src/App.js")
          app = app_path.read_text(encoding="utf-8")

          import_anchor = 'const FreshApp = React.lazy(() => import("./churvox-fresh/FreshApp"));'
          plans_import = 'const StandalonePlansRoute = React.lazy(() => import("./StandalonePlansRoute"));'
          if plans_import not in app:
              if import_anchor not in app:
                  raise SystemExit("FreshApp import anchor not found")
              app = app.replace(import_anchor, import_anchor + "\n" + plans_import, 1)

          old_route = '<Route path="/plans" element={<FreshBusinessRoute><AppRedirect to="/dashboard#plans" /></FreshBusinessRoute>} />'
          new_route = '<Route path="/plans" element={<FreshBusinessRoute><StandalonePlansRoute /></FreshBusinessRoute>} />'
          if old_route in app:
              app = app.replace(old_route, new_route, 1)
          elif new_route not in app:
              raise SystemExit("Plans route anchor not found")

          app_path.write_text(app, encoding="utf-8")

          wrapper = '''import React from "react";
          import FreshPlans from "./churvox-fresh/FreshPlans";

          export default function StandalonePlansRoute() {
            const handleNavigate = React.useCallback((target) => {
              const section = String(target || "").trim().toLowerCase();
              if (section === "support" || section === "help") {
                window.location.assign("/support");
                return;
              }
              window.location.assign(section ? `/dashboard#${section}` : "/dashboard");
            }, []);

            return (
              <main className="cvStandalonePlansRoute" data-checkout-trace="plans-route-auth-recover-v1">
                <FreshPlans onNavigate={handleNavigate} />
              </main>
            );
          }
          '''
          wrapper = "\n".join(line[10:] if line.startswith("          ") else line for line in wrapper.splitlines()).strip() + "\n"
          Path("frontend/src/StandalonePlansRoute.jsx").write_text(wrapper, encoding="utf-8")

          test_content = '''const { test, expect } = require("@playwright/test");

          test.describe("standalone authenticated plans route", () => {
            test("keeps unauthenticated visitors on the safe login path", async ({ page }) => {
              await page.goto("/plans?country=NZ");
              await page.waitForLoadState("domcontentloaded");
              const text = (await page.locator("body").innerText()).replace(/\\s+/g, " ").trim();
              expect(page.url()).toMatch(/\\/(login|plans)(?:[?#]|$)/i);
              expect(text).toMatch(/Churvox|email|password|log in|pricing/i);
              expect(text.length).toBeGreaterThan(40);
            });
          });
          '''
          test_content = "\n".join(line[10:] if line.startswith("          ") else line for line in test_content.splitlines()).strip() + "\n"
          Path("frontend/tests/e2e/churvox-plans-route-contract.spec.js").write_text(test_content, encoding="utf-8")

      - name: Verify route source contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('frontend/src/App.js', 'utf8');
          const wrapper = fs.readFileSync('frontend/src/StandalonePlansRoute.jsx', 'utf8');
          const plans = fs.readFileSync('frontend/src/churvox-fresh/FreshPlans.jsx', 'utf8');
          if (!app.includes('<StandalonePlansRoute />')) throw new Error('/plans is not wired to StandalonePlansRoute');
          if (app.includes('path="/plans" element={<FreshBusinessRoute><AppRedirect')) throw new Error('/plans still redirects into dashboard');
          if (!wrapper.includes('plans-route-auth-recover-v1')) throw new Error('plans auth recovery marker missing');
          if (!plans.includes('Pricing country') || !plans.includes('COUNTRY_OPTIONS')) throw new Error('country-aware pricing selector missing');
          console.log('PASS: standalone /plans route, auth recovery marker and country selector are wired.');
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build patched frontend
        working-directory: frontend
        env:
          CI: false
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run local plans route contract
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/e2e/churvox-plans-route-contract.spec.js --project=desktop-chromium --reporter=line

      - name: Run authenticated plans regression when credentials exist
        if: env.CHURVOX_E2E_EMAIL != '' && env.CHURVOX_E2E_PASSWORD != ''
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/e2e/churvox-plans-regression-and-cleanup.spec.js --project=desktop-chromium -g "Plans page loads billing JSON" --reporter=line

      - name: Run owner and worker route gauntlet when credentials exist
        if: env.CHURVOX_E2E_EMAIL != '' && env.CHURVOX_E2E_PASSWORD != ''
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          CHURVOX_OWNER_EMAIL: ${{ secrets.CHURVOX_OWNER_EMAIL || secrets.CHURVOX_E2E_EMAIL }}
          CHURVOX_OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD || secrets.CHURVOX_E2E_PASSWORD }}
          CHURVOX_WORKER_EMAIL: ${{ secrets.CHURVOX_WORKER_EMAIL }}
          CHURVOX_WORKER_PASSWORD: ${{ secrets.CHURVOX_WORKER_PASSWORD }}
        run: npx playwright test tests/e2e/churvox-human-business-gauntlet.spec.js --project=desktop-chromium --workers=1 -g "owner dashboard|worker app route" --reporter=line

      - name: Run client job quote invoice journey when credentials exist
        if: env.CHURVOX_E2E_EMAIL != '' && env.CHURVOX_E2E_PASSWORD != ''
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          CHURVOX_E2E_MUTATE: "1"
        run: npx playwright test tests/e2e/churvox-real-business-audit-v2.spec.js --project=desktop-chromium --workers=1 -g "creates client, job, quote and invoice" --reporter=line

      - name: Clean journey test records
        if: always() && env.CHURVOX_E2E_EMAIL != '' && env.CHURVOX_E2E_PASSWORD != ''
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          CHURVOX_E2E_CLEANUP: "1"
        run: npx playwright test tests/e2e/churvox-plans-regression-and-cleanup.spec.js --project=desktop-chromium -g "cleanup live Playwright test records" --reporter=line

      - name: Commit verified fix and remove temporary workflow
        run: |
          rm -f .github/workflows/agent-fix-plans-route.yml
          git config user.name "Churvox Agent"
          git config user.email "hello@churvox.com"
          git add frontend/src/App.js frontend/src/StandalonePlansRoute.jsx frontend/tests/e2e/churvox-plans-route-contract.spec.js .github/workflows/agent-fix-plans-route.yml
          git commit -m "Fix standalone plans route"
          git push origin HEAD:agent/fix-plans-route-and-flow
