name: Agent Finalize Plans Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-finalize-plans-fix
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verified branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-plans-route-and-flow
          fetch-depth: 0

      - name: Apply the already verified patch
        run: python3 scripts/agent_apply_plans_fix.py

      - name: Confirm verified source markers
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('frontend/src/App.js', 'utf8');
          const route = fs.readFileSync('frontend/src/StandalonePlansRoute.jsx', 'utf8');
          const plansTest = fs.readFileSync('frontend/tests/e2e/churvox-plans-route-contract.spec.js', 'utf8');
          const loginTest = fs.readFileSync('frontend/tests/e2e/churvox-plans-regression-and-cleanup.spec.js', 'utf8');
          const ownerTest = fs.readFileSync('frontend/tests/e2e/churvox-human-business-gauntlet.spec.js', 'utf8');
          if (!app.includes('<StandalonePlansRoute />')) throw new Error('standalone plans route missing');
          if (!route.includes('plans-route-auth-recover-v1')) throw new Error('plans route marker missing');
          if (!plansTest.includes('Pricing country')) throw new Error('country selector test missing');
          if (!loginTest.includes('login submit button should be clickable')) throw new Error('login regression fix missing');
          if (!ownerTest.includes('live Churvox Studio owner workspace')) throw new Error('Studio owner gauntlet fix missing');
          NODE

      - name: Commit verified source files
        run: |
          git config user.name "Churvox Agent"
          git config user.email "hello@churvox.com"
          git add frontend/src/App.js \
            frontend/src/StandalonePlansRoute.jsx \
            frontend/tests/e2e/churvox-plans-route-contract.spec.js \
            frontend/tests/e2e/churvox-plans-regression-and-cleanup.spec.js \
            frontend/tests/e2e/churvox-human-business-gauntlet.spec.js
          if git diff --cached --quiet; then
            echo "Verified patch is already committed."
            exit 0
          fi
          git commit -m "Fix standalone plans route"
          git push origin HEAD:agent/fix-plans-route-and-flow
