name: Agent Fix Plans Route

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-fix-plans-route-and-flow
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CHURVOX_E2E_EMAIL: ${{ secrets.CHURVOX_E2E_EMAIL || secrets.CHURVOX_OWNER_EMAIL || 'hello@churvox.com' }}
      CHURVOX_E2E_PASSWORD: ${{ secrets.CHURVOX_E2E_PASSWORD || secrets.CHURVOX_OWNER_PASSWORD }}
      PLAYWRIGHT_API_BASE: https://grassley-backend.onrender.com
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-plans-route-and-flow
          fetch-depth: 0

      - name: Apply isolated plans route fix
        run: python3 scripts/agent_apply_plans_fix.py

      - name: Verify route source contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('frontend/src/App.js', 'utf8');
          const wrapper = fs.readFileSync('frontend/src/StandalonePlansRoute.jsx', 'utf8');
          const plans = fs.readFileSync('frontend/src/churvox-fresh/FreshPlans.jsx', 'utf8');
          if (!app.includes('<StandalonePlansRoute />')) throw new Error('/plans is not wired to StandalonePlansRoute');
          if (app.includes('path="/plans" element={<FreshBusinessRoute><AppRedirect')) throw new Error('/plans still redirects into dashboard');
          if (!wrapper.includes('plans-route-auth-recover-v1')) throw new Error('plans auth recovery marker missing');
          if (!plans.includes('Pricing country') || !plans.includes('COUNTRY_OPTIONS')) throw new Error('country-aware pricing selector missing');
          console.log('PASS: standalone /plans route, auth recovery marker and country selector are wired.');
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build patched frontend
        working-directory: frontend
        env:
          CI: false
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run local plans route contract
        id: plans_browser
        continue-on-error: true
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          set -o pipefail
          npx playwright test tests/e2e/churvox-plans-route-contract.spec.js --project=desktop-chromium --reporter=line 2>&1 | tee ../plans-route-test-failure.txt

      - name: Save exact browser failure
        if: steps.plans_browser.outcome == 'failure'
        run: |
          git config user.name "Churvox Agent"
          git config user.email "hello@churvox.com"
          git add plans-route-test-failure.txt
          git commit -m "Record plans route browser failure"
          git push origin HEAD:agent/fix-plans-route-and-flow
          exit 1

      - name: Run authenticated plans regression
        if: env.CHURVOX_E2E_PASSWORD != ''
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/e2e/churvox-plans-regression-and-cleanup.spec.js --project=desktop-chromium -g "Plans page loads billing JSON" --reporter=line

      - name: Run owner and worker route gauntlet
        if: env.CHURVOX_E2E_PASSWORD != ''
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          CHURVOX_OWNER_EMAIL: ${{ secrets.CHURVOX_OWNER_EMAIL || secrets.CHURVOX_E2E_EMAIL || 'hello@churvox.com' }}
          CHURVOX_OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD || secrets.CHURVOX_E2E_PASSWORD }}
          CHURVOX_WORKER_EMAIL: ${{ secrets.CHURVOX_WORKER_EMAIL }}
          CHURVOX_WORKER_PASSWORD: ${{ secrets.CHURVOX_WORKER_PASSWORD }}
        run: npx playwright test tests/e2e/churvox-human-business-gauntlet.spec.js --project=desktop-chromium --workers=1 -g "owner dashboard|worker app route" --reporter=line

      - name: Run client job quote invoice journey
        if: env.CHURVOX_E2E_PASSWORD != ''
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          CHURVOX_E2E_MUTATE: "1"
        run: npx playwright test tests/e2e/churvox-real-business-audit-v2.spec.js --project=desktop-chromium --workers=1 -g "creates client, job, quote and invoice" --reporter=line

      - name: Clean journey test records
        if: always() && env.CHURVOX_E2E_PASSWORD != ''
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          CHURVOX_E2E_CLEANUP: "1"
        run: npx playwright test tests/e2e/churvox-plans-regression-and-cleanup.spec.js --project=desktop-chromium -g "cleanup live Playwright test records" --reporter=line

      - name: Commit verified fix and remove temporary helpers
        run: |
          rm -f .github/workflows/agent-fix-plans-route.yml scripts/agent_apply_plans_fix.py plans-route-test-failure.txt
          git config user.name "Churvox Agent"
          git config user.email "hello@churvox.com"
          git add -A frontend/src/App.js frontend/src/StandalonePlansRoute.jsx frontend/tests/e2e/churvox-plans-route-contract.spec.js .github/workflows/agent-fix-plans-route.yml scripts/agent_apply_plans_fix.py plans-route-test-failure.txt
          git commit -m "Fix standalone plans route"
          git push origin HEAD:agent/fix-plans-route-and-flow
