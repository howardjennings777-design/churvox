name: Apply exact HQ tester row fix

on:
  push:
    branches:
      - agent/clean-full-ui-test

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clean-full-ui-test
          fetch-depth: 1

      - name: Require exact tester row
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/tests/e2e/churvox-paid-launch-hq-reality.spec.js')
          text = path.read_text()
          old = "    const pendingRow = page.locator('tr').filter({ hasText: 'Tester@Real.test' }).filter({ has: page.getByRole('button', { name: 'Revoke', exact: true }) }).first();"
          new = "    const pendingRow = page.locator('tr').filter({ has: page.getByText('Tester@Real.test', { exact: true }) }).filter({ has: page.getByRole('button', { name: 'Revoke', exact: true }) }).first();"
          if old not in text:
              raise SystemExit('Expected HQ tester row selector was not found.')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/churvox-apply-clean-test-fixes-3.yml

      - name: Commit exact row fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/tests/e2e/churvox-paid-launch-hq-reality.spec.js .github/workflows/churvox-apply-clean-test-fixes-3.yml
          git commit -m "Select exact tester row in HQ audit"
          git push origin HEAD:agent/clean-full-ui-test
