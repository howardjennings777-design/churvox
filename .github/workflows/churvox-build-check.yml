name: Churvox Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Materialise verified Churvox V8 source
      run: node scripts/churvox_hardening_v8_materialize.cjs

    - name: Install backend contract dependencies
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir fastapi==0.110.1 pymongo==4.5.0

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci --legacy-peer-deps

    - name: Build frontend
      working-directory: ./frontend
      shell: bash
      env:
        CI: false
      run: |
        set -o pipefail
        npm run build 2>&1 | tee "$RUNNER_TEMP/frontend-build.txt"

    - name: Upload frontend build report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: churvox-frontend-build-report
        path: ${{ runner.temp }}/frontend-build.txt
        if-no-files-found: error

    - name: Validate backend syntax
      shell: bash
      run: |
        set +e
        set -o pipefail
        report="$RUNNER_TEMP/backend-syntax.txt"
        status=0
        files=(
          backend/server.py
          backend/xero_routes.py
          backend/churvox_command_routes.py
          backend/churvox_ai_operator_routes.py
          backend/churvox_command_compat_routes.py
          backend/churvox_command_apply_routes.py
          backend/churvox_command_human_mimic_routes.py
          backend/churvox_command_human_mimic_guard_routes.py
          backend/churvox_command_mimic_intelligence_routes.py
          backend/churvox_command_human_mimic_marker_routes.py
          backend/churvox_paid_launch_readiness_routes.py
          backend/churvox_job_done_routes.py
          backend/churvox_owner_intelligence_routes.py
          usercustomize.py
          backend/usercustomize.py
        )
        : > "$report"
        for file in "${files[@]}"; do
          echo "== $file ==" | tee -a "$report"
          if python3 -m py_compile "$file" 2>&1 | tee -a "$report"; then
            echo "PASS" | tee -a "$report"
          else
            echo "FAIL" | tee -a "$report"
            status=1
          fi
          echo | tee -a "$report"
        done
        exit "$status"

    - name: Upload backend syntax report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: churvox-backend-syntax-report
        path: ${{ runner.temp }}/backend-syntax.txt
        if-no-files-found: error

    - name: Run current launch contracts
      shell: bash
      run: |
        set +e
        set -o pipefail
        report="$RUNNER_TEMP/launch-contracts.txt"
        status=0
        checks=(
          "Fresh Studio has one owner shell|scripts/audit_fresh_no_double_shell.py"
          "Command wiring|scripts/audit_command_wiring.py"
          "Command runs the office safely|scripts/churvox-command-runs-office-contract.py"
          "Worker and owner messaging|scripts/churvox-worker-owner-message-contract.py"
          "Recurring job idempotency|scripts/churvox-recurring-idempotency-contract.py"
          "Job completion final contract|scripts/churvox-job-completion-final-contract.py"
          "Job Done reality contract|scripts/churvox-job-done-reality-contract.py"
          "Paid launch backend contract|scripts/churvox_paid_launch_backend_contract.py"
          "Launch completion matrix|scripts/audit_launch_done_matrix.py"
        )
        : > "$report"
        for check in "${checks[@]}"; do
          label="${check%%|*}"
          script="${check#*|}"
          echo "== $label ==" | tee -a "$report"
          echo "script=$script" | tee -a "$report"
          if [ ! -f "$script" ]; then
            echo "FAIL — current contract file is missing" | tee -a "$report"
            status=1
          elif python3 "$script" 2>&1 | tee -a "$report"; then
            echo "PASS" | tee -a "$report"
          else
            echo "FAIL" | tee -a "$report"
            status=1
          fi
          echo | tee -a "$report"
        done
        exit "$status"

    - name: Upload launch contract report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: churvox-launch-contract-report
        path: ${{ runner.temp }}/launch-contracts.txt
        if-no-files-found: error
