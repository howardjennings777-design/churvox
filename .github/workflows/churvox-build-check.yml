name: Churvox Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Materialise verified Churvox V8 source
      run: node scripts/churvox_hardening_v8_materialize.cjs

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci --legacy-peer-deps

    - name: Build frontend
      working-directory: ./frontend
      env:
        CI: false
      run: npm run build

    - name: Validate backend syntax
      run: |
        python3 -m py_compile backend/server.py
        python3 -m py_compile backend/xero_routes.py
        python3 -m py_compile backend/churvox_command_routes.py
        python3 -m py_compile backend/churvox_automation_engine.py
        python3 -m py_compile backend/churvox_email_notifications.py
        python3 -m py_compile backend/churvox_quote_workflow.py
        python3 -m py_compile backend/churvox_ai_operator_routes.py
        python3 -m py_compile backend/churvox_command_compat_routes.py
        python3 -m py_compile backend/churvox_command_apply_routes.py
        python3 -m py_compile backend/churvox_command_human_mimic_routes.py
        python3 -m py_compile backend/churvox_command_human_mimic_guard_routes.py
        python3 -m py_compile backend/churvox_command_mimic_intelligence_routes.py
        python3 -m py_compile backend/churvox_command_human_mimic_marker_routes.py
        python3 -m py_compile backend/churvox_paid_launch_readiness_routes.py
        python3 -m py_compile backend/churvox_job_done_routes.py
        python3 -m py_compile backend/churvox_owner_intelligence_routes.py
        python3 -m py_compile usercustomize.py
        python3 -m py_compile backend/usercustomize.py

    - name: Verify real command and automation wiring
      run: python3 scripts/verify_command_automation_contract.py

    - name: Verify Command writes into real records
      run: python3 scripts/verify_command_apply_contract.py

    - name: Verify real quote and invoice action wiring
      run: python3 scripts/verify_quote_invoice_action_contract.py

    - name: Verify browser-level quote and invoice action flow
      run: python3 scripts/verify_quote_invoice_browser_flow_contract.py

    - name: Verify worker to owner and owner to worker messaging wiring
      run: python3 scripts/verify_worker_owner_messaging_contract.py

    - name: Verify Jobs open and support create edit delete actions
      run: python3 scripts/verify_jobs_open_actions_contract.py

    - name: Verify client history and worker records open properly
      run: python3 scripts/verify_client_worker_open_records_contract.py

    - name: Verify no page-visible workspace is empty
      run: python3 scripts/verify_no_empty_pages_contract.py

    - name: Verify paid launch baseline contracts
      run: python3 scripts/verify_paid_launch_contracts.py

    - name: Verify Command Full Control contract
      run: python3 scripts/churvox-command-full-control-contract.py

    - name: Verify Command real AI operator contract
      run: python3 scripts/churvox-ai-operator-reality-contract.py

    - name: Verify Command human mimic guard contract
      run: python3 scripts/churvox-command-human-mimic-guard-contract.py

    - name: Verify real AI operator integration contract
      run: python3 scripts/churvox-ai-operator-integration-contract.py

    - name: Verify real Command apply reality contract
      run: python3 scripts/churvox-command-apply-reality-contract.py

    - name: Verify Command human mimic intelligence contract
      run: python3 scripts/churvox-command-human-mimic-intelligence-contract.py

    - name: Verify paid launch readiness contract
      run: python3 scripts/churvox-paid-launch-readiness-contract.py

    - name: Verify Command human mimic smoke contract
      run: python3 scripts/churvox-command-human-mimic-smoke-contract.py

    - name: Verify Command shared live state contract
      run: python3 scripts/churvox-command-live-smoke-contract.py

    - name: Verify Command source truth contract
      run: python3 scripts/churvox-command-source-truth-contract.py

    - name: Verify Job Done reality contract
      run: python3 scripts/churvox-job-done-reality-contract.py

    - name: Verify Churvox Intelligence reality contract
      run: python3 scripts/churvox-intelligence-reality-contract.py
