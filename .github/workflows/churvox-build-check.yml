name: Churvox Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Materialise verified Churvox V8 source
      run: node scripts/churvox_hardening_v8_materialize.cjs

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci --legacy-peer-deps

    - name: Build frontend
      working-directory: ./frontend
      env:
        CI: false
      run: npm run build

    - name: Validate backend syntax
      shell: bash
      run: |
        set +e
        set -o pipefail
        report="$RUNNER_TEMP/backend-syntax.txt"
        status=0
        files=(
          backend/server.py
          backend/xero_routes.py
          backend/churvox_command_routes.py
          backend/churvox_ai_operator_routes.py
          backend/churvox_command_compat_routes.py
          backend/churvox_command_apply_routes.py
          backend/churvox_command_human_mimic_routes.py
          backend/churvox_command_human_mimic_guard_routes.py
          backend/churvox_command_mimic_intelligence_routes.py
          backend/churvox_command_human_mimic_marker_routes.py
          backend/churvox_paid_launch_readiness_routes.py
          backend/churvox_job_done_routes.py
          backend/churvox_owner_intelligence_routes.py
          usercustomize.py
          backend/usercustomize.py
        )
        : > "$report"
        for file in "${files[@]}"; do
          echo "== $file ==" | tee -a "$report"
          if python3 -m py_compile "$file" 2>&1 | tee -a "$report"; then
            echo "PASS" | tee -a "$report"
          else
            echo "FAIL" | tee -a "$report"
            status=1
          fi
          echo | tee -a "$report"
        done
        exit "$status"

    - name: Upload backend syntax report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: churvox-backend-syntax-report
        path: ${{ runner.temp }}/backend-syntax.txt
        if-no-files-found: error

    - name: Run every launch contract
      shell: bash
      run: |
        set +e
        set -o pipefail
        report="$RUNNER_TEMP/launch-contracts.txt"
        status=0
        checks=(
          "Real command and automation wiring|scripts/verify_command_automation_contract.py"
          "Command writes into real records|scripts/verify_command_apply_contract.py"
          "Real quote and invoice action wiring|scripts/verify_quote_invoice_action_contract.py"
          "Browser-level quote and invoice action flow|scripts/verify_quote_invoice_browser_flow_contract.py"
          "Worker to owner and owner to worker messaging wiring|scripts/verify_worker_owner_messaging_contract.py"
          "Jobs open and create edit delete actions|scripts/verify_jobs_open_actions_contract.py"
          "Client history and worker records open|scripts/verify_client_worker_open_records_contract.py"
          "No page-visible workspace is empty|scripts/verify_no_empty_pages_contract.py"
          "Paid launch baseline contracts|scripts/verify_paid_launch_contracts.py"
          "Command Full Control contract|scripts/churvox-command-full-control-contract.py"
          "Command real AI operator contract|scripts/churvox-ai-operator-reality-contract.py"
          "Command human mimic guard contract|scripts/churvox-command-human-mimic-guard-contract.py"
          "Real AI operator integration contract|scripts/churvox-ai-operator-integration-contract.py"
          "Real Command apply reality contract|scripts/churvox-command-apply-reality-contract.py"
          "Command human mimic intelligence contract|scripts/churvox-command-human-mimic-intelligence-contract.py"
          "Paid launch readiness contract|scripts/churvox-paid-launch-readiness-contract.py"
          "Command human mimic smoke contract|scripts/churvox-command-human-mimic-smoke-contract.py"
          "Command shared live state contract|scripts/churvox-command-live-smoke-contract.py"
          "Command source truth contract|scripts/churvox-command-source-truth-contract.py"
          "Job Done reality contract|scripts/churvox-job-done-reality-contract.py"
          "Churvox Intelligence reality contract|scripts/churvox-intelligence-reality-contract.py"
        )
        : > "$report"
        for check in "${checks[@]}"; do
          label="${check%%|*}"
          script="${check#*|}"
          echo "== $label ==" | tee -a "$report"
          echo "script=$script" | tee -a "$report"
          if python3 "$script" 2>&1 | tee -a "$report"; then
            echo "PASS" | tee -a "$report"
          else
            echo "FAIL" | tee -a "$report"
            status=1
          fi
          echo | tee -a "$report"
        done
        exit "$status"

    - name: Upload launch contract report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: churvox-launch-contract-report
        path: ${{ runner.temp }}/launch-contracts.txt
        if-no-files-found: error
