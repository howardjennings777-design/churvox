name: Churvox Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-check:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend compile checks
        run: |
          python3 -m py_compile backend/server.py
          python3 -m compileall -q backend

  frontend-build:
    name: Frontend install and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          registry-url: "https://registry.npmjs.org"

      - name: Force public npm registry
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config get registry

      - name: Install frontend dependencies
        run: npm --prefix frontend install --legacy-peer-deps --registry=https://registry.npmjs.org/

      - name: Verify craco exists
        run: |
          test -f frontend/node_modules/.bin/craco
          npm --prefix frontend list @craco/craco

      - name: Build frontend
        run: npm --prefix frontend run build
