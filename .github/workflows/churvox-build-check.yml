name: Churvox Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-check:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend compile checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          import sys

          failures = []
          for path in sorted(Path("backend").rglob("*.py")):
              try:
                  py_compile.compile(str(path), doraise=True)
              except py_compile.PyCompileError as exc:
                  failures.append((path, exc.msg))

          report = Path("/tmp/backend-compile-errors.txt")
          if failures:
              lines = [f"Backend compile failures: {len(failures)}"]
              for path, message in failures:
                  lines.extend(["", f"--- {path} ---", message])
              report.write_text("\n".join(lines) + "\n")
              print(report.read_text())
              sys.exit(1)

          report.write_text("All backend Python files compiled successfully.\n")
          print(report.read_text())
          PY

      - name: Job Done reality contract
        run: python3 scripts/churvox-job-done-reality-contract.py

      - name: Paid account boundary contract
        run: python3 scripts/churvox-paid-account-boundary-contract.py

      - name: Churvox Intelligence contract
        run: python3 scripts/churvox-owner-intelligence-contract.py

      - name: Churvox Go Live and Trust contract
        run: python3 scripts/churvox-launch-hardening-contract.py

      - name: Upload backend compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-compile-diagnostics
          path: /tmp/backend-compile-errors.txt
          if-no-files-found: error
          retention-days: 3

  frontend-build:
    name: Frontend install and build
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          registry-url: "https://registry.npmjs.org"

      - name: Force public npm registry
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config get registry

      - name: Install frontend dependencies
        run: npm --prefix frontend install --legacy-peer-deps --registry=https://registry.npmjs.org/

      - name: Verify craco exists
        run: |
          test -f frontend/node_modules/.bin/craco
          npm --prefix frontend list @craco/craco

      - name: Build frontend
        shell: bash
        run: |
          set -o pipefail
          npm --prefix frontend run build 2>&1 | tee /tmp/frontend-build.log

      - name: Upload frontend build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-diagnostics
          path: /tmp/frontend-build.log
          if-no-files-found: error
          retention-days: 3
