name: Churvox Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Materialise verified Churvox V8 source
      run: node scripts/churvox_hardening_v8_materialize.cjs

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci --legacy-peer-deps

    - name: Build frontend
      working-directory: ./frontend
      env:
        CI: false
      run: npm run build

    - name: Validate every materialised backend Python file
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import py_compile
        import sys

        failures = []
        files = sorted(Path("backend").rglob("*.py")) + [Path("usercustomize.py")]
        for file in files:
            if not file.exists():
                continue
            try:
                py_compile.compile(str(file), doraise=True)
            except py_compile.PyCompileError as error:
                failures.append(f"{file}: {error.msg}")

        if failures:
            print("\n\n".join(failures))
            sys.exit(1)
        print(f"Compiled {len(files)} materialised Python files successfully.")
        PY

    - name: Run maintained repository contracts
      shell: bash
      run: |
        set -euo pipefail
        contracts=(
          scripts/verify_command_automation_contract.py
          scripts/verify_command_apply_contract.py
          scripts/verify_quote_invoice_action_contract.py
          scripts/verify_quote_invoice_browser_flow_contract.py
          scripts/verify_worker_owner_messaging_contract.py
          scripts/verify_jobs_open_actions_contract.py
          scripts/verify_client_worker_open_records_contract.py
          scripts/verify_no_empty_pages_contract.py
          scripts/verify_paid_launch_contracts.py
          scripts/churvox-command-full-control-contract.py
          scripts/churvox-ai-operator-reality-contract.py
          scripts/churvox-command-human-mimic-guard-contract.py
          scripts/churvox-ai-operator-integration-contract.py
          scripts/churvox-command-apply-reality-contract.py
          scripts/churvox-command-human-mimic-intelligence-contract.py
          scripts/churvox-paid-launch-readiness-contract.py
          scripts/churvox-command-human-mimic-smoke-contract.py
          scripts/churvox-command-live-smoke-contract.py
          scripts/churvox-command-source-truth-contract.py
          scripts/churvox-job-done-reality-contract.py
          scripts/churvox-intelligence-reality-contract.py
        )
        ran=0
        retired=0
        for contract in "${contracts[@]}"; do
          if [ -f "${contract}" ]; then
            echo "Running ${contract}"
            python3 "${contract}"
            ran=$((ran + 1))
          else
            echo "Retired contract not present: ${contract}"
            retired=$((retired + 1))
          fi
        done
        echo "Maintained contracts run: ${ran}; retired references ignored: ${retired}."
