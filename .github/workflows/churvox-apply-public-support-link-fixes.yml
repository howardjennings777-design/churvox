name: Fix remaining public support link tap targets

on:
  push:
    branches:
      - agent/clean-full-ui-test

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clean-full-ui-test
          fetch-depth: 1

      - name: Enlarge proof and client support links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'frontend/src/pages/public/PublicProofPackPage.jsx': (
                  '<a href="mailto:hello@churvox.com?subject=Churvox%20proof%20pack">contact Churvox support</a>',
                  '<a href="mailto:hello@churvox.com?subject=Churvox%20proof%20pack" style={{ display: "inline-flex", alignItems: "center", minHeight: 28, padding: "2px 4px" }}>contact Churvox support</a>',
              ),
              'frontend/src/pages/public/PublicClientPortalPage.js': (
                  '<a href="mailto:hello@churvox.com?subject=Churvox%20client%20portal">contact Churvox support</a>',
                  '<a href="mailto:hello@churvox.com?subject=Churvox%20client%20portal" style={{ display: "inline-flex", alignItems: "center", minHeight: 28, padding: "2px 4px" }}>contact Churvox support</a>',
              ),
          }

          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected support link not found in {filename}.')
              path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/churvox-apply-public-support-link-fixes.yml

      - name: Commit remaining public tap-target fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/public/PublicProofPackPage.jsx \
                  frontend/src/pages/public/PublicClientPortalPage.js \
                  .github/workflows/churvox-apply-public-support-link-fixes.yml
          git commit -m "Make public fallback links mobile tap friendly"
          git push origin HEAD:agent/clean-full-ui-test
