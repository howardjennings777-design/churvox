name: Fix Recovery Undo State

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/churvox-go-live-trust-clean
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Harden recovery state and browser contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          component = Path('frontend/src/churvox-office-lab/OfficeTeamLaunchHardening.jsx')
          source = component.read_text()
          old = '''    try { const body = await undoRecoveryReceipt(item.id); setSummary((current) => ({ ...current, recovery: (current.recovery || []).map((receipt) => receipt.id === item.id ? body.receipt : receipt) })); setNotice("The reversible internal action was undone and recorded."); }'''
          new = '''    try {\n      const body = await undoRecoveryReceipt(item.id);\n      const updatedReceipt = body?.receipt;\n      if (!updatedReceipt?.id || updatedReceipt.id !== item.id) throw new Error("Churvox could not confirm the recovery receipt. Nothing was changed on this screen.");\n      setSummary((current) => ({ ...current, recovery: (current?.recovery || []).filter(Boolean).map((receipt) => receipt.id === item.id ? updatedReceipt : receipt) }));\n      setNotice("The reversible internal action was undone and recorded.");\n    }'''
          if old not in source:
              raise SystemExit('Recovery undo source block not found')
          source = source.replace(old, new, 1)
          source = source.replace(
              '''<strong>{(summary?.recovery || []).filter((item) => item.reversible && item.status === "available").length}</strong>''',
              '''<strong>{(summary?.recovery || []).filter((item) => item && item.reversible && item.status === "available").length}</strong>''',
              1,
          )
          source = source.replace(
              '''function Recovery({ items, busy, setBusy, setSummary, setNotice }) {''',
              '''function Recovery({ items, busy, setBusy, setSummary, setNotice }) {\n  const receipts = (Array.isArray(items) ? items : []).filter((item) => item?.id);''',
              1,
          )
          source = source.replace(
              '''<div className="cvLaunchRecovery">{items.length ? items.map((item) =>''',
              '''<div className="cvLaunchRecovery">{receipts.length ? receipts.map((item) =>''',
              1,
          )
          component.write_text(source)

          spec = Path('frontend/tests/e2e/churvox-launch-hardening.spec.js')
          test_source = spec.read_text()
          old_mock = '''    if (path === '/api/launch-hardening/recovery/receipt-1/undo') return route.fulfill(json({ success: true, receipt: { ...summary(plan).recovery[0], status: 'undone' } }));'''
          new_mock = '''    if (/^\\/api\\/launch-hardening\\/recovery\\/[^/]+\\/undo$/.test(path)) {\n      const receiptId = decodeURIComponent(path.split('/').at(-2));\n      const known = summary(plan).recovery.find((item) => item.id === receiptId) || { id: receiptId, title: 'Reversible owner action', reversible: true, before: {}, after: {} };\n      return route.fulfill(json({ success: true, receipt: { ...known, status: 'undone', reversible: false } }));\n    }'''
          if old_mock not in test_source:
              raise SystemExit('Recovery browser mock not found')
          spec.write_text(test_source.replace(old_mock, new_mock, 1))
          PY
          python3 scripts/churvox-owner-intelligence-contract.py
          python3 scripts/churvox-launch-hardening-contract.py
          node --check frontend/tests/e2e/churvox-launch-hardening.spec.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/churvox-office-lab/OfficeTeamLaunchHardening.jsx frontend/tests/e2e/churvox-launch-hardening.spec.js
          git commit -m "Harden recovery undo state"
          git push origin HEAD:agent/churvox-go-live-trust-clean
