name: Churvox Correct Final Repair Anchor

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  correct:
    if: startsWith(github.event.issue.title, '[churvox-correct-final-repair-anchor]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace fragile wrapper anchor with structural insertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/churvox-final-human-audit-repair.yml')
          text = path.read_text()
          start_marker = "          anchor = '''    _install_patch("
          end_marker = "          wrapper_path.write_text(wrapper)\n"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('old wrapper anchor block start not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('old wrapper anchor block end not found')
          end += len(end_marker)
          replacement = '''          worker_decision_marker = '("churvox_worker_field_slip_decision_patch", "backend.churvox_worker_field_slip_decision_patch"),'
          marker_index = wrapper.find(worker_decision_marker)
          if marker_index < 0:
              raise SystemExit('worker field-slip decision installer marker not found')
          block_start = wrapper.rfind('    _install_patch(', 0, marker_index)
          block_end = wrapper.find('\n    )', marker_index)
          if block_start < 0 or block_end < 0:
              raise SystemExit('worker field-slip decision installer block boundaries not found')
          block_end += len('\n    )')
          worker_block = wrapper[block_start:block_end]
          command_block = (
              '    _install_patch(\n'
              '        module,\n'
              '        ("churvox_command_slip_decision_patch", "backend.churvox_command_slip_decision_patch"),\n'
              '        "final Command slip decision routes",\n'
              '    )'
          )
          if 'churvox_command_slip_decision_patch' not in wrapper:
              wrapper = wrapper[:block_start] + command_block + '\n' + worker_block + wrapper[block_end:]
          wrapper_path.write_text(wrapper)
          print('patched: final startup wrapper owns Command decisions')
'''
          path.write_text(text[:start] + replacement + text[end:])
          print('corrected final repair workflow wrapper insertion')
          PY

      - name: Validate workflow YAML
        run: ruby -e "require 'yaml'; YAML.load_file('.github/workflows/churvox-final-human-audit-repair.yml'); puts 'workflow YAML valid'"

      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/churvox-final-human-audit-repair.yml
          git commit -m 'Fix final human audit repair wrapper insertion'
          git push origin HEAD:main

      - name: Post result
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Corrected the final repair wrapper insertion and validated the workflow YAML.' });
