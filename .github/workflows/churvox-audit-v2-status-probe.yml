name: Churvox Audit V2 Status Probe

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  status:
    if: startsWith(github.event.issue.title, '[churvox-audit-v2-status]')
    runs-on: ubuntu-latest
    steps:
      - name: Post latest V2 run and job state
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              event: 'issues',
              per_page: 100,
            });
            const run = runs
              .filter((item) => item.name === 'Churvox Live Human Launch Audit V2')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (!run) throw new Error('No V2 audit run found.');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const lines = jobs.map((job) => {
              const current = (job.steps || []).find((step) => step.status === 'in_progress');
              const failed = (job.steps || []).filter((step) => step.conclusion === 'failure').map((step) => step.name);
              return `- ${job.name}: ${job.status}${job.conclusion ? ` / ${job.conclusion}` : ''}${current ? ` — running: ${current.name}` : ''}${failed.length ? ` — failed: ${failed.join(', ')}` : ''}`;
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [`V2 audit run ${run.id}: **${run.status}${run.conclusion ? ` / ${run.conclusion}` : ''}**`, ...lines].join('\n'),
            });
