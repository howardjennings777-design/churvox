name: Churvox Command Fast Load Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-command-fast-load-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply focused Command repair
        run: python scripts/churvox-command-fast-load-apply.py

      - name: Run permanent source contract
        run: node scripts/churvox-command-fast-load-contract.cjs

      - name: Compile and test backend route precedence
        run: |
          python -m pip install -q pytest fastapi pymongo
          python -m py_compile \
            backend/churvox_paid_launch_live_patch.py \
            backend/churvox_command_human_mimic_routes.py \
            backend/churvox_command_human_mimic_guard_routes.py \
            backend/churvox_start.py
          python -m pytest -q backend/test_churvox_command_fast_load_patch.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Production frontend build
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start local frontend
        working-directory: frontend
        run: |
          npm start > /tmp/churvox-command-fast-load-local.txt 2>&1 &
          for i in {1..75}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/churvox-command-fast-load-local.txt
          exit 1

      - name: Prove queue displays before scan and audit
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          npx playwright test tests/e2e/churvox-command-fast-load.spec.js \
            --project=desktop-chromium \
            --workers=1 \
            --reporter=line

      - name: Commit verified repair
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- frontend/package.json frontend/package-lock.json 2>/dev/null || true
          git clean -fd frontend/build frontend/test-results frontend/playwright-report 2>/dev/null || true
          git add \
            frontend/src/churvox-office-lab/OfficeTeamLabSite.jsx \
            frontend/src/churvox-office-lab/OfficeTeamCommandApi.js \
            backend/churvox_paid_launch_live_patch.py \
            backend/churvox_command_human_mimic_routes.py \
            backend/churvox_command_human_mimic_guard_routes.py \
            backend/churvox_start.py
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Load Command queue before background brain scan"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const sha = '${{ steps.publish.outputs.sha }}' || 'not published';
            const body = ok
              ? `## Command fast-load repair passed\n\n- Existing Command decisions render before the full business scan and audit.\n- Queue, audit and scan requests have bounded deadlines.\n- Final production route precedence is forced after legacy server registration.\n- Command reads exclude audit history and no longer wait for index creation or unrelated counts.\n- Human mimic reads, storage and guard cleanup use bounded concurrency.\n- Backend precedence test, production build and browser queue-first test passed.\n- Commit: \`${sha}\``
              : `## Command fast-load repair failed safely\n\nNo unverified product repair was published. Workflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
