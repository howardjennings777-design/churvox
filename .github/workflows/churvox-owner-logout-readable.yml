name: Churvox Owner Logout and Readability

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/runtime/churvoxVisibleLogoutRuntime.js'
      - 'frontend/src/churvox-office-lab/OfficeTeamVisualRepair.css'
      - 'frontend/tests/e2e/churvox-owner-logout-readable.spec.js'
      - '.github/workflows/churvox-owner-logout-readable.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: churvox-owner-logout-readable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-access:
    name: Desktop and mobile logout/readability proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prove logout and readable text
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          set -o pipefail
          npx playwright test \
            tests/e2e/churvox-owner-logout-readable.spec.js \
            --project=desktop-chromium \
            --project=mobile-chromium \
            --workers=1 \
            --reporter=line 2>&1 | tee /tmp/churvox-owner-access-test.log

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churvox-owner-logout-readable-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
            /tmp/churvox-owner-access-test.log
          if-no-files-found: ignore
          retention-days: 7
