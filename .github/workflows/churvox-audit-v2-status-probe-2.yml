name: Churvox Audit V2 Status Probe 2

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  status:
    if: startsWith(github.event.issue.title, '[churvox-audit-v2-status2]')
    runs-on: ubuntu-latest
    steps:
      - name: Post actual non-skipped V2 run and job state
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              event: 'issues',
              per_page: 100,
            });
            const candidates = runs
              .filter((item) => item.name === 'Churvox Live Human Launch Audit V2')
              .filter((item) => item.conclusion !== 'skipped')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const run = candidates[0];
            if (!run) throw new Error('No non-skipped V2 audit run found.');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const lines = jobs.map((job) => {
              const current = (job.steps || []).find((step) => step.status === 'in_progress');
              const failed = (job.steps || []).filter((step) => step.conclusion === 'failure').map((step) => step.name);
              return `- ${job.name}: ${job.status}${job.conclusion ? ` / ${job.conclusion}` : ''}${current ? ` — running: ${current.name}` : ''}${failed.length ? ` — failed: ${failed.join(', ')}` : ''}`;
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [`Actual V2 audit run ${run.id}: **${run.status}${run.conclusion ? ` / ${run.conclusion}` : ''}**`, ...lines].join('\n'),
            });

  live-file-status:
    if: startsWith(github.event.issue.title, '[churvox-live-file-compare-status]')
    runs-on: ubuntu-latest
    steps:
      - name: Post exact live bundle proof state
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              event: 'issues',
              per_page: 100,
            });
            const run = runs
              .filter((item) => item.name === 'Churvox live file compare')
              .filter((item) => item.conclusion !== 'skipped')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (!run) throw new Error('No live file compare run found.');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const lines = jobs.map((job) => {
              const current = (job.steps || []).find((step) => step.status === 'in_progress');
              const failed = (job.steps || []).filter((step) => step.conclusion === 'failure').map((step) => step.name);
              return `- ${job.name}: ${job.status}${job.conclusion ? ` / ${job.conclusion}` : ''}${current ? ` — running: ${current.name}` : ''}${failed.length ? ` — failed: ${failed.join(', ')}` : ''}`;
            });
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: [`Live file compare run ${run.id}: **${run.status}${run.conclusion ? ` / ${run.conclusion}` : ''}**`, ...lines].join('\n') });
