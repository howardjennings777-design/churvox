name: Churvox Server Wrapper Final Command Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-server-wrapper-final-command]')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check fastapi==0.110.1 pymongo==4.5.0 pytest

      - name: Apply final server wrapper repair
        run: python scripts/churvox-server-wrapper-final-command-repair.py

      - name: Compile, contract and focused test gate
        shell: bash
        run: |
          set -o pipefail
          {
            python -m py_compile backend/server/__init__.py backend/churvox_paid_launch_live_patch.py
            node scripts/churvox-server-wrapper-final-command-contract.cjs
            node scripts/churvox-command-queue-speed-backend-contract.cjs
            pytest -q backend/test_churvox_command_fast_load_patch.py
          } 2>&1 | tee /tmp/churvox-server-wrapper-final-command.txt

      - name: Commit verified wrapper repair
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add backend/server/__init__.py
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Mount final Command speed routes in live server wrapper'
          git reset --hard HEAD
          git clean -fdx
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ job.status }}' === 'success';
            const sha = '${{ steps.publish.outputs.sha }}' || 'not published';
            const output = fs.existsSync('/tmp/churvox-server-wrapper-final-command.txt') ? fs.readFileSync('/tmp/churvox-server-wrapper-final-command.txt', 'utf8').slice(-7000) : 'No output.';
            const body = ok
              ? `## Final live Command wrapper repair passed\n\nThe exact module Render is serving now force-installs the queue-speed routes last and exposes a safe live marker.\n\nCommit: \`${sha}\`\n\n\`\`\`text\n${output}\n\`\`\``
              : `## Final live Command wrapper repair failed safely\n\nNo unverified wrapper change was published.\n\n\`\`\`text\n${output}\n\`\`\`\n\nWorkflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
