name: Resolve PR 746 Visible Run

on:
  pull_request:
    branches: [audit/churvox-pr746-base-20260726]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  actions: read

concurrency:
  group: resolve-pr746-visible
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: agent/churvox-office-os-foundation
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main safely
        id: merge
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash scripts/churvox-resolve-pr746-main.sh 2>&1 | tee resolve-pr746.log

      - name: Upload exact merge log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolve-pr746-log-${{ github.run_id }}
          path: resolve-pr746.log
          if-no-files-found: error
          retention-days: 2

      - name: Fail if merge did not complete
        if: steps.merge.outcome != 'success'
        run: exit 1
