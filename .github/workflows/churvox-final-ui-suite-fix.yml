name: Apply final Studio UI suite fixes

on:
  push:
    branches: [ agent/final-studio-launch-fix ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-studio-launch-fix
          fetch-depth: 0

      - name: Fix current mobile and Studio test coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          css = Path('frontend/src/pages/marketing/ChurvoxPublicWorld.css')
          text = css.read_text()
          old = '.cpWorldFooterGroup a { color: rgba(255,255,255,.7); font-size: 12px; font-weight: 800; }'
          new = '.cpWorldFooterGroup a { min-height: 44px; display: flex; align-items: center; padding: 6px 0; color: rgba(255,255,255,.7); font-size: 12px; font-weight: 800; }'
          if text.count(old) != 1:
              raise SystemExit('Expected one public footer link rule')
          css.write_text(text.replace(old, new, 1))

          package = Path('frontend/package.json')
          data = json.loads(package.read_text())
          current_specs = 'tests/e2e/churvox-full-ui-logic-buttons.spec.js tests/e2e/churvox-public-honesty-and-function.spec.js tests/e2e/churvox-owner-no-fake-data.spec.js tests/e2e/churvox-paid-launch-hq-reality.spec.js tests/e2e/churvox-studio-visual.spec.js'
          data['scripts']['test:ui:full'] = f'PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 playwright test {current_specs} --workers=1'
          data['scripts']['test:ui:desktop'] = f'PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 playwright test {current_specs} --project=desktop-chromium --workers=1'
          data['scripts']['test:ui:mobile'] = f'PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 playwright test {current_specs} --project=mobile-chromium --workers=1'
          package.write_text(json.dumps(data, indent=2) + '\n')

          truth = Path('frontend/tests/e2e/churvox-owner-no-fake-data.spec.js')
          text = truth.read_text()
          old_screens = "const OWNER_SCREENS = ['today', 'command', 'work', 'schedule', 'clients', 'messages', 'worker', 'quotes', 'invoices', 'money', 'staff', 'payroll', 'team', 'automation', 'branding', 'settings', 'plans', 'help'];"
          new_screens = "const OWNER_SCREENS = ['today', 'command', 'jobs', 'schedule', 'recurring', 'clients', 'messages', 'crew', 'field', 'timesheets', 'access', 'quotes', 'invoices', 'money', 'accounting', 'settings', 'plans', 'support'];"
          if text.count(old_screens) != 1:
              raise SystemExit('Expected one old owner screen list')
          text = text.replace(old_screens, new_screens, 1)
          old_open = """  await expect(page.locator('.cvOfficeSite')).toBeVisible();
  await expect(page.locator('.cvSiteScreen')).toBeVisible();
  await expect(page.locator('.cvOfficeSite')).toHaveAttribute('data-screen', screen);
"""
          new_open = """  await expect(page.locator('[data-churvox-layout=\"fresh-studio\"]')).toBeVisible();
  await expect(page.locator('.cvsWorkspace')).toBeVisible();
  await expect(page.locator(`.cvsStudio.page-${screen}`)).toBeVisible();
"""
          if text.count(old_open) != 1:
              raise SystemExit('Expected one retired owner shell assertion block')
          text = text.replace(old_open, new_open, 1)
          old_text = "const text = (await page.locator('.cvSiteScreen').innerText()).replace(/\\s+/g, ' ').trim();"
          new_text = "const text = (await page.locator('.cvsWorkspace').innerText()).replace(/\\s+/g, ' ').trim();"
          if text.count(old_text) != 1:
              raise SystemExit('Expected one retired owner screen text locator')
          truth.write_text(text.replace(old_text, new_text, 1))

          intelligence = Path('scripts/churvox-owner-intelligence-contract.py')
          text = intelligence.read_text()
          old = "        require(hook, 'getattr(route, \"path\", \"\") == \"/api/owner-intelligence/summary\"', \"runtime route verification\")"
          new = "        require(hook, \"owner-intelligence/summary\", \"runtime route verification\")"
          if text.count(old) != 1:
              raise SystemExit('Expected one stale intelligence route assertion')
          intelligence.write_text(text.replace(old, new, 1))

          build = Path('.github/workflows/churvox-build-check.yml')
          text = build.read_text()
          marker = '          "Job Done reality contract|scripts/churvox-job-done-reality-contract.py"\n'
          addition = marker + '          "Owner intelligence contract|scripts/churvox-owner-intelligence-contract.py"\n'
          if text.count(marker) != 1 or 'Owner intelligence contract|scripts/churvox-owner-intelligence-contract.py' in text:
              raise SystemExit('Could not add the current owner intelligence contract cleanly')
          build.write_text(text.replace(marker, addition, 1))
          PY
          node --check frontend/tests/e2e/churvox-owner-no-fake-data.spec.js
          python3 -m json.tool frontend/package.json >/dev/null
          python3 -m py_compile scripts/churvox-owner-intelligence-contract.py

      - name: Commit the final permanent fixes
        run: |
          rm .github/workflows/churvox-final-ui-suite-fix.yml
          git config user.name "Churvox Launch Repair"
          git config user.email "hello@churvox.com"
          git add frontend/src/pages/marketing/ChurvoxPublicWorld.css frontend/package.json frontend/tests/e2e/churvox-owner-no-fake-data.spec.js scripts/churvox-owner-intelligence-contract.py .github/workflows/churvox-build-check.yml .github/workflows/churvox-final-ui-suite-fix.yml
          git commit -m "Fix mobile footer targets and align Studio UI coverage"
          git push origin HEAD:agent/final-studio-launch-fix
