name: Churvox export live visual preview

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  export:
    if: startsWith(github.event.issue.title, '[churvox-export-live-visual-preview]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compact visual preview
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64, json
          source=Path('docs/live-visual-inspection/home.png')
          image=Image.open(source).convert('RGB')
          original=image.size
          image.thumbnail((720, 8000))
          image.save('/tmp/churvox-home-preview.jpg', quality=58, optimize=True, progressive=True)
          payload=base64.b64encode(Path('/tmp/churvox-home-preview.jpg').read_bytes()).decode('ascii')
          chunks=[payload[i:i+45000] for i in range(0,len(payload),45000)]
          Path('/tmp/manifest.json').write_text(json.dumps({'original':original,'preview':image.size,'bytes':Path('/tmp/churvox-home-preview.jpg').stat().st_size,'chunks':len(chunks)}))
          for index,chunk in enumerate(chunks,1):
              Path(f'/tmp/chunk-{index:03d}.txt').write_text(chunk)
          PY
      - name: Post preview chunks
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'VISUAL_PREVIEW_MANIFEST '+JSON.stringify(manifest)});
            for (let i=1;i<=manifest.chunks;i++) {
              const name=`/tmp/chunk-${String(i).padStart(3,'0')}.txt`;
              const chunk=fs.readFileSync(name,'utf8');
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`VISUAL_PREVIEW_CHUNK ${i}/${manifest.chunks}\n${chunk}`});
            }
