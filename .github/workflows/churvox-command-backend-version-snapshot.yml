name: Churvox Command Backend Version Snapshot

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  snapshot:
    if: startsWith(github.event.issue.title, '[churvox-command-backend-snapshot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current backend boot version
        shell: bash
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee /tmp/churvox-command-backend-snapshot.txt
          (async () => {
            const url = `https://grassley-backend.onrender.com/api/command-fast-load/boot?ts=${Date.now()}`;
            const started = Date.now();
            const response = await fetch(url, { cache: 'no-store' });
            const text = await response.text();
            console.log(`status=${response.status}`);
            console.log(`elapsed_ms=${Date.now() - started}`);
            console.log(text.slice(0, 5000));
          })().catch((error) => { console.error(error.stack || error.message || error); process.exit(1); });
          NODE

      - name: Post snapshot
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('/tmp/churvox-command-backend-snapshot.txt') ? fs.readFileSync('/tmp/churvox-command-backend-snapshot.txt', 'utf8') : 'No output.';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## Current Command backend snapshot\n\n\`\`\`text\n${output}\n\`\`\`` });
