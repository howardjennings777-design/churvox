name: Churvox Login Emergency Gate

on:
  push:
    branches: [main]
    paths:
      - 'backend/sitecustomize.py'
      - 'backend/churvox_auth_me_401_patch.py'
      - 'backend/churvox_login_emergency_final.py'
      - 'backend/churvox_login_route_finalizer.py'
      - 'backend/churvox_outer_cors_error_shield.py'
      - 'backend/churvox_auth_paid_launch_hardening.py'
      - 'backend/churvox_production_launch_security.py'
      - 'backend/churvox_runtime_jwt_secret_patch.py'
      - 'backend/test_churvox_auth_me_401_patch.py'
      - 'backend/test_churvox_login_emergency_final.py'
      - 'backend/test_churvox_runtime_jwt_secret_patch.py'
      - 'frontend/src/runtime/churvoxOwnerLoginFallbackGuardRuntime.js'
      - 'frontend/src/pages/owner/OwnerLoginPage.jsx'
      - 'frontend/src/pages/owner/OwnerDashboardPage.jsx'
      - 'frontend/src/pages/auth/AdminLoginPage.js'
      - 'scripts/test_platform_owner_frontend_lock.py'
      - '.github/workflows/churvox-login-emergency-gate.yml'
  pull_request:
    paths:
      - 'backend/sitecustomize.py'
      - 'backend/churvox_auth_me_401_patch.py'
      - 'backend/churvox_login_emergency_final.py'
      - 'backend/churvox_login_route_finalizer.py'
      - 'backend/churvox_outer_cors_error_shield.py'
      - 'backend/churvox_auth_paid_launch_hardening.py'
      - 'backend/churvox_production_launch_security.py'
      - 'backend/churvox_runtime_jwt_secret_patch.py'
      - 'backend/test_churvox_auth_me_401_patch.py'
      - 'backend/test_churvox_login_emergency_final.py'
      - 'backend/test_churvox_runtime_jwt_secret_patch.py'
      - 'frontend/src/runtime/churvoxOwnerLoginFallbackGuardRuntime.js'
      - 'frontend/src/pages/owner/OwnerLoginPage.jsx'
      - 'frontend/src/pages/owner/OwnerDashboardPage.jsx'
      - 'frontend/src/pages/auth/AdminLoginPage.js'
      - 'scripts/test_platform_owner_frontend_lock.py'
      - '.github/workflows/churvox-login-emergency-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-code-gate:
    name: Compile and test final login stack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend contract dependencies
        run: python -m pip install --disable-pip-version-check fastapi

      - name: Compile login stack
        run: |
          python -m py_compile \
            backend/sitecustomize.py \
            backend/churvox_auth_me_401_patch.py \
            backend/churvox_login_emergency_final.py \
            backend/churvox_login_route_finalizer.py \
            backend/churvox_outer_cors_error_shield.py \
            backend/churvox_auth_paid_launch_hardening.py \
            backend/churvox_production_launch_security.py \
            backend/churvox_runtime_jwt_secret_patch.py \
            backend/test_churvox_auth_me_401_patch.py \
            backend/test_churvox_login_emergency_final.py \
            backend/test_churvox_runtime_jwt_secret_patch.py \
            scripts/test_platform_owner_frontend_lock.py

      - name: Run final login access contracts
        run: |
          python -m unittest backend.test_churvox_auth_me_401_patch
          python -m unittest backend.test_churvox_login_emergency_final
          python -m unittest backend.test_churvox_runtime_jwt_secret_patch
          python -m unittest scripts.test_platform_owner_frontend_lock

      - name: Verify final route markers
        run: |
          grep -F 'VERSION = "churvox-auth-me-401-20260712"' backend/churvox_auth_me_401_patch.py
          grep -F 'VERSION = "churvox-login-emergency-final-20260712f"' backend/churvox_login_emergency_final.py
          grep -F 'VERSION = "churvox-production-launch-security-20260712g"' backend/churvox_production_launch_security.py
          grep -F 'VERSION = "churvox-runtime-jwt-secret-20260712c"' backend/churvox_runtime_jwt_secret_patch.py
          grep -F 'app.add_api_route("/api/auth/me", strict_auth_me, methods=["GET"])' backend/churvox_auth_me_401_patch.py
          grep -F 'app.add_api_route("/api/auth/login", emergency_login, methods=["POST"])' backend/churvox_login_emergency_final.py
          grep -F 'app.add_api_route("/api/auth/logout", emergency_logout, methods=["POST"])' backend/churvox_login_emergency_final.py
          grep -F 'app.add_api_route(worker_path, emergency_login, methods=["POST"])' backend/churvox_login_emergency_final.py
          grep -F 'if not valid and worker_fallback_allowed(user):' backend/churvox_login_emergency_final.py
          grep -F '"lockout-check-error"' backend/churvox_login_emergency_final.py
          grep -F '"lockout-record-error"' backend/churvox_login_emergency_final.py
          grep -F 'critical_repair = bool(' backend/churvox_login_emergency_final.py
          grep -F '"sessions_revoked": sessions_revoked' backend/churvox_login_emergency_final.py
          grep -F '"jwt_persistent": jwt_source == "environment"' backend/churvox_login_emergency_final.py
          grep -F '"worker_login_route_count": worker_login_route_count' backend/churvox_login_emergency_final.py
          grep -F 'return raw.startswith("sk" + "_")' backend/churvox_production_launch_security.py
          grep -F 'return raw.startswith("whsec" + "_")' backend/churvox_production_launch_security.py
          grep -F 'module.PLATFORM_OWNER_EMAILS = [PLATFORM_OWNER_EMAIL]' backend/churvox_production_launch_security.py
          grep -F 'isolated emergency login route' backend/churvox_outer_cors_error_shield.py
          grep -F 'if path == "/api/auth/login"' backend/churvox_auth_paid_launch_hardening.py
          grep -F 'normalizedEmail !== OWNER_EMAIL' frontend/src/pages/owner/OwnerLoginPage.jsx
          grep -F 'response.ok && email === OWNER_EMAIL' frontend/src/pages/owner/OwnerDashboardPage.jsx
          grep -F 'verifiedEmail !== PLATFORM_OWNER_EMAIL' frontend/src/pages/auth/AdminLoginPage.js
