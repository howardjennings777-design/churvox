name: Churvox One-Time Live Login Gate

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  live-login-gate:
    if: startsWith(github.event.issue.title, '[churvox-live-login-gate]')
    name: Live owner and worker login proof
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Mark test as started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Live Churvox owner/worker login gate is running. Credentials remain masked as GitHub Actions secrets.'
            })

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        working-directory: .
        run: python -m pip install --disable-pip-version-check fastapi==0.110.1 pymongo==4.5.0

      - name: Install frontend dependencies
        run: npm install --include=dev --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete live login gate
        id: gate
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: https://www.churvox.com
          PLAYWRIGHT_API_BASE: https://grassley-backend.onrender.com
          CHURVOX_OWNER_EMAIL: ${{ secrets.CHURVOX_OWNER_EMAIL || 'howardjennings77@gmail.com' }}
          CHURVOX_OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}
          CHURVOX_WORKER_EMAIL: ${{ secrets.CHURVOX_WORKER_EMAIL }}
          CHURVOX_WORKER_PASSWORD: ${{ secrets.CHURVOX_WORKER_PASSWORD || secrets.CHURVOX_OWNER_PASSWORD }}
          CHURVOX_E2E_SIGNUP: '0'
          CHURVOX_E2E_MUTATE: '0'
        run: node scripts/churvox-paid-launch-release-gate.cjs

      - name: Upload release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churvox-one-time-live-login-report
          path: |
            /tmp/churvox-paid-launch-release
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Post test result
        if: always()
        uses: actions/github-script@v7
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/churvox-paid-launch-release/churvox-paid-launch-release-report.txt';
            let report = 'The release report was not created.';
            if (fs.existsSync(path)) {
              const text = fs.readFileSync(path, 'utf8');
              report = text.slice(-24000);
            }
            const outcome = process.env.GATE_OUTCOME === 'success' ? 'PASSED' : 'FAILED';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Live login gate ${outcome}\n\n\`\`\`text\n${report}\n\`\`\``
            });

      - name: Fail workflow when gate failed
        if: steps.gate.outcome != 'success'
        run: exit 1
