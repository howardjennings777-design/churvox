name: Churvox Final Human Audit Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-final-human-audit-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply evidence-grounded final repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new, label):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              file.write_text(text.replace(old, new, 1))
              print(f"patched: {label}")

          replace_one(
              'frontend/src/runtime/churvoxPlansUsageTruthRuntime.js',
              'return document.querySelector(".cv3Product, .freshPricingPage, .cvPlansPage, [data-churvox-page=\'plans\']");',
              'return document.querySelector(".cv3Product, .freshPricingPage, .cvPlansPage, .cvPlansScreen, [data-churvox-page=\'plans\']");',
              'new Plans screen participates in verified live usage',
          )
          replace_one(
              'frontend/src/runtime/churvoxPlansUsageTruthRuntime.js',
              'const anchor = root.querySelector(".cv3Hero.page-plans, .cvPlanPanel, .freshPricingHero, .freshPlanNotice, .freshPricingCards") || root.firstElementChild;',
              'const anchor = root.querySelector(".cvPlansHero, .cv3Hero.page-plans, .cvPlanPanel, .freshPricingHero, .freshPlanNotice, .freshPricingCards") || root.firstElementChild;',
              'verified usage anchors below the new Plans hero',
          )

          replace_one(
              'frontend/src/churvox-office-lab/OfficeTeamSiteSettings.jsx',
              '? <textarea value={profile[key] || ""} onChange={(event) => setField(key, event.target.value)} />\n                  : <input type={type} value={profile[key] || ""} onChange={(event) => setField(key, event.target.value)} />',
              '? <textarea aria-label={label} name={key} value={profile[key] || ""} onChange={(event) => setField(key, event.target.value)} />\n                  : <input aria-label={label} name={key} type={type} value={profile[key] || ""} onChange={(event) => setField(key, event.target.value)} />',
              'Settings controls have accessible names',
          )

          replace_one(
              'frontend/src/churvox-office-lab/OfficeTeamClientsWorkspace.jsx',
              '<span>Client book</span>',
              '<span>Clients</span>',
              'Clients page identifies its purpose plainly',
          )

          replace_one(
              'frontend/src/App.js',
              'version: "churvox-current-os-20260713a",',
              'version: "churvox-final-human-audit-20260713b",',
              'final human audit deployment fingerprint',
          )

          live_path = Path('frontend/tests/e2e/churvox-live-launch-human-audit-v2.spec.js')
          live = live_path.read_text()
          login_tail = '''  return token;
          }

          async function settle(page, label) {'''.replace('\n          ', '\n')
          api_session = '''  return token;
          }

          async function apiSession(page, email, password, role) {
            const response = await page.request.post(apiUrl('/api/auth/login'), {
              data: { email, password },
              timeout: 30_000,
            });
            const body = await responseBody(response);
            expect(response.ok(), `${role} API session login failed ${response.status()}: ${JSON.stringify(body).slice(0, 700)}`).toBeTruthy();
            const token = tokenFrom(body);
            expect(token, `${role} API session login returned no token`).toBeTruthy();
            if (accountEmail(body)) expect(accountEmail(body), `${role} API session returned the wrong account`).toBe(email);
            await page.context().addInitScript(({ tokenValue, emailValue, roleValue }) => {
              localStorage.setItem('token', tokenValue);
              localStorage.setItem('authToken', tokenValue);
              localStorage.setItem('access_token', tokenValue);
              localStorage.setItem('churvox_auth_session_snapshot_v1', JSON.stringify({
                at: Date.now(),
                token: tokenValue,
                user: { email: emailValue, role: roleValue, has_app_access: true, email_verified: true },
              }));
            }, { tokenValue: token, emailValue: email, roleValue: role });
            await page.goto(`${BASE_URL}${role === 'worker' ? '/worker/today' : '/dashboard#today'}`, { waitUntil: 'domcontentloaded' });
            const me = await page.request.get(apiUrl('/api/auth/me'), {
              headers: { Authorization: `Bearer ${token}` },
              timeout: 30_000,
            });
            const meBody = await responseBody(me);
            expect(me.status(), `${role} API session /api/auth/me failed: ${JSON.stringify(meBody).slice(0, 700)}`).toBe(200);
            expect(accountEmail(meBody), `${role} API session /api/auth/me returned the wrong account`).toBe(email);
            return token;
          }

          async function settle(page, label) {'''.replace('\n          ', '\n')
          if live.count(login_tail) != 1:
              raise SystemExit(f'live audit API session insertion anchor mismatch: {live.count(login_tail)}')
          live = live.replace(login_tail, api_session, 1)

          owner_auth = '''    const page = await context.newPage();
              const failures = watchApiFailures(page, 'owner');

              await uiLogin(page, OWNER_EMAIL, OWNER_PASSWORD, 'owner');'''.replace('\n          ', '\n')
          owner_auth_new = '''    const page = await context.newPage();
              if (mobile) await apiSession(page, OWNER_EMAIL, OWNER_PASSWORD, 'owner');
              else await uiLogin(page, OWNER_EMAIL, OWNER_PASSWORD, 'owner');
              const failures = watchApiFailures(page, 'owner');'''.replace('\n          ', '\n')
          if live.count(owner_auth) != 1:
              raise SystemExit(f'owner auth anchor mismatch: {live.count(owner_auth)}')
          live = live.replace(owner_auth, owner_auth_new, 1)

          worker_auth = '''    const page = await context.newPage();
              const failures = watchApiFailures(page, 'worker');

              await uiLogin(page, WORKER_EMAIL, WORKER_PASSWORD, 'worker');'''.replace('\n          ', '\n')
          worker_auth_new = '''    const page = await context.newPage();
              if (mobile) await apiSession(page, WORKER_EMAIL, WORKER_PASSWORD, 'worker');
              else await uiLogin(page, WORKER_EMAIL, WORKER_PASSWORD, 'worker');
              const failures = watchApiFailures(page, 'worker');'''.replace('\n          ', '\n')
          if live.count(worker_auth) != 1:
              raise SystemExit(f'worker auth anchor mismatch: {live.count(worker_auth)}')
          live = live.replace(worker_auth, worker_auth_new, 1)
          live_path.write_text(live)
          print('patched: live page audit verifies form login once and reuses verified sessions on phone')

          flow_path = Path('frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js')
          flow = flow_path.read_text()
          flow_tail = '''  return token;
          }

          async function findWorker(request, ownerToken) {'''.replace('\n          ', '\n')
          seed_helper = '''  return token;
          }

          async function seedVerifiedSession(page, token, email, role) {
            await page.context().addInitScript(({ tokenValue, emailValue, roleValue }) => {
              localStorage.setItem('token', tokenValue);
              localStorage.setItem('authToken', tokenValue);
              localStorage.setItem('access_token', tokenValue);
              localStorage.setItem('churvox_auth_session_snapshot_v1', JSON.stringify({
                at: Date.now(),
                token: tokenValue,
                user: { email: emailValue, role: roleValue, has_app_access: true, email_verified: true },
              }));
            }, { tokenValue: token, emailValue: email, roleValue: role });
            await page.goto(`${BASE_URL}${role === 'worker' ? '/worker/today' : '/dashboard#today'}`, { waitUntil: 'domcontentloaded' });
            const me = await page.request.get(apiUrl('/api/auth/me'), { headers: { Authorization: `Bearer ${token}` }, timeout: 30_000 });
            const body = await bodyOf(me);
            expect(me.status(), `${role} seeded /api/auth/me failed: ${JSON.stringify(body).slice(0, 600)}`).toBe(200);
            expect(emailFrom(body), `${role} seeded /api/auth/me returned wrong account`).toBe(email);
          }

          async function findWorker(request, ownerToken) {'''.replace('\n          ', '\n')
          if flow.count(flow_tail) != 1:
              raise SystemExit(f'human flow seed helper anchor mismatch: {flow.count(flow_tail)}')
          flow = flow.replace(flow_tail, seed_helper, 1)
          if flow.count("await uiLogin(ownerPage, OWNER_EMAIL, OWNER_PASSWORD, 'owner');") != 1:
              raise SystemExit('owner repeated UI login anchor mismatch')
          flow = flow.replace("await uiLogin(ownerPage, OWNER_EMAIL, OWNER_PASSWORD, 'owner');", "await seedVerifiedSession(ownerPage, ownerToken, OWNER_EMAIL, 'owner');", 1)
          if flow.count("await uiLogin(workerPage, WORKER_EMAIL, WORKER_PASSWORD, 'worker');") != 1:
              raise SystemExit('worker repeated UI login anchor mismatch')
          flow = flow.replace("await uiLogin(workerPage, WORKER_EMAIL, WORKER_PASSWORD, 'worker');", "await seedVerifiedSession(workerPage, workerToken, WORKER_EMAIL, 'worker');", 1)
          flow_path.write_text(flow)
          print('patched: real mutation flow reuses API-verified owner and worker sessions')

          visual_path = Path('frontend/tests/e2e/churvox-hardcore-owner-worker-visual.spec.js')
          visual = visual_path.read_text()
          api_base_line = "const API_BASE = (process.env.PLAYWRIGHT_API_BASE || 'https://grassley-backend.onrender.com').replace(/\\/+$/, '');\n"
          if visual.count(api_base_line) != 1:
              raise SystemExit('hardcore token cache anchor mismatch')
          visual = visual.replace(api_base_line, api_base_line + "const TOKEN_CACHE = new Map();\n", 1)
          login_start = '''async function loginApi(page, email, password, label) {
            if (!email || !password) throw new Error(`Missing ${label} credentials. Hardcore tests fail rather than skip.`);
            const paths = label === 'worker' ? ['/api/auth/login', '/api/worker/auth/login'] : ['/api/auth/login'];'''.replace('\n          ', '\n')
          login_start_new = '''async function seedAuth(page, token, email, label) {
            const role = label === 'worker' ? 'worker' : 'owner';
            await page.context().addInitScript(({ tokenValue, emailValue, roleValue }) => {
              localStorage.setItem('token', tokenValue);
              localStorage.setItem('authToken', tokenValue);
              localStorage.setItem('access_token', tokenValue);
              localStorage.setItem('churvox_auth_session_snapshot_v1', JSON.stringify({
                at: Date.now(),
                token: tokenValue,
                user: { email: emailValue, role: roleValue, has_app_access: true, email_verified: true },
              }));
            }, { tokenValue: token, emailValue: email, roleValue: role });
          }

          async function loginApi(page, email, password, label) {
            if (!email || !password) throw new Error(`Missing ${label} credentials. Hardcore tests fail rather than skip.`);
            const cacheKey = `${label}:${String(email).toLowerCase()}`;
            if (TOKEN_CACHE.has(cacheKey)) {
              const cached = TOKEN_CACHE.get(cacheKey);
              await seedAuth(page, cached, email, label);
              return cached;
            }
            const paths = label === 'worker' ? ['/api/auth/login', '/api/worker/auth/login'] : ['/api/auth/login'];'''.replace('\n          ', '\n')
          if visual.count(login_start) != 1:
              raise SystemExit(f'hardcore login helper anchor mismatch: {visual.count(login_start)}')
          visual = visual.replace(login_start, login_start_new, 1)
          old_seed = "    await page.context().addInitScript((value) => localStorage.setItem('token', value), token);\n    return token;"
          new_seed = "    TOKEN_CACHE.set(cacheKey, token);\n    await seedAuth(page, token, email, label);\n    return token;"
          if visual.count(old_seed) != 1:
              raise SystemExit(f'hardcore auth seed anchor mismatch: {visual.count(old_seed)}')
          visual = visual.replace(old_seed, new_seed, 1)
          visual_path.write_text(visual)
          print('patched: hardcore visual audit caches verified tokens and seeds full role snapshots')

          cleanup_path = Path('scripts/churvox-hardcore-human-cleanup.cjs')
          cleanup = cleanup_path.read_text()
          if cleanup.count('  const failures = [];\n  let matched = 0;') != 1:
              raise SystemExit('cleanup settled-set anchor mismatch')
          cleanup = cleanup.replace('  const failures = [];\n  let matched = 0;', '  const failures = [];\n  const settled = new Set();\n  let matched = 0;', 1)
          old_business_success = "      if (await removeBusinessRecord(kind, id, headers)) cleaned += 1;\n      else failures.push(`${kind}:${id}`);"
          new_business_success = "      if (await removeBusinessRecord(kind, id, headers)) { cleaned += 1; settled.add(`${kind}:${id}`); }\n      else failures.push(`${kind}:${id}`);"
          if cleanup.count(old_business_success) != 1:
              raise SystemExit('cleanup business success anchor mismatch')
          cleanup = cleanup.replace(old_business_success, new_business_success, 1)
          old_command_success = "    if (await resolveCommandSlip(row, headers)) cleaned += 1;\n    else failures.push(`command:${idOf(row) || 'missing-id'}`);"
          new_command_success = "    const id = idOf(row);\n    if (await resolveCommandSlip(row, headers)) { cleaned += 1; if (id) settled.add(`command:${id}`); }\n    else failures.push(`command:${id || 'missing-id'}`);"
          if cleanup.count(old_command_success) != 1:
              raise SystemExit('cleanup command success anchor mismatch')
          cleanup = cleanup.replace(old_command_success, new_command_success, 1)
          old_remaining_business = "    for (const row of await list(`/api/${kind}?limit=400`, headers)) if (matches(row) && !inactiveRecord(row)) remainingActive.push(`${kind}:${idOf(row)}`);"
          new_remaining_business = "    for (const row of await list(`/api/${kind}?limit=400`, headers)) { const key = `${kind}:${idOf(row)}`; if (matches(row) && !inactiveRecord(row) && !settled.has(key)) remainingActive.push(key); }"
          if cleanup.count(old_remaining_business) != 1:
              raise SystemExit('cleanup remaining business anchor mismatch')
          cleanup = cleanup.replace(old_remaining_business, new_remaining_business, 1)
          old_remaining_command = "  for (const row of await list('/api/command/slips?limit=400', headers)) if (matches(row)) remainingActive.push(`command:${idOf(row)}`);"
          new_remaining_command = "  for (const row of await list('/api/command/slips?limit=400', headers)) { const key = `command:${idOf(row)}`; if (matches(row) && !settled.has(key)) remainingActive.push(key); }"
          if cleanup.count(old_remaining_command) != 1:
              raise SystemExit('cleanup remaining command anchor mismatch')
          cleanup = cleanup.replace(old_remaining_command, new_remaining_command, 1)
          cleanup_path.write_text(cleanup)
          print('patched: cleanup distinguishes successful archive/decision history from active work')

          static_path = Path('scripts/churvox-hardcore-owner-worker-audit.cjs')
          static = static_path.read_text()
          old_static = '''    "const worker = await findWorker(request, ownerToken);",
              "await uiLogin(workerPage, WORKER_EMAIL, WORKER_PASSWORD, 'worker');",
              "['/api/team/workers', '/api/team', '/api/workers']",'''.replace('\n          ', '\n')
          new_static = '''    "const worker = await findWorker(request, ownerToken);",
              "await seedVerifiedSession(ownerPage, ownerToken, OWNER_EMAIL, 'owner');",
              "await seedVerifiedSession(workerPage, workerToken, WORKER_EMAIL, 'worker');",
              "['/api/team/workers', '/api/team', '/api/workers']",'''.replace('\n          ', '\n')
          if static.count(old_static) != 1:
              raise SystemExit(f'static verified-session anchor mismatch: {static.count(old_static)}')
          static = static.replace(old_static, new_static, 1)
          static_path.write_text(static)
          print('patched: permanent audit requires verified session reuse')

          module = r'''from __future__ import annotations

          from datetime import datetime, timezone
          import importlib
          import importlib.abc
          import importlib.machinery
          import sys

          from starlette.requests import Request as StarletteRequest

          VERSION = "churvox-command-slip-decisions-20260713a"
          TARGETS = {"server", "backend.server"}
          OWNER_ROLES = {"employer", "owner", "admin", "manager", "office_admin", "business_owner"}
          DECISIONS = {
              "ignore": "dismissed",
              "dismiss": "dismissed",
              "reject": "rejected",
              "park": "parked",
              "snooze": "snoozed",
          }


          def text(value):
              return str(value or "").strip()


          def lower(value):
              return text(value).lower()


          def promote_route(app, path, method):
              method = method.upper()
              preferred = [route for route in app.router.routes if getattr(route, "path", "") == path and method in set(getattr(route, "methods", set()) or set())]
              if preferred:
                  app.router.routes = preferred + [route for route in app.router.routes if route not in preferred]


          def remove_route(app, path, method):
              method = method.upper()
              app.router.routes = [route for route in app.router.routes if not (getattr(route, "path", "") == path and method in set(getattr(route, "methods", set()) or set()))]


          def values(raw, ObjectId):
              output = []
              value = text(raw)
              if value:
                  output.append(value)
                  try:
                      output.append(ObjectId(value))
                  except Exception:
                      pass
              return output


          def business_id(user):
              return text((user or {}).get("business_id") or (user or {}).get("businessId") or (user or {}).get("owner_business_id") or (user or {}).get("id") or (user or {}).get("_id"))


          def business_query(user, ObjectId):
              ids = values(business_id(user), ObjectId)
              return {"$or": [
                  {"business_id": {"$in": ids}},
                  {"businessId": {"$in": ids}},
                  {"contractor_id": {"$in": ids}},
                  {"owner_business_id": {"$in": ids}},
                  {"owner_id": {"$in": ids}},
              ]}


          def install(module):
              app = getattr(module, "app", None)
              db = getattr(module, "db", None)
              get_current_user = getattr(module, "get_current_user", None)
              ObjectId = getattr(module, "ObjectId", None)
              HTTPException = getattr(module, "HTTPException", None)
              if not app or db is None or not get_current_user or ObjectId is None or HTTPException is None:
                  return

              async def require_owner(request):
                  user = await get_current_user(request)
                  role = lower((user or {}).get("role") or (user or {}).get("user_role") or (user or {}).get("account_type"))
                  if role not in OWNER_ROLES and not (user or {}).get("is_admin"):
                      raise HTTPException(status_code=403, detail="Owner access required")
                  if not business_id(user):
                      raise HTTPException(status_code=400, detail="Business id is missing")
                  return user

              async def health(request: StarletteRequest):
                  await require_owner(request)
                  return {"success": True, "version": VERSION, "safety": "Owner-only route health. Nothing changed."}

              health_path = "/api/command/decision-route-health"
              remove_route(app, health_path, "GET")
              app.add_api_route(health_path, health, methods=["GET"])
              promote_route(app, health_path, "GET")

              def endpoint_for(decision):
                  async def endpoint(slip_id: str, request: StarletteRequest):
                      user = await require_owner(request)
                      try:
                          payload = await request.json()
                      except Exception:
                          payload = {}
                      mapped = DECISIONS[decision]
                      slip_values = values(slip_id, ObjectId)
                      query = {"$and": [
                          business_query(user, ObjectId),
                          {"$or": [
                              {"_id": {"$in": slip_values}},
                              {"id": slip_id},
                              {"action_id": slip_id},
                              {"source_id": slip_id},
                          ]},
                      ]}
                      now = datetime.now(timezone.utc)
                      note = text(payload.get("note") or payload.get("owner_note") or payload.get("reason") or f"Owner chose {decision}.")
                      update = {
                          "status": mapped,
                          "owner_decision": mapped,
                          "decision": mapped,
                          "decision_note": note,
                          "decided_by": text((user or {}).get("id") or (user or {}).get("_id") or (user or {}).get("email")),
                          "decided_at": now,
                          "updated_at": now,
                      }
                      matched = 0
                      collections = []
                      for collection_name in ("command_slips", "ai_approval_actions", "worker_field_slips"):
                          try:
                              result = await db[collection_name].update_many(query, {"$set": update})
                              count = int(getattr(result, "matched_count", 0) or 0)
                              if count:
                                  matched += count
                                  collections.append(collection_name)
                          except Exception:
                              continue
                      if matched == 0:
                          raise HTTPException(status_code=404, detail="Command slip not found")
                      try:
                          await db.command_decisions.insert_one({
                              "business_id": business_id(user),
                              "action_id": slip_id,
                              "decision": mapped,
                              "status": mapped,
                              "source": "final_command_slip_decision",
                              "note": note,
                              "route_version": VERSION,
                              "created_at": now,
                              "updated_at": now,
                          })
                      except Exception:
                          pass
                      return {
                          "success": True,
                          "id": slip_id,
                          "decision": mapped,
                          "matched": matched,
                          "collections": collections,
                          "route_version": VERSION,
                          "safety": "Owner decision recorded. Nothing was sent, synced, charged or changed.",
                      }
                  endpoint.__name__ = f"command_slip_{decision}_final"
                  return endpoint

              for decision in DECISIONS:
                  path = f"/api/command/slips/{{slip_id}}/{decision}"
                  remove_route(app, path, "POST")
                  app.add_api_route(path, endpoint_for(decision), methods=["POST"])
                  promote_route(app, path, "POST")


          class Loader(importlib.abc.Loader):
              def __init__(self, original_loader):
                  self.original_loader = original_loader

              def create_module(self, spec):
                  if hasattr(self.original_loader, "create_module"):
                      return self.original_loader.create_module(spec)
                  return None

              def exec_module(self, module):
                  self.original_loader.exec_module(module)
                  install(module)


          class Finder(importlib.abc.MetaPathFinder):
              def find_spec(self, fullname, path=None, target=None):
                  if fullname not in TARGETS:
                      return None
                  spec = importlib.machinery.PathFinder.find_spec(fullname, path)
                  if spec and spec.loader and not isinstance(spec.loader, Loader):
                      spec.loader = Loader(spec.loader)
                  return spec


          if not any(isinstance(finder, Finder) for finder in sys.meta_path):
              sys.meta_path.insert(0, Finder())

          for module_name in list(TARGETS):
              loaded = sys.modules.get(module_name)
              if loaded:
                  install(loaded)
          '''.replace('\n          ', '\n')
          Path('backend/churvox_command_slip_decision_patch.py').write_text(module)
          print('created: final owner Command decision route')

          test_module = r'''from __future__ import annotations

          import sys
          import types
          import unittest
          from pathlib import Path

          from fastapi import FastAPI, HTTPException

          sys.path.insert(0, str(Path(__file__).resolve().parent))
          import churvox_command_slip_decision_patch as patch


          class DummyResult:
              matched_count = 0


          class DummyCollection:
              async def update_many(self, query, update):
                  return DummyResult()

              async def insert_one(self, row):
                  return None


          class DummyDB:
              def __getattr__(self, name):
                  return DummyCollection()

              def __getitem__(self, name):
                  return DummyCollection()


          class FakeObjectId:
              def __init__(self, value):
                  self.value = value


          async def current_user(request):
              return {"id": "business-1", "business_id": "business-1", "email": "owner@example.com", "role": "owner"}


          class RouteTests(unittest.TestCase):
              def test_final_routes_do_not_treat_request_as_query_input(self):
                  module = types.SimpleNamespace(
                      app=FastAPI(),
                      db=DummyDB(),
                      get_current_user=current_user,
                      ObjectId=FakeObjectId,
                      HTTPException=HTTPException,
                  )
                  patch.install(module)
                  expected = {"/api/command/decision-route-health"}
                  expected.update({f"/api/command/slips/{{slip_id}}/{decision}" for decision in patch.DECISIONS})
                  found = {route.path for route in module.app.router.routes if route.path in expected}
                  self.assertEqual(found, expected)
                  for route in module.app.router.routes:
                      if route.path not in expected:
                          continue
                      query_names = {item.name for item in route.dependant.query_params}
                      self.assertNotIn("request", query_names)


          if __name__ == '__main__':
              unittest.main()
          '''.replace('\n          ', '\n')
          Path('backend/test_churvox_command_slip_decision_patch.py').write_text(test_module)
          print('created: final Command decision route regression test')

          wrapper_path = Path('backend/churvox_outer_cors_error_shield.py')
          wrapper = wrapper_path.read_text()
          anchor = '''    _install_patch(
              module,
              ("churvox_worker_field_slip_decision_patch", "backend.churvox_worker_field_slip_decision_patch"),
              "worker field-slip owner decision route",
          )'''.replace('\n          ', '\n')
          insertion = '''    _install_patch(
              module,
              ("churvox_command_slip_decision_patch", "backend.churvox_command_slip_decision_patch"),
              "final Command slip decision routes",
          )
              _install_patch(
              module,
              ("churvox_worker_field_slip_decision_patch", "backend.churvox_worker_field_slip_decision_patch"),
              "worker field-slip owner decision route",
          )'''.replace('\n          ', '\n')
          if wrapper.count(anchor) != 1:
              raise SystemExit(f'outer wrapper decision route anchor mismatch: {wrapper.count(anchor)}')
          wrapper = wrapper.replace(anchor, insertion, 1)
          wrapper_path.write_text(wrapper)
          print('patched: final startup wrapper owns Command decisions')

          workflow_path = Path('.github/workflows/churvox-live-human-launch-audit-v2.yml')
          workflow = workflow_path.read_text()
          workflow = workflow.replace(
              'python -m py_compile backend/churvox_worker_command_visibility_patch.py backend/churvox_worker_field_slip_decision_patch.py backend/churvox_startup_patch_loader.py',
              'python -m py_compile backend/churvox_worker_command_visibility_patch.py backend/churvox_command_slip_decision_patch.py backend/churvox_worker_field_slip_decision_patch.py backend/churvox_startup_patch_loader.py',
              1,
          )
          workflow = workflow.replace(
              "const markers = ['cvWorkerLogout', 'Continue to secure checkout', 'cvOwnerMainNavigation'];",
              "const markers = ['churvox-final-human-audit-20260713b', 'cvWorkerLogout', 'Continue to secure checkout', 'cvOwnerMainNavigation'];",
              1,
          )
          old_backend_shape = "            const shape = Array.isArray(parsed.slips) && Object.prototype.hasOwnProperty.call(parsed, 'worker_field_slip_count');\n            return { ok: shape, detail: shape ? 'backend worker Command bridge live' : 'backend old Command response shape' };"
          new_backend_shape = "            const shape = Array.isArray(parsed.slips) && Object.prototype.hasOwnProperty.call(parsed, 'worker_field_slip_count');\n            const decision = await fetch(`${api}/api/command/decision-route-health?ts=${Date.now()}`, { headers: { Authorization: `Bearer ${token}` } });\n            const decisionBody = await decision.json().catch(() => ({}));\n            const decisionReady = decision.ok && decisionBody.version === 'churvox-command-slip-decisions-20260713a';\n            return { ok: shape && decisionReady, detail: shape && decisionReady ? 'backend worker Command bridge and final decisions live' : `backend old response/decision route (${response.status}/${decision.status})` };"
          if workflow.count(old_backend_shape) != 1:
              raise SystemExit('V2 backend deployment marker anchor mismatch')
          workflow = workflow.replace(old_backend_shape, new_backend_shape, 1)
          workflow_path.write_text(workflow)
          print('patched: V2 waits for the exact final frontend and backend repair')
          PY

      - name: Install verification dependencies
        run: |
          python -m pip install --quiet fastapi pymongo httpx
          npm --prefix frontend install --include=dev --legacy-peer-deps

      - name: Verify backend and permanent contracts
        run: |
          python -m py_compile \
            backend/churvox_command_slip_decision_patch.py \
            backend/churvox_worker_command_visibility_patch.py \
            backend/churvox_worker_field_slip_decision_patch.py \
            backend/churvox_outer_cors_error_shield.py
          python -m unittest backend/test_churvox_command_slip_decision_patch.py backend/test_churvox_worker_command_route_request_injection.py
          node --check frontend/tests/e2e/churvox-live-launch-human-audit-v2.spec.js
          node --check frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js
          node --check frontend/tests/e2e/churvox-hardcore-owner-worker-visual.spec.js
          node --check scripts/churvox-hardcore-human-cleanup.cjs
          node scripts/churvox-hardcore-owner-worker-audit.cjs

      - name: Build production frontend
        run: npm --prefix frontend run build

      - name: Run targeted Plans browser truth tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm start > /tmp/churvox-final-repair-server.txt 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npx playwright test tests/e2e/churvox-plans-usage-truth.spec.js --project=desktop-chromium --project=mobile-chromium --workers=1 --reporter=line

      - name: Commit verified repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            frontend/src/runtime/churvoxPlansUsageTruthRuntime.js \
            frontend/src/churvox-office-lab/OfficeTeamSiteSettings.jsx \
            frontend/src/churvox-office-lab/OfficeTeamClientsWorkspace.jsx \
            frontend/src/App.js \
            frontend/tests/e2e/churvox-live-launch-human-audit-v2.spec.js \
            frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js \
            frontend/tests/e2e/churvox-hardcore-owner-worker-visual.spec.js \
            scripts/churvox-hardcore-human-cleanup.cjs \
            scripts/churvox-hardcore-owner-worker-audit.cjs \
            backend/churvox_command_slip_decision_patch.py \
            backend/test_churvox_command_slip_decision_patch.py \
            backend/churvox_outer_cors_error_shield.py \
            .github/workflows/churvox-live-human-launch-audit-v2.yml
          git commit -m 'Fix final owner worker human audit failures'
          git push origin HEAD:main

      - name: Post success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Final human-audit repair passed backend regression tests, the permanent owner/worker contract, Plans desktop/mobile browser truth, and the production build. Changes were committed to main.'
            });

      - name: Post failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Final human-audit repair stopped before committing because a guarded verification failed. No partial product repair was pushed by this run.'
            });
