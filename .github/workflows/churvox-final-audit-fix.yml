name: Apply Final Audit Fixes

on:
  pull_request:
    branches: [audit/churvox-pr746-base-20260726]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: churvox-final-audit-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: agent/churvox-office-os-foundation
          fetch-depth: 0
          persist-credentials: true

      - name: Align final audit with current UI semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          big = Path('frontend/tests/e2e/churvox-big-launch-audit.spec.js')
          text = big.read_text()
          text = text.replace("const studioAreas = ['Today', 'Work', 'Clients', 'Money', 'Team', 'Messages', 'Command'];", "const studioAreas = ['Today', 'Jobs', 'Clients', 'Money', 'Team', 'Messages', 'Command'];")
          text = text.replace("for (const item of ['Today', 'Work', 'Command', 'Messages', 'More'])", "for (const item of ['Today', 'Jobs', 'Command', 'Messages', 'More'])")
          big.write_text(text)

          wording = Path('frontend/tests/e2e/churvox-wording-flow-human-audit.spec.js')
          text = wording.read_text()
          text = text.replace("document.querySelectorAll('h1, h2')", "document.querySelectorAll('h1, h2, h3, [role=\"heading\"]')")
          wording.write_text(text)
          PY

          git diff --check
          git config user.name "Churvox Audit Bot"
          git config user.email "hello@churvox.com"
          git add frontend/tests/e2e/churvox-big-launch-audit.spec.js frontend/tests/e2e/churvox-wording-flow-human-audit.spec.js
          git commit -m "Align final audit with current Jobs and heading semantics"
          git push origin HEAD:agent/churvox-office-os-foundation
