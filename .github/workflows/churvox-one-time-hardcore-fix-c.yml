name: Churvox One-Time Hardcore Repair C

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair-c:
    if: startsWith(github.event.issue.title, '[churvox-hardcore-fix-c]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair the human audit and evidence workflow
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/churvox-fix-c.txt
          from pathlib import Path

          audit = Path('frontend/tests/e2e/churvox-live-hardcore-human-everything.spec.js')
          text = audit.read_text()
          if 'async function ensureMoreOpen(page)' not in text:
              anchor = 'async function safeControlSweep(page, routeLabel, limit = 18) {'
              helper = '''async function ensureMoreOpen(page) {
            const trigger = page.getByRole('button', { name: 'More', exact: true }).first();
            await expect(trigger).toBeVisible({ timeout: 12_000 });
            if (await trigger.getAttribute('aria-expanded') !== 'true') await trigger.click();
            const menu = page.getByRole('menu', { name: /More tools/i });
            await expect(menu).toBeVisible({ timeout: 10_000 });
            return menu;
          }

          async function closeMore(page) {
            const trigger = page.getByRole('button', { name: 'More', exact: true }).first();
            if (!(await trigger.count()) || await trigger.getAttribute('aria-expanded') !== 'true') return;
            const close = page.getByRole('button', { name: 'Close More menu' }).last();
            if (await close.count() && await close.isVisible().catch(() => false)) await close.click();
            else await page.keyboard.press('Escape');
            await expect(trigger).toHaveAttribute('aria-expanded', 'false');
          }

          async function safeControlSweep(page, routeLabel, limit = 18) {'''
              if text.count(anchor) != 1:
                  raise SystemExit(f'More helper anchor mismatch: {text.count(anchor)}')
              text = text.replace(anchor, helper, 1)
              print('inserted deterministic More helpers')

          start_token = "    await openOwnerHash(page, 'today', /today|churvox/i);\n    await clickVisibleNavigation(page, 'More');"
          end_token = "\n\n    for (const label of ['Settings', 'Plans', 'Help']) {"
          if start_token in text:
              start = text.index(start_token)
              end = text.index(end_token, start)
              replacement = '''    await openOwnerHash(page, 'today', /today|churvox/i);
            const moreMenu = await ensureMoreOpen(page);
            const box = await moreMenu.boundingBox();
            expect(box, 'More menu has no visible box').toBeTruthy();
            expect(box.x).toBeGreaterThanOrEqual(0);
            expect(box.y).toBeGreaterThanOrEqual(0);
            expect(box.x + box.width).toBeLessThanOrEqual((await page.viewportSize()).width + 1);
            const moreItems = (await moreMenu.getByRole('menuitem').allTextContents()).map(clean).filter(Boolean);
            await closeMore(page);
            for (const item of moreItems) {
              await openOwnerHash(page, 'today', /today|churvox/i);
              const reopened = await ensureMoreOpen(page);
              const menuItem = reopened.getByRole('menuitem', { name: item, exact: true });
              await expect(menuItem).toBeVisible();
              await menuItem.click();
              await page.waitForTimeout(400);
              await assertNoLegacy(page, `More → ${item}`);
            }'''
              text = text[:start] + replacement + text[end:]
              print('replaced fragile More loop')
          elif 'const moreItems = (await moreMenu.getByRole' not in text:
              raise SystemExit('Could not find More loop')

          old = '''      await workerPage.goto(`${BASE_URL}${path}`, { waitUntil: 'domcontentloaded' });
                await pageSleep(500);
                expect(workerPage.url(), `worker reached forbidden owner route ${path}`).toMatch(/\/worker\/|\/login/);'''
          new = '''      await workerPage.goto(`${BASE_URL}${path}`, { waitUntil: 'domcontentloaded' });
                await expect.poll(() => workerPage.url(), {
                  message: `worker reached forbidden owner route ${path}`,
                  timeout: 15_000,
                  intervals: [250, 500, 900, 1500, 2500],
                }).toMatch(/\/worker\/|\/login/);'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'Role poll block mismatch: {text.count(old)}')
              text = text.replace(old, new, 1)
              print('replaced fixed role wait with poll')
          audit.write_text(text)

          workflow = Path('.github/workflows/churvox-one-time-hardcore-human-everything.yml')
          wf = workflow.read_text()

          def replace_once(old, new, label):
              nonlocal_wf = None
              global wf
              if new in wf:
                  print(f'already patched: {label}')
                  return
              if wf.count(old) != 1:
                  raise SystemExit(f'{label} mismatch: {wf.count(old)}')
              wf = wf.replace(old, new, 1)
              print(f'patched: {label}')

          replace_once(
              '''        run: |
                    node <<'NODE'
                    const base = 'https://www.churvox.com';''',
              '''        run: |
                    set -o pipefail
                    node <<'NODE' 2>&1 | tee /tmp/churvox-deploy.txt
                    const base = 'https://www.churvox.com';''',
              'deployment evidence log'
          )
          replace_once(
              '        run: node scripts/churvox-hardcore-owner-worker-audit.cjs',
              '''        run: |
                    set -o pipefail
                    node scripts/churvox-hardcore-owner-worker-audit.cjs 2>&1 | tee /tmp/churvox-static.txt''',
              'static evidence log'
          )
          replace_once(
              '''          npx playwright test \\
                    tests/e2e/churvox-full-ui-logic-buttons.spec.js \\
                    tests/e2e/churvox-more-menu-paid-launch.spec.js \\''',
              '''          npx playwright test \\
                    tests/e2e/churvox-more-menu-paid-launch.spec.js \\''',
              'remove obsolete lab UI test'
          )
          replace_once(
              '          npx playwright test tests/e2e/churvox-real-human-owner-worker-flow.spec.js \\',
              '          npx playwright test tests/e2e/churvox-current-human-owner-worker-flow.spec.js \\',
              'current human owner-worker flow'
          )

          clean_start = wf.index('      - name: Clean every live audit record')
          clean_end = wf.index('      - name: Build audit report', clean_start)
          clean_block = '''      - name: Clean every live audit record
                id: cleanup
                if: always()
                continue-on-error: true
                run: |
                  set -o pipefail
                  node scripts/churvox-hardcore-human-cleanup.cjs 2>&1 | tee /tmp/churvox-cleanup.txt

          '''
          wf = wf[:clean_start] + clean_block + wf[clean_end:]
          print('replaced cleanup with verified active-record cleanup')

          upload_anchor = '''            /tmp/churvox-hardcore-runner.txt
                    /tmp/churvox-hardcore-local.log'''
          upload_new = '''            /tmp/churvox-hardcore-runner.txt
                    /tmp/churvox-hardcore-local.log
                    /tmp/churvox-deploy.txt
                    /tmp/churvox-static.txt
                    /tmp/churvox-cleanup.txt'''
          if upload_new not in wf:
              if wf.count(upload_anchor) != 1:
                  raise SystemExit(f'Upload evidence anchor mismatch: {wf.count(upload_anchor)}')
              wf = wf.replace(upload_anchor, upload_new, 1)
              print('added deploy/static/cleanup evidence files')

          workflow.write_text(wf)
          PY

      - name: Verify patched audit files
        run: |
          node --check frontend/tests/e2e/churvox-live-hardcore-human-everything.spec.js
          node --check frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js
          node --check scripts/churvox-hardcore-human-cleanup.cjs
          python - <<'PY'
          import yaml
          yaml.safe_load(open('.github/workflows/churvox-one-time-hardcore-human-everything.yml'))
          print('workflow YAML valid')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/tests/e2e/churvox-live-hardcore-human-everything.spec.js frontend/tests/e2e/churvox-current-human-owner-worker-flow.spec.js scripts/churvox-hardcore-human-cleanup.cjs .github/workflows/churvox-one-time-hardcore-human-everything.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Strengthen current human audit and cleanup"
            git push origin HEAD:main
          fi

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('/tmp/churvox-fix-c.txt') ? fs.readFileSync('/tmp/churvox-fix-c.txt', 'utf8').slice(-12000) : 'No patch log.';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## Repair C ${{ job.status }}\n\n\`\`\`text\n${log}\n\`\`\`` });
