name: Job Done Strict ID Linkage Repair

on:
  push:
    branches:
      - feature/job-done-money-radar
    paths:
      - .github/workflows/job-done-id-link-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/job-done-money-radar
          fetch-depth: 0
      - name: Enforce explicit record links
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/churvox_job_done_routes.py")
          text = path.read_text()
          old = '''        job_id = record_id(job)
          client_id = safe_text(first_value(job, ["client_id", "customer_id", "clientId", "customerId"], ""), "")
          conditions = []
          for value in id_values(job_id):
              conditions.extend([
                  {"job_id": value}, {"jobId": value}, {"source_job_id": value},
                  {"linked_job_id": value}, {"record_id": value},
              ])
          for value in id_values(client_id):
              conditions.extend([{"client_id": value}, {"customer_id": value}])
          if not conditions:
              return []
          '''
          new = '''        job_id = record_id(job)
          conditions = []
          for value in id_values(job_id):
              conditions.extend([
                  {"job_id": value}, {"jobId": value}, {"source_job_id": value},
                  {"linked_job_id": value}, {"record_id": value},
              ])
          direct_values = []
          if any(name in INVOICE_COLLECTIONS for name in collections):
              direct_values.extend([
                  first_value(job, ["invoice_id", "invoiceId", "linked_invoice_id"], ""),
              ])
          if any(name in TIME_COLLECTIONS for name in collections):
              raw_time_ids = first_value(job, ["time_entry_ids", "timer_ids", "timesheet_ids"], [])
              direct_values.extend(raw_time_ids if isinstance(raw_time_ids, list) else [raw_time_ids])
          for direct in direct_values:
              for value in id_values(direct):
                  conditions.extend([{"_id": value}, {"id": value}, {"invoice_id": value}, {"time_entry_id": value}, {"timer_id": value}])
          if not conditions:
              return []
          '''
          if old not in text:
              raise SystemExit("linked_rows block not found")
          text = text.replace(old, new, 1)
          old_scan = '''    async def scan_closeouts(user):
          jobs = await scoped_rows(user, JOB_COLLECTIONS, 300)
          '''
          new_scan = '''    async def scan_closeouts(user):
          try:
              await db.job_closeouts.create_index(
                  [("business_id", 1), ("job_collection", 1), ("job_id", 1)],
                  unique=True,
                  name="one_closeout_per_job",
              )
          except Exception:
              pass
          jobs = await scoped_rows(user, JOB_COLLECTIONS, 300)
          '''
          if old_scan not in text:
              raise SystemExit("scan_closeouts block not found")
          text = text.replace(old_scan, new_scan, 1)
          path.write_text(text)
      - name: Compile repaired backend
        run: python -m py_compile backend/churvox_job_done_routes.py backend/churvox_command_apply_routes.py backend/churvox_worker_complete_elapsed_patch.py
      - name: Commit repair and remove workflow
        run: |
          git config user.name "Churvox Reality Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/job-done-id-link-repair.yml
          git add backend/churvox_job_done_routes.py
          git commit -m "Require explicit IDs for Job Done links"
          git push origin feature/job-done-money-radar
