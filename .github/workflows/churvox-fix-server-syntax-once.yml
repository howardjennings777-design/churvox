name: Churvox One-Time Backend Syntax Repair

on:
  push:
    branches:
      - agent/final-login-route-contract
    paths:
      - '.github/workflows/churvox-fix-server-syntax-once.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-login-route-contract

      - name: Repair and compile backend server
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/server.py')
          source = path.read_text()
          broken = 'app.include_router(api_router) moved to bottom after all routes'
          fixed = '# app.include_router(api_router) moved to bottom after all routes'
          if source.count(broken) != 1:
              raise SystemExit(f'Expected exactly one broken marker, found {source.count(broken)}')
          path.write_text(source.replace(broken, fixed, 1))
          PY
          python3 -m py_compile backend/server.py

      - name: Commit the repair and remove this temporary workflow
        run: |
          rm .github/workflows/churvox-fix-server-syntax-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.py .github/workflows/churvox-fix-server-syntax-once.yml
          git commit -m 'Fix backend server syntax blocker'
          git push origin HEAD:agent/final-login-route-contract
