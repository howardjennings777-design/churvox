name: Churvox Paid Launch Billing Final Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-paid-launch-billing-final]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install focused backend dependencies
        run: python -m pip install --disable-pip-version-check fastapi==0.110.1 stripe pymongo==4.5.0

      - name: Mount final billing routes last
        run: python scripts/churvox-paid-launch-billing-final-apply.py

      - name: Compile, contract and behavior gate
        shell: bash
        run: |
          set -o pipefail
          {
            python -m py_compile backend/churvox_paid_launch_billing_final_patch.py backend/server/__init__.py
            node scripts/churvox-paid-launch-billing-final-contract.cjs
            python scripts/churvox_paid_launch_billing_final_test.py
            node scripts/churvox-growth-pack-checkout-contract.cjs
            node scripts/churvox-paid-launch-readiness-contract.cjs
          } 2>&1 | tee /tmp/churvox-paid-launch-billing-final.txt

      - name: Commit verified billing repair
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add backend/server/__init__.py
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Mount final Stripe plan and Growth Pack checkout routes'
          git reset --hard HEAD
          git clean -fdx
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ job.status }}' === 'success';
            const sha = '${{ steps.publish.outputs.sha }}' || 'not published';
            const output = fs.existsSync('/tmp/churvox-paid-launch-billing-final.txt') ? fs.readFileSync('/tmp/churvox-paid-launch-billing-final.txt', 'utf8').slice(-9000) : 'No gate output.';
            const body = ok
              ? `## Final paid-launch billing repair passed\n\nThe live wrapper now owns plan and Growth Pack checkout through one owner-only Stripe engine. Locked prices, 14-day no-card trial, dynamic price fallback and safe failure responses all passed.\n\nCommit: \`${sha}\`\n\n\`\`\`text\n${output}\n\`\`\``
              : `## Final paid-launch billing repair failed safely\n\nNo unverified wrapper change was published.\n\n\`\`\`text\n${output}\n\`\`\`\n\nWorkflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
