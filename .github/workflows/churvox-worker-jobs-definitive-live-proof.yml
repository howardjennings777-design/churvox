name: Churvox Worker Jobs Definitive Live Proof

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  proof:
    if: startsWith(github.event.issue.title, '[churvox-worker-jobs-definitive-live-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PLAYWRIGHT_BASE_URL: https://www.churvox.com
      PLAYWRIGHT_API_BASE: https://grassley-backend.onrender.com
      CHURVOX_OWNER_EMAIL: howardjennings777@gmail.com
      CHURVOX_OWNER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}
      CHURVOX_WORKER_PASSWORD: ${{ secrets.CHURVOX_OWNER_PASSWORD }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm install --include=dev --legacy-peer-deps
          npx playwright install --with-deps chromium

      - name: Wait for exact v8 frontend and Worker Jobs backend
        shell: bash
        run: |
          node <<'NODE'
          const frontend = 'https://www.churvox.com/churvox-paid-launch-build.json';
          const backend = 'https://grassley-backend.onrender.com/api/worker/jobs-readiness';
          const expected = 'worker-jobs-current-first-v4-20260713';
          const expectedFrontend = 'churvox-worker-field-command-bridge-v8-20260713';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          (async () => {
            let last = '';
            for (let attempt = 1; attempt <= 120; attempt += 1) {
              try {
                const [frontResponse, backResponse] = await Promise.all([
                  fetch(`${frontend}?ts=${Date.now()}`, { cache: 'no-store' }),
                  fetch(`${backend}?ts=${Date.now()}`, { cache: 'no-store' }),
                ]);
                const front = await frontResponse.json().catch(() => ({}));
                const back = await backResponse.json().catch(() => ({}));
                const ready = frontResponse.ok && backResponse.ok
                  && front.build === expectedFrontend
                  && Array.isArray(front.includes)
                  && front.includes.includes('mobile-command-touch-targets')
                  && front.includes.includes('final-field-slip-route-delegates-to-command-bridge')
                  && back.version === expected
                  && back.ready === true
                  && back.definitive_route_owner === 'worker_jobs';
                console.log(`DEPLOY attempt=${attempt} frontend=${front.build || frontResponse.status} worker_backend=${back.version || backResponse.status} ready=${ready}`);
                if (ready) return;
                last = `frontend=${front.build || frontResponse.status} worker_backend=${back.version || backResponse.status}`;
              } catch (error) {
                last = error.message || String(error);
              }
              if (attempt < 120) await sleep(10_000);
            }
            throw new Error(`Exact v8 frontend and Worker Jobs backend did not deploy: ${last}`);
          })().catch((error) => { console.error(error.stack || error); process.exit(1); });
          NODE

      - name: Wait for final Command bridge owner and discover one linked worker
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const api = process.env.PLAYWRIGHT_API_BASE.replace(/\/+$/, '');
          const ownerEmail = process.env.CHURVOX_OWNER_EMAIL;
          const password = process.env.CHURVOX_OWNER_PASSWORD;
          const expectedCommand = 'churvox-command-force-refresh-v4-20260713';
          const expectedBridge = 'churvox-worker-field-command-bridge-v8-20260713';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const tokenFrom = (body = {}) => body.token || body.access_token || body.auth_token || body.jwt || body.accessToken || body.user?.token || body.user?.access_token || body.data?.token || body.data?.access_token || '';
          const rowsFrom = (payload) => {
            const body = payload?.data?.data ?? payload?.data ?? payload;
            if (Array.isArray(body)) return body;
            for (const key of ['workers','team','members','items','records','results','data']) if (Array.isArray(body?.[key])) return body[key];
            return [];
          };
          const emailOf = (row = {}) => String(row.email || row.worker_email || row.user_email || '').trim().toLowerCase();
          const read = async (response) => response.json().catch(() => ({}));
          (async () => {
            const login = await fetch(`${api}/api/auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: ownerEmail, password }) });
            const owner = await read(login);
            const token = tokenFrom(owner);
            if (!login.ok || !token) throw new Error(`Owner login failed ${login.status}`);

            let backendReady = false;
            let backendLast = '';
            for (let attempt = 1; attempt <= 120; attempt += 1) {
              const [commandResponse, bridgeResponse] = await Promise.all([
                fetch(`${api}/api/paid-launch/backend-readiness?ts=${Date.now()}`, {
                  headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
                  cache: 'no-store',
                }),
                fetch(`${api}/api/worker/field-command-readiness?ts=${Date.now()}`, { cache: 'no-store' }),
              ]);
              const commandBody = await read(commandResponse);
              const bridgeBody = await read(bridgeResponse);
              backendReady = commandResponse.ok
                && bridgeResponse.ok
                && commandBody.command_force_refresh === expectedCommand
                && commandBody.worker_field_command_bridge === expectedBridge
                && bridgeBody.version === expectedBridge
                && bridgeBody.ready === true
                && bridgeBody.definitive_route_owner === 'paid_launch_guard_bridge';
              backendLast = `command=${commandBody.command_force_refresh || commandResponse.status} bridge=${bridgeBody.version || bridgeResponse.status} owner=${bridgeBody.definitive_route_owner || ''}`;
              console.log(`BACKEND_DEPLOY attempt=${attempt} ${backendLast} ready=${backendReady}`);
              if (backendReady) break;
              if (attempt < 120) await sleep(10_000);
            }
            if (!backendReady) throw new Error(`Exact final Command bridge backend did not deploy: ${backendLast}`);

            const candidates = [];
            for (const endpoint of ['/api/team/workers','/api/team','/api/workers']) {
              const response = await fetch(`${api}${endpoint}?ts=${Date.now()}`, { headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' }, cache: 'no-store' });
              if (!response.ok) continue;
              for (const row of rowsFrom(await read(response))) {
                const email = emailOf(row);
                const status = String(row.status || '').toLowerCase();
                if (!email || email === ownerEmail || /inactive|deleted|archived|disabled/.test(status) || candidates.includes(email)) continue;
                candidates.push(email);
              }
            }
            for (const email of candidates.slice(0, 12)) {
              for (const path of ['/api/auth/login','/api/worker/auth/login']) {
                const response = await fetch(`${api}${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
                const body = await read(response);
                if (response.ok && tokenFrom(body)) {
                  fs.appendFileSync(process.env.GITHUB_ENV, `CHURVOX_WORKER_EMAIL=${email}\n`);
                  console.log('Linked worker credential verified without exposing the address.');
                  return;
                }
              }
            }
            throw new Error('No linked active worker could authenticate.');
          })().catch((error) => { console.error(error.stack || error); process.exit(1); });
          NODE

      - name: Prove mobile Command touch target against a real slip
        working-directory: frontend
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          const api = process.env.PLAYWRIGHT_API_BASE.replace(/\/+$/, '');
          const base = process.env.PLAYWRIGHT_BASE_URL.replace(/\/+$/, '');
          const email = process.env.CHURVOX_OWNER_EMAIL;
          const password = process.env.CHURVOX_OWNER_PASSWORD;
          const tokenText = `MOBILE TOUCH PROOF ${Date.now()}`;
          const tokenFrom = (body = {}) => body.token || body.access_token || body.auth_token || body.jwt || body.accessToken || body.user?.token || body.user?.access_token || body.data?.token || body.data?.access_token || '';
          const read = async (response) => response.json().catch(() => ({}));
          (async () => {
            const login = await fetch(`${api}/api/auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
            const loginBody = await read(login);
            const token = tokenFrom(loginBody);
            if (!login.ok || !token) throw new Error(`Owner API login failed ${login.status}`);
            const createdResponse = await fetch(`${api}/api/command/slips`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', 'X-Churvox-Command-Refresh': 'churvox-command-force-refresh-v4-20260713' },
              body: JSON.stringify({ source_type: 'paid_launch_mobile_touch', action_type: 'review_mobile_touch', title: tokenText, found: 'Mobile touch target proof.', prepared: 'Prepared for owner review only.', why: 'Verifies a safe mobile control size.', urgency: 'Owner review', status: 'open' }),
            });
            const created = await read(createdResponse);
            const slipId = created?.slip?.id || created?.slip?._id || created?.id || '';
            if (!createdResponse.ok || !slipId) throw new Error(`Could not create mobile proof slip ${createdResponse.status}`);
            const browser = await chromium.launch({ headless: true });
            try {
              const context = await browser.newContext({ viewport: { width: 390, height: 844 }, serviceWorkers: 'block' });
              const page = await context.newPage();
              await page.goto(`${base}/login`, { waitUntil: 'domcontentloaded' });
              await page.getByLabel(/email/i).first().fill(email);
              await page.getByLabel(/password/i).first().fill(password);
              await page.getByRole('button', { name: /sign in|log in/i }).first().click();
              await page.waitForURL((url) => !/\/login(?:[?#]|$)/.test(url.pathname), { timeout: 30000 });
              await page.goto(`${base}/dashboard#command`, { waitUntil: 'domcontentloaded' });
              await page.waitForSelector('.cvOwnerReady', { timeout: 30000 });
              await page.waitForFunction((text) => document.body.innerText.includes(text), tokenText, { timeout: 30000 });
              const card = page.locator('.cvSiteDecisionCard').filter({ hasText: tokenText }).first();
              const button = card.getByRole('button', { name: 'Open slip', exact: true });
              const box = await button.boundingBox();
              if (!box || box.height < 44) throw new Error(`Open slip mobile height was ${box?.height || 0}px`);
              console.log(`MOBILE_TOUCH_PASS height=${box.height}`);
              await context.close();
            } finally {
              await browser.close();
              await fetch(`${api}/api/command/slips/${encodeURIComponent(slipId)}/ignore`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'Ignore', note: 'Paid-launch mobile touch proof cleanup' }),
              }).catch(() => null);
            }
          })().catch((error) => { console.error(error.stack || error); process.exit(1); });
          NODE

      - name: Run one real owner-worker lifecycle
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/e2e/churvox-current-human-owner-worker-flow.spec.js \
            --project=desktop-chromium \
            --workers=1 \
            --repeat-each=1 \
            --retries=0 \
            --reporter=line 2>&1 | tee /tmp/churvox-worker-jobs-definitive-live-proof.txt

      - name: Upload focused proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churvox-worker-jobs-definitive-live-proof-v8
          path: |
            /tmp/churvox-worker-jobs-definitive-live-proof.txt
            frontend/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ job.status }}' === 'success';
            const raw = fs.existsSync('/tmp/churvox-worker-jobs-definitive-live-proof.txt')
              ? fs.readFileSync('/tmp/churvox-worker-jobs-definitive-live-proof.txt', 'utf8')
              : '';
            const tail = raw.slice(-6500)
              .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, '[worker-email-hidden]')
              .replace(/Bearer\s+[A-Za-z0-9._-]+/gi, 'Bearer [hidden]');
            const body = ok
              ? '## Final v8 bridge and mobile touch live proof passed\n\nThe exact v8 frontend, Worker Jobs v4, Command refresh v4 and final paid-launch guard bridge are deployed. A real mobile Command slip measured at least 44px, and one real owner→worker assignment, complete field lifecycle, proof, worker problem, immediate owner Command receipt, logout and cleanup passed.'
              : `## Final v8 bridge and mobile touch live proof failed\n\nA deployment, mobile touch or real lifecycle step did not pass. Safe lifecycle tail:\n\n\`\`\`text\n${tail || 'No lifecycle log was created.'}\n\`\`\`\n\nWorkflow run: \`${context.runId}\`.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
