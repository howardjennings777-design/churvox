name: Churvox Final Repair Error Only

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[churvox-final-repair-error-only]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Extract actual runtime error
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow churvox-final-human-audit-repair.yml --limit 10 --json databaseId,displayTitle --jq '[.[] | select(.displayTitle | startswith("[churvox-final-human-audit-repair]"))][0].databaseId')"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 \
            | sed -r 's/\x1B\[[0-9;]*[mK]//g' \
            | grep -E 'patched:|created:|mismatch|expected exactly|Traceback|SystemExit|Error:|SyntaxError|AssertionError|FAILED|failed|found [0-9]+$' \
            | tail -n 80 > /tmp/error-only.txt || true
          echo "Run $run_id" | cat - /tmp/error-only.txt > /tmp/error-only-final.txt

      - name: Post actual error
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('/tmp/error-only-final.txt', 'utf8');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## Actual final repair error\n\n\`\`\`text\n${text}\n\`\`\`` });
