name: Churvox owner premium pages v2

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[churvox-owner-premium-pages-v2]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build remaining premium rooms
        id: patch
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/churvox-premium-pages-patch.log
          from pathlib import Path
          import re

          path = Path('frontend/src/churvox-product/ProductAppV3.jsx')
          text = path.read_text()
          old_main = 'return <main className="cv3Product" data-version="CHURVOX_TIDY_PRODUCT_PAGES_20260708">'
          new_main = 'return <main className={`cv3Product cv3Page-${page}`} data-page={page} data-version="CHURVOX_PREMIUM_OWNER_ROOMS_20260724">'
          if old_main not in text:
            raise SystemExit('owner main class target missing')
          text = text.replace(old_main, new_main, 1)

          plans = r'''function PlansPage({ data, access }) {
  return <>
    <section className="cv3CapacityRoom span12">
      <header><div><small>Capacity switchboard</small><h2>Choose how much office sits behind the owner.</h2><p>The same Churvox control rule runs through every plan. Capacity, team tools and deeper preparation increase without changing who approves the work.</p></div><aside><span>Current access</span><b>{access.planName}</b><small>Pricing locked · no card upfront for trial</small></aside></header>
      <div className="cv3CapacityRail">{PLANS.map((plan, index) => { const current = access.planKey === plan.code; return <article key={plan.name} data-plan-card={!current ? true : undefined} data-stripe-plan={!current ? plan.name : undefined} className={`${plan.popular ? "popular" : ""}${current ? " current" : ""}`}><span>{String(index + 1).padStart(2, "0")}</span><div><small>{plan.popular ? "Most chosen" : current ? "Current plan" : "Office capacity"}</small><h3>{plan.name}</h3><p>{plan.note}</p></div><strong>${plan.price}<em>/month + GST</em></strong><ul>{plan.items.map((item) => <li key={item}>{item}</li>)}</ul>{current ? <button type="button" disabled>Current plan</button> : <button type="button" data-stripe-live-plan={plan.name} data-stripe-live-action="start_trial">Start {plan.name} trial</button>}</article>; })}</div>
    </section>
    <section className="cv3AddonRoom span12"><header><small>Extra capacity</small><h3>Add only what the business actually needs.</h3></header>{ADDONS.map((addon) => <article key={addon.name} data-plan-card data-stripe-plan={addon.stripe}><div><h3>{addon.name}</h3><p>{addon.note}</p></div><strong>${addon.price}<em>/month + GST</em></strong><button type="button" data-stripe-live-plan={addon.stripe} data-stripe-live-action="add_on">Add option</button></article>)}</section>
  </>;
}
'''
          text, n = re.subn(r'function PlansPage\(\{ data, access \}\) \{.*?\n\}\n\n(?=function SupportPage)', plans + '\n', text, count=1, flags=re.S)
          if n != 1:
            raise SystemExit('PlansPage replacement failed')

          support = r'''function SupportPage({ data, go, access }) {
  const steps = ["Add or import the first client", "Connect workers and choose their access", "Put recurring work inside Jobs", "Review exceptions in Command", "Export records whenever needed"];
  return <>
    <section className="cv3SupportRoom span12">
      <div className="cv3SupportSignal"><small>Churvox service room</small><h2>Help that understands where the work got stuck.</h2><p>Support should not send you hunting through the app. Start with the page, record or decision that is blocking the business.</p><div className="cv3SupportActions"><button type="button" onClick={() => window.location.assign(`mailto:${SUPPORT_EMAIL}`)}>Email Churvox</button>{access.can("command") ? <button type="button" onClick={() => go("command")}>Open Command</button> : null}</div><footer>{SUPPORT_EMAIL} · owner-controlled support</footer></div>
      <div className="cv3SupportPath"><small>First useful route</small><h3>Set up around a real job—not a fake tour.</h3>{steps.map((step, index) => <span key={step}><i>{String(index + 1).padStart(2, "0")}</i><b>{step}</b></span>)}</div>
    </section>
    <section className="cv3SupportRules span12"><div><small>Records</small><b>Tell us which page or record is wrong.</b></div><div><small>Field</small><b>Worker problems stay connected to the job.</b></div><div><small>Control</small><b>No support action bypasses owner approval.</b></div></section>
  </>;
}
'''
          text, n = re.subn(r'function SupportPage\(\{ data, go, access \}\) \{.*?\n\}\n\n(?=function Page)', support + '\n', text, count=1, flags=re.S)
          if n != 1:
            raise SystemExit('SupportPage replacement failed')
          path.write_text(text)

          css = Path('frontend/src/styles/churvoxOwnerPremiumWorkspace.css')
          css.write_text(css.read_text() + r'''

/* Page identity system — each room has its own visual job */
.cv3Product[class*="cv3Page-"] .cv3Hero{position:relative;isolation:isolate;overflow:hidden;padding-right:30px}
.cv3Product[class*="cv3Page-"] .cv3Hero:after{content:"";position:absolute;z-index:-1;right:0;top:0;width:36%;height:100%;pointer-events:none;opacity:.75}
.cv3Page-jobs .cv3Hero:after{background:repeating-linear-gradient(90deg,transparent 0 34px,rgba(239,107,46,.15) 35px 36px),linear-gradient(90deg,transparent,rgba(239,107,46,.07))}
.cv3Page-clients .cv3Hero:after{background:linear-gradient(90deg,transparent,rgba(125,88,55,.08)),repeating-linear-gradient(0deg,transparent 0 21px,rgba(17,21,19,.08) 22px 23px)}
.cv3Page-workers .cv3Hero:after{background:radial-gradient(circle at 65% 52%,transparent 0 28px,rgba(53,139,103,.12) 29px 30px,transparent 31px 56px,rgba(53,139,103,.10) 57px 58px,transparent 59px),linear-gradient(90deg,transparent,rgba(53,139,103,.06))}
.cv3Page-messages .cv3Hero:after{background:linear-gradient(90deg,transparent,rgba(68,100,150,.07)),repeating-linear-gradient(-35deg,transparent 0 28px,rgba(68,100,150,.09) 29px 30px)}
.cv3Page-quotes .cv3Hero:after{background:linear-gradient(90deg,transparent,rgba(239,107,46,.10)),repeating-linear-gradient(90deg,transparent 0 70px,rgba(239,107,46,.14) 71px 72px)}
.cv3Page-invoices .cv3Hero:after{background:linear-gradient(90deg,transparent,rgba(17,21,19,.08)),repeating-linear-gradient(0deg,transparent 0 25px,rgba(17,21,19,.10) 26px 27px)}
.cv3Page-team .cv3Hero:after,.cv3Page-payroll .cv3Hero:after{background:linear-gradient(90deg,transparent,rgba(136,91,42,.08)),repeating-radial-gradient(circle at 75% 50%,transparent 0 18px,rgba(136,91,42,.09) 19px 20px)}
.cv3Page-xero .cv3Hero:after{background:linear-gradient(90deg,transparent,rgba(31,110,164,.10)),repeating-linear-gradient(45deg,transparent 0 24px,rgba(31,110,164,.08) 25px 26px)}
.cv3Page-settings .cv3Hero:after{background:linear-gradient(90deg,transparent,rgba(17,21,19,.06)),linear-gradient(rgba(17,21,19,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(17,21,19,.06) 1px,transparent 1px);background-size:auto,22px 22px,22px 22px}

/* Jobs — route board */
.cv3Page-jobs .cv3Panel.span6{min-height:290px}.cv3Page-jobs .cv3Panel:first-of-type{border-top:2px solid #ef6b2e}.cv3Page-jobs .cv3Toolbar{padding:4px 0 8px}.cv3Page-jobs .cv3Row>span:first-of-type{background:#ef6b2e}

/* Clients — dossier */
.cv3Page-clients .cv3Panel.span7{padding-left:26px;border-left:1px solid var(--cv-line)}.cv3Page-clients .cv3PreviewTop{padding-bottom:14px;border-bottom:1px solid var(--cv-line)}.cv3Page-clients .cv3History{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}

/* Workers — field radar */
.cv3Page-workers .cv3Panel.span7{border-radius:18px;padding:0 22px 22px;background:linear-gradient(145deg,#111612,#1b241f);color:#fff;box-shadow:0 24px 70px rgba(17,21,19,.15)}.cv3Page-workers .cv3Panel.span7>header{border-color:rgba(255,255,255,.09)}.cv3Page-workers .cv3Panel.span7 header small{color:#78c89e}.cv3Page-workers .cv3Panel.span7 .cv3Empty span{color:rgba(255,255,255,.48)}.cv3Page-workers .cv3Tiles button{color:inherit;border-color:rgba(255,255,255,.08)}

/* Messages — signal lanes */
.cv3Page-messages .cv3Page{column-gap:0}.cv3Page-messages .cv3Panel.span4{padding:0 22px;border-right:1px solid var(--cv-line)}.cv3Page-messages .cv3Panel.span4:last-child{border-right:0}.cv3Page-messages .cv3Panel.span4:nth-of-type(3){border-radius:16px;background:#f9f9f5}.cv3Page-messages .cv3Row .bar{background:#5478a7}

/* Quotes — a continuous pipeline */
.cv3Page-quotes .cv3Pipeline{background:linear-gradient(180deg,rgba(255,255,255,.34),transparent)}.cv3Page-quotes .cv3Pipeline>div{position:relative}.cv3Page-quotes .cv3Pipeline>div:before{content:"";position:absolute;left:0;right:0;top:50px;height:2px;background:linear-gradient(90deg,#ef6b2e,rgba(239,107,46,.10))}.cv3Page-quotes .cv3Pipeline h3{position:relative;z-index:1;display:inline-block;padding-right:10px;background:#f5f3ed}

/* Invoices — controlled money ledger */
.cv3Page-invoices .cv3Stats{background:#151a17;color:#fff;border:0}.cv3Page-invoices .cv3Stats span{border-color:rgba(255,255,255,.09)}.cv3Page-invoices .cv3Stats small{color:rgba(255,255,255,.45)}.cv3Page-invoices .cv3Panel.span7{border-top:2px solid #ef6b2e}.cv3Page-invoices .cv3GuardGrid{border-radius:14px;overflow:hidden;background:#171c19;color:#fff}.cv3Page-invoices .cv3GuardGrid span{border-color:rgba(255,255,255,.08)}

/* Team and payroll — controlled access sheets */
.cv3Page-team .cv3Panel.span4,.cv3Page-payroll .cv3Panel.span4{align-self:start;border-radius:16px;padding:0 22px 22px;background:#171c19;color:#fff}.cv3Page-team .cv3Rule span,.cv3Page-payroll .cv3Rule span{color:rgba(255,255,255,.55)}

/* Xero — accounting handoff bay */
.cv3Page-xero .cv3Panel.span5{border-radius:18px;padding:0 24px 24px;background:linear-gradient(145deg,#101820,#172633);color:#fff;box-shadow:0 24px 70px rgba(20,56,82,.16)}.cv3Page-xero .cv3Panel.span5>header{border-color:rgba(255,255,255,.09)}.cv3Page-xero .cv3Accounting span{color:rgba(255,255,255,.55)}.cv3Page-xero .cv3Accounting em{color:#7dc3ee}

/* Settings — blueprint workbench */
.cv3Page-settings .cv3Panel.span6:first-of-type{border-radius:18px;padding:0 24px 26px;background:rgba(255,255,255,.45);box-shadow:0 18px 55px rgba(17,21,19,.06)}.cv3Page-settings .cv3Settings{grid-template-columns:repeat(2,minmax(0,1fr))}.cv3Page-settings .cv3Settings label:first-child,.cv3Page-settings .cv3Settings label:nth-child(3){grid-column:1/-1}

/* Plans — capacity switchboard */
.cv3CapacityRoom{grid-column:1/-1;overflow:hidden;border-radius:22px;background:#111411;color:#fff;box-shadow:0 28px 90px rgba(17,21,19,.20)}.cv3CapacityRoom>header{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:end;padding:42px;border-bottom:1px solid rgba(255,255,255,.09);background:radial-gradient(circle at 88% 0,rgba(239,107,46,.16),transparent 25%)}.cv3CapacityRoom>header small,.cv3AddonRoom>header small,.cv3SupportRoom small{color:#f39a69;font-size:9px;font-weight:850;letter-spacing:.17em;text-transform:uppercase}.cv3CapacityRoom>header h2{max-width:820px;margin:12px 0 12px;font-size:clamp(40px,5vw,70px);line-height:.9;letter-spacing:-.075em}.cv3CapacityRoom>header p{max-width:760px;margin:0;color:rgba(255,255,255,.57);line-height:1.55}.cv3CapacityRoom>header aside{display:grid;justify-items:end;gap:6px}.cv3CapacityRoom>header aside span{color:rgba(255,255,255,.42);font-size:10px}.cv3CapacityRoom>header aside b{font-size:24px}.cv3CapacityRoom>header aside small{color:rgba(255,255,255,.42);letter-spacing:0;text-transform:none}.cv3CapacityRail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}.cv3CapacityRail article{min-width:0;display:flex;flex-direction:column;min-height:480px;border:0;border-right:1px solid rgba(255,255,255,.09);border-radius:0!important;padding:26px;background:transparent;color:#fff;box-shadow:none!important}.cv3CapacityRail article:last-child{border-right:0}.cv3CapacityRail article>span{color:#f39a69;font-size:10px}.cv3CapacityRail article h3{margin:8px 0 5px;font-size:28px;letter-spacing:-.05em}.cv3CapacityRail article p{min-height:55px;color:rgba(255,255,255,.50);font-size:11px;line-height:1.45}.cv3CapacityRail article strong{display:block;margin:20px 0;font-size:36px;letter-spacing:-.06em}.cv3CapacityRail article strong em,.cv3AddonRoom strong em{display:block;color:rgba(255,255,255,.36);font-size:9px;font-style:normal;letter-spacing:0}.cv3CapacityRail article ul{display:grid;gap:8px;margin:0 0 24px;padding:0;list-style:none}.cv3CapacityRail article li{color:rgba(255,255,255,.62);font-size:10px}.cv3CapacityRail article li:before{content:"·";margin-right:7px;color:#ef6b2e}.cv3CapacityRail article button{margin-top:auto;min-height:42px;border:1px solid rgba(255,255,255,.14);border-radius:9px;background:rgba(255,255,255,.06);color:#fff;font-weight:760}.cv3CapacityRail article.popular{background:linear-gradient(180deg,rgba(239,107,46,.16),rgba(239,107,46,.035))}.cv3CapacityRail article.popular button{border-color:transparent;background:#ef6b2e}.cv3CapacityRail article.current{background:rgba(255,255,255,.04)}.cv3AddonRoom{grid-column:1/-1;border-top:1px solid var(--cv-line)}.cv3AddonRoom>header{padding:20px 0}.cv3AddonRoom>header h3{margin:5px 0;font-size:25px}.cv3AddonRoom>article{display:grid;grid-template-columns:1fr 180px 140px;gap:20px;align-items:center;min-height:94px;border-top:1px solid var(--cv-faint);padding:14px 0}.cv3AddonRoom>article h3{margin:0;font-size:17px}.cv3AddonRoom>article p{margin:5px 0 0;color:#747d78}.cv3AddonRoom>article strong{font-size:22px}.cv3AddonRoom strong em{color:#89918d}.cv3AddonRoom button{min-height:40px;border:0;border-radius:9px;background:#181d1a;color:#fff;font-weight:760}

/* Support — service room */
.cv3SupportRoom{grid-column:1/-1;display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden;border-radius:22px;background:#111411;color:#fff;box-shadow:0 28px 90px rgba(17,21,19,.18)}.cv3SupportSignal{display:flex;flex-direction:column;min-height:470px;padding:44px;background:radial-gradient(circle at 12% 90%,rgba(239,107,46,.15),transparent 30%)}.cv3SupportSignal h2{max-width:680px;margin:14px 0 15px;font-size:clamp(42px,5vw,70px);line-height:.9;letter-spacing:-.075em}.cv3SupportSignal p{max-width:620px;color:rgba(255,255,255,.58);line-height:1.6}.cv3SupportActions{display:flex;gap:9px;margin-top:24px}.cv3SupportActions button{min-height:42px;border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:0 15px;background:rgba(255,255,255,.06);color:#fff;font-weight:760}.cv3SupportActions button:first-child{border-color:transparent;background:#ef6b2e}.cv3SupportSignal footer{margin-top:auto;color:rgba(255,255,255,.38);font-size:10px}.cv3SupportPath{padding:44px;border-left:1px solid rgba(255,255,255,.09);background:linear-gradient(145deg,rgba(255,255,255,.025),transparent)}.cv3SupportPath h3{max-width:520px;margin:14px 0 25px;font-size:31px;letter-spacing:-.05em}.cv3SupportPath>span{min-height:58px;display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}.cv3SupportPath i{color:#f39a69;font-size:10px;font-style:normal}.cv3SupportPath b{font-size:12px}.cv3SupportRules{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--cv-line);border-bottom:1px solid var(--cv-line)}.cv3SupportRules>div{min-height:100px;display:grid;align-content:center;gap:6px;border-right:1px solid var(--cv-line);padding:18px 22px}.cv3SupportRules>div:last-child{border-right:0}.cv3SupportRules small{color:#ef6b2e;font-size:8px;letter-spacing:.16em;text-transform:uppercase}.cv3SupportRules b{font-size:14px}

/* Reliable touch targets without chunky controls */
.cv4Experience .cv3Brand{min-height:40px}.cv4Experience #churvox-owner-native-logout{height:40px!important;min-height:40px!important;max-height:40px!important}.cv4Experience button:not(.cv3Row){min-height:40px}

@media(max-width:900px){.cv3Product[class*="cv3Page-"] .cv3Hero:after{width:48%;opacity:.45}.cv3Page-clients .cv3Panel.span7{padding-left:0;border-left:0}.cv3Page-clients .cv3History{display:block}.cv3Page-workers .cv3Panel.span7{padding-left:16px;padding-right:16px}.cv3Page-messages .cv3Panel.span4{padding:0;border-right:0}.cv3CapacityRoom>header{display:block;padding:28px 22px}.cv3CapacityRoom>header h2{font-size:43px}.cv3CapacityRoom>header aside{justify-items:start;margin-top:24px}.cv3CapacityRail{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.cv3CapacityRail article{min-width:84vw;scroll-snap-align:start}.cv3AddonRoom>article{grid-template-columns:1fr auto}.cv3AddonRoom>article button{grid-column:1/-1}.cv3SupportRoom{display:block;border-radius:16px}.cv3SupportSignal{min-height:450px;padding:30px 22px}.cv3SupportSignal h2{font-size:43px}.cv3SupportPath{padding:30px 22px;border-left:0;border-top:1px solid rgba(255,255,255,.09)}.cv3SupportRules{display:block}.cv3SupportRules>div{border-right:0;border-bottom:1px solid var(--cv-line)}.cv4Experience #churvox-owner-native-logout{height:40px!important;min-height:40px!important;max-height:40px!important}}
''')
          PY

      - name: Build frontend
        id: build
        if: steps.patch.outcome == 'success'
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm ci --legacy-peer-deps 2>&1 | tee /tmp/churvox-premium-pages-install.log
          npm run build 2>&1 | tee /tmp/churvox-premium-pages-build.log

      - name: Commit premium pages
        id: commit
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/churvox-product/ProductAppV3.jsx frontend/src/styles/churvoxOwnerPremiumWorkspace.css
          git commit -m 'Carry premium Churvox rooms through the owner app'
          git push
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '';
            const patch = read('/tmp/churvox-premium-pages-patch.log');
            const build = read('/tmp/churvox-premium-pages-build.log');
            const body = [
              `Premium pages result: **${{ job.status }}**`,
              `Patch: \`${{ steps.patch.outcome }}\` · Build: \`${{ steps.build.outcome }}\` · Commit: \`${{ steps.commit.outcome }}\``,
              `Commit: \`${process.env.COMMIT || 'none'}\``,
              patch ? `\nPatch log:\n\`\`\`text\n${patch.slice(-2600)}\n\`\`\`` : '',
              build ? `\nBuild log:\n\`\`\`text\n${build.slice(-2600)}\n\`\`\`` : '',
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
