name: Churvox exact Sites live proof

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  prove:
    if: startsWith(github.event.issue.title, '[churvox-exact-sites-live-proof]')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for and prove exact captured homepage
        shell: bash
        run: |
          set +e
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          REPORT=/tmp/exact-sites-proof.txt
          : > "$REPORT"
          echo "UTC_START=$(date -u '+%Y-%m-%d %H:%M:%S')" >> "$REPORT"
          echo "CHROME=$CHROME" >> "$REPORT"

          for i in $(seq 1 24); do
            rm -rf /tmp/exact-profile /tmp/exact-dom.html /tmp/exact.err
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --user-data-dir=/tmp/exact-profile --virtual-time-budget=12000 \
              --dump-dom "https://www.churvox.com/?exactProof=$(date +%s%N)" \
              > /tmp/exact-dom.html 2>/tmp/exact.err
            exact=$(grep -Foc 'data-churvox-exact-sites-home="approved-20260724"' /tmp/exact-dom.html 2>/dev/null || true)
            header=$(grep -Foc 'class="site-header"' /tmp/exact-dom.html 2>/dev/null || true)
            workday=$(grep -Foc 'Morning. Your workday is ready.' /tmp/exact-dom.html 2>/dev/null || true)
            product=$(grep -Foc 'class="hero-product"' /tmp/exact-dom.html 2>/dev/null || true)
            oldapprox=$(grep -Foc 'Four questions. No dashboard hunting.' /tmp/exact-dom.html 2>/dev/null || true)
            title=$(grep -ioE '<title>[^<]*</title>' /tmp/exact-dom.html | head -1 | tr '\n' ' ')
            echo "POLL_$i exact=$exact header=$header workday=$workday product=$product old_approx=$oldapprox title=$title" >> "$REPORT"
            if [ "$exact" -gt 0 ] && [ "$header" -gt 0 ] && [ "$workday" -gt 0 ]; then
              echo "RESULT=PASS" >> "$REPORT"
              break
            fi
            sleep 20
          done

          curl -sS --max-time 40 -D /tmp/live-head -o /tmp/live-index -H 'Cache-Control: no-cache, no-store, max-age=0' "https://www.churvox.com/?exactCurl=$(date +%s%N)"
          echo "LAST_MODIFIED=$(grep -i '^last-modified:' /tmp/live-head | tail -1 | tr -d '\r')" >> "$REPORT"
          echo "RNDR=$(grep -i '^rndr-id:' /tmp/live-head | tail -1 | tr -d '\r')" >> "$REPORT"
          echo "MAIN_ASSET=$(grep -oE '/static/js/main\.[^"]+\.js' /tmp/live-index | head -1)" >> "$REPORT"
          if ! grep -q '^RESULT=PASS' "$REPORT"; then echo 'RESULT=FAIL' >> "$REPORT"; fi
          echo "UTC_END=$(date -u '+%Y-%m-%d %H:%M:%S')" >> "$REPORT"
          cat "$REPORT"
          {
            echo 'REPORT<<EOF'
            cat "$REPORT"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Post exact proof
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'```text\n'+(process.env.REPORT||'missing')+'\n```'});
