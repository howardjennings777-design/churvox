d-template-columns:repeat(3,1fr);row-gap:24px}.testerControlScene{width:calc(100% - 24px);margin-bottom:80px}.testerClose{width:calc(100% - 24px);align-items:flex-start;flex-direction:column}.testerClose a{width:100%;text-align:center}.cvTesterGate footer{align-items:flex-start;flex-direction:column;padding:24px 16px}}
          ''')
          PY

      - name: Prove production build
        working-directory: frontend
        run: |
          npm install --include=dev --legacy-peer-deps
          npm run build

      - name: Commit premium access rooms
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/auth/LoginPage.js frontend/src/pages/auth/ChurvoxLoginPolish.css frontend/public/testers/index.html frontend/public/testers/churvox-tester-premium.css
          git commit -m 'Rebuild login and tester pages as Churvox access rooms'
          git push
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Post result
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `Login and tester pages rebuilt and the full production build passed. Commit: \`${process.env.COMMIT || 'unknown'}\`` });
