rder-top:1px solid rgba(255,255,255,.09);border-bottom:1px solid rgba(255,255,255,.09);overflow:hidden}.testerRouteCore{position:relative;width:min(38vw,430px);aspect-ratio:1;display:grid;place-items:center;border:1px solid rgba(255,128,47,.4);border-radius:50%;background:radial-gradient(circle,rgba(255,106,26,.27),rgba(7,11,9,.95) 64%);box-shadow:0 0 0 40px rgba(255,106,26,.025),0 0 140px rgba(255,106,26,.22)}.testerRouteCore i{position:absolute;inset:-25px;border:1px dashed rgba(255,173,103,.18);border-radius:50%;animation:testerSpin 30s linear infinite}.testerRouteCore i:nth-child(2){inset:-62px;animation-direction:reverse;animation-duration:44s}.testerRouteCore span{font-size:clamp(88px,11vw,170px);font-weight:1000;letter-spacing:-.12em}.testerRouteCore small{position:absolute;bottom:25%;color:#ffb477;font-size:10px;font-weight:1000;letter-spacing:.16em;text-transform:uppercase}.testerRouteCopy{display:grid;gap:16px;max-width:760px}.testerRouteCopy h2,.testerControlScene h2,.testerClose h2{margin:0;color:var(--cream);font-size:clamp(48px,6vw,92px);line-height:.88;letter-spacing:-.085em}.testerRouteCopy p{margin:0;color:rgba(255,243,228,.55);font-size:17px;line-height:1.65;font-weight:680}.testerRouteNodes{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid rgba(255,255,255,.09)}.testerRouteNodes span{position:relative;padding:20px 8px 0;color:rgba(255,243,228,.66);font-size:11px;font-weight:900;text-align:center}.testerRouteNodes span:before{content:"";position:absolute;top:-4px;left:50%;width:7px;height:7px;transform:translateX(-50%);border-radius:50%;background:var(--orange);box-shadow:0 0 18px rgba(255,106,26,.5)}.testerControlScene{width:min(1460px,calc(100% - 40px));margin:0 auto 120px;display:grid;grid-template-columns:minmax(0,1fr) minmax(480px,.85fr);gap:60px;align-items:start}.testerControlScene>div:first-child{display:grid;gap:16px}.testerControlLines{display:grid;border-left:1px solid rgba(255,255,255,.1)}.