app = "churvox-web"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile.frontend.fly"

  [build.args]
    REACT_APP_SAME_ORIGIN_API = "1"

[env]
  CHURVOX_BACKEND_URL = "https://churvox-backend.fly.dev"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
