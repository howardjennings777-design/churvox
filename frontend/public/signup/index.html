<!doctype html>
<html lang="en" style="background:#ffffff!important;color:#000000!important;">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Sign up — Churvox</title>
  <style>
    html, body, main, section, form, div, p, h1, label, a, button, input {
      opacity: 1 !important;
      visibility: visible !important;
      filter: none !important;
      text-shadow: none !important;
      transform: none !important;
    }

    html, body {
      margin: 0 !important;
      min-height: 100vh !important;
      background: #ffffff !important;
      color: #000000 !important;
      -webkit-text-fill-color: #000000 !important;
      font-family: Arial, Helvetica, sans-serif !important;
    }

    body {
      padding: 18px !important;
    }

    .box {
      max-width: 620px !important;
      margin: 24px auto !important;
      padding: 24px !important;
      background: #ffffff !important;
      border: 3px solid #111111 !important;
      border-radius: 18px !important;
      color: #000000 !important;
      -webkit-text-fill-color: #000000 !important;
    }

    h1 {
      margin: 0 0 18px !important;
      font-size: 36px !important;
      line-height: 1.05 !important;
      color: #000000 !important;
      -webkit-text-fill-color: #000000 !important;
    }

    p, label, a {
      color: #000000 !important;
      -webkit-text-fill-color: #000000 !important;
      font-size: 16px !important;
      font-weight: 800 !important;
    }

    label {
      display: block !important;
      margin: 14px 0 6px !important;
    }

    input {
      display: block !important;
      width: 100% !important;
      height: 52px !important;
      margin-top: 6px !important;
      padding: 0 12px !important;
      border: 2px solid #111111 !important;
      border-radius: 10px !important;
      background: #ffffff !important;
      color: #000000 !important;
      -webkit-text-fill-color: #000000 !important;
      font-size: 18px !important;
    }

    input::placeholder {
      color: #444444 !important;
      -webkit-text-fill-color: #444444 !important;
      opacity: 1 !important;
    }

    button {
      width: 100% !important;
      height: 56px !important;
      margin-top: 18px !important;
      border: 3px solid #111111 !important;
      border-radius: 999px !important;
      background: #f97316 !important;
      color: #000000 !important;
      -webkit-text-fill-color: #000000 !important;
      font-size: 18px !important;
      font-weight: 1000 !important;
      cursor: pointer !important;
    }

    .top {
      max-width: 620px !important;
      margin: 0 auto !important;
      padding: 16px 0 !important;
      display: flex !important;
      justify-content: space-between !important;
      gap: 12px !important;
      align-items: center !important;
      color: #000000 !important;
      -webkit-text-fill-color: #000000 !important;
    }

    .brand {
      font-size: 28px !important;
      font-weight: 1000 !important;
      color: #000000 !important;
      -webkit-text-fill-color: #000000 !important;
    }

    .msg {
      display: none;
      padding: 12px;
      border: 2px solid #111;
      border-radius: 10px;
      margin-bottom: 12px;
      color: #000 !important;
      -webkit-text-fill-color: #000 !important;
      background: #fff3cd;
      font-weight: 900;
    }

    .msg.show {
      display: block !important;
    }
  </style>
</head>

<body style="background:#ffffff!important;color:#000000!important;-webkit-text-fill-color:#000000!important;">
  <div class="top">
    <div class="brand" style="color:#000000!important;-webkit-text-fill-color:#000000!important;">Churvox</div>
    <a href="/login" style="color:#000000!important;-webkit-text-fill-color:#000000!important;">Log in</a>
  </div>

  <main>
    <section class="box">
      <p style="color:#000000!important;-webkit-text-fill-color:#000000!important;">Create account</p>
      <h1 style="color:#000000!important;-webkit-text-fill-color:#000000!important;">Sign up to Churvox</h1>

      <form id="signupForm">
        <div id="message" class="msg"></div>

        <label style="color:#000000!important;-webkit-text-fill-color:#000000!important;">
          Full name
          <input id="name" name="name" autocomplete="name" required placeholder="Your name" />
        </label>

        <label style="color:#000000!important;-webkit-text-fill-color:#000000!important;">
          Email
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
        </label>

        <label style="color:#000000!important;-webkit-text-fill-color:#000000!important;">
          Business name
          <input id="business_name" name="business_name" autocomplete="organization" placeholder="Business name" />
        </label>

        <label style="color:#000000!important;-webkit-text-fill-color:#000000!important;">
          Password
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6" placeholder="Password" />
        </label>

        <label style="color:#000000!important;-webkit-text-fill-color:#000000!important;">
          Confirm password
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="6" placeholder="Confirm password" />
        </label>

        <button id="submitBtn" type="submit">Create account</button>
      </form>

      <p style="color:#000000!important;-webkit-text-fill-color:#000000!important;">
        Already have an account?
        <a href="/login" style="color:#000000!important;-webkit-text-fill-color:#000000!important;">Sign in</a>
      </p>
    </section>
  </main>

  <script>
    (function () {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister(); });
        }).catch(function () {});
      }

      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) { caches.delete(key); });
        }).catch(function () {});
      }

      var form = document.getElementById("signupForm");
      var msg = document.getElementById("message");
      var btn = document.getElementById("submitBtn");

      function show(text) {
        msg.textContent = text;
        msg.className = "msg show";
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        var name = document.getElementById("name").value.trim();
        var email = document.getElementById("email").value.trim();
        var business_name = document.getElementById("business_name").value.trim();
        var password = document.getElementById("password").value;
        var confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) return show("Passwords do not match.");
        if (password.length < 6) return show("Password must be at least 6 characters.");

        btn.disabled = true;
        btn.textContent = "Creating account...";

        try {
          var response = await fetch("/api/auth/register", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: name,
              email: email,
              password: password,
              business_name: business_name || null
            })
          });

          var data = {};
          try { data = await response.json(); } catch (_) {}

          if (!response.ok) {
            throw new Error(data.detail || data.message || "Registration failed.");
          }

          var token = data.token || data.access_token || data.auth_token || "";
          if (token) localStorage.setItem("token", token);

          localStorage.setItem("churvox_first_setup_pending", "true");
          window.location.href = "/plans?first_setup=1";
        } catch (err) {
          show(err.message || "Signup page works, but register API failed.");
        } finally {
          btn.disabled = false;
          btn.textContent = "Create account";
        }
      });
    })();
  </script>
</body>
</html>
