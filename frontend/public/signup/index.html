<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Sign up — Churvox</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f3ea;
      color: #111827;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% -8%, rgba(249,115,22,.14), transparent 34%),
        radial-gradient(circle at 90% 0%, rgba(15,23,42,.10), transparent 34%),
        #f7f3ea;
      color: #111827;
      padding: 14px;
    }

    .nav {
      width: min(1120px, 100%);
      margin: 0 auto 24px;
      border: 1px solid rgba(249,115,22,.22);
      border-radius: 24px;
      background: linear-gradient(135deg, #111827, #071118);
      color: #fff;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      box-shadow: 0 24px 70px rgba(17,24,39,.18);
    }

    .brand {
      font-size: 22px;
      font-weight: 1000;
      letter-spacing: -.04em;
    }

    .nav a {
      color: rgba(255,255,255,.86);
      text-decoration: none;
      font-weight: 900;
      font-size: 14px;
    }

    .wrap {
      min-height: calc(100vh - 110px);
      display: grid;
      place-items: start center;
    }

    .card {
      width: min(720px, 100%);
      background: #fffaf0;
      border: 1px solid rgba(17,24,39,.16);
      border-radius: 30px;
      padding: clamp(22px, 5vw, 46px);
      box-shadow: 0 30px 90px rgba(17,24,39,.16);
      color: #071118;
    }

    .kicker {
      margin: 0 0 10px;
      color: #c2410c;
      font-size: 12px;
      font-weight: 1000;
      text-transform: uppercase;
      letter-spacing: .18em;
    }

    h1 {
      margin: 0 0 22px;
      color: #071118;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 9vw, 68px);
      line-height: .92;
      letter-spacing: -.075em;
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      color: #1f2937;
      font-size: 13px;
      font-weight: 950;
    }

    input {
      width: 100%;
      min-height: 52px;
      border-radius: 16px;
      border: 1px solid rgba(8,21,31,.28);
      background: #fff;
      color: #071118;
      -webkit-text-fill-color: #071118;
      padding: 0 15px;
      font-size: 16px;
      outline: none;
      box-shadow: 0 10px 22px rgba(8,21,31,.08);
    }

    input:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 4px rgba(249,115,22,.14);
    }

    button {
      min-height: 54px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffb15f, #f97316);
      color: #111827;
      -webkit-text-fill-color: #111827;
      font-size: 15px;
      font-weight: 1000;
      cursor: pointer;
      box-shadow: 0 18px 44px rgba(249,115,22,.24);
    }

    button:disabled {
      opacity: .72;
      cursor: wait;
    }

    .sub {
      margin: 16px 0 0;
      color: #334155;
      font-weight: 750;
      line-height: 1.5;
    }

    .sub a {
      color: #b45309;
      font-weight: 1000;
    }

    .msg {
      display: none;
      border-radius: 16px;
      padding: 12px 14px;
      font-weight: 900;
      line-height: 1.45;
    }

    .msg.err {
      display: block;
      border: 1px solid rgba(185,28,28,.22);
      background: rgba(254,226,226,.86);
      color: #991b1b;
    }

    .msg.ok {
      display: block;
      border: 1px solid rgba(21,128,61,.22);
      background: rgba(220,252,231,.86);
      color: #166534;
    }

    @media (max-width: 620px) {
      body { padding: 10px; }
      .nav { border-radius: 20px; }
      .card { border-radius: 24px; }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="brand">Churvox</div>
    <a href="/login">Log in</a>
  </header>

  <main class="wrap">
    <section class="card">
      <p class="kicker">Create account</p>
      <h1>Build your Churvox command floor.</h1>

      <form id="signupForm">
        <div id="message" class="msg"></div>

        <label>
          Full name
          <input id="name" name="name" autocomplete="name" required />
        </label>

        <label>
          Email
          <input id="email" name="email" type="email" autocomplete="email" required />
        </label>

        <label>
          Business name
          <input id="business_name" name="business_name" autocomplete="organization" />
        </label>

        <label>
          Password
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6" />
        </label>

        <label>
          Confirm password
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="6" />
        </label>

        <button id="submitBtn" type="submit">Create account</button>
      </form>

      <p class="sub">Already have an account? <a href="/login">Sign in</a></p>
    </section>
  </main>

  <script>
    (function () {
      var form = document.getElementById("signupForm");
      var msg = document.getElementById("message");
      var btn = document.getElementById("submitBtn");

      function show(type, text) {
        msg.className = "msg " + type;
        msg.textContent = text;
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        var name = document.getElementById("name").value.trim();
        var email = document.getElementById("email").value.trim();
        var business_name = document.getElementById("business_name").value.trim();
        var password = document.getElementById("password").value;
        var confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
          show("err", "Passwords do not match.");
          return;
        }

        if (password.length < 6) {
          show("err", "Password must be at least 6 characters.");
          return;
        }

        btn.disabled = true;
        btn.textContent = "Creating account...";

        try {
          var response = await fetch("/api/auth/register", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: name,
              email: email,
              password: password,
              business_name: business_name || null
            })
          });

          var data = {};
          try { data = await response.json(); } catch (_) {}

          if (!response.ok) {
            throw new Error(data.detail || data.message || "Registration failed. Please try again.");
          }

          var token = data.token || data.access_token || data.auth_token || "";
          if (token) localStorage.setItem("token", token);

          localStorage.setItem("churvox_first_setup_pending", "true");
          localStorage.setItem("churvox_business_settings", JSON.stringify({
            business_name: business_name || "",
            email: email || ""
          }));

          show("ok", "Account created. Opening plans...");
          window.location.href = "/plans?first_setup=1";
        } catch (err) {
          show("err", err.message || "Signup loaded, but the register API did not respond.");
        } finally {
          btn.disabled = false;
          btn.textContent = "Create account";
        }
      });
    })();
  </script>
</body>
</html>
