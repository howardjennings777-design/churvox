<script>
  (function () {
    var words = ["login", "signin", "sign-in", "signup", "sign-up", "register", "forgot", "reset-password"];

    function isAuthRoute() {
      var here = String((window.location.pathname || "") + " " + (window.location.hash || "") + " " + (window.location.search || "")).toLowerCase();
      return words.some(function (word) {
        return here.indexOf(word) !== -1;
      });
    }

    function applyAuthCriticalReadable() {
      var on = isAuthRoute();
      document.documentElement.classList.toggle("churvox-auth-critical", on);
      if (document.body) {
        document.body.classList.toggle("churvox-auth-readable", on);
      }
    }

    applyAuthCriticalReadable();

    window.__CHURVOX_APPLY_AUTH_CRITICAL_READABLE__ = applyAuthCriticalReadable;

    if (!window.__CHURVOX_AUTH_CRITICAL_HISTORY_PATCHED__) {
      window.__CHURVOX_AUTH_CRITICAL_HISTORY_PATCHED__ = true;

      var pushState = window.history.pushState;
      var replaceState = window.history.replaceState;

      window.history.pushState = function () {
        var result = pushState.apply(this, arguments);
        setTimeout(applyAuthCriticalReadable, 0);
        setTimeout(applyAuthCriticalReadable, 100);
        return result;
      };

      window.history.replaceState = function () {
        var result = replaceState.apply(this, arguments);
        setTimeout(applyAuthCriticalReadable, 0);
        setTimeout(applyAuthCriticalReadable, 100);
        return result;
      };
    }

    window.addEventListener("load", applyAuthCriticalReadable);
    window.addEventListener("hashchange", applyAuthCriticalReadable);
    window.addEventListener("popstate", applyAuthCriticalReadable);
    document.addEventListener("DOMContentLoaded", applyAuthCriticalReadable);

    try {
      new MutationObserver(function () {
        if (isAuthRoute()) applyAuthCriticalReadable();
      }).observe(document.documentElement, { childList: true, subtree: true });
    } catch (e) {}
  })();
</script>
