    <style>
      html, body { background-color: #06111A; color: #F6FBFC; }
      html { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #06111A;
      }
      #root { min-height: 100vh; }
    </style>

<script>
/* CHURVOX_FORCE_CACHE_CLEAR_20260603_SAFE_ROLLBACK */
(function () {
  try {
    var key = "churvox_force_cache_clear_20260603_safe_rollback_v3";
    var current = localStorage.getItem(key);
    var clearing = [];

    if ("serviceWorker" in navigator) {
      clearing.push(
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
        }).catch(function () {})
      );
    }

    if ("caches" in window) {
      clearing.push(
        caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }).catch(function () {})
      );
    }

    if (current !== "done") {
      localStorage.setItem(key, "done");
      Promise.all(clearing).then(function () {
        var url = new URL(window.location.href);
        if (url.searchParams.get("cvfresh") !== "20260603") {
          url.searchParams.set("cvfresh", "20260603");
          window.location.replace(url.toString());
        }
      });
    }
  } catch (e) {}
})();
</script>


<script id="churvox-force-clear-old-cache">
(function () {
  try {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      });
    }
    if (window.caches) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) { caches.delete(key); });
      });
    }
  } catch (e) {}
})();
</script>
