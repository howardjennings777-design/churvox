<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Churvox Owner Platform</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #08111f;
      color: #fff;
      padding: 18px;
    }
    .wrap { max-width: 1150px; margin: 0 auto; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      border: 0;
      cursor: pointer;
    }
    .muted { color: rgba(255,255,255,.72); }
    .card {
      background: #0f172a;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .ok { border-color: rgba(34,197,94,.35); }
    .error { border-color: rgba(239,68,68,.45); color: #fecaca; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .stat-btn {
      width: 100%;
      text-align: left;
      background: #111827;
      color: #fff;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 16px;
      min-height: 100px;
      cursor: pointer;
    }
    .stat-btn:active { transform: scale(.99); }
    .stat-btn .label {
      color: rgba(255,255,255,.7);
      font-size: 14px;
      margin-bottom: 8px;
    }
    .stat-btn .value {
      font-size: 30px;
      font-weight: 800;
    }
    .stat-btn .tap {
      margin-top: 8px;
      font-size: 12px;
      color: #93c5fd;
    }
    .item {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 6px 0;
    }
    .section-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 10px 0;
    }
    .small { font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1 class="title">Owner Platform</h1>
        <div class="muted">Real stats and tappable owner boxes</div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <a class="btn" href="/dashboard">Back to App</a>
        <button class="btn" id="reloadBtn" type="button">Reload</button>
      </div>
    </div>

    <div id="status" class="card">Loading owner stats...</div>
    <div id="stats" class="grid" style="display:none;"></div>
    <div id="details" class="card" style="display:none;"></div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const statsEl = document.getElementById("stats");
    const detailsEl = document.getElementById("details");

    function esc(v) {
      return String(v ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[m]));
    }

    function itemHtml(obj) {
      const entries = Object.entries(obj || {}).filter(([k,v]) => v !== null && v !== undefined && v !== "");
      const title =
        obj.full_name ||
        obj.business_name ||
        obj.title ||
        obj.name ||
        obj.client_name ||
        obj.customer_name ||
        obj.invoice_number ||
        obj.email ||
        obj.id ||
        "Record";

      return `
        <div class="item">
          <div style="font-weight:800; margin-bottom:8px;">${esc(title)}</div>
          ${entries.map(([k,v]) => `<div class="small"><span class="muted">${esc(k)}:</span> ${esc(v)}</div>`).join("")}
        </div>
      `;
    }

    async function loadDetails(kind) {
      detailsEl.style.display = "block";
      detailsEl.className = "card";
      detailsEl.innerHTML = "Loading " + esc(kind) + "...";

      try {
        const res = await fetch("/api/owner/drilldown/" + encodeURIComponent(kind), {
          method: "GET",
          credentials: "include",
          headers: { "Content-Type": "application/json" }
        });

        if (!res.ok) {
          const t = await res.text();
          throw new Error(t || "Failed to load details");
        }

        const data = await res.json();
        const items = data.items || [];

        detailsEl.innerHTML =
          `<div class="section-title">${esc(data.title || kind)}</div>` +
          `<div class="muted">Latest ${items.length} records</div>` +
          (items.length ? items.map(itemHtml).join("") : `<div class="item muted">No records found.</div>`);
      } catch (err) {
        detailsEl.className = "card error";
        detailsEl.textContent = err.message || "Failed to load details";
      }
    }

    async function loadOwner() {
      statusEl.className = "card";
      statusEl.textContent = "Loading owner stats...";
      statsEl.style.display = "none";
      detailsEl.style.display = "none";
      detailsEl.innerHTML = "";

      try {
        const res = await fetch("/api/owner/stats", {
          method: "GET",
          credentials: "include",
          headers: { "Content-Type": "application/json" }
        });

        if (res.status === 403) {
          statusEl.className = "card error";
          statusEl.innerHTML = "This login is not allowed into Owner Platform yet.<br><br>Make sure you are signed in as <b>hello@churvox.com</b> or add your email to <b>PLATFORM_OWNER_EMAILS</b> in Render backend env.";
          return;
        }

        if (!res.ok) {
          const t = await res.text();
          throw new Error(t || "Failed to load owner stats");
        }

        const data = await res.json();
        const s = data.stats || {};

        statusEl.className = "card ok";
        statusEl.innerHTML = "Logged in as <b>" + esc(data.owner_email || "owner") + "</b>";

        const cards = [
          ["users", "Total Users", s.total_users || 0],
          ["businesses", "Businesses", s.total_businesses || 0],
          ["jobs", "Jobs", s.total_jobs || 0],
          ["clients", "Clients", s.total_clients || 0],
          ["invoices", "Invoices", s.total_invoices || 0],
          ["timers", "Active Timers", s.active_timers || 0]
        ];

        statsEl.innerHTML = cards.map(([kind, label, value]) => `
          <button class="stat-btn" data-kind="${esc(kind)}" type="button">
            <div class="label">${esc(label)}</div>
            <div class="value">${esc(value)}</div>
            <div class="tap">Tap to view</div>
          </button>
        `).join("");

        statsEl.style.display = "grid";

        document.querySelectorAll(".stat-btn").forEach(btn => {
          btn.addEventListener("click", () => loadDetails(btn.dataset.kind));
        });

        loadDetails("users");
      } catch (err) {
        statusEl.className = "card error";
        statusEl.textContent = err.message || "Failed to load owner stats";
      }
    }

    document.getElementById("reloadBtn").addEventListener("click", loadOwner);
    loadOwner();
  </script>
</body>
</html>
